<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>বাংলা প্রোফাইল সেকশন মাইনাস - Aluminium ERP BD</title>
    
    <!-- FORCE NO-CACHE META TAGS -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="theme-color" content="#0b0f19">
    <link rel="icon" type="image/png" href="icon-192.png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
            position: relative;
        }

        /* ব্যাকগ্রাউন্ড গ্যালাক্সি স্টার অ্যানিমেশন */
        #galaxy-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }
        .shooting-star {
            position: absolute;
            width: 2px;
            height: 60px;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,1));
            border-radius: 50%;
            filter: drop-shadow(0 0 6px #60a5fa);
            opacity: 0;
            animation: shooting 4s linear infinite;
        }
        .shooting-star::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 4px;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 10px #ffffff, 0 0 20px #3b82f6;
        }
        @keyframes shooting {
            0% { transform: translateY(-50px) translateX(50px) rotate(45deg); opacity: 0; }
            10% { opacity: 1; }
            35% { transform: translateY(300px) translateX(-300px) rotate(45deg); opacity: 0; }
            100% { opacity: 0; }
        }

        /* কন্টেইনার */
        .page-container {
            width: 100%;
            max-width: 500px;
            position: relative;
            z-index: 1;
        }

        /* 🌟 WHITE & BLUE GRADIENT BOX 🌟 */
        .main-card {
            background: linear-gradient(135deg, #ffffff 0%, #eff6ff 100%);
            border: 2px solid #3b82f6;
            border-radius: 20px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(37, 99, 235, 0.3);
            color: #1e293b;
        }

        /* ব্লু ও হোয়াইট হেডার সেকশন */
        .header-box {
            background: linear-gradient(135deg, #1d4ed8 0%, #2563eb 100%);
            color: #ffffff;
            padding: 15px;
            border-radius: 12px;
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        /* নোটিশ আইকন ও মেসেজ বক্স */
        .work-icon {
            font-size: 60px;
            margin-bottom: 15px;
            animation: pulse 2s infinite ease-in-out;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .status-title {
            color: #1d4ed8;
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .status-msg {
            color: #475569;
            font-size: 15px;
            line-height: 1.6;
            font-weight: 600;
            background: #ffffff;
            border: 1px dashed #93c5fd;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
        }

        /* ব্যাক বাটন */
        .btn-back {
            display: inline-block;
            width: 100%;
            padding: 13px;
            background: #2563eb;
            color: #ffffff;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 15px;
            margin-top: 25px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
            transition: background 0.2s;
        }
        .btn-back:active {
            transform: scale(0.98);
        }

        .branding-footer {
            color: #1d4ed8;
            font-size: 11px;
            font-weight: bold;
            margin-top: 20px;
            padding: 8px;
            background: rgba(37, 99, 235, 0.08);
            border: 1px solid rgba(37, 99, 235, 0.2);
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <!-- ব্যাকগ্রাউন্ড অ্যানিমেশন -->
    <div id="galaxy-bg">
        <div class="shooting-star" style="top:-5%;left:70%;animation-delay:0s;animation-duration:4s;"></div>
        <div class="shooting-star" style="top:10%;left:95%;animation-delay:1.5s;animation-duration:5s;"></div>
        <div class="shooting-star" style="top:-10%;left:45%;animation-delay:2.8s;animation-duration:3.5s;"></div>
    </div>

    <div class="page-container">
        <div class="main-card">
            
            <!-- ব্লু অ্যান্ড হোয়াইট হেডার -->
            <div class="header-box">
                <span>🏭</span>
                <span>বাংলা প্রোফাইল সেকশন মাইনাস</span>
            </div>

            <!-- কাজ চলমান মেসেজ সেকশন -->
            <div class="work-icon">⚙️</div>
            <div class="status-title">কাজ চলমান রয়েছে!</div>
            
            <div class="status-msg">
                প্রসেসিংয়ে রয়েছে। খুব শীঘ্রই নতুন আপডেটে এটি যুক্ত করে দেওয়া হবে।
            </div>

            <!-- ড্যাশবোর্ডে ফিরে যাওয়ার বাটন -->
            <a href="index.html" class="btn-back">⬅️ প্রধান ড্যাশবোর্ডে ফিরে যান</a>

            <div class="branding-footer">
                ALUMINIUM ERP BD — BY RUBEL
            </div>

        </div>
    </div>

</body>
</html>

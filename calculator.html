<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Material Calculator - Aluminium ERP BD</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #0b0f19; color: #f3f4f6; display: flex; justify-content: center; padding: 12px; min-height: 100vh; }
        .mobile-app { width: 100%; max-width: 450px; background: #0b0f19; border-radius: 28px; padding: 16px; position: relative; }
        
        .app-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .back-btn { background: #192233; border: 1px solid #232e42; color: #f9fafb; font-size: 18px; border-radius: 12px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; text-decoration: none; }
        .header-title { font-size: 18px; font-weight: 700; color: #f9fafb; }
        
        .card { background: #121929; border-radius: 20px; padding: 20px; border: 1px solid #1e293b; margin-bottom: 16px; }
        .card h3 { color: #fbbf24; font-size: 16px; margin-bottom: 15px; border-bottom: 1px solid #232e42; padding-bottom: 8px; }
        
        .form-row { display: flex; gap: 10px; margin-bottom: 14px; }
        .form-group { flex: 1; text-align: left; }
        .form-group label { display: block; font-size: 12px; color: #9ca3af; margin-bottom: 6px; }
        .form-group input, .form-group select { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #232e42; background: #192233; color: white; font-size: 14px; outline: none; }
        
        .btn-calc { background: #d97706; color: white; border: none; padding: 14px; border-radius: 12px; font-weight: bold; font-size: 15px; cursor: pointer; width: 100%; margin-top: 5px; }
        .btn-calc:active { transform: scale(0.98); }

        .result-box { display: none; background: #192233; border-radius: 14px; padding: 15px; margin-top: 15px; border: 1px dashed #3b82f6; }
        .result-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #232e42; font-size: 14px; }
        .result-item:last-child { border-bottom: none; }
        .val-highlight { color: #4ade80; font-weight: bold; }
    </style>
</head>
<body>

<div class="mobile-app">
    <div class="app-header">
        <a href="index.html" class="back-btn">←</a>
        <div class="header-title">Material Calculator</div>
        <div style="width: 40px;"></div>
    </div>

    <div class="card">
        <h3>🧮 সাইজ ও পরিমাপ ইনপুট</h3>
        
        <div class="form-group" style="margin-bottom: 14px;">
            <label>কাজের টাইপ (Item Type)</label>
            <select id="itemType">
                <option value="sliding">Sliding Window (২ পাল্লা)</option>
                <option value="door">Aluminum Door (ডোর)</option>
                <option value="fixed">Fixed Glass / Partition</option>
            </select>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>উচ্চতা / Height (ইঞ্চি)</label>
                <input type="number" id="winHeight" placeholder="e.g. 48">
            </div>
            <div class="form-group">
                <label>প্রস্থ / Width (ইঞ্চি)</label>
                <input type="number" id="winWidth" placeholder="e.g. 60">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>পরিমাণ (Quantity)</label>
                <input type="number" id="winQty" value="1">
            </div>
        </div>

        <button class="btn-calc" onclick="calculateMaterial()">Calculate Material</button>

        <div class="result-box" id="resultBox">
            <div class="result-item">
                <span>মোট স্কয়ার ফিট (SFT):</span>
                <span class="val-highlight" id="resSft">0 SFT</span>
            </div>
            <div class="result-item">
                <span>গ্লাস সাইজ (Glass Sqft):</span>
                <span class="val-highlight" id="resGlass">0 SFT</span>
            </div>
            <div class="result-item">
                <span>আনুমানিক সেকশন রানিং ফিট:</span>
                <span class="val-highlight" id="resRft">0 RFT</span>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        if (localStorage.getItem("erp_unlocked") !== "true") {
            alert("অনুগ্রহ করে অ্যাপটি লাইসেন্স কি দিয়ে অ্যাক্টিভেট করুন।");
            location.href = "index.html";
        }
    });

    function calculateMaterial() {
        let height = parseFloat(document.getElementById("winHeight").value) || 0;
        let width = parseFloat(document.getElementById("winWidth").value) || 0;
        let qty = parseInt(document.getElementById("winQty").value) || 1;

        if (height <= 0 || width <= 0) {
            alert("দয়া করে সঠিক সাইজ ইনপুট দিন!");
            return;
        }

        // Calculation formulas
        let totalSft = ((height * width) / 144) * qty;
        let glassSft = totalSft * 0.85; // Standard deduction estimation
        let runningFt = (((height + width) * 2) / 12) * qty;

        document.getElementById("resSft").innerText = totalSft.toFixed(2) + " SFT";
        document.getElementById("resGlass").innerText = glassSft.toFixed(2) + " SFT";
        document.getElementById("resRft").innerText = runningFt.toFixed(2) + " RFT";

        document.getElementById("resultBox").style.display = "block";
    }
</script>
</body>
</html>

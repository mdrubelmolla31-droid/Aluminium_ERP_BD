<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Material Calculator - Aluminium ERP BD</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            padding: 12px;
            max-width: 500px;
            margin: 0 auto;
        }

        /* Top Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #1e293b;
            padding: 10px 16px;
            border-radius: 12px;
            margin-bottom: 16px;
            border: 1px solid #334155;
        }

        .btn-home {
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
        }

        .header-title {
            font-size: 16px;
            font-weight: bold;
            color: #fff;
        }

        .icon-menu {
            font-size: 22px;
            cursor: pointer;
            color: #38bdf8;
            background: none;
            border: none;
        }

        /* Card Container */
        .card {
            background: #111827;
            border: 1px solid #1e293b;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .card-title {
            color: #38bdf8;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 14px;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 8px;
        }

        /* Input Grid Layout */
        .input-group {
            margin-bottom: 12px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            color: #9ca3af;
            margin-bottom: 4px;
        }

        .input-control {
            width: 100%;
            padding: 9px 12px;
            background: #1e293b;
            border: 1px solid #334155;
            color: white;
            border-radius: 8px;
            font-size: 13px;
            outline: none;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        /* Window Table */
        .window-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 12px;
        }

        .window-table th {
            background: #1d4ed8;
            color: white;
            padding: 8px;
            font-size: 12px;
        }

        .window-table td {
            padding: 6px 4px;
            text-align: center;
        }

        .window-table input {
            width: 100%;
            padding: 6px;
            background: #1e293b;
            border: 1px solid #334155;
            color: white;
            border-radius: 6px;
            text-align: center;
            font-size: 13px;
        }

        .btn-remove {
            background: #ef4444;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Action Buttons */
        .btn-add {
            width: 100%;
            padding: 10px;
            background: #10b981;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .btn-calc {
            width: 100%;
            padding: 11px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .btn-quotation {
            width: 100%;
            padding: 11px;
            background: #d97706;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
            display: block;
            text-align: center;
        }

        /* Results Table */
        .result-table {
            width: 100%;
            border-collapse: collapse;
        }

        .result-table td {
            padding: 8px 10px;
            border-bottom: 1px solid #1e293b;
            font-size: 13px;
        }

        .result-table tr:last-child td {
            border-bottom: none;
        }

        .text-right {
            text-align: right;
            font-weight: bold;
            color: #fbbf24;
        }

        /* Sidebar Overlay (History Drawer) */
        .sidebar-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            z-index: 9999;
            justify-content: flex-end;
        }

        .sidebar-content {
            background: #111827;
            width: 85%;
            max-width: 380px;
            height: 100%;
            padding: 16px;
            border-left: 1px solid #1e293b;
            overflow-y: auto;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 10px;
            margin-bottom: 16px;
        }

        .history-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 12px;
            position: relative;
        }

        .history-cust-name {
            color: #fbbf24;
            font-weight: bold;
            font-size: 14px;
        }

        .history-cust-sub {
            color: #9ca3af;
            font-size: 11px;
            margin-top: 2px;
        }

        .history-btn-del {
            position: absolute;
            top: 10px; right: 10px;
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid #ef4444;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
        }

        .btn-clear-all {
            width: 100%;
            padding: 8px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 12px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- 🏠 Header -->
    <div class="header">
        <a href="index.html" class="btn-home">🏠 Home</a>
        <div class="header-title">Material Calculator</div>
        <button class="icon-menu" onclick="toggleHistoryDrawer()">☰</button>
    </div>

    <!-- 👤 Customer Information -->
    <div class="card">
        <div class="card-title">Customer Details</div>
        <div class="input-group">
            <label>Customer Name</label>
            <input type="text" id="custName" class="input-control" placeholder="Enter Name">
        </div>
        <div class="grid-2">
            <div class="input-group">
                <label>Mobile Number</label>
                <input type="text" id="custPhone" class="input-control" placeholder="017xxxxxxxx">
            </div>
            <div class="input-group">
                <label>Address</label>
                <input type="text" id="custAddress" class="input-control" placeholder="Location">
            </div>
        </div>
    </div>

    <!-- ⚙️ Specifications -->
    <div class="card">
        <div class="card-title">Specifications</div>
        <div class="grid-2">
            <div class="input-group">
                <label>Company</label>
                <select id="companySelect" class="input-control">
                    <option value="KAI">KAI</option>
                    <option value="ALCO">ALCO</option>
                    <option value="ALUMEX">ALUMEX</option>
                    <option value="CHUNG HUA">CHUNG HUA</option>
                </select>
            </div>
            <div class="input-group">
                <label>Series</label>
                <select id="seriesSelect" class="input-control">
                    <option value="Sliding Window 3&quot;">Sliding Window 3"</option>
                    <option value="Sliding Window 4&quot;">Sliding Window 4"</option>
                </select>
            </div>
        </div>

        <div class="grid-2">
            <div class="input-group">
                <label>Alu Thickness</label>
                <select id="aluThickSelect" class="input-control">
                    <option value="1.0 mm">1.0 mm</option>
                    <option value="1.2 mm">1.2 mm</option>
                    <option value="1.5 mm">1.5 mm</option>
                </select>
            </div>
            <div class="input-group">
                <label>Glass Company</label>
                <select id="glassCompSelect" class="input-control">
                    <option value="Nasir">Nasir</option>
                    <option value="PHP">PHP</option>
                </select>
            </div>
        </div>

        <div class="grid-2">
            <div class="input-group">
                <label>Glass Thickness</label>
                <select id="glassThickSelect" class="input-control">
                    <option value="5 mm">5 mm</option>
                    <option value="6 mm">6 mm</option>
                </select>
            </div>
            <div class="input-group">
                <label>Glass Colour</label>
                <select id="glassColorSelect" class="input-control">
                    <option value="Clear">Clear</option>
                    <option value="Bronze">Bronze</option>
                    <option value="Dark Grey">Dark Grey</option>
                </select>
            </div>
        </div>
    </div>

    <!-- 📐 Window Dimensions (Inches) -->
    <div class="card">
        <div class="card-title">Window Dimensions (Inches)</div>
        <table class="window-table">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Height</th>
                    <th>Width</th>
                    <th>Qty</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="windowTableBody">
                <tr>
                    <td>1</td>
                    <td><input type="number" class="win-h" value="54"></td>
                    <td><input type="number" class="win-w" value="60"></td>
                    <td><input type="number" class="win-q" value="1"></td>
                    <td><button class="btn-remove" onclick="removeRow(this)">✕</button></td>
                </tr>
            </tbody>
        </table>

        <button class="btn-add" onclick="addRow()">+ Add Window</button>
        <button class="btn-calc" onclick="calculateMaterials()">Calculate & Save History</button>
    </div>

    <!-- 📊 Material Details -->
    <div class="card" id="resultCard" style="display: none;">
        <div class="card-title">Material Details</div>
        <table class="result-table">
            <tr><td>Outer Side</td><td class="text-right" id="resOuterSide">0 ft</td></tr>
            <tr><td>Outer Top</td><td class="text-right" id="resOuterTop">0 ft</td></tr>
            <tr><td>Outer Bottom</td><td class="text-right" id="resOuterBottom">0 ft</td></tr>
            <tr><td>Shutter Lock</td><td class="text-right" id="resShutterLock">0 ft</td></tr>
            <tr><td>Shutter Interlock</td><td class="text-right" id="resShutterInter">0 ft</td></tr>
            <tr><td>Glass Area</td><td class="text-right" id="resGlassArea">0 sqft</td></tr>
        </table>
        
        <div style="margin-top: 15px;">
            <a href="quotation.html" class="btn-quotation" onclick="sendToQuotation()">🚀 Send to Quotation</a>
        </div>
    </div>

    <!-- 📜 Sidebar History Drawer -->
    <div class="sidebar-overlay" id="historyDrawer">
        <div class="sidebar-content">
            <div class="sidebar-header">
                <h3 style="color:#38bdf8;">📜 Calculation History</h3>
                <button onclick="toggleHistoryDrawer()" style="background:none; border:none; color:white; font-size:18px;">✕</button>
            </div>
            
            <button class="btn-clear-all" onclick="clearAllHistory()">🗑️ Delete All History</button>
            <div id="historyList"></div>
        </div>
    </div>

    <script>
        let rowCounter = 1;
        let lastCalculatedData = null;

        function addRow() {
            rowCounter++;
            const tbody = document.getElementById("windowTableBody");
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td>${rowCounter}</td>
                <td><input type="number" class="win-h" value="54"></td>
                <td><input type="number" class="win-w" value="60"></td>
                <td><input type="number" class="win-q" value="1"></td>
                <td><button class="btn-remove" onclick="removeRow(this)">✕</button></td>
            `;
            tbody.appendChild(tr);
        }

        function removeRow(btn) {
            const row = btn.closest("tr");
            if (document.querySelectorAll("#windowTableBody tr").length > 1) {
                row.remove();
            } else {
                alert("At least one window is required!");
            }
        }

        function calculateMaterials() {
            const custName = document.getElementById("custName").value.trim() || "Unknown Customer";
            const custPhone = document.getElementById("custPhone").value.trim() || "N/A";
            const custAddress = document.getElementById("custAddress").value.trim() || "N/A";

            const heights = document.querySelectorAll(".win-h");
            const widths = document.querySelectorAll(".win-w");
            const qtys = document.querySelectorAll(".win-q");

            let totalHeightFt = 0;
            let totalWidthFt = 0;
            let totalGlassSqft = 0;
            let totalQtyCount = 0;

            heights.forEach((hEl, idx) => {
                const h = parseFloat(hEl.value) || 0;
                const w = parseFloat(widths[idx].value) || 0;
                const q = parseFloat(qtys[idx].value) || 0;

                totalHeightFt += (h / 12) * 2 * q;
                totalWidthFt += (w / 12) * q;
                totalGlassSqft += ((h * w) / 144) * q;
                totalQtyCount += q;
            });

            const outerSide = totalHeightFt.toFixed(2);
            const outerTop = totalWidthFt.toFixed(2);
            const outerBottom = totalWidthFt.toFixed(2);
            const shutterLock = totalHeightFt.toFixed(2);
            const shutterInter = totalHeightFt.toFixed(2);
            const glassSqft = totalGlassSqft.toFixed(2);

            // Display Results
            document.getElementById("resOuterSide").innerText = outerSide + " ft";
            document.getElementById("resOuterTop").innerText = outerTop + " ft";
            document.getElementById("resOuterBottom").innerText = outerBottom + " ft";
            document.getElementById("resShutterLock").innerText = shutterLock + " ft";
            document.getElementById("resShutterInter").innerText = shutterInter + " ft";
            document.getElementById("resGlassArea").innerText = glassSqft + " sqft";
            document.getElementById("resultCard").style.display = "block";

            // Prepare Data for Quotation & History
            lastCalculatedData = {
                id: Date.now(),
                date: new Date().toLocaleDateString('en-GB'),
                name: custName,
                phone: custPhone,
                address: custAddress,
                series: document.getElementById("seriesSelect").value,
                company: document.getElementById("companySelect").value,
                aluThick: document.getElementById("aluThickSelect").value,
                glassComp: document.getElementById("glassCompSelect").value,
                glassThick: document.getElementById("glassThickSelect").value,
                glassColor: document.getElementById("glassColorSelect").value,
                totalQty: totalQtyCount,
                glassSqft: glassSqft,
                outerSide: outerSide,
                outerTop: outerTop
            };

            saveHistory(lastCalculatedData);
            alert("হিসাব সম্পন্ন হয়েছে এবং হিস্ট্রিতে সেভ করা হয়েছে!");
        }

        function sendToQuotation() {
            if (!lastCalculatedData) {
                // যদি সরাসরি ক্লিক করে হিসাব না করে থাকে, তবে শেষ হিসাবটি তুলে নেবে
                calculateMaterials();
            }
            // Quotation পেজে পাঠানোর জন্য লোকাল স্টোরেজে সেভ করা হলো
            localStorage.setItem("quotation_active_data", JSON.stringify(lastCalculatedData));
        }

        function saveHistory(record) {
            let history = JSON.parse(localStorage.getItem("calc_history")) || [];
            history.unshift(record);
            localStorage.setItem("calc_history", JSON.stringify(history));
            renderHistory();
        }

        function renderHistory() {
            const historyList = document.getElementById("historyList");
            let history = JSON.parse(localStorage.getItem("calc_history")) || [];

            if (history.length === 0) {
                historyList.innerHTML = `<p style="color:#9ca3af; text-align:center; font-size:13px; margin-top:20px;">No history available</p>`;
                return;
            }

            let html = "";
            history.forEach(item => {
                html += `
                    <div class="history-card">
                        <button class="history-btn-del" onclick="deleteHistoryItem(${item.id})">Delete</button>
                        <div class="history-cust-name">👤 ${item.name}</div>
                        <div class="history-cust-sub">📞 ${item.phone} | 📍 ${item.address}</div>
                        <div style="font-size:12px; color:#e5e7eb; margin-top:6px;">
                            <strong>Series:</strong> ${item.series} (${item.company})<br>
                            <strong>Glass Area:</strong> ${item.glassSqft} sqft
                        </div>
                        <div style="font-size:10px; color:#6b7280; text-align:right; margin-top:4px;">${item.date}</div>
                    </div>
                `;
            });

            historyList.innerHTML = html;
        }

        function deleteHistoryItem(id) {
            let history = JSON.parse(localStorage.getItem("calc_history")) || [];
            history = history.filter(item => item.id !== id);
            localStorage.setItem("calc_history", JSON.stringify(history));
            renderHistory();
        }

        function clearAllHistory() {
            if (confirm("আপনি কি সমস্ত হিস্ট্রি ডিলিট করতে চান?")) {
                localStorage.removeItem("calc_history");
                renderHistory();
            }
        }

        function toggleHistoryDrawer() {
            const drawer = document.getElementById("historyDrawer");
            if (drawer.style.display === "flex") {
                drawer.style.display = "none";
            } else {
                renderHistory();
                drawer.style.display = "flex";
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curtain Wall Estimator</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #f1f5f9;
            color: #333;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #0c59a4;
            margin-bottom: 20px;
            font-weight: 900;
        }
        .input-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
        }
        .input-group label {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #475569;
        }
        .input-group input {
            padding: 10px;
            font-size: 16px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            outline: none;
            font-weight: bold;
        }
        .input-group input:focus {
            border-color: #0c59a4;
        }
        .btn-calc {
            width: 100%;
            padding: 12px;
            background-color: #198754;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 30px;
        }
        .btn-calc:hover {
            background-color: #146c43;
        }
        
        /* Table Styles */
        .result-section {
            display: none; /* Initially hidden */
        }
        .result-title {
            background: #023871;
            color: #fff;
            padding: 10px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px 4px 0 0;
            margin-top: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
            background: #fff;
        }
        th, td {
            border: 1px solid #cbd5e1;
            padding: 10px;
            text-align: center;
            font-size: 14px;
        }
        th {
            background: #f8fafc;
            color: #111;
            font-weight: bold;
        }
        .total-row td {
            font-weight: bold;
            background: #e2e8f0;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>কার্টিন ওয়াল এস্টিমেটর (Curtain Wall)</h2>

    <!-- Input Section -->
    <div class="input-grid">
        <div class="input-group">
            <label>মোট চওড়া (ফিট)</label>
            <input type="number" id="totalWidth" placeholder="যেমন: 24">
        </div>
        <div class="input-group">
            <label>মোট হাইট (ফিট)</label>
            <input type="number" id="totalHeight" placeholder="যেমন: 11">
        </div>
        <div class="input-group">
            <label>লম্বালম্বি কলাম (কয়টি খোপ)</label>
            <input type="number" id="cols" placeholder="যেমন: 6">
        </div>
        <div class="input-group">
            <label>আড়াআড়ি সারি (কয়টি খোপ)</label>
            <input type="number" id="rows" placeholder="যেমন: 3">
        </div>
    </div>

    <button class="btn-calc" onclick="calculateMaterials()">হিসাব বের করুন</button>

    <!-- Results Section -->
    <div id="resultArea" class="result-section">
        
        <!-- অ্যালুমিনিয়াম সেকশন -->
        <div class="result-title">অ্যালুমিনিয়ামের হিসাব (২১ ফিট লম্বা অনুযায়ী)</div>
        <table>
            <thead>
                <tr>
                    <th>মালের নাম</th>
                    <th>কোথায় লাগবে</th>
                    <th>টোটাল রানিং ফিট</th>
                    <th>আনুমানিক পরিমাণ (২১ ফিট পাইপ)</th>
                </tr>
            </thead>
            <tbody id="alumTable"></tbody>
        </table>

        <!-- গ্লাস ও অন্যান্য হিসাব -->
        <div class="result-title">গ্লাস, সিলিকন ও নটেন টেপ</div>
        <table>
            <thead>
                <tr>
                    <th>উপাদান</th>
                    <th>বিবরণ ও পরিমাণ</th>
                </tr>
            </thead>
            <tbody id="glassTable"></tbody>
        </table>

        <!-- এক্সেসরিজ হিসাব -->
        <div class="result-title">এক্সেসরিজ ও ফিটিংস (ক্ল্যাম, স্ক্রু, নাটবোল্ট, এঙ্গেল)</div>
        <table>
            <thead>
                <tr>
                    <th>উপাদানের নাম</th>
                    <th>ক্যালকুলেশন</th>
                    <th>মোট পরিমাণ</th>
                </tr>
            </thead>
            <tbody id="accTable"></tbody>
        </table>

    </div>
</div>

<script>
    function calculateMaterials() {
        // ইনপুট ভ্যালু নেওয়া
        let width = parseFloat(document.getElementById('totalWidth').value) || 0;
        let height = parseFloat(document.getElementById('totalHeight').value) || 0;
        let cols = parseInt(document.getElementById('cols').value) || 0;
        let rows = parseInt(document.getElementById('rows').value) || 0;

        if(width === 0 || height === 0 || cols === 0 || rows === 0) {
            alert("দয়া করে সবগুলো মাপ সঠিকভাবে দিন!");
            return;
        }

        let totalKhop = cols * rows;

        // ১. অ্যালুমিনিয়ামের হিসাব
        // হাফ সেকশন (চারিপাশের ফ্রেম)
        let halfSectionFeet = (width * 2) + (height * 2);
        let halfSectionPipes = Math.ceil(halfSectionFeet / 21);

        // ফুল সেকশন (মিডেল সেকশন)
        let verticalPipesCount = cols + 1; // টোটাল খাড়া মাল (সাইড সহ হিসাবের সুবিধার্থে)
        let middleVerticalsCount = cols - 1; // শুধুমাত্র মাঝখানের খাড়া মাল
        let middleVerticalFeet = middleVerticalsCount * height; // মাঝের খাড়া মালের টোটাল ফিট

        // আড়াআড়ি মালের হিসাব (২ ইঞ্চি জয়েন্ট বাদ দিয়ে)
        let horizontalRowsCount = rows - 1; // মাঝখানের আড়াআড়ি লাইনের সংখ্যা
        let deductionPerLine = (verticalPipesCount * 2) / 12; // প্রতি লাইনে জয়েন্টের জন্য ২ ইঞ্চি করে বাদ (ফিটে কনভার্ট করা)
        let horizontalFeetPerLine = width - deductionPerLine; 
        if (horizontalFeetPerLine < 0) horizontalFeetPerLine = 0;
        let middleHorizontalFeet = horizontalRowsCount * horizontalFeetPerLine;

        let totalFullSectionFeet = middleVerticalFeet + middleHorizontalFeet;
        let fullSectionPipes = Math.ceil(totalFullSectionFeet / 21);

        // ২. গ্লাস ও অন্যান্য
        let totalGlassSqft = width * height; // গ্লাসে কোনো ইঞ্চি বাদ যাবে না
        let totalSilicon = Math.ceil(totalGlassSqft / 50); // প্রতি ৫০ স্কয়ার ফিটে ১টি সিলিকন

        // নটেন টেপ (প্রতি খোপের চারিপাশ)
        let widthPerKhop = width / cols;
        let heightPerKhop = height / rows;
        let tapePerKhop = (widthPerKhop * 2) + (heightPerKhop * 2);
        let totalTapeFeet = tapePerKhop * totalKhop;
        let tapeCoils = Math.ceil(totalTapeFeet / 100); // ১০০ ফিটের কয়েল ধরলে

        // ৩. এক্সেসরিজ ও ফিটিংস
        // প্রতি খাড়া মালের জন্য উপরে ২টি, নিচে ২টি = মোট ৪টি ক্ল্যাম
        let totalClamps = verticalPipesCount * 4; 
        let royalBolts = totalClamps; // ১টি ক্ল্যামে ১টি রয়্যাল বোল্ট
        let screws = totalClamps * 2; // ১টি ক্ল্যামে ২টি ১" স্ক্রু
        let nutBolts = totalClamps; // ১টি ক্ল্যামে ১টি নাটবোল্ট (আপনার হিসাব অনুযায়ী প্রতিটিতে ১টি)

        // এঙ্গেল ও রিপিট
        // প্রতি খোপে ৪ কোনায় ২ ইঞ্চি করে মোট ৮ ইঞ্চি (8/12 ফিট)
        let totalAngleFeet = totalKhop * (8 / 12);
        let anglePipes = Math.ceil(totalAngleFeet / 21); // ২১ ফিট লম্বা এঙ্গেল
        let rivets = totalKhop * 20; // প্রতি খোপে ৪ জয়েন্ট * ৫টি করে রিপিট = ২০টি রিপিট

        // ডাটা টেবিলে বসানো
        
        // Alum Table
        document.getElementById('alumTable').innerHTML = `
            <tr>
                <td>হাফ সেকশন (Top & Side)</td>
                <td>একেবারে উপরে, নিচে ও ডানে-বামে</td>
                <td>${halfSectionFeet.toFixed(2)} ফিট</td>
                <td><strong>${halfSectionPipes} পিস</strong></td>
            </tr>
            <tr>
                <td>ফুল সেকশন (Middle Section)</td>
                <td>মাঝখানের সব খাড়া ও আড়াআড়ি মাল</td>
                <td>${totalFullSectionFeet.toFixed(2)} ফিট</td>
                <td><strong>${fullSectionPipes} পিস</strong></td>
            </tr>
            <tr>
                <td>অ্যাঙ্গেল (Angle)</td>
                <td>প্রতি খোপের জয়েন্টের জন্য (২" করে)</td>
                <td>${totalAngleFeet.toFixed(2)} ফিট</td>
                <td><strong>${anglePipes} পিস</strong></td>
            </tr>
        `;

        // Glass Table
        document.getElementById('glassTable').innerHTML = `
            <tr>
                <td>মোট গ্লাস এরিয়া</td>
                <td><strong>${totalGlassSqft.toFixed(2)} স্কয়ার ফিট</strong> (মোট খোপ: ${totalKhop} টি)</td>
            </tr>
            <tr>
                <td>নটেন টেপ</td>
                <td><strong>${totalTapeFeet.toFixed(2)} ফিট</strong> (আনুমানিক ${tapeCoils} কয়েল / ১০০ ফিট হিসেবে)</td>
            </tr>
            <tr>
                <td>সিলিকন গাম</td>
                <td><strong>${totalSilicon} পিস</strong> (প্রতি ৫০ স্কয়ার ফিটে ১টি হিসেবে)</td>
            </tr>
        `;

        // Accessories Table
        document.getElementById('accTable').innerHTML = `
            <tr>
                <td>ক্ল্যাম (Clamps)</td>
                <td>প্রতি খাড়া মালে ৪টি করে (${verticalPipesCount} টি খাড়া মাল)</td>
                <td><strong>${totalClamps} পিস</strong></td>
            </tr>
            <tr>
                <td>রয়্যাল বোল্ট</td>
                <td>প্রতি ক্ল্যামের জন্য ১টি করে</td>
                <td><strong>${royalBolts} পিস</strong></td>
            </tr>
            <tr>
                <td>১ ইঞ্চি স্ক্রু</td>
                <td>প্রতি ক্ল্যামের জন্য ২টি করে</td>
                <td><strong>${screws} পিস</strong></td>
            </tr>
            <tr>
                <td>২" নাটবোল্ট (৬/৮ মিমি)</td>
                <td>প্রতি ক্ল্যামের জন্য ১টি করে</td>
                <td><strong>${nutBolts} পিস</strong></td>
            </tr>
            <tr>
                <td>রিপিট (Rivets)</td>
                <td>প্রতি খোপে ২০টি করে (${totalKhop} টি খোপ)</td>
                <td><strong>${rivets} পিস</strong></td>
            </tr>
        `;

        // ফলাফল দেখান
        document.getElementById('resultArea').style.display = 'block';
    }
</script>

</body>
</html>

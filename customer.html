<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Management - Aluminium ERP BD</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #0b0f19; color: #f3f4f6; display: flex; justify-content: center; padding: 12px; min-height: 100vh; }
        .mobile-app { width: 100%; max-width: 450px; background: #0b0f19; border-radius: 28px; padding: 16px; position: relative; }
        
        /* Header */
        .app-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .back-btn { background: #192233; border: 1px solid #232e42; color: #f9fafb; font-size: 18px; border-radius: 12px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; text-decoration: none; }
        .header-title { font-size: 18px; font-weight: 700; color: #f9fafb; }
        
        /* Card Style */
        .card { background: #121929; border-radius: 20px; padding: 20px; border: 1px solid #1e293b; margin-bottom: 16px; }
        .card h3 { color: #fbbf24; font-size: 16px; margin-bottom: 15px; border-bottom: 1px solid #232e42; padding-bottom: 8px; }
        
        /* Form Inputs */
        .form-group { margin-bottom: 12px; text-align: left; }
        .form-group label { display: block; font-size: 12px; color: #9ca3af; margin-bottom: 6px; }
        .form-group input, .form-group textarea { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #232e42; background: #192233; color: white; font-size: 14px; outline: none; }
        .form-group textarea { resize: none; height: 60px; }

        .btn-add { background: #2563eb; color: white; border: none; padding: 12px; border-radius: 10px; font-weight: bold; font-size: 14px; cursor: pointer; width: 100%; margin-top: 5px; }
        .btn-add:active { transform: scale(0.98); }

        /* Search Input */
        .search-box { width: 100%; padding: 10px 14px; border-radius: 12px; border: 1px solid #232e42; background: #121929; color: white; font-size: 14px; margin-bottom: 12px; outline: none; }

        /* Customer List */
        .customer-card { background: #192233; border: 1px solid #232e42; border-radius: 14px; padding: 14px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .cust-info h4 { font-size: 15px; color: #f9fafb; margin-bottom: 4px; }
        .cust-info p { font-size: 12px; color: #9ca3af; margin-bottom: 2px; }
        
        .action-btns { display: flex; gap: 8px; }
        .call-btn { background: #059669; color: white; border: none; width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; text-decoration: none; }
        .delete-btn { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 14px; cursor: pointer; }
    </style>
</head>
<body>

<div class="mobile-app">
    <!-- Header -->
    <div class="app-header">
        <a href="index.html" class="back-btn">←</a>
        <div class="header-title">Customer List</div>
        <div style="width: 40px;"></div>
    </div>

    <!-- Add Customer Form -->
    <div class="card">
        <h3>👥 নতুন কাস্টমার যোগ করুন</h3>
        <div class="form-group">
            <label>কাস্টমারের নাম (Name)</label>
            <input type="text" id="custName" placeholder="যেমন: রহিম সাহেব">
        </div>
        <div class="form-group">
            <label>মোবাইল নম্বর (Phone)</label>
            <input type="tel" id="custPhone" placeholder="017XXXXXXXX">
        </div>
        <div class="form-group">
            <label>ঠিকানা (Address)</label>
            <textarea id="custAddress" placeholder="কাস্টমারের ঠিকানা..."></textarea>
        </div>
        <button class="btn-add" onclick="addCustomer()">+ Save Customer</button>
    </div>

    <!-- Customer Search & List -->
    <input type="text" id="searchBox" class="search-box" placeholder="🔍 কাস্টমার খুঁজুন (নাম বা নম্বর)..." oninput="renderCustomers()">

    <div id="customerList">
        <!-- Dynamic Customers will appear here -->
    </div>
</div>

<script>
    let customers = [];

    document.addEventListener("DOMContentLoaded", () => {
        // License Security Check
        if (localStorage.getItem("erp_unlocked") !== "true") {
            alert("অনুগ্রহ করে অ্যাপটি লাইসেন্স কি দিয়ে অ্যাক্টিভেট করুন।");
            location.href = "index.html";
            return;
        }

        loadCustomers();
    });

    function loadCustomers() {
        let saved = localStorage.getItem("erp_customers");
        if (saved) {
            customers = JSON.parse(saved);
        }
        renderCustomers();
    }

    function saveCustomersToStorage() {
        localStorage.setItem("erp_customers", JSON.stringify(customers));
    }

    function addCustomer() {
        let name = document.getElementById("custName").value.trim();
        let phone = document.getElementById("custPhone").value.trim();
        let address = document.getElementById("custAddress").value.trim();

        if (!name || !phone) {
            alert("দয়া করে কাস্টমারের নাম এবং মোবাইল নম্বর দিন!");
            return;
        }

        let newCustomer = {
            id: Date.now(),
            name: name,
            phone: phone,
            address: address || "N/A"
        };

        customers.unshift(newCustomer);
        saveCustomersToStorage();
        renderCustomers();

        // Clear Form Inputs
        document.getElementById("custName").value = "";
        document.getElementById("custPhone").value = "";
        document.getElementById("custAddress").value = "";

        alert("✅ কাস্টমার সেভ করা হয়েছে!");
    }

    function deleteCustomer(id) {
        if (confirm("আপনি কি এই কাস্টমার রিমুভ করতে চান?")) {
            customers = customers.filter(c => c.id !== id);
            saveCustomersToStorage();
            renderCustomers();
        }
    }

    function renderCustomers() {
        let listContainer = document.getElementById("customerList");
        let searchKeyword = document.getElementById("searchBox").value.toLowerCase();
        listContainer.innerHTML = "";

        let filteredCustomers = customers.filter(c => 
            c.name.toLowerCase().includes(searchKeyword) || 
            c.phone.includes(searchKeyword)
        );

        if (filteredCustomers.length === 0) {
            listContainer.innerHTML = `<div style="text-align: center; color: #9ca3af; padding: 20px; font-size: 13px;">কোনো কাস্টমার পাওয়া যায়নি।</div>`;
            return;
        }

        filteredCustomers.forEach(c => {
            listContainer.innerHTML += `
                <div class="customer-card">
                    <div class="cust-info">
                        <h4>${c.name}</h4>
                        <p>📞 ${c.phone}</p>
                        <p>📍 ${c.address}</p>
                    </div>
                    <div class="action-btns">
                        <!-- Direct Phone Call Button -->
                        <a href="tel:${c.phone}" class="call-btn" title="Call Customer">📞</a>
                        <button class="delete-btn" onclick="deleteCustomer(${c.id})" title="Delete">🗑️</button>
                    </div>
                </div>
            `;
        });
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Management - Aluminium ERP BD</title>
  <style>
    :root {
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --text: #0f172a;
      --border: #cbd5e1;
      --input-bg: #ffffff;
      --header-bg: linear-gradient(135deg, #123a8c 0%, #1557c0 45%, #2563d9 100%);
    }

    *, *::before, *::after { box-sizing: border-box; }
    
    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
    }
    
    body {
      padding: 12px;
      display: flex;
      justify-content: center;
    }

    .main-container { width: 100%; max-width: 500px; }

    /* ================= HEADER STYLE ================= */
    .header-card {
      background: var(--header-bg);
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 15px;
      box-shadow: 0 4px 15px rgba(20, 70, 160, 0.2);
      color: #ffffff;
    }
    
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.2);
      padding-bottom: 10px;
    }

    .header-title {
      flex: 1;
      text-align: left;
      font-weight: 900;
      font-size: 18px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .date-display {
      font-size: 13px;
      font-weight: 700;
      background: rgba(255,255,255,0.2);
      padding: 4px 10px;
      border-radius: 6px;
      white-space: nowrap;
    }

    .shop-details {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .editable-input {
      width: 100%;
      height: 40px;
      padding: 6px 12px;
      border: none;
      border-radius: 6px;
      background: rgba(255,255,255,0.95);
      color: #0f172a;
      font-size: 18px;
      font-weight: 900;
      text-align: center;
      outline: none;
      transition: all 0.3s ease;
    }
    #shopPhone {
      font-size: 15px;
      font-weight: 800;
    }

    /* ================= FORM & LIST SECTION ================= */
    .form-card { 
      background: var(--card-bg); 
      border: 1px solid var(--border); 
      border-radius: 12px; 
      padding: 16px; 
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 13px; color: #475569; margin-bottom: 5px; font-weight: 700; }
    .form-control { 
      width: 100%; 
      padding: 10px; 
      background: var(--input-bg); 
      border: 1.5px solid var(--border); 
      color: var(--text); 
      border-radius: 8px; 
      font-size: 14px; 
      font-weight: 600;
      outline: none; 
    }
    .form-control:focus { border-color: var(--accent); }

    .btn-submit { 
      width: 100%; 
      padding: 12px; 
      background: var(--accent); 
      color: white; 
      border: none; 
      border-radius: 8px; 
      font-weight: 900; 
      cursor: pointer; 
      font-size: 15px; 
      margin-top: 5px; 
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.2); 
    }
    .btn-submit:active { background: var(--accent-hover); }

    .search-box { margin-bottom: 15px; }

    .customer-list { display: flex; flex-direction: column; gap: 12px; }
    .customer-card { 
      background: var(--card-bg); 
      border: 1px solid var(--border); 
      border-radius: 10px; 
      padding: 14px; 
      display: flex; 
      flex-direction: column; 
      gap: 10px; 
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }
    
    .cust-top-row { display: flex; justify-content: space-between; align-items: flex-start; }
    .cust-info h4 { font-size: 16px; color: #1e3a8a; font-weight: 900; margin-bottom: 4px; }
    .cust-info p { font-size: 13px; color: #475569; font-weight: 600; margin-top: 2px; }

    .action-btns { display: flex; gap: 6px; }
    .btn-action { background: #e2e8f0; border: none; color: #0f172a; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; }
    .btn-delete { background: #fee2e2; color: #dc2626; }

    /* যোগাযোগের দ্রুত বাটনসমূহ */
    .contact-actions { display: flex; gap: 8px; border-top: 1px solid var(--border); padding-top: 10px; flex-wrap: wrap; }
    .btn-contact { text-decoration: none; padding: 8px 12px; border-radius: 6px; font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; gap: 5px; color: white; flex: 1; justify-content: center; text-align: center; min-width: 90px; }
    .btn-call { background: #10b981; } /* ডাইরেক্ট কল */
    .btn-wa { background: #25d366; color: #ffffff; } /* হোয়াটসঅ্যাপ */
    .btn-imo { background: #2563eb; } /* ইমু */

    .empty-msg { text-align: center; color: #64748b; font-size: 14px; font-weight: bold; margin-top: 30px; }
  </style>
</head>
<body>

<div class="main-container">
  
  <!-- হেডার সেকশন (ব্লু গ্রাডিয়েন্ট) -->
  <div class="header-card">
    <div class="header-top">
      <span class="header-title">কাস্টমার ম্যানেজমেন্ট</span>
      <div id="currentDate" class="date-display"></div>
    </div>
    
    <div class="shop-details">
      <input type="text" id="shopName" class="editable-input" value="আর এম থাই অ্যালুমিনিয়াম" placeholder="দোকানের নাম" oninput="saveShopDetails()">
      <input type="text" id="shopPhone" class="editable-input" value="মোবাইল: 01676474412" placeholder="মোবাইল নম্বর" oninput="saveShopDetails()">
    </div>
  </div>

  <!-- কাস্টমার যোগ করার ফর্ম -->
  <div class="form-card">
    <h3 id="formTitle" style="font-size: 15px; margin-bottom: 12px; color: #1e3a8a; font-weight: 900;">➕ Add New Customer</h3>
    <input type="hidden" id="editIndex" value="">
    
    <div class="form-group">
      <label>Customer Name *</label>
      <input type="text" id="custName" class="form-control" placeholder="গ্রাহকের নাম লিখুন">
    </div>
    
    <div class="form-group">
      <label>Mobile Number *</label>
      <input type="text" id="custPhone" class="form-control" placeholder="মোবাইল নম্বর লিখুন (যেমন: 017xxxxxxxx)">
    </div>

    <div class="form-group">
      <label>Address</label>
      <input type="text" id="custAddress" class="form-control" placeholder="ঠিকানা লিখুন">
    </div>

    <button class="btn-submit" id="saveBtn" onclick="saveCustomer()">Save Customer</button>
  </div>

  <!-- সার্চ বক্স -->
  <div class="search-box">
    <input type="text" id="searchInput" class="form-control" placeholder="🔍 কাস্টমার খুঁজুন (নাম বা নম্বর দিয়ে)..." oninput="renderCustomers()">
  </div>

  <!-- কাস্টমার লিস্ট -->
  <div class="customer-list" id="customerListContainer">
    <!-- কাস্টমার কার্ডগুলো এখানে ডাইনামিকভাবে লোড হবে -->
  </div>

</div>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    setCurrentDate();
    loadShopDetails();
    renderCustomers();
  });

  function setCurrentDate() {
    const today = new Date();
    const day = String(today.getDate()).padStart(2, '0');
    const month = String(today.getMonth() + 1).padStart(2, '0');
    const year = today.getFullYear();
    document.getElementById("currentDate").innerText = `তারিখ: ${day}/${month}/${year}`;
  }

  function saveShopDetails() {
    const shopName = document.getElementById("shopName").value;
    const shopPhone = document.getElementById("shopPhone").value;
    localStorage.setItem("erp_shopName", shopName);
    localStorage.setItem("erp_shopPhone", shopPhone);
  }

  function loadShopDetails() {
    const savedName = localStorage.getItem("erp_shopName");
    const savedPhone = localStorage.getItem("erp_shopPhone");
    if (savedName !== null) document.getElementById("shopName").value = savedName;
    if (savedPhone !== null) document.getElementById("shopPhone").value = savedPhone;
  }

  function saveCustomer() {
    let name = document.getElementById('custName').value.trim();
    let phone = document.getElementById('custPhone').value.trim();
    let address = document.getElementById('custAddress').value.trim();
    let editIndex = document.getElementById('editIndex').value;

    if (!name || !phone) {
      alert("দয়া করে কাস্টমার নাম এবং মোবাইল নম্বর লিখুন!");
      return;
    }

    let customers = JSON.parse(localStorage.getItem('erp_customers')) || [];

    if (editIndex === "") {
      customers.push({ name, phone, address });
    } else {
      customers[editIndex] = { name, phone, address };
      document.getElementById('editIndex').value = "";
      document.getElementById('formTitle').innerText = "➕ Add New Customer";
      document.getElementById('saveBtn').innerText = "Save Customer";
    }

    localStorage.setItem('erp_customers', JSON.stringify(customers));
    clearForm();
    renderCustomers();
  }

  function clearForm() {
    document.getElementById('custName').value = '';
    document.getElementById('custPhone').value = '';
    document.getElementById('custAddress').value = '';
  }

  function renderCustomers() {
    let container = document.getElementById('customerListContainer');
    let searchQuery = document.getElementById('searchInput').value.toLowerCase();
    let customers = JSON.parse(localStorage.getItem('erp_customers')) || [];

    container.innerHTML = '';

    let filteredCustomers = customers.filter(c => 
      c.name.toLowerCase().includes(searchQuery) || c.phone.includes(searchQuery)
    );

    if (filteredCustomers.length === 0) {
      container.innerHTML = `<div class="empty-msg">কোনো কাস্টমার পাওয়া যায়নি</div>`;
      return;
    }

    filteredCustomers.forEach((cust) => {
      let originalIndex = customers.indexOf(cust);
      
      let rawPhone = cust.phone.replace(/\s+/g, '');
      let formattedPhone = rawPhone.startsWith('+') ? rawPhone : (rawPhone.startsWith('88') ? '+' + rawPhone : '+88' + rawPhone);
      let waLink = `https://wa.me/${formattedPhone}`;
      let callLink = `tel:${rawPhone}`;
      let imoLink = `imo://call?phone=${rawPhone}`;

      let card = document.createElement('div');
      card.className = 'customer-card';
      card.innerHTML = `
        <div class="cust-top-row">
          <div class="cust-info">
            <h4>${cust.name}</h4>
            <p>📞 ${cust.phone}</p>
            <p>📍 ${cust.address || 'ঠিকানা দেওয়া নেই'}</p>
          </div>
          <div class="action-btns">
            <button class="btn-action" onclick="editCustomer(${originalIndex})" title="Edit">✏️ Edit</button>
            <button class="btn-action btn-delete" onclick="deleteCustomer(${originalIndex})" title="Delete">🗑️</button>
          </div>
        </div>

        <div class="contact-actions">
          <a href="${callLink}" class="btn-contact btn-call">📞 Call</a>
          <a href="${waLink}" target="_blank" class="btn-contact btn-wa">💬 WhatsApp</a>
          <a href="${imoLink}" class="btn-contact btn-imo">📹 Imo</a>
        </div>
      `;
      container.appendChild(card);
    });
  }

  function editCustomer(index) {
    let customers = JSON.parse(localStorage.getItem('erp_customers')) || [];
    let cust = customers[index];

    document.getElementById('custName').value = cust.name;
    document.getElementById('custPhone').value = cust.phone;
    document.getElementById('custAddress').value = cust.address;
    document.getElementById('editIndex').value = index;

    document.getElementById('formTitle').innerText = "✏️ Edit Customer";
    document.getElementById('saveBtn').innerText = "Update Customer";
    
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function deleteCustomer(index) {
    if (confirm("আপনি কি নিশ্চিতভাবে এই কাস্টমারটি ডিলিট করতে চান?")) {
      let customers = JSON.parse(localStorage.getItem('erp_customers')) || [];
      customers.splice(index, 1);
      localStorage.setItem('erp_customers', JSON.stringify(customers));
      renderCustomers();
    }
  }
</script>

</body>
</html>

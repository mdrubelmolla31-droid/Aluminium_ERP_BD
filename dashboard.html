<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aluminium ERP BD</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- টপ নেভিগেশন বার -->
    <header class="top-nav">
        <button class="nav-btn">☰</button>
        <h1 class="nav-title">Dashboard</h1>
        <button class="nav-btn notification-btn">🔔</button>
    </header>

    <main class="dashboard-body">
        
        <!-- নীল রঙের ওয়েলকাম ব্যানার (ছবি অনুযায়ী) -->
        <div class="welcome-banner">
            <div class="banner-info">
                <h2>Welcome, Admin</h2>
                <p>Aluminium ERP BD</p>
            </div>
            <div class="user-avatar">
                👤
            </div>
        </div>

        <!-- ৬টি অপশনের গ্রিড মেনু -->
        <div class="dashboard-grid">
            
            <a href="company.html" class="grid-card bg-blue">
                <div class="icon-box icon-blue">🏢</div>
                <span>Company</span>
            </a>

            <a href="settings.html" class="grid-card bg-purple">
                <div class="icon-box icon-purple">📦</div>
                <span>Profile</span>
            </a>

            <a href="customer.html" class="grid-card bg-green">
                <div class="icon-box icon-green">👤</div>
                <span>Customer</span>
            </a>

            <a href="stock.html" class="grid-card bg-orange">
                <div class="icon-box icon-orange">⬢</div>
                <span>Stock</span>
            </a>

            <a href="quotation.html" class="grid-card bg-red">
                <div class="icon-box icon-red">📄</div>
                <span>Quotation</span>
            </a>

            <a href="calculator.html" class="grid-card bg-teal">
                <div class="icon-box icon-teal">🧮</div>
                <span>Material Calculator</span>
            </a>

        </div>

        <!-- সিস্টেম তথ্য ও সামারি (আগের কোডের সুবিধার্থে) -->
        <div class="summary-card">
            <h3>📊 Quick Overview</h3>
            <div class="summary-stats">
                <div><span>Total Quotation:</span> <b id="totalQuotation">0</b></div>
                <div><span>Total Sale:</span> <b id="totalSale">0.00 ৳</b></div>
            </div>
        </div>

    </main>

    <script src="dashboard.js"></script>
</body>
</html>

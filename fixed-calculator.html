<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>মূল ফিক্সড ক্যালকুলেটর</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
            background: #1e293b;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
        }
        h2 {
            text-align: center;
            color: #38bdf8;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #cbd5e1;
        }
        input {
            width: 100%;
            padding: 10px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #0284c7;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }
        button:hover {
            background: #0369a1;
        }
        .result {
            margin-top: 25px;
            background: #0f172a;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #334155;
        }
        .result h3 {
            margin: 0 0 15px 0;
            font-size: 18px;
            color: #38bdf8;
            border-bottom: 1px solid #334155;
            padding-bottom: 8px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 14px;
        }
        th, td {
            border: 1px solid #334155;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #0284c7;
            color: white;
        }
        td {
            background-color: #1e293b;
        }
        .summary-box {
            margin-top: 15px;
            font-size: 15px;
            font-weight: bold;
            color: #38bdf8;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📌 মূল ফিক্সড ক্যালকুলেটর</h2>
    
    <div class="form-group">
        <label for="height">মোট উচ্চতা (ফিট):</label>
        <input type="number" id="height" placeholder="যেমন: 11" step="any" value="11" oninput="generateRowInputs()">
    </div>

    <div class="form-group">
        <label for="width">মোট প্রস্থ / লেন্থ (ফিট):</label>
        <input type="number" id="width" placeholder="যেমন: 24" step="any" value="24">
    </div>

    <div class="form-group">
        <label for="cols">খাড়া খোপ / কলাম সংখ্যা:</label>
        <input type="number" id="cols" value="6">
    </div>

    <div class="form-group">
        <label for="rows">অনুভূমিক খোপ / সারি সংখ্যা:</label>
        <input type="number" id="rows" value="3" oninput="generateRowInputs()">
    </div>

    <div id="rowHeightsContainer" class="form-group">
        <label>প্রতিটি সারির উচ্চতা (ফিট করে):</label>
        <div id="rowInputsList"></div>
    </div>

    <button onclick="calculateFixedTable()">হিসাব করুন</button>

    <div class="result" id="resultBox" style="display: none;">
        <h3>হিসাবের ফলাফল ও কাটিং তালিকা:</h3>
        <div class="summary-box" id="resGlass"></div>
        
        <table>
            <thead>
                <tr>
                    <th>সেকশনের নাম</th>
                    <th>প্রয়োজনীয় মাপ / পরিমাণ</th>
                    <th>২১ ফিট সেকশন লাগবে</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- ডাইনামিক টেবিল ডাটা এখানে আসবে -->
            </tbody>
        </table>
    </div>
</div>

<script>
    function generateRowInputs() {
        const rows = parseInt(document.getElementById('rows').value) || 0;
        const totalHeight = parseFloat(document.getElementById('height').value) || 0;
        const container = document.getElementById('rowInputsList');
        container.innerHTML = '';

        let defaultVal = rows > 0 ? (totalHeight / rows).toFixed(1) : 0;

        for (let i = 1; i <= rows; i++) {
            container.innerHTML += `
                <div style="margin-bottom: 8px; display: flex; align-items: center; gap: 10px;">
                    <span style="font-size:14px; min-width:50px;">সারি ${i}:</span>
                    <input type="number" class="row-h-input" value="${defaultVal}" step="any">
                </div>
            `;
        }
    }

    window.onload = generateRowInputs;

    function calculateFixedTable() {
        const height = parseFloat(document.getElementById('height').value);
        const width = parseFloat(document.getElementById('width').value);
        const cols = parseInt(document.getElementById('cols').value);
        const rows = parseInt(document.getElementById('rows').value);
        const resultBox = document.getElementById('resultBox');
        
        if (isNaN(height) || isNaN(width) || height <= 0 || width <= 0 || isNaN(cols) || isNaN(rows)) {
            alert('দয়া করে সঠিক মাপ এবং খোপের সংখ্যা ইনপুট দিন।');
            return;
        }

        const standardLen = 21; // ২১ ফিট স্ট্যান্ডার্ড সেকশন

        // ১. গ্লাসের ক্ষেত্রফল
        const totalSqft = height * width;

        // ২. অ্যালুমিনিয়াম সেকশন হিসাব
        const verticalCount = cols + 1; // খাড়া মালের সংখ্যা
        const totalTopSideFeet = (width * 2) + (height * verticalCount);
        const topSidePcs = Math.ceil(totalTopSideFeet / standardLen);

        const horizontalCount = rows; 
        const totalBottomFeet = (width * horizontalCount) + (height * (rows - 1));
        const bottomPcs = Math.ceil(totalBottomFeet / standardLen);

        const totalBottomBitFeet = totalBottomFeet;
        const bottomBitPcs = Math.ceil(totalBottomBitFeet / standardLen);

        const totalGrooveCoverFeet = totalTopSideFeet + (width * (rows - 1));
        const grooveCoverPcs = Math.ceil(totalGrooveCoverFeet / standardLen);

        // টেবিল ডাটা তৈরি
        const tableBody = document.getElementById('tableBody');
        tableBody.innerHTML = `
            <tr>
                <td><strong>টপ এন্ড সাইড সেকশন</strong></td>
                <td>${totalTopSideFeet.toFixed(2)} ফিট</td>
                <td><strong>${topSidePcs} টি</strong> (২১ ফিটিংস)</td>
            </tr>
            <tr>
                <td><strong>ফিক্সডের বটম সেকশন</strong></td>
                <td>${totalBottomFeet.toFixed(2)} ফিট</td>
                <td><strong>${bottomPcs} টি</strong> (২১ ফিটিংস)</td>
            </tr>
            <tr>
                <td><strong>বটম বিট</strong></td>
                <td>${totalBottomBitFeet.toFixed(2)} ফিট</td>
                <td><strong>${bottomBitPcs} টি</strong> (২১ ফিটিংস)</td>
            </tr>
            <tr>
                <td><strong>গ্রুপ কভার</strong></td>
                <td>${totalGrooveCoverFeet.toFixed(2)} ফিট</td>
                <td><strong>${grooveCoverPcs} টি</strong> (২১ ফিটিংস)</td>
            </tr>
        `;

        document.getElementById('resGlass').innerHTML = `মোট গ্লাস এরিয়া: ${totalSqft.toFixed(2)} বর্গফুট`;
        resultBox.style.display = 'block';
    }
</script>

</body>
</html>

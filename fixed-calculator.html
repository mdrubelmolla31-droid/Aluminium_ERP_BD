<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>মূল ফিক্সড ক্যালকুলেটর</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        h2 {
            text-align: center;
            color: #38bdf8;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            margin-bottom: 4px;
            font-size: 14px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #0284c7;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background: #0369a1;
        }
        .result {
            margin-top: 20px;
            background: #0f172a;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #334155;
        }
        .result h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
            color: #38bdf8;
        }
        .result p {
            margin: 6px 0;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📌 মূল ফিক্সড ক্যালকুলেটর</h2>
    
    <div class="form-group">
        <label for="height">উচ্চতা (ফিট):</label>
        <input type="number" id="height" placeholder="উচ্চতা লিখুন (যেমন: 11)" step="any">
    </div>

    <div class="form-group">
        <label for="width">প্রস্থ / লেন্থ (ফিট):</label>
        <input type="number" id="width" placeholder="প্রস্থ লিখুন (যেমন: 24)" step="any">
    </div>

    <div class="form-group">
        <label for="cols">খাড়া খোপ / কলাম সংখ্যা:</label>
        <input type="number" id="cols" placeholder="যেমন: 6" value="6">
    </div>

    <div class="form-group">
        <label for="rows">অনুভূমিক খোপ / সারি সংখ্যা:</label>
        <input type="number" id="rows" placeholder="যেমন: 3" value="3">
    </div>

    <button onclick="calculateFixed()">হিসাব করুন</button>

    <div class="result" id="resultBox" style="display: none;">
        <h3>ফলাফল:</h3>
        <p id="resGlass">গ্লাসের ক্ষেত্রফল: </p>
        <p id="resTopSide">টপ এন্ড সাইড সেকশন: </p>
        <p id="resBottom">ফিক্সডের বটম সেকশন: </p>
        <p id="resBottomBit">বটম বিট: </p>
        <p id="resGrooveCover">গ্রুপ কভার: </p>
        <p id="resPlainCover">প্লেন কভার (প্রয়োজনীয়): </p>
    </div>
</div>

<script>
    function calculateFixed() {
        const height = parseFloat(document.getElementById('height').value);
        const width = parseFloat(document.getElementById('width').value);
        const cols = parseInt(document.getElementById('cols').value);
        const rows = parseInt(document.getElementById('rows').value);
        const resultBox = document.getElementById('resultBox');
        
        if (isNaN(height) || isNaN(width) || height <= 0 || width <= 0 || isNaN(cols) || isNaN(rows)) {
            alert('দয়া করে উচ্চতা, প্রস্থ এবং খোপের সংখ্যা সঠিকভাবে ইনপুট দিন।');
            return;
        }

        // ১. গ্লাসের ক্ষেত্রফল (বর্গফুট)
        const totalSqft = height * width;

        // ২. টপ এন্ড সাইড সেকশন (ছাদের আউটার + খাড়া মালগুলো)
        // খাড়া মাল সংখ্যা = cols + 1 (দুই পাশ সহ) অথবা কলাম অনুযায়ী
        const verticalCount = cols + 1;
        const topAndSideLength = (width * 2) + (height * verticalCount);

        // ৩. ফিক্সডের বটম সেকশন (নিচের বটম + মাঝের হরিজন্টাল ডিভিশনগুলো)
        const horizontalCount = rows; // সারির ওপর ভিত্তি করে বটম বা মাঝের মাল
        const fixedBottomLength = (width * horizontalCount) + (height * (rows - 1)); // আনুমানিক কাঠামোগত লজিক

        // ৪. অ্যাক্সেসরিজ হিসাব (বটম বিট, গ্রুপ কভার, প্লেন কভার)
        const bottomBit = fixedBottomLength; // বটমের ভেতরে সমপরিমাণ বটম বিট
        const grooveCover = topAndSideLength + (width * (rows - 1)); // খাড়া মাল ও মাঝের মালের জন্য গ্রুপ কভার
        const plainCover = (width * 2); // সাধারণ প্লেন কভারের প্রাথমিক মাপ

        // ফলাফল প্রদর্শন (২১ ফিটের হিসেবে কয়টা সেকশন লাগতে পারে তা বোঝার জন্য ফিট হিসেবে দেখানো হলো)
        document.getElementById('resGlass').innerText = `গ্লাসের পরিমাণ: ${totalSqft.toFixed(2)} বর্গফুট`;
        document.getElementById('resTopSide').innerText = `টপ এন্ড সাইড সেকশন: ${topAndSideLength.toFixed(2)} ফিট`;
        document.getElementById('resBottom').innerText = `ফিক্সডের বটম সেকশন: ${fixedBottomLength.toFixed(2)} ফিট`;
        document.getElementById('resBottomBit').innerText = `বটম বিট: ${bottomBit.toFixed(2)} ফিট`;
        document.getElementById('resGrooveCover').innerText = `গ্রুপ কভার: ${grooveCover.toFixed(2)} ফিট`;
        document.getElementById('resPlainCover').innerText = `প্লেন কভার: ${plainCover.toFixed(2)} ফিট`;
        
        resultBox.style.display = 'block';
    }
</script>

</body>
</html>

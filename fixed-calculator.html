<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>প্রফেশনাল মূল ফিক্সড ক্যালকুলেটর</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: #1e293b;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
        }
        h2 {
            text-align: center;
            color: #38bdf8;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #cbd5e1;
        }
        input {
            width: 100%;
            padding: 10px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #0284c7;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }
        button:hover {
            background: #0369a1;
        }
        .result {
            margin-top: 25px;
            background: #0f172a;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #334155;
        }
        .result h3 {
            margin: 0 0 15px 0;
            font-size: 18px;
            color: #38bdf8;
            border-bottom: 1px solid #334155;
            padding-bottom: 8px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 14px;
        }
        th, td {
            border: 1px solid #334155;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #0284c7;
            color: white;
        }
        td {
            background-color: #1e293b;
        }
        .summary-box {
            margin-top: 15px;
            font-size: 15px;
            font-weight: bold;
            color: #38bdf8;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📌 মূল ফিক্সড ক্যালকুলেটর (স্মার্ট অপ্টিমাইজেশন)</h2>
    
    <div class="form-group">
        <label for="height">মোট উচ্চতা (ফিট):</label>
        <input type="number" id="height" placeholder="যেমন: 11" step="any" value="11" oninput="generateRowInputs()">
    </div>

    <div class="form-group">
        <label for="width">মোট প্রস্থ / লেন্থ (ফিট):</label>
        <input type="number" id="width" placeholder="যেমন: 24" step="any" value="24">
    </div>

    <div class="form-group">
        <label for="cols">খাড়া খোপ / কলাম সংখ্যা:</label>
        <input type="number" id="cols" value="6">
    </div>

    <div class="form-group">
        <label for="rows">অনুভূমিক খোপ / সারি সংখ্যা:</label>
        <input type="number" id="rows" value="3" oninput="generateRowInputs()">
    </div>

    <div id="rowHeightsContainer" class="form-group">
        <label>প্রতিটি সারির উচ্চতা (ফিট করে):</label>
        <div id="rowInputsList"></div>
    </div>

    <button onclick="calculateAdvancedFixed()">হিসাব করুন</button>

    <div class="result" id="resultBox" style="display: none;">
        <h3>হিসাবের ফলাফল ও কাটিং ব্রেকডাউন:</h3>
        <div class="summary-box" id="resSummary"></div>
        
        <table>
            <thead>
                <tr>
                    <th>সেকشنের নাম</th>
                    <th>কাটিং সাইজ ও পরিমাণ</th>
                    <th>২১ ফিট সেকশন লাগবে</th>
                    <th>অবশিষ্ট অপচয় (Waste)</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- ডাইনামিক টেবিল ডাটা -->
            </tbody>
        </table>
    </div>
</div>

<script>
    function generateRowInputs() {
        const rows = parseInt(document.getElementById('rows').value) || 0;
        const totalHeight = parseFloat(document.getElementById('height').value) || 0;
        const container = document.getElementById('rowInputsList');
        container.innerHTML = '';

        let defaultVal = rows > 0 ? (totalHeight / rows).toFixed(1) : 0;

        for (let i = 1; i <= rows; i++) {
            container.innerHTML += `
                <div style="margin-bottom: 8px; display: flex; align-items: center; gap: 10px;">
                    <span style="font-size:14px; min-width:50px;">সারি ${i}:</span>
                    <input type="number" class="row-h-input" value="${defaultVal}" step="any">
                </div>
            `;
        }
    }

    window.onload = generateRowInputs;

    function calculateAdvancedFixed() {
        const height = parseFloat(document.getElementById('height').value);
        const width = parseFloat(document.getElementById('width').value);
        const cols = parseInt(document.getElementById('cols').value);
        const rows = parseInt(document.getElementById('rows').value);
        const resultBox = document.getElementById('resultBox');
        
        if (isNaN(height) || isNaN(width) || height <= 0 || width <= 0 || isNaN(cols) || isNaN(rows)) {
            alert('দয়া করে সঠিক মাপ এবং খোপের সংখ্যা ইনপুট দিন।');
            return;
        }

        // অ্যালুমিনিয়াম সেকশনের আনুমানিক পুরুত্ব (ইঞ্চিকে ফিটে রূপান্তর: যেমন ১.৫ ইঞ্চি = ০.১২৫ ফিট)
        // খোপের সংখ্যা বাড়লে অ্যালুমিনিয়াম যে জায়গা খাবে, তা গ্লাস থেকে বাদ যাবে
        const aluThicknessPerDiv = 1.25 / 12; // ১.২৫ ইঞ্চি
        const totalVerticalAluWidth = (cols - 1) * aluThicknessPerDiv;
        const totalHorizontalAluHeight = (rows - 1) * aluThicknessPerDiv;

        const netWidth = Math.max(0, width - totalVerticalAluWidth);
        const netHeight = Math.max(0, height - totalHorizontalAluHeight);

        // ১. নিখুঁত গ্লাস এরিয়া হিসাব
        const totalGlassSqft = netWidth * netHeight;

        const standardLen = 21; // ২১ ফিট স্ট্যান্ডার্ড সেকশন

        // কাটিং অপ্টিমাইজেশন ফাংশন (প্রতি ২১ ফিট পাইপ থেকে কয় পিস কাটবে এবং কত ওয়েস্টেজ হবে)
        function getCuttingDetails(pieceLength, totalPiecesNeeded) {
            let piecesPerStandard = Math.floor(standardLen / pieceLength);
            if (piecesPerStandard < 1) piecesPerStandard = 1; // যদি মালের সাইজ ২১ ফিটের বেশি হয়
            
            let totalSections = Math.ceil(totalPiecesNeeded / piecesPerStandard);
            let totalLengthUsed = totalPiecesNeeded * pieceLength;
            let totalLengthBought = totalSections * standardLen;
            let totalWaste = totalLengthBought - totalLengthUsed;

            return {
                totalSections: totalSections,
                waste: totalWaste > 0 ? totalWaste : 0
            };
        }

        // ২. টপ এন্ড সাইড সেকশন (লম্বালম্বি খাড়া মাল)
        const verticalCount = cols + 1;
        const topSideCutLen = height;
        const topSideCalc = getCuttingDetails(topSideCutLen, verticalCount);
        const totalTopSideFeet = (width * 2) + (height * verticalCount);

        // ৩. ফিক্সডের বটম সেকশন (অনুভূমিক মাল)
        const horizontalCount = rows;
        const bottomCutLen = width / cols; // প্রতি খোপের প্রস্থ অনুযায়ী আনুমানিক কাটিং বা মোট প্রস্থ
        const totalBottomFeet = (width * horizontalCount) + (height * (rows - 1));
        const bottomCalc = getCuttingDetails(width, horizontalCount); // পূর্ণ প্রস্থ ধরে হিসাব

        // ৪. বটম বিট ও গ্রুপ কভার
        const totalBottomBitFeet = totalBottomFeet;
        const bottomBitCalc = getCuttingDetails(width, horizontalCount);

        const totalGrooveCoverFeet = totalTopSideFeet + (width * (rows - 1));
        const grooveCalc = getCuttingDetails(width, verticalCount);

        // টেবিল ডাটা তৈরি
        const tableBody = document.getElementById('tableBody');
        tableBody.innerHTML = `
            <tr>
                <td><strong>টপ এন্ড সাইড সেকশন</strong></td>
                <td>${verticalCount} পিস (প্রতিটি ${topSideCutLen.toFixed(1)} ফিট)</td>
                <td><strong>${topSideCalc.totalSections} টি</strong> (২১ ফিটিংস)</td>
                <td style="color: #f87171;">${topSideCalc.waste.toFixed(2)} ফিট</td>
            </tr>
            <tr>
                <td><strong>ফিক্সডের বটম সেকশন</strong></td>
                <td>${horizontalCount} পিস (প্রতিটি ${width.toFixed(1)} ফিট)</td>
                <td><strong>${bottomCalc.totalSections} টি</strong> (২১ ফিটিংস)</td>
                <td style="color: #f87171;">${bottomCalc.waste.toFixed(2)} ফিট</td>
            </tr>
            <tr>
                <td><strong>বটম বিট</strong></td>
                <td>${horizontalCount} পিস (প্রতিটি ${width.toFixed(1)} ফিট)</td>
                <td><strong>${bottomBitCalc.totalSections} টি</strong> (২১ ফিটিংস)</td>
                <td style="color: #f87171;">${bottomBitCalc.waste.toFixed(2)} ফিট</td>
            </tr>
            <tr>
                <td><strong>গ্রুপ কভার</strong></td>
                <td>মাল অনুযায়ী</td>
                <td><strong>${grooveCalc.totalSections} টি</strong> (২১ ফিটিংস)</td>
                <td style="color: #f87171;">${grooveCalc.waste.toFixed(2)} ফিট</td>
            </tr>
        `;

        document.getElementById('resSummary').innerHTML = `
            নেট গ্লাস এরিয়া (অ্যালুমিনিয়াম বাদ দিয়ে): ${totalGlassSqft.toFixed(2)} বর্গফুট<br>
            মোট অ্যালুমিনিয়াম সেকশন প্রয়োজন: ${(totalTopSideFeet + totalBottomFeet).toFixed(2)} রানিং ফিট
        `;
        
        resultBox.style.display = 'block';
    }
</script>

</body>
</html>

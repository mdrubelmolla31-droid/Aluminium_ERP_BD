<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>মূল ফিক্সড ক্যালকুলেটর</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        h2 {
            text-align: center;
            color: #38bdf8;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 10px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #0284c7;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background: #0369a1;
        }
        .result {
            margin-top: 20px;
            background: #0f172a;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #334155;
        }
        .result h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
            color: #38bdf8;
        }
        .result p {
            margin: 5px 0;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📌 মূল ফিক্সড ক্যালকুলেটর</h2>
    
    <div class="form-group">
        <label for="width">প্রস্থ (ফিট/ইঞ্চি বা ইঞ্চি):</label>
        <input type="number" id="width" placeholder="প্রস্থ লিখুন" step="any">
    </div>

    <div class="form-group">
        <label for="height">উচ্চতা (ফিট/ইঞ্চি বা ইঞ্চি):</label>
        <input type="number" id="height" placeholder="উচ্চতা লিখুন" step="any">
    </div>

    <button onclick="calculateFixed()">হিসাব করুন</button>

    <div class="result" id="resultBox" style="display: none;">
        <h3>ফলাফল:</h3>
        <p id="resArea">গ্লাসের ক্ষেত্রফল: </p>
        <p id="resSection">সেকশন মাপ: </p>
    </div>
</div>

<script>
    function calculateFixed() {
        const width = parseFloat(document.getElementById('width').value);
        const height = parseFloat(document.getElementById('height').value);
        const resultBox = document.getElementById('resultBox');
        
        if (isNaN(width) || isNaN(height) || width <= 0 || height <= 0) {
            alert('দয়া করে সঠিক মাপ ইনপুট দিন।');
            return;
        }

        // সাধারণ হিসাব (উদাহরণস্বরূপ স্কয়ার ফিট এবং সেকশনের প্রাথমিক হিসাব)
        // যদি আপনার মাপ ইঞ্চি বা অন্য মাপে হয়, তবে ফর্মুলা পরবর্তীতে কাস্টমাইজ করা যাবে।
        const sqft = (width * height) / 144; // যদি ইঞ্চি ইনপুট হয়
        const totalSection = (width + height) * 2; // চারপাশের সেকশনের প্রাথমিক ধারণা

        document.getElementById('resArea').innerText = `গ্লাসের ক্ষেত্রফল: ${sqft.toFixed(2)} বর্গফিট (SQFT)`;
        document.getElementById('resSection').innerText = `সেকশন প্রয়োজন: ${totalSection.toFixed(2)} ইঞ্চি`;
        
        resultBox.style.display = 'block';
    }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>গ্লাস কাটিং অপটিমাইজার</title>

<style>

:root{
    --bg-color:#f1f5f9;
    --card-bg:#ffffff;
    --accent:#2563eb;
    --accent-hover:#1d4ed8;
    --green:#10b981;
    --green-hover:#059669;
    --red:#ef4444;
    --red-hover:#dc2626;
    --text:#0f172a;
    --muted:#64748b;
    --border:#cbd5e1;
    --input-bg:#ffffff;

    --header-bg:linear-gradient(
        135deg,
        #123a8c 0%,
        #1557c0 45%,
        #2563d9 100%
    );
}

*,
*::before,
*::after{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    background-color:var(--bg-color);
    color:var(--text);
    font-family:
        'Segoe UI',
        system-ui,
        -apple-system,
        Roboto,
        Arial,
        sans-serif;
}

body{
    padding:12px;
}

.main-container{
    max-width:950px;
    width:100%;
    margin:0 auto;
}

/* =====================================================
   HEADER
===================================================== */

.header-card{
    background:var(--header-bg);
    padding:16px;
    border-radius:12px;
    margin-bottom:15px;
    box-shadow:0 4px 15px rgba(20,70,160,0.20);
    color:#ffffff;
}

.header-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
    border-bottom:1px solid rgba(255,255,255,0.20);
    padding-bottom:10px;
}

.menu-btn{
    width:40px;
    height:40px;
    flex-shrink:0;
    border:1px solid rgba(255,255,255,0.35);
    border-radius:8px;
    background:rgba(255,255,255,0.18);
    color:#ffffff;
    font-size:20px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
}

.header-title{
    flex:1;
    text-align:center;
    font-weight:900;
    font-size:20px;
    letter-spacing:1px;
    padding:0 10px;
}

.date-display{
    font-size:14px;
    font-weight:700;
    background:rgba(255,255,255,0.20);
    padding:4px 10px;
    border-radius:6px;
    white-space:nowrap;
}

/* =====================================================
   SHOP INFO
===================================================== */

.shop-details{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-bottom:12px;
}

.editable-input{
    width:100%;
    height:42px;
    padding:6px 12px;
    border:none;
    border-radius:6px;
    background:rgba(255,255,255,0.95);
    color:#0f172a;
    font-size:18px;
    font-weight:900;
    text-align:center;
    outline:none;
}

#shopPhone{
    font-size:16px;
}

/* Sheet size */

.sheet-size-box{
    display:flex;
    gap:8px;
    width:100%;
    align-items:center;
}

.sheet-size-title{
    color:#ffffff;
    font-size:14px;
    font-weight:800;
    white-space:nowrap;
}

.sheet-input{
    flex:1;
    min-width:0;
    height:40px;
    padding:6px 8px;
    border:none;
    border-radius:6px;
    background:rgba(255,255,255,0.95);
    color:#111827;
    font-size:17px;
    font-weight:900;
    text-align:center;
    outline:none;
}

.sheet-x{
    color:#ffffff;
    font-size:18px;
    font-weight:900;
}

/* =====================================================
   SECTION TITLE
===================================================== */

.section-card{
    background:var(--card-bg);
    border:1px solid var(--border);
    border-radius:10px;
    padding:15px;
    margin-bottom:15px;
    box-shadow:0 4px 15px rgba(0,0,0,0.05);
}

.section-title{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:18px;
    font-weight:900;
    color:#1e3a8a;
    margin-bottom:12px;
}

.section-badge{
    margin-left:auto;
    background:#dbeafe;
    color:#1d4ed8;
    padding:5px 9px;
    border-radius:20px;
    font-size:11px;
    font-weight:800;
}

/* =====================================================
   INPUT ROW
===================================================== */

.glass-row{
    background:#f8fafc;
    padding:10px;
    border-radius:9px;
    margin-bottom:9px;
    display:flex;
    gap:8px;
    align-items:center;
    border:1px solid var(--border);
    box-shadow:0 2px 5px rgba(0,0,0,0.04);
}

.serial{
    width:32px;
    height:32px;
    flex-shrink:0;
    border-radius:50%;
    background:var(--accent);
    color:#ffffff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:900;
    font-size:13px;
}

.glass-row input{
    flex:1;
    min-width:0;
    padding:11px 7px;
    border-radius:7px;
    border:2px solid var(--border);
    background:var(--input-bg);
    color:var(--text);
    font-size:16px;
    font-weight:800;
    text-align:center;
    outline:none;
}

.glass-row input:focus{
    border-color:var(--accent);
}

.delete-row-btn{
    background:var(--red);
    color:#ffffff;
    border:none;
    border-radius:8px;
    width:44px;
    height:44px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
}

.delete-row-btn:hover{
    background:var(--red-hover);
}

/* =====================================================
   BUTTONS
===================================================== */

.btn{
    background:var(--accent);
    color:#ffffff;
    border:none;
    padding:15px;
    font-weight:900;
    border-radius:8px;
    cursor:pointer;
    width:100%;
    margin-top:10px;
    font-size:16px;
    box-shadow:0 4px 10px rgba(37,99,235,0.20);
    transition:0.2s;
}

.btn:hover{
    background:var(--accent-hover);
    transform:translateY(-1px);
}

.btn-add{
    background:var(--green);
    box-shadow:0 4px 10px rgba(16,185,129,0.20);
}

.btn-add:hover{
    background:var(--green-hover);
}

.btn-calculate{
    font-size:17px;
}

/* =====================================================
   RESULT CONTAINER
===================================================== */

.results-container{
    margin-top:20px;
    background:var(--card-bg);
    border-radius:10px;
    border:1px solid var(--border);
    padding:15px;
    box-shadow:0 4px 15px rgba(0,0,0,0.05);
}

.result-heading{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:12px;
}

.result-heading h3{
    margin:0;
    color:#1e3a8a;
    font-size:18px;
    font-weight:900;
}

.result-badge{
    background:#dbeafe;
    color:#1d4ed8;
    padding:5px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:900;
}

/* =====================================================
   SUMMARY CARDS
===================================================== */

.summary-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin-bottom:15px;
}

.summary-card{
    background:#f8fafc;
    border:1px solid var(--border);
    border-radius:8px;
    padding:12px 8px;
    text-align:center;
}

.summary-label{
    color:var(--muted);
    font-size:13px;
    font-weight:800;
    margin-bottom:5px;
}

.summary-value{
    color:#1d4ed8;
    font-size:20px;
    font-weight:900;
}

/* =====================================================
   SHEET RESULT CARDS
===================================================== */

.sheet-list{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.sheet-card{
    background:#f8fafc;
    border:1px solid var(--border);
    border-radius:8px;
    overflow:hidden;
}

.sheet-card-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#ffffff;
    padding:11px 12px;
    border-bottom:1px solid var(--border);
}

.sheet-number{
    display:flex;
    align-items:center;
    gap:9px;
}

.sheet-badge{
    background:var(--accent);
    color:#ffffff;
    width:32px;
    height:32px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:13px;
    font-weight:900;
}

.sheet-title{
    color:#1d4ed8;
    font-size:17px;
    font-weight:900;
}

/* =====================================================
   PIECE LIST
===================================================== */

.piece-list{
    padding:10px;
}

.piece-item{
    background:#ffffff;
    border:1px solid #e2e8f0;
    border-radius:7px;
    padding:9px;
    margin-bottom:7px;
    display:grid;
    grid-template-columns:30px 1fr 1fr;
    gap:6px;
    align-items:center;
}

.piece-item:last-child{
    margin-bottom:0;
}

.piece-number{
    width:26px;
    height:26px;
    border-radius:50%;
    background:#dbeafe;
    color:#1d4ed8;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:11px;
    font-weight:900;
}

.piece-size{
    font-size:15px;
    color:#0f172a;
    font-weight:900;
}

.piece-position{
    text-align:right;
    font-size:14px;
    color:#059669;
    font-weight:800;
}

/* =====================================================
   WASTE LIST
===================================================== */

.waste-list {
    padding: 10px 12px;
    background: #fff1f2;
    border-top: 1px dashed #fecdd3;
}

.waste-title {
    font-weight: 800;
    color: #e11d48;
    margin-bottom: 8px;
    font-size: 14px;
}

.waste-item {
    font-size: 14px;
    color: #9f1239;
    font-weight: 700;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
}
.waste-item::before {
    content: "•";
    margin-right: 6px;
}

/* =====================================================
   INFO
===================================================== */

.info-box{
    margin-top:15px;
    background:#eff6ff;
    border:1px solid #bfdbfe;
    color:#1e40af;
    border-radius:8px;
    padding:11px;
    text-align:center;
    font-size:13px;
    font-weight:700;
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

    body{
        padding:8px;
    }

    .header-card{
        padding:13px;
    }

    .header-top{
        margin-bottom:10px;
    }

    .header-title{
        font-size:17px;
        padding:0 5px;
    }

    .date-display{
        font-size:11px;
        padding:4px 6px;
    }

    .menu-btn{
        width:36px;
        height:36px;
        font-size:17px;
    }

    .editable-input{
        height:40px;
        font-size:16px;
    }

    #shopPhone{
        font-size:14px;
    }

    .sheet-size-title{
        font-size:12px;
    }

    .sheet-input{
        height:38px;
        font-size:15px;
    }

    .glass-row{
        gap:6px;
        padding:8px;
    }

    .serial{
        width:28px;
        height:28px;
        font-size:11px;
    }

    .glass-row input{
        font-size:14px;
        padding:10px 4px;
    }

    .delete-row-btn{
        width:40px;
        height:40px;
        font-size:16px;
    }

    .summary-card{
        padding:10px 12px;
    }

    .summary-value{
        font-size:18px;
    }

    .sheet-card-header{
        align-items:center;
    }

    .sheet-title{
        font-size:15px;
    }

    .piece-item{
        grid-template-columns:28px 1fr;
    }

    .piece-position{
        grid-column:2;
        text-align:left;
    }

    .section-title{
        font-size:16px;
    }
}

/* =====================================================
   PRINT
===================================================== */

@media print{
    @page{
        size:A4 portrait;
        margin:10mm;
    }
    html, body{
        background:#ffffff !important;
        padding:0 !important;

    }

    }

        background:#f8fafc !important;

        background:transparent !important;

    }

<body>

<div class="main-container">
    <div class="header-card">
        <div class="header-top">
            <button class="menu-btn no-print" onclick="scrollToInput()" title="ইনপুট">☰</button>
            <span class="header-title">🪟 গ্লাস কাটিং অপটিমাইজার</span>
            <div id="currentDate" class="date-display"></div>
        </div>
        <div class="shop-details">
            <input type="text" id="shopName" class="editable-input" value="আর এম থাই অ্যালুমিনিয়াম" placeholder="দোকানের নাম">
            <input type="text" id="shopPhone" class="editable-input" value="মোবাইল: 01676474412" placeholder="মোবাইল নম্বর">
        </div>
        <div class="sheet-size-box">
            <span class="sheet-size-title">📐 শীট সাইজ</span>
            <input type="number" id="sheetWidth" class="sheet-input" value="84" min="1" step="0.01">
            <span class="sheet-x">×</span>
            <input type="number" id="sheetHeight" class="sheet-input" value="51" min="1" step="0.01">
            <span class="sheet-size-title">ইঞ্চি</span>
        </div>
    </div>

    <div class="section-card" id="inputSection">
        <div class="section-title">
            📋 গ্লাসের তালিকা
            <span class="section-badge">উচ্চতা × প্রস্থ</span>
        </div>
        <div id="glassInputContainer"></div>
        <button class="btn btn-add" onclick="addGlassRow()">➕ আরও গ্লাস যোগ করুন</button>
        <button class="btn btn-calculate" onclick="calculate()">📊 কাটিং হিসাব বের করুন</button>
    </div>

    <div class="results-container" id="resultArea" style="display:none;">
        <div class="result-heading">
            <h3>📊 কাটিং রেজাল্ট</h3>
            <span class="result-badge" id="resultBadge">সম্পন্ন</span>
        </div>
        <div class="summary-grid" id="resultSummary"></div>
        <div class="sheet-list" id="resultDetail"></div>
        <div class="info-box">
            ✅ হিসাব সম্পন্ন। প্রতিটি শীটে কত পিস গ্লাস কাটা হয়েছে এবং কোন সাইজের কতটুকু গ্লাস অবশিষ্ট (ওয়েস্টেজ) আছে তা দেখানো হয়েছে।
        </div>
        <button class="btn no-print" onclick="window.print()">🖨️ প্রিন্ট / PDF</button>
    </div>
</div>

<script>
const glassInputContainer = document.getElementById("glassInputContainer");
const resultArea = document.getElementById("resultArea");
const resultSummary = document.getElementById("resultSummary");
const resultDetail = document.getElementById("resultDetail");

function setCurrentDate(){
    const today = new Date();
    const day = String(today.getDate()).padStart(2,"0");
    const month = String(today.getMonth()+1).padStart(2,"0");
    const year = today.getFullYear();
    document.getElementById("currentDate").innerText = `তারিখ: ${day}/${month}/${year}`;
}

function scrollToInput(){
    document.getElementById("inputSection").scrollIntoView({ behavior:"smooth", block:"start" });
}

let rowCount = 0;
function addGlassRow(height = "", width = "", quantity = ""){
    rowCount++;
    const div = document.createElement("div");
    div.className = "glass-row";
    div.innerHTML = `
        <div class="serial">${rowCount}</div>
        <input type="number" class="glass-height" placeholder="উচ্চতা" value="${height}" min="0" step="0.01">
        <input type="number" class="glass-width" placeholder="প্রস্থ" value="${width}" min="0" step="0.01">
        <input type="number" class="glass-quantity" placeholder="পিস" value="${quantity}" min="1" step="1">
        <button class="delete-row-btn" onclick="deleteGlassRow(this)" title="মুছে ফেলুন">✕</button>
    `;
    glassInputContainer.appendChild(div);
}

function deleteGlassRow(button){
    const rows = document.querySelectorAll("#glassInputContainer .glass-row");
    if(rows.length <= 1){
        alert("কমপক্ষে একটি গ্লাসের সারি রাখতে হবে।");
        return;
    }
    button.closest(".glass-row").remove();
    renumberRows();
}

function renumberRows(){
    const rows = document.querySelectorAll("#glassInputContainer .glass-row");
    rows.forEach((row,index)=>{
        row.querySelector(".serial").textContent = index + 1;
    });
    rowCount = rows.length;
}

function getSheetSize(){
    return {
        width: parseFloat(document.getElementById("sheetWidth").value) || 84,
        height: parseFloat(document.getElementById("sheetHeight").value) || 51
    };
}

function getPieces(){
    const rows = document.querySelectorAll("#glassInputContainer .glass-row");
    const pieces = [];
    rows.forEach(row=>{
        const height = parseFloat(row.querySelector(".glass-height").value);
        const width = parseFloat(row.querySelector(".glass-width").value);
        const quantity = parseInt(row.querySelector(".glass-quantity").value) || 0;
        if(height > 0 && width > 0 && quantity > 0){
            pieces.push({height:height, width:width, quantity:quantity});
        }
    });
    return pieces;
}

/* =====================================================
   BSP Tree Algorithm (To find exact waste rectangles)
===================================================== */
class BinNode {
    constructor(x, y, w, h) {
        this.x = x;
        this.y = y;
        this.w = w;
        this.h = h;
        this.used = false;
        this.right = null;
        this.down = null;
    }
}

function findNode(root, w, h) {
    if (root.used) {
        let node = findNode(root.right, w, h);
        if (node) return node;
        return findNode(root.down, w, h);
    } else if (w <= root.w && h <= root.h) {
        return root;
    }
    return null;
}

function splitNode(node, w, h) {
    node.used = true;
    let dw = node.w - w;
    let dh = node.h - h;
    
    // Split logically to create the largest contiguous free rectangles
    if (dw > dh) {
        node.right = new BinNode(node.x + w, node.y, dw, node.h);
        node.down = new BinNode(node.x, node.y + h, w, dh);
    } else {
        node.right = new BinNode(node.x + w, node.y, dw, h);
        node.down = new BinNode(node.x, node.y + h, node.w, dh);
    }
    return node;
}

function getWastePieces(node, wasteArray) {
    if (!node) return;
    if (!node.used) {
        // Only keep waste pieces that have actual area
        if (node.w > 0 && node.h > 0) {
            wasteArray.push({w: node.w, h: node.h});
        }
    } else {
        getWastePieces(node.right, wasteArray);
        getWastePieces(node.down, wasteArray);
    }
}

function formatNumber(value){
    return parseFloat(Number(value).toFixed(2)).toString();
}

function optimizeCutting(pieces, sheetW, sheetH) {
    let items = [];
    for (const p of pieces) {
        for (let i = 0; i < p.quantity; i++) {
            items.push({ w: p.width, h: p.height });
        }
    }

    // Sort pieces by largest dimension first
    items.sort((a, b) => Math.max(b.w, b.h) - Math.max(a.w, a.h));

    const sheets = [];

    for (const item of items) {
        let placed = false;

        for (let s = 0; s < sheets.length; s++) {
            let root = sheets[s].root;

            let node = findNode(root, item.w, item.h);
            if (node) {
                splitNode(node, item.w, item.h);
                sheets[s].placedPieces.push({ w: item.w, h: item.h });
                placed = true;
                break;
            }

            let nodeRotated = findNode(root, item.h, item.w);
            if (nodeRotated) {
                splitNode(nodeRotated, item.h, item.w);
                sheets[s].placedPieces.push({ w: item.h, h: item.w });
                placed = true;
                break;
            }
        }

        if (!placed) {
            let newRoot = new BinNode(0, 0, sheetW, sheetH);
            let node = findNode(newRoot, item.w, item.h);
            let w = item.w, h = item.h;

            if (!node) {
                node = findNode(newRoot, item.h, item.w);
                w = item.h; h = item.w;
            }

            if (node) {
                splitNode(node, w, h);
                sheets.push({
                    root: newRoot,
                    placedPieces: [{ w: w, h: h }]
                });
            }
        }
    }

    const results = sheets.map((sheet, index) => {
        let wasteArray = [];
        getWastePieces(sheet.root, wasteArray);

        let groupedWaste = {};
        wasteArray.forEach(wst => {
            let key = `${formatNumber(wst.h)} × ${formatNumber(wst.w)}`;
            if (!groupedWaste[key]) groupedWaste[key] = 0;
            groupedWaste[key]++;
        });

        return {
            sheetIndex: index + 1,
            pieces: sheet.placedPieces,
            wasteGroups: groupedWaste
        };
    });

    return {
        totalSheets: sheets.length,
        totalPiecesCut: items.length,
        sheetDetails: results
    };
}

function calculate(){
    const sheet = getSheetSize();
    const pieces = getPieces();

    if(pieces.length === 0){
        alert("দয়া করে কমপক্ষে একটি বৈধ গ্লাস সাইজ দিন।");
        return;
    }

    const invalidPieces = [];
    pieces.forEach((p,index)=>{
        const normalFit = p.width <= sheet.width && p.height <= sheet.height;
        const rotatedFit = p.height <= sheet.width && p.width <= sheet.height;
        if(!normalFit && !rotatedFit){
            invalidPieces.push(`সারি ${index+1}: ${p.height} × ${p.width} ইঞ্চি`);
        }
    });

    if(invalidPieces.length > 0){
        alert("নিচের গ্লাসগুলো শীটের মধ্যে ফিট হবে না:\n\n" + invalidPieces.join("\n"));
        return;
    }

    const result = optimizeCutting(pieces, sheet.width, sheet.height);

    resultArea.style.display = "block";

    resultSummary.innerHTML = `
        <div class="summary-card">
            <div class="summary-label">📦 মোট শীট লাগবে</div>
            <div class="summary-value">${result.totalSheets} টি</div>
        </div>
        <div class="summary-card">
            <div class="summary-label">📐 মোট গ্লাস কাটা হবে</div>
            <div class="summary-value">${result.totalPiecesCut} পিস</div>
        </div>
    `;

    resultDetail.innerHTML = "";

    result.sheetDetails.forEach(sheet=>{
        
        let groupedPieces = {};
        sheet.pieces.forEach(p => {
            let sizeKey = `${formatNumber(p.h)} × ${formatNumber(p.w)}`;
            if(!groupedPieces[sizeKey]) {
                groupedPieces[sizeKey] = 0;
            }
            groupedPieces[sizeKey]++;
        });

        const card = document.createElement("div");
        card.className = "sheet-card";

        let header = `
            <div class="sheet-card-header">
                <div class="sheet-number">
                    <div class="sheet-badge">${sheet.sheetIndex}</div>
                    <div class="sheet-title">শীট #${sheet.sheetIndex}</div>
                </div>
            </div>
        `;

        let pieceHTML = `<div class="piece-list">`;
        let pIndex = 1;
        for (let key in groupedPieces) {
            let qty = groupedPieces[key];
            pieceHTML += `
                <div class="piece-item">
                    <div class="piece-number">${pIndex++}</div>
                    <div class="piece-size">${key} ইঞ্চি</div>
                    <div class="piece-position">কাটা হয়েছে: ${qty} পিস</div>
                </div>
            `;
        }
        pieceHTML += `</div>`;

        let wasteHTML = `<div class="waste-list">
                            <div class="waste-title">🗑️ অবশিষ্ট গ্লাস (ওয়েস্টেজ টুকরো):</div>`;
        let wCount = 0;
        for (let key in sheet.wasteGroups) {
            let qty = sheet.wasteGroups[key];
            wasteHTML += `<div class="waste-item">${key} ইঞ্চি = ${qty} টুকরো</div>`;
            wCount++;
        }
        if (wCount === 0) {
             wasteHTML += `<div class="waste-item" style="color:#64748b;">কোনো ওয়েস্টেজ নেই</div>`;
        }
        wasteHTML += `</div>`;

        card.innerHTML = header + pieceHTML + wasteHTML;
        resultDetail.appendChild(card);
    });

    setTimeout(()=>{
        resultArea.scrollIntoView({ behavior:"smooth", block:"start" });
    },100);
}

document.addEventListener("keydown", function(event){
    if(event.key === "Enter" && event.target.tagName === "INPUT"){
        calculate();
    }
});

window.addEventListener("load", function(){
    setCurrentDate();
    addGlassRow("", "", "");
});
</script>

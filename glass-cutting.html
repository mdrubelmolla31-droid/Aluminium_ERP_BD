<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>গ্লাস কাটিং অপটিমাইজার</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', 'Arial', sans-serif;
            background: #f0f4f8;
            padding: 20px;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
            padding: 25px 30px;
        }
        /* Header */
        .header {
            background: linear-gradient(135deg, #0b3b6b, #1a5a9b);
            color: white;
            padding: 20px 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
        }
        .header-left {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .header-left .title {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .header-left .sub {
            font-size: 14px;
            opacity: 0.9;
        }
        .header-right {
            text-align: right;
            font-size: 14px;
            background: rgba(255,255,255,0.15);
            padding: 8px 16px;
            border-radius: 30px;
        }
        .header-right .date {
            font-weight: 600;
        }
        /* Shop Info */
        .shop-info {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            background: #f8fafc;
            padding: 18px 20px;
            border-radius: 12px;
            border: 1px solid #dce7f2;
            margin-bottom: 25px;
            align-items: center;
        }
        .shop-info label {
            font-weight: 600;
            color: #1e3a6f;
            margin-right: 6px;
        }
        .shop-info input {
            border: 1px solid #bcccdb;
            border-radius: 6px;
            padding: 8px 14px;
            font-size: 15px;
            background: white;
            width: 200px;
            transition: 0.2s;
        }
        .shop-info input:focus {
            border-color: #1a5a9b;
            outline: none;
            box-shadow: 0 0 0 3px rgba(26,90,155,0.2);
        }
        .shop-info .flex-item {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        /* Input Section */
        .input-section {
            margin-bottom: 25px;
        }
        .section-title {
            font-size: 20px;
            font-weight: 700;
            color: #0b3b6b;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .section-title span {
            background: #0b3b6b;
            color: white;
            padding: 2px 12px;
            border-radius: 30px;
            font-size: 14px;
        }
        .table-wrap {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        th {
            background: #e5edf5;
            color: #1e3a6f;
            font-weight: 700;
            padding: 14px 10px;
            text-align: center;
            font-size: 15px;
        }
        td {
            padding: 10px 8px;
            text-align: center;
            border-bottom: 1px solid #eef3f7;
            vertical-align: middle;
        }
        td input {
            width: 80px;
            padding: 8px 6px;
            border: 1px solid #cbdae8;
            border-radius: 6px;
            text-align: center;
            font-size: 15px;
            transition: 0.2s;
        }
        td input:focus {
            border-color: #1a5a9b;
            outline: none;
            box-shadow: 0 0 0 3px rgba(26,90,155,0.15);
        }
        td input[type="number"] {
            -moz-appearance: textfield;
        }
        td input[type="number"]::-webkit-outer-spin-button,
        td input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .delete-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: 0.2s;
        }
        .delete-btn:hover {
            background: #c0392b;
            transform: scale(1.02);
        }
        .add-row-btn {
            background: #27ae60;
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 15px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 10px rgba(39,174,96,0.3);
        }
        .add-row-btn:hover {
            background: #1e8449;
            transform: translateY(-2px);
        }
        .calc-btn {
            background: #1a5a9b;
            color: white;
            border: none;
            padding: 14px 40px;
            border-radius: 40px;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 6px 18px rgba(26,90,155,0.35);
            margin-top: 10px;
            width: 100%;
        }
        .calc-btn:hover {
            background: #0b3b6b;
            transform: scale(1.01);
        }
        /* Result */
        .result-area {
            margin-top: 30px;
            padding: 20px;
            background: #fafcff;
            border-radius: 14px;
            border: 2px solid #b8d0e6;
            display: none;
        }
        .result-area.active {
            display: block;
        }
        .result-summary {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            background: #e3edf7;
            padding: 18px 22px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .result-summary div {
            font-size: 17px;
            font-weight: 600;
            color: #0b3b6b;
        }
        .result-summary div span {
            background: #0b3b6b;
            color: white;
            padding: 2px 14px;
            border-radius: 30px;
            margin-left: 8px;
        }
        .result-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 10px;
            overflow: hidden;
        }
        .result-table th {
            background: #0b3b6b;
            color: white;
            padding: 12px 8px;
        }
        .result-table td {
            padding: 10px 8px;
            border-bottom: 1px solid #dee9f2;
        }
        .result-table tr:last-child td {
            border-bottom: none;
        }
        .waste-highlight {
            background: #fef9e7;
            font-weight: 600;
        }
        .footer-text {
            margin-top: 18px;
            color: #3b5e7a;
            font-size: 14px;
            text-align: center;
        }
        @media (max-width: 700px) {
            .container { padding: 15px; }
            .header { flex-direction: column; align-items: flex-start; gap: 10px; }
            .header-right { align-self: flex-start; }
            .shop-info { flex-direction: column; align-items: stretch; }
            .shop-info input { width: 100%; }
            td input { width: 60px; }
            .result-summary { flex-direction: column; }
        }
    </style>
</head>
<body>
<div class="container" id="app">

    <!-- HEADER -->
    <div class="header">
        <div class="header-left">
            <div class="title">🪟 গ্লাস কাটিং অপটিমাইজার</div>
            <div class="sub">সর্বনিম্ন অপচয়ে শীট কাটার হিসাব</div>
        </div>
        <div class="header-right">
            <div class="date">📅 <span id="currentDate"></span></div>
        </div>
    </div>

    <!-- SHOP INFO -->
    <div class="shop-info">
        <div class="flex-item">
            <label>🏢 দোকানের নাম:</label>
            <input type="text" id="shopName" value="আর এম থাই অ্যালুমিনিয়াম">
        </div>
        <div class="flex-item">
            <label>📞 মোবাইল:</label>
            <input type="text" id="shopPhone" value="০১৬৭৬৪৭৪৪১২">
        </div>
        <div class="flex-item">
            <label>📐 শীট সাইজ:</label>
            <input type="number" id="sheetWidth" value="84" style="width:70px;"> x
            <input type="number" id="sheetHeight" value="51" style="width:70px;"> ইঞ্চি
        </div>
    </div>

    <!-- INPUT TABLE -->
    <div class="input-section">
        <div class="section-title">
            📋 গ্লাসের তালিকা (উচ্চতা × প্রস্থ)
            <span>সিরিয়াল অনুযায়ী দিন</span>
        </div>
        <div class="table-wrap">
            <table id="inputTable">
                <thead>
                    <tr>
                        <th style="width:40px;">#</th>
                        <th>উচ্চতা (ইঞ্চি)</th>
                        <th>প্রস্থ (ইঞ্চি)</th>
                        <th>পরিমাণ (পিস)</th>
                        <th style="width:80px;">অ্যাকশন</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- সারি JS দিয়ে যোগ হবে -->
                </tbody>
            </table>
        </div>
        <button class="add-row-btn" id="addRowBtn">➕ আরও যোগ করুন</button>
    </div>

    <!-- CALCULATE BUTTON -->
    <button class="calc-btn" id="calculateBtn">📊 হিসাব বের করুন</button>

    <!-- RESULT AREA -->
    <div class="result-area" id="resultArea">
        <div class="result-summary" id="resultSummary">
            <!-- ডায়নামিক -->
        </div>
        <div id="resultDetail">
            <!-- টেবিল -->
        </div>
        <div class="footer-text">✅ হিসাব সম্পন্ন। প্রতিটি শীটে টুকরাগুলো কীভাবে বসেছে তার বিস্তারিত নিচে দেওয়া হলো।</div>
    </div>

</div>

<script>
    // ================== DOM REFS ==================
    const tbody = document.getElementById('tableBody');
    const addBtn = document.getElementById('addRowBtn');
    const calcBtn = document.getElementById('calculateBtn');
    const resultArea = document.getElementById('resultArea');
    const resultSummary = document.getElementById('resultSummary');
    const resultDetail = document.getElementById('resultDetail');

    // তারিখ দেখানো
    document.getElementById('currentDate').textContent = new Date().toLocaleDateString('bn-BD', { day:'numeric', month:'numeric', year:'numeric' });

    // ================== ROW MANAGEMENT ==================
    let rowCount = 0;

    function addRow(height = '', width = '', qty = '') {
        rowCount++;
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td><strong>${rowCount}</strong></td>
            <td><input type="number" class="inp-height" value="${height}" placeholder="উচ্চতা"></td>
            <td><input type="number" class="inp-width" value="${width}" placeholder="প্রস্থ"></td>
            <td><input type="number" class="inp-qty" value="${qty}" placeholder="পরিমাণ"></td>
            <td><button class="delete-btn" onclick="deleteRow(this)">🗑️</button></td>
        `;
        tbody.appendChild(tr);
    }

    // ডিফল্ট ৩টি সারি (উদাহরণ)
    addRow('84', '51', '6');
    addRow('51', '87', '4');
    addRow('16', '9', '8');

    // আরও যোগ
    addBtn.addEventListener('click', () => addRow());

    // ডিলিট ফাংশন
    window.deleteRow = function(btn) {
        const tr = btn.closest('tr');
        if (tbody.children.length <= 1) {
            alert('কমপক্ষে একটি সারি রাখতে হবে।');
            return;
        }
        tr.remove();
        renumberRows();
    };

    function renumberRows() {
        const rows = tbody.querySelectorAll('tr');
        rows.forEach((tr, idx) => {
            tr.querySelector('td:first-child strong').textContent = idx + 1;
        });
        rowCount = rows.length;
    }

    // ================== CORE ALGORITHM ==================
    // শীটের সাইজ
    function getSheetSize() {
        const w = parseFloat(document.getElementById('sheetWidth').value) || 84;
        const h = parseFloat(document.getElementById('sheetHeight').value) || 51;
        return { width: w, height: h };
    }

    // ইনপুট থেকে ডেটা সংগ্রহ
    function getPieces() {
        const rows = tbody.querySelectorAll('tr');
        const pieces = [];
        for (let tr of rows) {
            const h = parseFloat(tr.querySelector('.inp-height').value);
            const w = parseFloat(tr.querySelector('.inp-width').value);
            const qty = parseInt(tr.querySelector('.inp-qty').value) || 0;
            if (h > 0 && w > 0 && qty > 0) {
                pieces.push({ height: h, width: w, quantity: qty });
            }
        }
        return pieces;
    }

    // ====== অপটিমাইজেশন (২D বিন প্যাকিং - গার্ডি অ্যালগরিদম) ======
    function optimizeCutting(pieces, sheetW, sheetH) {
        // ১. প্রতিটি পিসকে আলাদা আইটেমে রূপান্তর (কোয়ান্টিটি অনুযায়ী)
        let items = [];
        for (let p of pieces) {
            for (let i = 0; i < p.quantity; i++) {
                items.push({ w: p.width, h: p.height });
            }
        }

        // বড় থেকে ছোট সাজানো (ক্ষেত্রফল অনুযায়ী)
        items.sort((a, b) => (b.w * b.h) - (a.w * a.h));

        const sheets = []; // প্রতিটি শীটে [{w, h, x, y}]
        const sheetWaste = [];

        for (let item of items) {
            let placed = false;
            // চেষ্টা করি প্রতিটি শীটে ফিট করার
            for (let s = 0; s < sheets.length; s++) {
                const layout = sheets[s];
                // সরল 'গার্ডি' – বর্তমান শীটে সবচেয়ে ফাঁকা জায়গায় বসানোর চেষ্টা
                // আমরা এখানে সহজ পদ্ধতি: প্রতিটি শীটে প্রথম ফিট পজিশন খুঁজি
                const pos = findPosition(layout, item.w, item.h, sheetW, sheetH);
                if (pos) {
                    layout.push({ w: item.w, h: item.h, x: pos.x, y: pos.y });
                    placed = true;
                    break;
                }
                // যদি না ফিটায়, ঘোরানোর চেষ্টা
                const rotated = findPosition(layout, item.h, item.w, sheetW, sheetH);
                if (rotated) {
                    layout.push({ w: item.h, h: item.w, x: rotated.x, y: rotated.y });
                    placed = true;
                    break;
                }
            }
            // কোনো শীটে ফিটায়নি – নতুন শীট
            if (!placed) {
                const newSheet = [];
                // প্রথমে ফিট করার চেষ্টা (আসল বা ঘোরানো)
                let pos = findPosition(newSheet, item.w, item.h, sheetW, sheetH);
                if (pos) {
                    newSheet.push({ w: item.w, h: item.h, x: pos.x, y: pos.y });
                } else {
                    // ঘোরানো
                    pos = findPosition(newSheet, item.h, item.w, sheetW, sheetH);
                    if (pos) {
                        newSheet.push({ w: item.h, h: item.w, x: pos.x, y: pos.y });
                    } else {
                        // যদি একেবারেই না ফিটায় (তাত্ত্বিকভাবে সম্ভব নয়, কারণ শীট বড়)
                        // তবু হ্যান্ডেল
                        newSheet.push({ w: item.w, h: item.h, x: 0, y: 0 });
                    }
                }
                sheets.push(newSheet);
            }
        }

        // প্রতিটি শীটের অপচয় ক্যালকুলেট
        const results = sheets.map((layout, idx) => {
            let usedArea = 0;
            for (let p of layout) {
                usedArea += p.w * p.h;
            }
            const sheetArea = sheetW * sheetH;
            const waste = sheetArea - usedArea;
            return {
                sheetIndex: idx + 1,
                pieces: layout,
                usedArea: usedArea,
                waste: waste,
                wastePercent: (waste / sheetArea) * 100
            };
        });

        const totalSheets = sheets.length;
        const totalWaste = results.reduce((sum, r) => sum + r.waste, 0);
        const totalUsed = results.reduce((sum, r) => sum + r.usedArea, 0);
        const totalArea = totalSheets * sheetW * sheetH;

        return {
            totalSheets,
            totalWaste,
            totalUsed,
            totalArea,
            wastePercent: (totalWaste / totalArea) * 100,
            sheetDetails: results
        };
    }

    // পজিশন খোঁজার ফাংশন (সহজ নীচে-বামে ফিট)
    function findPosition(layout, itemW, itemH, sheetW, sheetH) {
        // সমস্ত সম্ভাব্য স্থান পরীক্ষা (grid approach – রেজোলিউশন ১ ইঞ্চি)
        // এখানে আমরা সাধারণ 'bottom-left' অ্যালগরিদম ব্যবহার করছি
        // বাস্তবে আরও উন্নত অ্যালগরিদম দরকার, কিন্তু ডেমোর জন্য যথেষ্ট
        // আমরা ১ ইঞ্চি গ্রিডে চেক করছি (যদিও অপটিমাল নয়, কিন্তু ছোট ডেটার জন্য কাজ করে)
        for (let y = 0; y <= sheetH - itemH; y++) {
            for (let x = 0; x <= sheetW - itemW; x++) {
                let overlap = false;
                for (let placed of layout) {
                    if (x < placed.x + placed.w && x + itemW > placed.x &&
                        y < placed.y + placed.h && y + itemH > placed.y) {
                        overlap = true;
                        break;
                    }
                }
                if (!overlap) {
                    return { x, y };
                }
            }
        }
        return null;
    }

    // ================== CALCULATE & DISPLAY ==================
    function calculate() {
        const sheet = getSheetSize();
        const pieces = getPieces();

        if (pieces.length === 0) {
            alert('দয়া করে কমপক্ষে একটি বৈধ গ্লাস সাইজ দিন।');
            return;
        }

        const result = optimizeCutting(pieces, sheet.width, sheet.height);

        // show result
        resultArea.classList.add('active');

        // Summary
        resultSummary.innerHTML = `
            <div>📦 মোট শীট প্রয়োজন: <span>${result.totalSheets} টি</span></div>
            <div>📐 মোট ব্যবহার্য ক্ষেত্রফল: <span>${result.totalUsed.toFixed(2)} বর্গ ইঞ্চি</span></div>
            <div>🗑️ মোট অপচয়: <span>${result.totalWaste.toFixed(2)} বর্গ ইঞ্চি (${result.wastePercent.toFixed(2)}%)</span></div>
        `;

        // Detail Table
        let html = `<table class="result-table">
            <thead><tr><th>শীট নং</th><th>টুকরার সাইজ (উচ্চতা × প্রস্থ)</th><th>অবস্থান (x, y)</th><th>ব্যবহৃত ক্ষেত্র</th><th>অপচয়</th></tr></thead><tbody>`;
        for (let sh of result.sheetDetails) {
            const piecesStr = sh.pieces.map(p => `${p.h}×${p.w}`).join(', ');
            const posStr = sh.pieces.map(p => `(${p.x},${p.y})`).join(', ');
            html += `<tr>
                <td><strong>#${sh.sheetIndex}</strong></td>
                <td>${piecesStr}</td>
                <td>${posStr}</td>
                <td>${sh.usedArea.toFixed(2)}</td>
                <td class="waste-highlight">${sh.waste.toFixed(2)} (${sh.wastePercent.toFixed(1)}%)</td>
            </tr>`;
        }
        html += `</tbody></table>`;
        resultDetail.innerHTML = html;
    }

    calcBtn.addEventListener('click', calculate);

    // ================== AUTO CALCULATE ON ENTER (optional) ==================
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && e.target.tagName === 'INPUT') {
            calculate();
        }
    });

</script>
</body>
</html>

<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>গ্লাস কাটিং অপটিমাইজার</title>

<style>

:root{
    --bg-color:#f1f5f9;
    --card-bg:#ffffff;
    --accent:#2563eb;
    --accent-hover:#1d4ed8;
    --green:#10b981;
    --green-hover:#059669;
    --red:#ef4444;
    --red-hover:#dc2626;
    --text:#0f172a;
    --muted:#64748b;
    --border:#cbd5e1;
    --input-bg:#ffffff;

    --header-bg:linear-gradient(
        135deg,
        #123a8c 0%,
        #1557c0 45%,
        #2563d9 100%
    );
}

*,
*::before,
*::after{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    background-color:var(--bg-color);
    color:var(--text);
    font-family:
        'Segoe UI',
        system-ui,
        -apple-system,
        Roboto,
        Arial,
        sans-serif;
}

body{
    padding:12px;
}

.main-container{
    max-width:950px;
    width:100%;
    margin:0 auto;
}

/* =====================================================
   HEADER
===================================================== */

.header-card{
    background:var(--header-bg);
    padding:16px;
    border-radius:12px;
    margin-bottom:15px;
    box-shadow:0 4px 15px rgba(20,70,160,0.20);
    color:#ffffff;
}

.header-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
    border-bottom:1px solid rgba(255,255,255,0.20);
    padding-bottom:10px;
}

.menu-btn{
    width:40px;
    height:40px;
    flex-shrink:0;
    border:1px solid rgba(255,255,255,0.35);
    border-radius:8px;
    background:rgba(255,255,255,0.18);
    color:#ffffff;
    font-size:20px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
}

.header-title{
    flex:1;
    text-align:center;
    font-weight:900;
    font-size:20px;
    letter-spacing:1px;
    padding:0 10px;
}

.date-display{
    font-size:14px;
    font-weight:700;
    background:rgba(255,255,255,0.20);
    padding:4px 10px;
    border-radius:6px;
    white-space:nowrap;
}

/* =====================================================
   SHOP INFO
===================================================== */

.shop-details{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-bottom:12px;
}

.editable-input{
    width:100%;
    height:42px;
    padding:6px 12px;
    border:none;
    border-radius:6px;
    background:rgba(255,255,255,0.95);
    color:#0f172a;
    font-size:18px;
    font-weight:900;
    text-align:center;
    outline:none;
}

#shopPhone{
    font-size:16px;
}

/* Sheet size */

.sheet-size-box{
    display:flex;
    gap:8px;
    width:100%;
    align-items:center;
}

.sheet-size-title{
    color:#ffffff;
    font-size:14px;
    font-weight:800;
    white-space:nowrap;
}

.sheet-input{
    flex:1;
    min-width:0;
    height:40px;
    padding:6px 8px;
    border:none;
    border-radius:6px;
    background:rgba(255,255,255,0.95);
    color:#111827;
    font-size:17px;
    font-weight:900;
    text-align:center;
    outline:none;
}

.sheet-x{
    color:#ffffff;
    font-size:18px;
    font-weight:900;
}

/* =====================================================
   SECTION TITLE
===================================================== */

.section-card{
    background:var(--card-bg);
    border:1px solid var(--border);
    border-radius:10px;
    padding:15px;
    margin-bottom:15px;
    box-shadow:0 4px 15px rgba(0,0,0,0.05);
}

.section-title{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:18px;
    font-weight:900;
    color:#1e3a8a;
    margin-bottom:12px;
}

.section-badge{
    margin-left:auto;
    background:#dbeafe;
    color:#1d4ed8;
    padding:5px 9px;
    border-radius:20px;
    font-size:11px;
    font-weight:800;
}

/* =====================================================
   INPUT ROW
===================================================== */

.glass-row{
    background:#f8fafc;
    padding:10px;
    border-radius:9px;
    margin-bottom:9px;
    display:flex;
    gap:8px;
    align-items:center;
    border:1px solid var(--border);
    box-shadow:0 2px 5px rgba(0,0,0,0.04);
}

.serial{
    width:32px;
    height:32px;
    flex-shrink:0;
    border-radius:50%;
    background:var(--accent);
    color:#ffffff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:900;
    font-size:13px;
}

.glass-row input{
    flex:1;
    min-width:0;
    padding:11px 7px;
    border-radius:7px;
    border:2px solid var(--border);
    background:var(--input-bg);
    color:var(--text);
    font-size:16px;
    font-weight:800;
    text-align:center;
    outline:none;
}

.glass-row input:focus{
    border-color:var(--accent);
}

.delete-row-btn{
    background:var(--red);
    color:#ffffff;
    border:none;
    border-radius:8px;
    width:44px;
    height:44px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
}

.delete-row-btn:hover{
    background:var(--red-hover);
}

/* =====================================================
   BUTTONS
===================================================== */

.btn{
    background:var(--accent);
    color:#ffffff;
    border:none;
    padding:15px;
    font-weight:900;
    border-radius:8px;
    cursor:pointer;
    width:100%;
    margin-top:10px;
    font-size:16px;
    box-shadow:0 4px 10px rgba(37,99,235,0.20);
    transition:0.2s;
}

.btn:hover{
    background:var(--accent-hover);
    transform:translateY(-1px);
}

.btn-add{
    background:var(--green);
    box-shadow:0 4px 10px rgba(16,185,129,0.20);
}

.btn-add:hover{
    background:var(--green-hover);
}

.btn-calculate{
    font-size:17px;
}

/* =====================================================
   RESULT CONTAINER
===================================================== */

.results-container{
    margin-top:20px;
    background:var(--card-bg);
    border-radius:10px;
    border:1px solid var(--border);
    padding:15px;
    box-shadow:0 4px 15px rgba(0,0,0,0.05);
}

.result-heading{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:12px;
}

.result-heading h3{
    margin:0;
    color:#1e3a8a;
    font-size:18px;
    font-weight:900;
}

.result-badge{
    background:#dbeafe;
    color:#1d4ed8;
    padding:5px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:900;
}

/* =====================================================
   SUMMARY CARDS
===================================================== */

.summary-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-bottom:15px;
}

.summary-card{
    background:#f8fafc;
    border:1px solid var(--border);
    border-radius:8px;
    padding:12px 8px;
    text-align:center;
}

.summary-label{
    color:var(--muted);
    font-size:12px;
    font-weight:800;
    margin-bottom:5px;
}

.summary-value{
    color:#1d4ed8;
    font-size:19px;
    font-weight:900;
}

/* =====================================================
   SHEET RESULT CARDS
===================================================== */

.sheet-list{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.sheet-card{
    background:#f8fafc;
    border:1px solid var(--border);
    border-radius:8px;
    overflow:hidden;
}

.sheet-card-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#ffffff;
    padding:11px 12px;
    border-bottom:1px solid var(--border);
}

.sheet-number{
    display:flex;
    align-items:center;
    gap:9px;
}

.sheet-badge{
    background:var(--accent);
    color:#ffffff;
    width:32px;
    height:32px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:13px;
    font-weight:900;
}

.sheet-title{
    color:#1d4ed8;
    font-size:17px;
    font-weight:900;
}

.sheet-waste{
    background:#fef3c7;
    color:#92400e;
    border:1px solid #fde68a;
    padding:5px 8px;
    border-radius:6px;
    font-size:12px;
    font-weight:900;
}

/* =====================================================
   PIECE LIST
===================================================== */

.piece-list{
    padding:10px;
}

.piece-item{
    background:#ffffff;
    border:1px solid #e2e8f0;
    border-radius:7px;
    padding:9px;
    margin-bottom:7px;
    display:grid;
    grid-template-columns:30px 1fr 1fr;
    gap:6px;
    align-items:center;
}

.piece-item:last-child{
    margin-bottom:0;
}

.piece-number{
    width:26px;
    height:26px;
    border-radius:50%;
    background:#dbeafe;
    color:#1d4ed8;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:11px;
    font-weight:900;
}

.piece-size{
    font-size:14px;
    color:#0f172a;
    font-weight:900;
}

.piece-position{
    text-align:right;
    font-size:13px;
    color:#059669;
    font-weight:800;
}

/* =====================================================
   SHEET FOOTER
===================================================== */

.sheet-footer{
    background:#f1f5f9;
    border-top:1px solid var(--border);
    padding:9px 12px;
    display:flex;
    justify-content:space-between;
    gap:8px;
    font-size:13px;
    font-weight:800;
}

.used-area{
    color:#059669;
}

.waste-area{
    color:#dc2626;
}

/* =====================================================
   INFO
===================================================== */

.info-box{
    margin-top:15px;
    background:#eff6ff;
    border:1px solid #bfdbfe;
    color:#1e40af;
    border-radius:8px;
    padding:11px;
    text-align:center;
    font-size:13px;
    font-weight:700;
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

    body{
        padding:8px;
    }

    .header-card{
        padding:13px;
    }

    .header-top{
        margin-bottom:10px;
    }

    .header-title{
        font-size:17px;
        padding:0 5px;
    }

    .date-display{
        font-size:11px;
        padding:4px 6px;
    }

    .menu-btn{
        width:36px;
        height:36px;
        font-size:17px;
    }

    .editable-input{
        height:40px;
        font-size:16px;
    }

    #shopPhone{
        font-size:14px;
    }

    .sheet-size-title{
        font-size:12px;
    }

    .sheet-input{
        height:38px;
        font-size:15px;
    }

    .glass-row{
        gap:6px;
        padding:8px;
    }

    .serial{
        width:28px;
        height:28px;
        font-size:11px;
    }

    .glass-row input{
        font-size:14px;
        padding:10px 4px;
    }

    .delete-row-btn{
        width:40px;
        height:40px;
        font-size:16px;
    }

    .summary-grid{
        grid-template-columns:1fr;
    }

    .summary-card{
        display:flex;
        justify-content:space-between;
        align-items:center;
        padding:10px 12px;
    }

    .summary-label{
        margin:0;
    }

    .summary-value{
        font-size:17px;
    }

    .sheet-card-header{
        align-items:flex-start;
    }

    .sheet-title{
        font-size:15px;
    }

    .sheet-waste{
        font-size:10px;
    }

    .piece-item{
        grid-template-columns:28px 1fr;
    }

    .piece-position{
        grid-column:2;
        text-align:left;
    }

    .section-title{
        font-size:16px;
    }
}

/* =====================================================
   PRINT
===================================================== */

@media print{

    @page{
        size:A4 portrait;
        margin:10mm;
    }

    html,
    body{
        background:#ffffff !important;
        padding:0 !important;
        margin:0 !important;
        color:#000000 !important;
        font-family:Arial,sans-serif !important;
    }

    .main-container{
        max-width:100% !important;
        width:100% !important;
        margin:0 !important;
    }

    .header-card{
        background:linear-gradient(
            135deg,
            #f0f9ff 0%,
            #e0f2fe 50%,
            #f8fafc 100%
        ) !important;
        color:#0f172a !important;
        border:1px solid #bae6fd !important;
        box-shadow:none !important;
        border-radius:8px !important;
        padding:15px !important;
        -webkit-print-color-adjust:exact !important;
        print-color-adjust:exact !important;
    }

    .menu-btn{
        display:none !important;
    }

    .header-title{
        color:#1e40af !important;
        font-size:22px !important;
    }

    .date-display{
        color:#0f172a !important;
        background:#ffffff !important;
        border:1px solid #cbd5e1 !important;
    }

    .editable-input{
        background:transparent !important;
        color:#0f172a !important;
        font-size:30px !important;
        height:auto !important;
        padding:2px !important;
    }

    #shopPhone{
        font-size:18px !important;
    }

    .sheet-size-box{
        color:#1d4ed8 !important;
        border-top:1px dashed #94a3b8;
        padding-top:8px;
        justify-content:center;
    }

    .sheet-size-title,
    .sheet-x{
        color:#1d4ed8 !important;
    }

    .sheet-input{
        background:transparent !important;
        color:#000000 !important;
        border:none !important;
        max-width:80px !important;
    }

    .section-card{
        border:none !important;
        box-shadow:none !important;
        padding:0 !important;
    }

    #inputSection,
    .btn,
    .no-print{
        display:none !important;
    }

    .results-container{
        border:none !important;
        box-shadow:none !important;
        padding:0 !important;
        margin-top:10px !important;
    }

    .summary-grid{
        display:flex !important;
        border:1px solid #cbd5e1 !important;
        margin-bottom:10px !important;
    }

    .summary-card{
        flex:1 !important;
        border:none !important;
        border-right:1px solid #cbd5e1 !important;
        border-radius:0 !important;
        background:#f8fafc !important;
    }

    .summary-card:last-child{
        border-right:none !important;
    }

    .sheet-list{
        display:block !important;
    }

    .sheet-card{
        border:1px solid #94a3b8 !important;
        border-radius:6px !important;
        margin-bottom:10px !important;
        page-break-inside:avoid !important;
    }

    .sheet-card-header{
        background:#2563eb !important;
        color:#ffffff !important;
        -webkit-print-color-adjust:exact !important;
        print-color-adjust:exact !important;
    }

    .sheet-title{
        color:#ffffff !important;
    }

    .sheet-badge{
        background:#ffffff !important;
        color:#2563eb !important;
    }

    .sheet-waste{
        background:#ffffff !important;
        color:#92400e !important;
    }

    .piece-list{
        background:#ffffff !important;
    }

    .piece-item{
        border:1px solid #cbd5e1 !important;
        border-radius:0 !important;
        margin-bottom:0 !important;
        border-bottom:none !important;
    }

    .piece-item:last-child{
        border-bottom:1px solid #cbd5e1 !important;
    }

    .info-box{
        border:1px solid #bfdbfe !important;
        background:#eff6ff !important;
        -webkit-print-color-adjust:exact !important;
        print-color-adjust:exact !important;
    }

}

/* =====================================================
   EMPTY RESULT
===================================================== */

.empty-result{
    text-align:center;
    padding:30px 10px;
    color:#64748b;
    font-size:14px;
    font-weight:700;
}

</style>
</head>

<body>

<div class="main-container">

    <!-- =================================================
         HEADER
    ================================================== -->

    <div class="header-card">

        <div class="header-top">

            <button
                class="menu-btn no-print"
                onclick="scrollToInput()"
                title="ইনপুট"
            >
                ☰
            </button>

            <span class="header-title">
                🪟 গ্লাস কাটিং অপটিমাইজার
            </span>

            <div
                id="currentDate"
                class="date-display"
            ></div>

        </div>

        <div class="shop-details">

            <input
                type="text"
                id="shopName"
                class="editable-input"
                value="আর এম থাই অ্যালুমিনিয়াম"
                placeholder="দোকানের নাম"
            >

            <input
                type="text"
                id="shopPhone"
                class="editable-input"
                value="মোবাইল: 01676474412"
                placeholder="মোবাইল নম্বর"
            >

        </div>

        <!-- SHEET SIZE -->

        <div class="sheet-size-box">

            <span class="sheet-size-title">
                📐 শীট সাইজ
            </span>

            <input
                type="number"
                id="sheetWidth"
                class="sheet-input"
                value="84"
                min="1"
                step="0.01"
                aria-label="শীট প্রস্থ"
            >

            <span class="sheet-x">×</span>

            <input
                type="number"
                id="sheetHeight"
                class="sheet-input"
                value="51"
                min="1"
                step="0.01"
                aria-label="শীট উচ্চতা"
            >

            <span class="sheet-size-title">
                ইঞ্চি
            </span>

        </div>

    </div>


    <!-- =================================================
         INPUT SECTION
    ================================================== -->

    <div
        class="section-card"
        id="inputSection"
    >

        <div class="section-title">

            📋 গ্লাসের তালিকা

            <span class="section-badge">
                উচ্চতা × প্রস্থ
            </span>

        </div>

        <div id="glassInputContainer"></div>

        <button
            class="btn btn-add"
            onclick="addGlassRow()"
        >
            ➕ আরও গ্লাস যোগ করুন
        </button>

        <button
            class="btn btn-calculate"
            onclick="calculate()"
        >
            📊 কাটিং হিসাব বের করুন
        </button>

    </div>


    <!-- =================================================
         RESULT
    ================================================== -->

    <div
        class="results-container"
        id="resultArea"
        style="display:none;"
    >

        <div class="result-heading">

            <h3>
                📊 কাটিং রেজাল্ট
            </h3>

            <span
                class="result-badge"
                id="resultBadge"
            >
                সম্পন্ন
            </span>

        </div>


        <!-- SUMMARY -->

        <div
            class="summary-grid"
            id="resultSummary"
        ></div>


        <!-- SHEET DETAILS -->

        <div
            class="sheet-list"
            id="resultDetail"
        ></div>


        <div class="info-box">
            ✅ হিসাব সম্পন্ন। প্রতিটি শীটে কোন গ্লাস কত পিস কাটা হয়েছে তা উপরে দেখানো হয়েছে।
        </div>

        <button
            class="btn no-print"
            onclick="window.print()"
        >
            🖨️ প্রিন্ট / PDF
        </button>

    </div>

</div>


<script>

/* =====================================================
   DOM REFERENCES
===================================================== */

const glassInputContainer =
    document.getElementById("glassInputContainer");

const resultArea =
    document.getElementById("resultArea");

const resultSummary =
    document.getElementById("resultSummary");

const resultDetail =
    document.getElementById("resultDetail");


/* =====================================================
   DATE
===================================================== */

function setCurrentDate(){

    const today = new Date();

    const day =
        String(today.getDate()).padStart(2,"0");

    const month =
        String(today.getMonth()+1).padStart(2,"0");

    const year =
        today.getFullYear();

    document.getElementById("currentDate").innerText =
        `তারিখ: ${day}/${month}/${year}`;
}


/* =====================================================
   SCROLL TO INPUT
===================================================== */

function scrollToInput(){

    document.getElementById("inputSection")
        .scrollIntoView({
            behavior:"smooth",
            block:"start"
        });

}


/* =====================================================
   ROW MANAGEMENT
===================================================== */

let rowCount = 0;

/*
    একটি নতুন গ্লাস ইনপুট Row
*/

function addGlassRow(
    height = "",
    width = "",
    quantity = ""
){

    rowCount++;

    const div =
        document.createElement("div");

    div.className = "glass-row";

    div.innerHTML = `

        <div class="serial">
            ${rowCount}
        </div>

        <input
            type="number"
            class="glass-height"
            placeholder="উচ্চতা"
            value="${height}"
            min="0"
            step="0.01"
        >

        <input
            type="number"
            class="glass-width"
            placeholder="প্রস্থ"
            value="${width}"
            min="0"
            step="0.01"
        >

        <input
            type="number"
            class="glass-quantity"
            placeholder="পিস"
            value="${quantity}"
            min="1"
            step="1"
        >

        <button
            class="delete-row-btn"
            onclick="deleteGlassRow(this)"
            title="মুছে ফেলুন"
        >
            ✕
        </button>

    `;

    glassInputContainer.appendChild(div);

}


/*
    Row Delete
*/

function deleteGlassRow(button){

    const rows =
        document.querySelectorAll(
            "#glassInputContainer .glass-row"
        );

    if(rows.length <= 1){

        alert(
            "কমপক্ষে একটি গ্লাসের সারি রাখতে হবে।"
        );

        return;
    }

    button.closest(".glass-row").remove();

    renumberRows();

}


/*
    Serial Number ঠিক করা
*/

function renumberRows(){

    const rows =
        document.querySelectorAll(
            "#glassInputContainer .glass-row"
        );

    rows.forEach((row,index)=>{

        row.querySelector(".serial")
            .textContent = index + 1;

    });

    rowCount = rows.length;

}


/* =====================================================
   GET SHEET SIZE
===================================================== */

function getSheetSize(){

    const width =
        parseFloat(
            document.getElementById("sheetWidth").value
        ) || 84;

    const height =
        parseFloat(
            document.getElementById("sheetHeight").value
        ) || 51;

    return {
        width: width,
        height: height
    };

}


/* =====================================================
   GET INPUT PIECES
===================================================== */

function getPieces(){

    const rows =
        document.querySelectorAll(
            "#glassInputContainer .glass-row"
        );

    const pieces = [];

    rows.forEach(row=>{

        const height =
            parseFloat(
                row.querySelector(".glass-height").value
            );

        const width =
            parseFloat(
                row.querySelector(".glass-width").value
            );

        const quantity =
            parseInt(
                row.querySelector(".glass-quantity").value
            ) || 0;

        if(
            height > 0 &&
            width > 0 &&
            quantity > 0
        ){

            pieces.push({
                height:height,
                width:width,
                quantity:quantity
            });

        }

    });

    return pieces;

}


/* =====================================================
   CORE 2D CUTTING OPTIMIZATION
===================================================== */

function optimizeCutting(
    pieces,
    sheetW,
    sheetH
){

    let items = [];

    for(const p of pieces){
        for(let i = 0; i < p.quantity; i++){
            items.push({
                w:p.width,
                h:p.height
            });
        }
    }

    items.sort(
        (a,b)=> (b.w * b.h) - (a.w * a.h)
    );

    const sheets = [];

    for(const item of items){

        let placed = false;

        for(let s = 0; s < sheets.length; s++){

            const layout = sheets[s];

            const pos = findPosition(layout, item.w, item.h, sheetW, sheetH);

            if(pos){
                layout.push({ w:item.w, h:item.h, x:pos.x, y:pos.y });
                placed = true;
                break;
            }

            const rotated = findPosition(layout, item.h, item.w, sheetW, sheetH);

            if(rotated){
                layout.push({ w:item.h, h:item.w, x:rotated.x, y:rotated.y });
                placed = true;
                break;
            }
        }

        if(!placed){
            const newSheet = [];
            let pos = findPosition(newSheet, item.w, item.h, sheetW, sheetH);

            if(pos){
                newSheet.push({ w:item.w, h:item.h, x:pos.x, y:pos.y });
            }
            else{
                pos = findPosition(newSheet, item.h, item.w, sheetW, sheetH);
                if(pos){
                    newSheet.push({ w:item.h, h:item.w, x:pos.x, y:pos.y });
                }
                else{
                    newSheet.push({ w:item.w, h:item.h, x:0, y:0 });
                }
            }
            sheets.push(newSheet);
        }
    }

    const results = sheets.map((layout,index)=>{
        let usedArea = 0;
        for(const p of layout){
            usedArea += p.w * p.h;
        }

        const sheetArea = sheetW * sheetH;
        const waste = sheetArea - usedArea;

        return {
            sheetIndex:index+1,
            pieces:layout,
            usedArea:usedArea,
            waste:waste,
            wastePercent: (waste / sheetArea) * 100
        };
    });

    const totalSheets = sheets.length;
    const totalWaste = results.reduce((sum,r)=> sum + r.waste, 0);
    const totalArea = totalSheets * sheetW * sheetH;

    return {
        totalSheets:totalSheets,
        totalPiecesCut: items.length,
        wastePercent: totalArea > 0 ? (totalWaste / totalArea) * 100 : 0,
        sheetDetails:results
    };

}


/* =====================================================
   FIND POSITION
===================================================== */

function findPosition(layout, itemW, itemH, sheetW, sheetH){

    if(itemW > sheetW || itemH > sheetH){
        return null;
    }

    for(let y = 0; y <= sheetH - itemH; y++){
        for(let x = 0; x <= sheetW - itemW; x++){
            let overlap = false;

            for(const placed of layout){
                if(
                    x < placed.x + placed.w &&
                    x + itemW > placed.x &&
                    y < placed.y + placed.h &&
                    y + itemH > placed.y
                ){
                    overlap = true;
                    break;
                }
            }
            if(!overlap){
                return { x:x, y:y };
            }
        }
    }
    return null;
}


/* =====================================================
   FORMAT NUMBER
===================================================== */

function formatNumber(value){
    return Number(value).toFixed(2);
}


/* =====================================================
   CALCULATE
===================================================== */

function calculate(){

    const sheet = getSheetSize();
    const pieces = getPieces();

    if(pieces.length === 0){
        alert("দয়া করে কমপক্ষে একটি বৈধ গ্লাস সাইজ দিন।");
        return;
    }

    const invalidPieces = [];

    pieces.forEach((p,index)=>{
        const normalFit = p.width <= sheet.width && p.height <= sheet.height;
        const rotatedFit = p.height <= sheet.width && p.width <= sheet.height;

        if(!normalFit && !rotatedFit){
            invalidPieces.push(`সারি ${index+1}: ${p.height} × ${p.width} ইঞ্চি`);
        }
    });

    if(invalidPieces.length > 0){
        alert("নিচের গ্লাসগুলো শীটের মধ্যে ফিট হবে না:\n\n" + invalidPieces.join("\n"));
        return;
    }

    const result = optimizeCutting(pieces, sheet.width, sheet.height);

    resultArea.style.display = "block";

    /* Summary Update - "বর্গ ইঞ্চি" বাদ দিয়ে પিস ও শতাংশ দেখানো হয়েছে */
    resultSummary.innerHTML = `
        <div class="summary-card">
            <div class="summary-label">📦 মোট শীট</div>
            <div class="summary-value">${result.totalSheets} টি</div>
        </div>

        <div class="summary-card">
            <div class="summary-label">📐 মোট কাটা পিস</div>
            <div class="summary-value">${result.totalPiecesCut} পিস</div>
        </div>

        <div class="summary-card">
            <div class="summary-label">🗑️ মোট অপচয়</div>
            <div class="summary-value">${result.wastePercent.toFixed(2)}%</div>
        </div>
    `;

    /* Sheet Details Update */
    resultDetail.innerHTML = "";

    result.sheetDetails.forEach(sheet=>{
        
        // Group pieces by size
        let groupedPieces = {};
        sheet.pieces.forEach(p => {
            let sizeKey = `${formatNumber(p.h)} × ${formatNumber(p.w)}`;
            if(!groupedPieces[sizeKey]) {
                groupedPieces[sizeKey] = 0;
            }
            groupedPieces[sizeKey]++;
        });

        const card = document.createElement("div");
        card.className = "sheet-card";

        let header = `
            <div class="sheet-card-header">
                <div class="sheet-number">
                    <div class="sheet-badge">${sheet.sheetIndex}</div>
                    <div class="sheet-title">শীট #${sheet.sheetIndex}</div>
                </div>
                <div class="sheet-waste">
                    অপচয়: ${sheet.wastePercent.toFixed(1)}%
                </div>
            </div>
        `;

        let pieceHTML = `<div class="piece-list">`;
        let pIndex = 1;

        for (let key in groupedPieces) {
            let qty = groupedPieces[key];
            pieceHTML += `
                <div class="piece-item">
                    <div class="piece-number">${pIndex++}</div>
                    <div class="piece-size">${key} ইঞ্চি</div>
                    <div class="piece-position">কাটা হয়েছে: ${qty} পিস</div>
                </div>
            `;
        }
        pieceHTML += `</div>`;

        const footer = `
            <div class="sheet-footer">
                <span class="used-area">এই শিট থেকে মোট কাটা হয়েছে: ${sheet.pieces.length} পিস</span>
                <span class="waste-area">অপচয়: ${sheet.wastePercent.toFixed(1)}%</span>
            </div>
        `;

        card.innerHTML = header + pieceHTML + footer;
        resultDetail.appendChild(card);
    });

    setTimeout(()=>{
        resultArea.scrollIntoView({
            behavior:"smooth",
            block:"start"
        });
    },100);

}


/* =====================================================
   ENTER KEY
===================================================== */

document.addEventListener("keydown", function(event){
    if(event.key === "Enter" && event.target.tagName === "INPUT"){
        calculate();
    }
});


/* =====================================================
   DEFAULT DATA (পরিবর্তন করা হয়েছে)
===================================================== */

function loadDefaultRows(){
    // শুধুমাত্র ১টি খালি ইনপুট সারি থাকবে
    addGlassRow("", "", "");
}


/* =====================================================
   INITIALIZE
===================================================== */

window.addEventListener("load", function(){
    setCurrentDate();
    loadDefaultRows();
});

</script>

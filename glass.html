<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>গ্লাস কাটিং ক্যালকুলেটর</title>
  <style>
    :root {
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --accent: #2563eb;
      --header-bg: linear-gradient(135deg, #1e3a8a 0%, #1d4ed8 100%);
      --text: #0f172a;
      --border: #cbd5e1;
    }
    *, *::before, *::after {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 12px;
      background-color: var(--bg-color);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
    }
    .main-container {
      max-width: 900px;
      margin: 0 auto;
    }

    /* ================= HEADER STYLE ================= */
    .header-card {
      background: var(--header-bg);
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 15px;
      box-shadow: 0 4px 15px rgba(30, 58, 138, 0.25);
      color: #ffffff;
    }
    
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.2);
      padding-bottom: 10px;
    }
    
    .menu-btn {
      width: 38px;
      height: 38px;
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 8px;
      background: rgba(255,255,255,0.18);
      color: #ffffff;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .header-title {
      flex: 1;
      text-align: center;
      font-weight: 900;
      font-size: 20px;
      letter-spacing: 0.5px;
      color: #ffffff;
    }

    .date-display {
      font-size: 13px;
      font-weight: 700;
      background: rgba(255,255,255,0.2);
      padding: 5px 10px;
      border-radius: 6px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .shop-details {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
    }

    .editable-input {
      width: 100%;
      height: 42px;
      padding: 6px 12px;
      border: none;
      border-radius: 6px;
      background: rgba(255,255,255,0.95);
      color: #0f172a;
      font-size: 18px;
      font-weight: 900;
      text-align: center;
      outline: none;
    }
    #shopPhone {
      font-size: 16px;
    }

    .floor-unit-box {
      display: flex;
      gap: 8px;
      width: 100%;
    }
    .floor-unit-box select {
      flex: 1;
      padding: 10px;
      background: rgba(255,255,255,0.95);
      border: none;
      color: #0f172a;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 800;
      outline: none;
      cursor: pointer;
      text-align: center;
    }
    
    /* ================= HISTORY SIDEBAR ================= */
    .sidebar {
      position: fixed;
      top: 0; left: -340px;
      width: 320px; height: 100%;
      background: #ffffff;
      border-right: 1px solid var(--border);
      box-shadow: 4px 0 15px rgba(0,0,0,0.15);
      transition: 0.3s;
      padding: 15px;
      z-index: 1000;
      overflow-y: auto;
    }
    .sidebar.active { left: 0; }
    .close-btn { 
      background: #ef4444; 
      color: #fff; 
      border: none; 
      padding: 6px 12px; 
      border-radius: 6px; 
      font-size: 12px; 
      cursor: pointer; 
      font-weight: bold; 
    }
    
    .history-card {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      margin-top: 10px;
    }
    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .history-date {
      color: var(--accent);
      font-size: 12px;
      font-weight: bold;
    }
    .history-actions {
      display: flex;
      gap: 6px;
    }
    .history-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 13px;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .btn-reopen { color: #2563eb; border: 1px solid #2563eb; }
    .btn-delete-item { color: #ef4444; border: 1px solid #ef4444; }

    /* ================= INPUT SECTION ================= */
    .window-row {
      background: var(--card-bg);
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 10px;
      display: flex;
      gap: 10px;
      align-items: center;
      border: 1px solid var(--border);
    }
    .window-row input {
      flex: 1;
      padding: 12px 8px;
      border-radius: 8px;
      border: 2px solid var(--border);
      font-size: 18px;
      font-weight: bold;
      text-align: center;
      outline: none;
    }
    .window-row input:focus { border-color: var(--accent); }
    .delete-row-btn {
      background: #ef4444;
      color: #fff;
      border: none;
      border-radius: 8px;
      width: 46px;
      height: 46px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* ================= BUTTONS ================= */
    .btn {
      background: var(--accent);
      color: #ffffff;
      border: none;
      padding: 15px;
      font-weight: 900;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
      font-size: 16px;
    }
    .btn-add { background: #10b981; }
    .btn-pdf { background: #dc2626; margin-top: 15px; }

    /* ================= SCREEN UI CARDS ================= */
    .results-container {
      margin-top: 20px;
      background: var(--card-bg);
      border-radius: 10px;
      border: 1px solid var(--border);
      padding: 15px;
    }

    .result-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .result-card {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    .result-card-header {
      display: flex;
      align-items: center;
      background: #ffffff;
      padding: 12px;
      border-bottom: 1px solid var(--border);
    }

    .sn-badge {
      background: var(--accent);
      color: #fff;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-weight: bold;
      margin-right: 12px;
      flex-shrink: 0;
    }

    .glass-size-text {
      font-size: 18px;
      font-weight: 900;
      color: #1d4ed8;
    }

    .result-options {
      display: grid;
      grid-template-columns: 1fr 1.5fr 1fr;
      gap: 8px;
      padding: 10px;
      background: #f1f5f9;
    }

    .card-select {
      width: 100%;
      padding: 8px 4px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
      font-weight: bold;
      text-align: center;
      outline: none;
      background: #fff;
    }

    /* Hidden element for print table in normal screen view */
    .print-only-container {
      display: none;
    }

    /* ========================================================= */
    /* PERFECT PRINT & PDF STYLING */
    /* ========================================================= */
    @media print {
      @page {
        size: A4 portrait;
        margin: 12mm 10mm;
      }

      html, body {
        background: #ffffff !important;
        color: #000000 !important;
        padding: 0 !important;
        margin: 0 !important;
        font-family: Arial, sans-serif !important;
      }

      /* Hide screen-only controls */
      .menu-btn, 
      #windowsContainer, 
      .btn-add, 
      .btn, 
      .sidebar, 
      .delete-row-btn, 
      .btn-pdf,
      .screen-cards-view {
        display: none !important;
      }

      .main-container {
        max-width: 100% !important;
        width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
      }

      .results-container {
        border: none !important;
        padding: 0 !important;
        margin-top: 0 !important;
      }

      /* Prominent Blue Print Header */
      .header-card {
        background: #1e3a8a !important; /* Dark Blue */
        color: #ffffff !important;
        border-radius: 8px !important;
        padding: 18px !important;
        margin-bottom: 15px !important;
        text-align: center !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      .header-top {
        border-bottom: 1px solid rgba(255,255,255,0.3) !important;
        padding-bottom: 8px !important;
        margin-bottom: 12px !important;
        display: flex !important;
        justify-content: space-between !important;
        align-items: center !important;
      }

      .header-title {
        color: #ffffff !important;
        font-size: 22px !important;
        font-weight: 900 !important;
        text-transform: uppercase !important;
      }

      .date-display {
        color: #ffffff !important;
        background: rgba(255,255,255,0.2) !important;
        font-size: 14px !important;
        font-weight: bold !important;
        padding: 4px 10px !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      .editable-input {
        background: transparent !important;
        color: #ffffff !important;
        border: none !important;
        font-size: 26px !important; /* Big shop name */
        font-weight: 900 !important;
        height: auto !important;
        padding: 2px 0 !important;
      }

      #shopPhone {
        font-size: 20px !important; /* Big phone number */
        font-weight: 800 !important;
      }

      .print-floor-unit {
        margin-top: 10px !important;
        font-size: 16px !important;
        font-weight: bold !important;
        color: #ffffff !important;
        border-top: 1px dashed rgba(255,255,255,0.3) !important;
        padding-top: 6px !important;
      }

      .floor-unit-box {
        display: none !important; /* Screen dropdowns hidden in print */
      }

      /* Show Print Table */
      .print-only-container {
        display: block !important;
        width: 100% !important;
      }

      .print-table {
        width: 100% !important;
        border-collapse: collapse !important;
        margin-top: 5px !important;
      }

      .print-table th {
        background: #1e3a8a !important;
        color: #ffffff !important;
        padding: 10px 6px !important;
        font-size: 15px !important;
        font-weight: bold !important;
        border: 1px solid #1e3a8a !important;
        text-align: center !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      .print-table td {
        padding: 10px 6px !important;
        font-size: 15px !important;
        font-weight: bold !important;
        border: 1px solid #cbd5e1 !important;
        text-align: center !important;
        color: #000000 !important;
      }

      .print-table tr:nth-child(even) td {
        background: #f8fafc !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
    }
  </style>
</head>
<body>

  <div class="main-container">
    <!-- History Sidebar -->
    <div id="sidebar" class="sidebar">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <h3 style="color: var(--accent); margin: 0; font-weight: 900;">সম্পূর্ণ হিস্টরি</h3>
        <button class="close-btn" onclick="toggleHistory()">✕ বন্ধ</button>
      </div>
      <hr style="border-color: var(--border); margin-bottom: 15px;">
      <div id="historyContent">কোনো হিস্টরি পাওয়া যায়নি।</div>
    </div>

    <!-- Header Section -->
    <div class="header-card">
      <div class="header-top">
        <button class="menu-btn" onclick="toggleHistory()">☰</button>
        <div class="header-title">গ্লাস কাটিং সাইজ</div>
        <div id="currentDate" class="date-display"></div>
      </div>
      
      <div class="shop-details">
        <input type="text" id="shopName" class="editable-input" value="আর এম থাই অ্যালুমিনিয়াম" placeholder="দোকানের নাম" oninput="saveCurrentFormState()">
        <input type="text" id="shopPhone" class="editable-input" value="মোবাইল: 01676474412" placeholder="মোবাইল নম্বর" oninput="saveCurrentFormState()">
      </div>
      
      <!-- Floor and Unit Dropdowns -->
      <div class="floor-unit-box">
        <select id="floorSelect" onchange="saveCurrentFormState(); updatePrintFloorText();">
          <option value="">তলা সিলেক্ট করুন</option>
          <option value="নিচ তলা">নিচ তলা</option>
          <option value="১ম তলা">১ম তলা</option>
          <option value="২য় তলা">২য় তলা</option>
          <option value="৩য় তলা">৩য় তলা</option>
          <option value="৪র্থ তলা">৪র্থ তলা</option>
          <option value="৫ম তলা">৫ম তলা</option>
          <option value="৬ষ্ঠ তলা">৬ষ্ঠ তলা</option>
          <option value="৭ম তলা">৭ম তলা</option>
          <option value="৮ম তলা">৮ম তলা</option>
          <option value="৯ম তলা">৯ম তলা</option>
          <option value="১০ম তলা">১০ম তলা</option>
        </select>
        
        <select id="unitSelect" onchange="saveCurrentFormState(); updatePrintFloorText();">
          <option value="">ইউনিট</option>
          <option value="A">A</option>
          <option value="B">B</option>
          <option value="C">C</option>
          <option value="D">D</option>
          <option value="E">E</option>
        </select>
      </div>

      <!-- Text version for Print Header -->
      <div id="printFloorText" class="print-floor-unit" style="display:none;"></div>
    </div>

    <!-- Window Input Rows -->
    <div id="windowsContainer"></div>

    <button class="btn btn-add" onclick="addWindow()">+ আরও উইন্ডো যোগ করুন</button>
    <button class="btn" onclick="calculateGlass()">গ্লাস কাটিং সাইজ বের করুন</button>

    <!-- Results Section -->
    <div class="results-container" id="resultContainer" style="display:none;">
      
      <!-- Screen Card Layout -->
      <div class="screen-cards-view result-list" id="glassResultCards"></div>

      <!-- Printable Clean Horizontal Table (Only visible in Print/PDF) -->
      <div class="print-only-container">
        <table class="print-table">
          <thead>
            <tr>
              <th style="width: 8%;">নং</th>
              <th style="width: 40%;">গ্লাসের সাইজ (ইঞ্চি)</th>
              <th style="width: 17%;">মিলিমিটার</th>
              <th style="width: 23%;">কালার</th>
              <th style="width: 12%;">কোয়ান্টিটি</th>
            </tr>
          </thead>
          <tbody id="printTableBody"></tbody>
        </table>
      </div>

      <button class="btn btn-pdf" onclick="downloadPDF()">PDF ডাউনলোড / প্রিন্ট</button>
    </div>
  </div>

  <script>
    function toggleHistory() {
      document.getElementById("sidebar").classList.toggle("active");
    }

    function setCurrentDate() {
      const today = new Date();
      const day = String(today.getDate()).padStart(2, '0');
      const month = String(today.getMonth() + 1).padStart(2, '0');
      const year = today.getFullYear();
      document.getElementById("currentDate").innerText = `তারিখ: ${day}/${month}/${year}`;
    }

    function updatePrintFloorText() {
      const floor = document.getElementById("floorSelect").value;
      const unit = document.getElementById("unitSelect").value;
      const el = document.getElementById("printFloorText");
      
      if (floor || unit) {
        el.innerText = `${floor ? 'তলা: ' + floor : ''} ${unit ? ' | ইউনিট: ' + unit : ''}`.trim();
        el.style.display = "block";
      } else {
        el.innerText = "";
        el.style.display = "none";
      }
    }

    function addWindow(hVal = "", wVal = "") {
      const container = document.getElementById("windowsContainer");
      const div = document.createElement("div");
      div.className = "window-row";
      div.innerHTML = `
        <input type="number" class="mm-h" placeholder="হাইট (mm)" value="${hVal}" oninput="saveCurrentFormState()">
        <input type="number" class="mm-w" placeholder="চওড়া (mm)" value="${wVal}" oninput="saveCurrentFormState()">
        <button class="delete-row-btn" onclick="removeWindow(this)">✕</button>
      `;
      container.appendChild(div);
      saveCurrentFormState();
    }

    function removeWindow(button) {
      const rows = document.querySelectorAll("#windowsContainer .window-row");
      if (rows.length > 1) {
        button.parentElement.remove();
        saveCurrentFormState();
      } else {
        alert("কমপক্ষে একটি উইন্ডো থাকা আবশ্যক!");
      }
    }

    function saveCurrentFormState() {
      const shopName = document.getElementById("shopName").value;
      const shopPhone = document.getElementById("shopPhone").value;
      const floorSelect = document.getElementById("floorSelect").value;
      const unitSelect = document.getElementById("unitSelect").value;

      const windowRows = document.querySelectorAll("#windowsContainer .window-row");
      const windowsData = [];

      windowRows.forEach(row => {
        const h = row.querySelector(".mm-h").value;
        const w = row.querySelector(".mm-w").value;
        windowsData.push({ h, w });
      });

      const formState = { shopName, shopPhone, floorSelect, unitSelect, windowsData };
      localStorage.setItem("glassFormData", JSON.stringify(formState));
    }

    function loadSavedFormState() {
      const savedState = localStorage.getItem("glassFormData");
      if (!savedState) {
        addWindow();
        return;
      }

      const formState = JSON.parse(savedState);

      if (formState.shopName !== undefined) document.getElementById("shopName").value = formState.shopName;
      if (formState.shopPhone !== undefined) document.getElementById("shopPhone").value = formState.shopPhone;
      if (formState.floorSelect !== undefined) document.getElementById("floorSelect").value = formState.floorSelect;
      if (formState.unitSelect !== undefined) document.getElementById("unitSelect").value = formState.unitSelect;

      const container = document.getElementById("windowsContainer");
      container.innerHTML = "";

      if (formState.windowsData && formState.windowsData.length > 0) {
        formState.windowsData.forEach(win => addWindow(win.h, win.w));
      } else {
        addWindow();
      }
      updatePrintFloorText();
    }

    function mmToInchSuta(mm) {
      let totalInches = mm / 25.4;
      let inches = Math.floor(totalInches);
      let fraction = totalInches - inches;
      let suta = Math.round(fraction * 8);

      if (suta === 8) {
        inches += 1;
        suta = 0;
      }
      return suta > 0 ? `${inches}" ${suta} সুতা` : `${inches}"`;
    }

    function getQtyOptions(selectedQty = 2) {
      let options = "";
      for (let i = 1; i <= 100; i++) {
        options += `<option value="${i}" ${i === parseInt(selectedQty) ? 'selected' : ''}>${i}</option>`;
      }
      return options;
    }

    function getMmOptions(selectedMm = "5.5mm") {
      const mms = ["5mm", "5.5mm", "6mm", "8mm", "10mm", "12mm", "15mm"];
      return mms.map(mm => `<option value="${mm}" ${mm === selectedMm ? 'selected' : ''}>${mm}</option>`).join('');
    }

    function getColorOptions(selectedColor = "Dark Grey Normal") {
      const colors = [
        "Clear", "Blue Markeri", "Blue Normal", 
        "Green Markeri", "Green Normal", "Lake Blue Markeri", 
        "Lake Blue Normal", "Dark Grey Normal", "Light Bronze Normal",
        "Winer", "Emboss", "Coffee"
      ];
      return colors.map(c => `<option value="${c}" ${c === selectedColor ? 'selected' : ''}>${c}</option>`).join('');
    }

    function generateCardHTML(sn, sizeText, mm, color, qty) {
      return `
        <div class="result-card" data-sn="${sn}" data-size="${sizeText}">
          <div class="result-card-header">
            <div class="sn-badge">${sn}</div>
            <div class="glass-size-text">${sizeText}</div>
          </div>
          <div class="result-options">
            <select class="card-select select-mm" onchange="syncPrintTable()">${getMmOptions(mm)}</select>
            <select class="card-select select-color" onchange="syncPrintTable()">${getColorOptions(color)}</select>
            <select class="card-select select-qty" onchange="syncPrintTable()">${getQtyOptions(qty)}</select>
          </div>
        </div>
      `;
    }

    function calculateGlass() {
      const heights = document.querySelectorAll(".mm-h");
      const widths = document.querySelectorAll(".mm-w");
      const cardContainer = document.getElementById("glassResultCards");
      cardContainer.innerHTML = "";

      let historyItems = [];
      let serialNumber = 1;

      heights.forEach((hInput, index) => {
        let hVal = parseFloat(hInput.value);
        let wVal = parseFloat(widths[index].value);

        if (hVal && wVal) {
          let finalH_mm = hVal - 105;
          let finalW_mm = (wVal - 123) / 2;

          let hFormatted = mmToInchSuta(finalH_mm);
          let wFormatted = mmToInchSuta(finalW_mm);
          let finalSizeText = `${hFormatted} × ${wFormatted}`;

          cardContainer.innerHTML += generateCardHTML(serialNumber, finalSizeText, "5.5mm", "Dark Grey Normal", 2);

          historyItems.push({
            sn: serialNumber,
            size: finalSizeText,
            mm: "5.5mm",
            color: "Dark Grey Normal",
            qty: 2
          });

          serialNumber++;
        }
      });

      if (cardContainer.children.length > 0) {
        document.getElementById("resultContainer").style.display = "block";
        syncPrintTable();
        saveHistory(historyItems);
      }
    }

    /* Synchronizes Screen Cards to standard horizontal print table */
    function syncPrintTable() {
      const cards = document.querySelectorAll(".result-card");
      const printBody = document.getElementById("printTableBody");
      printBody.innerHTML = "";

      cards.forEach(card => {
        const sn = card.getAttribute("data-sn");
        const size = card.getAttribute("data-size");
        const mm = card.querySelector(".select-mm").value;
        const color = card.querySelector(".select-color").value;
        const qty = card.querySelector(".select-qty").value;

        printBody.innerHTML += `
          <tr>
            <td>${sn}</td>
            <td style="color:#1d4ed8;">${size}</td>
            <td>${mm}</td>
            <td>${color}</td>
            <td>${qty} পিস</td>
          </tr>
        `;
      });
    }

    function saveHistory(items) {
      let floor = document.getElementById("floorSelect").value;
      let unit = document.getElementById("unitSelect").value;
      let locationText = (floor || unit) ? ` (${floor} ${unit ? 'ইউনিট ' + unit : ''})`.trim() : "";

      let existing = JSON.parse(localStorage.getItem("glassHistory") || "[]");
      let newEntry = {
        id: Date.now(),
        date: new Date().toLocaleTimeString('bn-BD', { hour: '2-digit', minute: '2-digit' }) + ', ' + new Date().toLocaleDateString('bn-BD') + locationText,
        items: items
      };
      existing.unshift(newEntry);
      localStorage.setItem("glassHistory", JSON.stringify(existing));
      renderHistory();
    }

    function renderHistory() {
      let existing = JSON.parse(localStorage.getItem("glassHistory") || "[]");
      let historyContent = document.getElementById("historyContent");
      
      if(existing.length === 0) {
        historyContent.innerHTML = "<div style='color: #64748b; text-align: center; margin-top: 20px;'>কোনো হিস্টরি পাওয়া যায়নি।</div>";
        return;
      }
      
      let html = `<button class="close-btn" style="width:100%; margin-bottom:10px; background:#ef4444;" onclick="clearAllHistory()">সব হিস্টরি মুছুন</button>`;
      
      existing.forEach((entry) => {
        let itemListHtml = entry.items.map(item => 
          `<li>#${item.sn || 1}: ${item.size}</li>`
        ).join('');

        html += `
          <div class="history-card">
            <div class="history-header">
              <span class="history-date">${entry.date}</span>
              <div class="history-actions">
                <button class="history-btn btn-reopen" onclick="reopenHistory(${entry.id})" title="পুনরায় খুলুন">📂 খুলুন</button>
                <button class="history-btn btn-delete-item" onclick="deleteHistoryItem(${entry.id})" title="মুছে ফেলুন">🗑️</button>
              </div>
            </div>
            <ul style="padding-left: 18px; margin: 5px 0; color: #475569; font-size: 13px; cursor: pointer;" onclick="reopenHistory(${entry.id})">
              ${itemListHtml}
            </ul>
          </div>
        `;
      });

      historyContent.innerHTML = html;
    }

    function deleteHistoryItem(id) {
      let existing = JSON.parse(localStorage.getItem("glassHistory") || "[]");
      let updated = existing.filter(item => item.id !== id);
      localStorage.setItem("glassHistory", JSON.stringify(updated));
      renderHistory();
    }

    function clearAllHistory() {
      if(confirm("আপনি কি সব হিস্টরি মুছে ফেলতে চান?")) {
        localStorage.removeItem("glassHistory");
        renderHistory();
      }
    }

    function reopenHistory(id) {
      let existing = JSON.parse(localStorage.getItem("glassHistory") || "[]");
      let selectedEntry = existing.find(item => item.id === id);

      if (selectedEntry) {
        const cardContainer = document.getElementById("glassResultCards");
        cardContainer.innerHTML = "";

        selectedEntry.items.forEach((item, index) => {
          let sn = item.sn || (index + 1);
          cardContainer.innerHTML += generateCardHTML(sn, item.size, item.mm, item.color, item.qty);
        });

        document.getElementById("resultContainer").style.display = "block";
        syncPrintTable();
        toggleHistory();
      }
    }

    function downloadPDF() {
      syncPrintTable();
      updatePrintFloorText();
      window.print();
    }

    window.onload = function() {
      setCurrentDate();
      loadSavedFormState();
      renderHistory();
    };
  </script>
</body>
</html>

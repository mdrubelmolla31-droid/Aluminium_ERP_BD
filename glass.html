<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>গ্লাস কাটিং ক্যালকুলেটর</title>
  <style>
    :root {
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --text: #0f172a;
      --border: #cbd5e1;
      --input-bg: #ffffff;
      --header-bg: linear-gradient(135deg, #123a8c 0%, #1557c0 45%, #2563d9 100%);
    }
    *, *::before, *::after {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
    }
    body {
      padding: 12px;
    }
    .main-container {
      max-width: 950px;
      margin: 0 auto;
      width: 100%;
    }

    /* ================= HEADER STYLE ================= */
    .header-card {
      background: var(--header-bg);
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 15px;
      box-shadow: 0 4px 15px rgba(20, 70, 160, 0.2);
      color: #ffffff;
    }
    
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      border-bottom: 1px solid rgba(255,255,255,0.2);
      padding-bottom: 10px;
    }
    
    .menu-btn {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 8px;
      background: rgba(255,255,255,0.18);
      color: #ffffff;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .header-title {
      font-weight: 900;
      font-size: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .date-display {
      font-size: 14px;
      font-weight: 700;
      background: rgba(255,255,255,0.2);
      padding: 4px 10px;
      border-radius: 6px;
      white-space: nowrap;
    }

    .shop-details {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
    }

    .editable-input {
      width: 100%;
      height: 40px;
      padding: 6px 12px;
      border: none;
      border-radius: 6px;
      background: rgba(255,255,255,0.95);
      color: #111827;
      font-size: 16px;
      font-weight: 800;
      text-align: center;
      outline: none;
      transition: all 0.3s ease;
    }
    .editable-input:focus {
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.3);
    }

    /* Floor & Unit Section */
    .floor-unit-box {
      display: flex;
      gap: 8px;
      width: 100%;
    }
    .floor-unit-box select {
      flex: 1;
      padding: 10px;
      background: rgba(255,255,255,0.95);
      border: none;
      color: #111827;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 800;
      outline: none;
      cursor: pointer;
      text-align: center;
    }
    
    /* ================= HISTORY SIDEBAR ================= */
    .sidebar {
      position: fixed;
      top: 0; left: -340px;
      width: 320px; height: 100%;
      background: #ffffff;
      border-right: 1px solid var(--border);
      box-shadow: 4px 0 15px rgba(0,0,0,0.1);
      transition: 0.3s;
      padding: 15px;
      z-index: 1000;
      overflow-y: auto;
    }
    .sidebar.active { left: 0; }
    .close-btn { 
      background: #ef4444; 
      color: #fff; 
      border: none; 
      padding: 5px 10px; 
      border-radius: 6px; 
      float: right; 
      font-size: 12px; 
      cursor: pointer; 
      font-weight: bold; 
    }
    
    .history-card {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      margin-top: 10px;
    }
    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .history-date {
      color: var(--accent);
      font-size: 13px;
      font-weight: bold;
    }
    .history-actions {
      display: flex;
      gap: 6px;
    }
    .history-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 14px;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .btn-reopen { color: #2563eb; border: 1px solid #2563eb; }
    .btn-delete-item { color: #ef4444; border: 1px solid #ef4444; }
    
    .clear-all-btn {
      background: #ef4444;
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 6px;
      width: 100%;
      font-size: 14px;
      cursor: pointer;
      margin-top: 10px;
      font-weight: bold;
    }

    /* ================= INPUT SECTION ================= */
    .window-row {
      background: var(--card-bg);
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 10px;
      display: flex;
      gap: 10px;
      align-items: center;
      border: 1px solid var(--border);
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
    .window-row input {
      flex: 1;
      min-width: 0;
      padding: 12px 8px;
      border-radius: 8px;
      border: 2px solid var(--border);
      background: var(--input-bg);
      color: var(--text);
      font-size: 18px;
      font-weight: bold;
      text-align: center;
      outline: none;
    }
    .window-row input:focus {
      border-color: var(--accent);
    }
    .delete-row-btn {
      background: #ef4444;
      color: #fff;
      border: none;
      border-radius: 8px;
      width: 48px;
      height: 48px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* ================= BUTTONS ================= */
    .btn {
      background: var(--accent);
      color: #ffffff;
      border: none;
      padding: 15px;
      font-weight: 900;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
      font-size: 16px;
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.2);
    }
    .btn-add { background: #10b981; color: #fff; box-shadow: 0 4px 10px rgba(16, 185, 129, 0.2); }
    .btn-whatsapp { background: #25D366; color: #fff; margin-top: 15px; box-shadow: 0 4px 10px rgba(37, 211, 102, 0.2); }
    .btn-pdf { background: #ef4444; color: #fff; margin-top: 10px; box-shadow: 0 4px 10px rgba(239, 68, 68, 0.2); }

    /* ================= TABLE ================= */
    .table-container {
      width: 100%;
      margin-top: 20px;
      background: var(--card-bg);
      border-radius: 10px;
      border: 1px solid var(--border);
      overflow-x: auto;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      min-width: 600px;
    }
    th, td {
      padding: 12px 4px;
      border: 1px solid var(--border);
      text-align: center;
      vertical-align: middle;
      word-break: break-word;
    }
    th { 
      background: #f1f5f9; 
      color: var(--accent); 
      font-size: 15px; 
      font-weight: 900; 
    }
    tbody tr:nth-child(even) {
      background-color: #f8fafc;
    }

    th:nth-child(1), td:nth-child(1) { width: 8% !important; }
    th:nth-child(2), td:nth-child(2) { width: 40% !important; }
    th:nth-child(3), td:nth-child(3) { width: 14% !important; }
    th:nth-child(4), td:nth-child(4) { width: 28% !important; }
    th:nth-child(5), td:nth-child(5) { width: 10% !important; }

    .glass-size-text {
      font-size: 18px !important;
      font-weight: 900 !important;
      color: #1d4ed8 !important;
      line-height: 1.3;
    }

    .sn-text {
      font-size: 16px !important;
      font-weight: 900 !important;
      color: #0f172a;
    }

    .table-select {
      width: 100%;
      padding: 8px 2px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      color: #0f172a;
      border-radius: 6px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      outline: none;
      text-align: center;
      text-align-last: center;
    }

    /* ========================================================= */
    /* PRINT DESIGN WITH CURRENT DATE */
    /* ========================================================= */
    @media print {
      @page {
        size: A4 portrait;
        margin: 0;
      }
      
      html, body {
        width: 210mm;
        height: 297mm;
        margin: 0 !important;
        padding: 0 !important;
        background: #ffffff !important;
        color: #000000 !important;
        overflow: hidden !important;
      }
      
      body {
        border: 8px double #002366 !important;
        box-sizing: border-box !important;
        padding: 8mm !important;
      }

      .main-container {
        max-width: 100% !important;
        width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
      }

      .print-wrapper {
        border: 3px double #0088cc !important;
        border-radius: 8px !important;
        padding: 16px !important;
        margin: 0 !important;
        width: 100% !important;
        box-sizing: border-box !important;
      }

      .header-card {
        background: transparent !important;
        border: none !important;
        box-shadow: none !important;
        padding: 0 0 10px 0 !important;
        margin-bottom: 10px !important;
        color: #000 !important;
      }
      .menu-btn, .header-title {
        display: none !important;
      }
      
      .editable-input {
        background: transparent !important;
        color: #0088cc !important;
        font-size: 24px !important;
        font-weight: 900 !important;
        padding: 0 !important;
        height: auto !important;
      }
      #shopPhone {
        font-size: 20px !important;
        color: #000000 !important;
      }
      
      .date-display {
        font-size: 16px !important;
        color: #000000 !important;
        font-weight: 900 !important;
        background: transparent !important;
        text-align: right;
        padding: 0 !important;
      }

      .floor-unit-box {
        border-top: 1.5px dotted #0088cc !important;
        padding-top: 8px !important;
        margin-top: 8px !important;
      }
      .floor-unit-box select {
        background: transparent !important;
        border: none !important;
        color: #000000 !important;
        font-size: 18px !important;
        font-weight: 900 !important;
        padding: 0 !important;
        appearance: none;
        -webkit-appearance: none;
      }

      #windowsContainer, .btn-add, .btn, .sidebar, .delete-row-btn {
        display: none !important;
      }

      #resultContainer {
        display: block !important;
        background: transparent !important;
        border: none !important;
        box-shadow: none !important;
        margin-top: 0 !important;
        padding: 0 !important;
        width: 100% !important;
      }
      .table-container {
        border: none !important;
        margin: 0 !important;
        width: 100% !important;
      }
      
      table {
        border: 2px solid #0088cc !important;
        border-collapse: collapse !important;
        width: 100% !important;
        table-layout: fixed !important;
      }

      th {
        background: #ffffff !important;
        color: #0088cc !important;
        border: 2px solid #0088cc !important;
        font-weight: 900 !important;
        font-size: 18px !important;
        padding: 10px 4px !important;
      }
      
      td {
        border: 2px solid #0088cc !important;
        color: #000000 !important;
        font-weight: 900 !important;
        font-size: 18px !important;
        padding: 12px 4px !important;
      }
      .glass-size-text {
        color: #000000 !important;
        font-size: 20px !important;
        font-weight: 900 !important;
      }
      .sn-text {
        color: #0088cc !important;
        font-size: 18px !important;
      }
      .table-select {
        background: transparent !important;
        border: none !important;
        color: #000000 !important;
        font-size: 18px !important;
        font-weight: 900 !important;
        appearance: none;
        -webkit-appearance: none;
        text-align-last: center;
        padding: 0 !important;
        width: 100% !important;
      }

      .btn-whatsapp, .btn-pdf {
        display: none !important;
      }
    }
  </style>
</head>
<body>

  <div class="main-container">
    <div class="print-wrapper">
      <!-- History Sidebar -->
      <div id="sidebar" class="sidebar">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h3 style="color: var(--accent); margin: 0; font-weight: 900;">সম্পূর্ণ হিস্টরি</h3>
            <button class="close-btn" onclick="toggleHistory()">✕ বন্ধ</button>
        </div>
        <hr style="border-color: var(--border); margin-bottom: 15px;">
        <div id="historyContent">কোনো হিস্টরি পাওয়া যায়নি।</div>
      </div>

      <!-- Header Section with Blue Gradient -->
      <div class="header-card">
        <div class="header-top">
          <button class="menu-btn" onclick="toggleHistory()">☰</button>
          <span class="header-title">গ্লাস কাটিং সাইজ</span>
          <div id="currentDate" class="date-display"></div>
        </div>
        
        <div class="shop-details">
          <input type="text" id="shopName" class="editable-input" value="আর এম থাই অ্যালুমিনিয়াম" placeholder="দোকানের নাম" oninput="saveCurrentFormState()">
          <input type="text" id="shopPhone" class="editable-input" value="মোবাইল: 01676474412" placeholder="মোবাইল নম্বর" oninput="saveCurrentFormState()">
        </div>
        
        <!-- Floor and Unit Dropdowns -->
        <div class="floor-unit-box">
          <select id="floorSelect" onchange="saveCurrentFormState()">
            <option value="">তলা সিলেক্ট করুন</option>
            <option value="নিচ তলা">নিচ তলা</option>
            <option value="১ম তলা">১ম তলা</option>
            <option value="২য় তলা">২য় তলা</option>
            <option value="৩য় তলা">৩য় তলা</option>
            <option value="৪র্থ তলা">৪র্থ তলা</option>
            <option value="৫ম তলা">৫ম তলা</option>
            <option value="৬ষ্ঠ তলা">৬ষ্ঠ তলা</option>
            <option value="৭ম তলা">৭ম তলা</option>
            <option value="৮ম তলা">৮ম তলা</option>
            <option value="৯ম তলা">৯ম তলা</option>
            <option value="১০ম তলা">১০ম তলা</option>
          </select>
          
          <select id="unitSelect" onchange="saveCurrentFormState()">
            <option value="">ইউনিট</option>
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="C">C</option>
            <option value="D">D</option>
            <option value="E">E</option>
          </select>
        </div>
      </div>

      <!-- Dynamic Input Windows -->
      <div id="windowsContainer"></div>

      <button class="btn btn-add" onclick="addWindow()">+ আরও উইন্ডো যোগ করুন</button>
      <button class="btn" onclick="calculateGlass()">গ্লাস কাটিং সাইজ বের করুন</button>

      <!-- Results Table -->
      <div class="table-container" id="resultContainer" style="display:none;">
        <table>
          <thead>
            <tr>
              <th>নং</th>
              <th>গ্লাসের সাইজ (ইঞ্চি)</th>
              <th>মিলি</th>
              <th>কালার</th>
              <th>পিস</th>
            </tr>
          </thead>
          <tbody id="glassTableBody"></tbody>
        </table>

        <div style="padding: 15px;">
          <button class="btn btn-whatsapp" onclick="sendWhatsApp()">WhatsApp-এ পাঠান</button>
          <button class="btn btn-pdf" onclick="downloadPDF()">PDF ডাউনলোড / প্রিন্ট</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    function toggleHistory() {
      document.getElementById("sidebar").classList.toggle("active");
    }

    /* তারিখ দেখানোর ফাংশন (DD/MM/YYYY) */
    function setCurrentDate() {
      const today = new Date();
      const day = String(today.getDate()).padStart(2, '0');
      const month = String(today.getMonth() + 1).padStart(2, '0');
      const year = today.getFullYear();
      document.getElementById("currentDate").innerText = `তারিখ: ${day}/${month}/${year}`;
    }

    function addWindow(hVal = "", wVal = "") {
      const container = document.getElementById("windowsContainer");
      const div = document.createElement("div");
      div.className = "window-row";
      div.innerHTML = `
        <input type="number" class="mm-h" placeholder="হাইট (mm)" value="${hVal}" oninput="saveCurrentFormState()">
        <input type="number" class="mm-w" placeholder="চওড়া (mm)" value="${wVal}" oninput="saveCurrentFormState()">
        <button class="delete-row-btn" onclick="removeWindow(this)">✕</button>
      `;
      container.appendChild(div);
      saveCurrentFormState();
    }

    function removeWindow(button) {
      const rows = document.querySelectorAll("#windowsContainer .window-row");
      if (rows.length > 1) {
        button.parentElement.remove();
        saveCurrentFormState();
      } else {
        alert("কমপক্ষে একটি উইন্ডো থাকা আবশ্যক!");
      }
    }

    function saveCurrentFormState() {
      const shopName = document.getElementById("shopName").value;
      const shopPhone = document.getElementById("shopPhone").value;
      const floorSelect = document.getElementById("floorSelect").value;
      const unitSelect = document.getElementById("unitSelect").value;

      const windowRows = document.querySelectorAll("#windowsContainer .window-row");
      const windowsData = [];

      windowRows.forEach(row => {
        const h = row.querySelector(".mm-h").value;
        const w = row.querySelector(".mm-w").value;
        windowsData.push({ h, w });
      });

      const formState = {
        shopName,
        shopPhone,
        floorSelect,
        unitSelect,
        windowsData
      };

      localStorage.setItem("glassFormData", JSON.stringify(formState));
    }

    function loadSavedFormState() {
      const savedState = localStorage.getItem("glassFormData");
      if (!savedState) {
        addWindow();
        return;
      }

      const formState = JSON.parse(savedState);

      if (formState.shopName !== undefined) document.getElementById("shopName").value = formState.shopName;
      if (formState.shopPhone !== undefined) document.getElementById("shopPhone").value = formState.shopPhone;
      if (formState.floorSelect !== undefined) document.getElementById("floorSelect").value = formState.floorSelect;
      if (formState.unitSelect !== undefined) document.getElementById("unitSelect").value = formState.unitSelect;

      const container = document.getElementById("windowsContainer");
      container.innerHTML = "";

      if (formState.windowsData && formState.windowsData.length > 0) {
        formState.windowsData.forEach(win => {
          addWindow(win.h, win.w);
        });
      } else {
        addWindow();
      }
    }

    function mmToInchSuta(mm) {
      let totalInches = mm / 25.4;
      let inches = Math.floor(totalInches);
      let fraction = totalInches - inches;
      let suta = Math.round(fraction * 8);

      if (suta === 8) {
        inches += 1;
        suta = 0;
      }
      return suta > 0 ? `${inches}" ${suta} সুতা` : `${inches}"`;
    }

    function getQtyOptions(selectedQty = 2) {
      let options = "";
      for (let i = 1; i <= 100; i++) {
        options += `<option value="${i}" ${i === parseInt(selectedQty) ? 'selected' : ''}>${i}</option>`;
      }
      return options;
    }

    function getMmOptions(selectedMm = "5.5mm") {
      const mms = ["5mm", "5.5mm", "6mm", "8mm", "10mm", "12mm", "15mm"];
      return mms.map(mm => `<option value="${mm}" ${mm === selectedMm ? 'selected' : ''}>${mm}</option>`).join('');
    }

    function getColorOptions(selectedColor = "Dark Grey Normal") {
      const colors = [
        "Clear", "Blue Markeri", "Blue Normal", 
        "Green Markeri", "Green Normal", "Lake Blue Markeri", 
        "Lake Blue Normal", "Dark Grey Normal", "Light Bronze Normal",
        "Winer", "Emboss", "Coffee"
      ];
      return colors.map(c => `<option value="${c}" ${c === selectedColor ? 'selected' : ''}>${c}</option>`).join('');
    }

    function calculateGlass() {
      const heights = document.querySelectorAll(".mm-h");
      const widths = document.querySelectorAll(".mm-w");
      const tbody = document.getElementById("glassTableBody");
      tbody.innerHTML = "";

      let historyItems = [];
      let serialNumber = 1;

      heights.forEach((hInput, index) => {
        let hVal = parseFloat(hInput.value);
        let wVal = parseFloat(widths[index].value);

        if (hVal && wVal) {
          let finalH_mm = hVal - 105;
          let finalW_mm = (wVal - 123) / 2;

          let hFormatted = mmToInchSuta(finalH_mm);
          let wFormatted = mmToInchSuta(finalW_mm);

          let finalSizeText = `${hFormatted} × ${wFormatted}`;

          let tr = document.createElement("tr");
          tr.innerHTML = `
            <td class="sn-text">${serialNumber}</td>
            <td class="glass-size-text">${finalSizeText}</td>
            <td>
              <select class="table-select">${getMmOptions("5.5mm")}</select>
            </td>
            <td>
              <select class="table-select">${getColorOptions("Dark Grey Normal")}</select>
            </td>
            <td>
              <select class="table-select">${getQtyOptions(2)}</select>
            </td>
          `;
          tbody.appendChild(tr);

          historyItems.push({
            sn: serialNumber,
            size: finalSizeText,
            mm: "5.5mm",
            color: "Dark Grey Normal",
            qty: 2
          });

          serialNumber++;
        }
      });

      if (tbody.children.length > 0) {
        document.getElementById("resultContainer").style.display = "block";
        saveHistory(historyItems);
      }
    }

    function saveHistory(items) {
      let floor = document.getElementById("floorSelect").value;
      let unit = document.getElementById("unitSelect").value;
      let locationText = (floor || unit) ? ` (${floor} ${unit ? 'ইউনিট ' + unit : ''})`.trim() : "";

      let existing = JSON.parse(localStorage.getItem("glassHistory") || "[]");
      let newEntry = {
        id: Date.now(),
        date: new Date().toLocaleTimeString('bn-BD', { hour: '2-digit', minute: '2-digit' }) + ', ' + new Date().toLocaleDateString('bn-BD') + locationText,
        items: items
      };
      existing.unshift(newEntry);
      localStorage.setItem("glassHistory", JSON.stringify(existing));
      renderHistory();
    }

    function renderHistory() {
      let existing = JSON.parse(localStorage.getItem("glassHistory") || "[]");
      let historyContent = document.getElementById("historyContent");
      
      if(existing.length === 0) {
        historyContent.innerHTML = "<div style='color: #64748b; text-align: center; margin-top: 20px;'>কোনো হিস্টরি পাওয়া যায়নি।</div>";
        return;
      }
      
      let html = `<button class="clear-all-btn" onclick="clearAllHistory()">সব হিস্টরি মুছুন</button>`;
      
      existing.forEach((entry) => {
        let itemListHtml = entry.items.map(item => 
          `<li>#${item.sn || 1}: ${item.size} (${item.mm}, ${item.qty} পিস)</li>`
        ).join('');

        html += `
          <div class="history-card">
            <div class="history-header">
              <span class="history-date">${entry.date}</span>
              <div class="history-actions">
                <button class="history-btn btn-reopen" onclick="reopenHistory(${entry.id})" title="পুনরায় খুলুন">📂 খুলুন</button>
                <button class="history-btn btn-delete-item" onclick="deleteHistoryItem(${entry.id})" title="মুছে ফেলুন">🗑️</button>
              </div>
            </div>
            <ul style="padding-left: 18px; margin: 5px 0; color: #475569; font-size: 13px; cursor: pointer;" onclick="reopenHistory(${entry.id})">
              ${itemListHtml}
            </ul>
          </div>
        `;
      });

      historyContent.innerHTML = html;
    }

    function deleteHistoryItem(id) {
      let existing = JSON.parse(localStorage.getItem("glassHistory") || "[]");
      let updated = existing.filter(item => item.id !== id);
      localStorage.setItem("glassHistory", JSON.stringify(updated));
      renderHistory();
    }

    function clearAllHistory() {
      if(confirm("আপনি কি সব হিস্টরি মুছে ফেলতে চান?")) {
        localStorage.removeItem("glassHistory");
        renderHistory();
      }
    }

    function reopenHistory(id) {
      let existing = JSON.parse(localStorage.getItem("glassHistory") || "[]");
      let selectedEntry = existing.find(item => item.id === id);

      if (selectedEntry) {
        const tbody = document.getElementById("glassTableBody");
        tbody.innerHTML = "";

        selectedEntry.items.forEach((item, index) => {
          let tr = document.createElement("tr");
          tr.innerHTML = `
            <td class="sn-text">${item.sn || (index + 1)}</td>
            <td class="glass-size-text">${item.size}</td>
            <td><select class="table-select">${getMmOptions(item.mm)}</select></td>
            <td><select class="table-select">${getColorOptions(item.color)}</select></td>
            <td><select class="table-select">${getQtyOptions(item.qty)}</select></td>
          `;
          tbody.appendChild(tr);
        });

        document.getElementById("resultContainer").style.display = "block";
        toggleHistory();
      }
    }

    function sendWhatsApp() {
      let shopName = document.getElementById("shopName").value;
      let shopPhone = document.getElementById("shopPhone").value;
      let floor = document.getElementById("floorSelect").value;
      let unit = document.getElementById("unitSelect").value;
      let dateText = document.getElementById("currentDate").innerText;
      
      let locationInfo = (floor || unit) ? `\n*অবস্থান:* ${floor} ${unit ? 'ইউনিট ' + unit : ''}` : "";
      
      let message = `*${shopName}*\n${shopPhone}\n${dateText}${locationInfo}\n---------------------------\n*গ্লাস কাটিং লিস্ট:*\n\n`;
      
      let rows = document.querySelectorAll("#glassTableBody tr");
      rows.forEach((row) => {
        let sn = row.cells[0].innerText;
        let size = row.cells[1].innerText;
        let mm = row.cells[2].querySelector("select").value;
        let color = row.cells[3].querySelector("select").value;
        let qty = row.cells[4].querySelector("select").value;
        
        message += `${sn}. সাইজ: ${size}\n   মিলি: ${mm} | কালার: ${color} | পিস: ${qty}\n\n`;
      });

      let encodedMsg = encodeURIComponent(message);
      window.open(`https://wa.me/?text=${encodedMsg}`, '_blank');
    }

    function downloadPDF() {
      window.print();
    }

    window.onload = function() {
      setCurrentDate();
      loadSavedFormState();
      renderHistory();
    };
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>গ্লাস কাটিং ক্যালকুলেটর</title>
  <style>
    :root {
      --bg-color: #0b1329;
      --card-bg: #131e3a;
      --accent: #38bdf8;
      --text: #ffffff;
      --border: #1e2d52;
      --input-bg: #091024;
    }
    *, *::before, *::after {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
    }
    body {
      padding: 12px;
    }
    .main-container {
      max-width: 950px;
      margin: 0 auto;
      width: 100%;
    }
    .header-card {
      background: var(--card-bg);
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 15px;
      border: 1px solid var(--border);
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .menu-btn {
      font-size: 28px;
      background: none;
      border: none;
      color: var(--accent);
      cursor: pointer;
      padding: 0;
    }
    .editable-input {
      background: transparent;
      border: none;
      border-bottom: 2px dashed var(--accent);
      color: var(--text);
      font-size: 20px;
      font-weight: bold;
      width: 100%;
      margin-bottom: 8px;
      outline: none;
    }
    .editable-input.title {
      font-size: 26px;
      font-weight: 900;
      color: var(--accent);
    }
    
    /* History Sidebar */
    .sidebar {
      position: fixed;
      top: 0; left: -340px;
      width: 320px; height: 100%;
      background: #060b17;
      border-right: 1px solid var(--border);
      transition: 0.3s;
      padding: 15px;
      z-index: 1000;
      overflow-y: auto;
    }
    .sidebar.active { left: 0; }
    .close-btn { color: #ef4444; float: right; font-size: 22px; cursor: pointer; font-weight: bold; }
    
    .history-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      margin-top: 10px;
    }
    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .history-date {
      color: var(--accent);
      font-size: 13px;
      font-weight: bold;
    }
    .history-actions {
      display: flex;
      gap: 6px;
    }
    .history-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 14px;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .btn-reopen { color: #38bdf8; border: 1px solid #38bdf8; }
    .btn-delete-item { color: #ef4444; border: 1px solid #ef4444; }
    
    .clear-all-btn {
      background: #ef4444;
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 6px;
      width: 100%;
      font-size: 14px;
      cursor: pointer;
      margin-top: 10px;
      font-weight: bold;
    }

    /* Input Section */
    .window-row {
      background: var(--card-bg);
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 10px;
      display: flex;
      gap: 10px;
      align-items: center;
      border: 1px solid var(--border);
    }
    .window-row input {
      flex: 1;
      min-width: 0;
      padding: 12px 8px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--input-bg);
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      text-align: center;
      outline: none;
    }
    .delete-row-btn {
      background: #ef4444;
      color: #fff;
      border: none;
      border-radius: 6px;
      width: 42px;
      height: 45px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* Action Buttons */
    .btn {
      background: var(--accent);
      color: #0b1329;
      border: none;
      padding: 15px;
      font-weight: 900;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
      font-size: 18px;
    }
    .btn-add { background: #22c55e; color: #fff; }
    .btn-whatsapp { background: #25D366; color: #fff; margin-top: 15px; }
    .btn-pdf { background: #ef4444; color: #fff; margin-top: 10px; }

    /* Large Universal Responsive Table Design */
    .table-container {
      width: 100%;
      margin-top: 15px;
      background: var(--card-bg);
      border-radius: 10px;
      border: 1px solid var(--border);
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }
    th, td {
      padding: 14px 4px;
      border: 1px solid var(--border);
      text-align: center;
      vertical-align: middle;
      word-wrap: break-word;
    }
    th { 
      background: #081023; 
      color: var(--accent); 
      font-size: 18px; 
      font-weight: 900; 
    }

    .glass-size-text {
      font-size: 20px !important;
      font-weight: 900 !important;
      color: #facc15 !important;
      text-shadow: 0px 0px 1px #000;
      line-height: 1.3;
    }

    .sn-text {
      font-size: 18px !important;
      font-weight: 900 !important;
      color: #ffffff;
    }

    .table-select {
      width: 100%;
      padding: 8px 2px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      color: #fff;
      border-radius: 6px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      outline: none;
      text-align: center;
      text-align-last: center;
    }

    /* LARGE PRINT & MULTI-PAGE SUPPORT */
    @media print {
      @page {
        margin: 10mm;
        size: A4 portrait;
      }
      html, body {
        height: auto !important;
        margin: 0 !important;
        padding: 0 !important;
        background: #ffffff !important;
        color: #000000 !important;
        overflow: visible !important;
      }
      
      .main-container {
        max-width: 100% !important;
        width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
      }

      .print-wrapper {
        border: 3px solid #000000 !important;
        padding: 15px !important;
        margin: 0 !important;
        box-sizing: border-box !important;
      }

      .header-card {
        background: transparent !important;
        border: none !important;
        border-bottom: 3px solid #000000 !important;
        border-radius: 0 !important;
        padding: 0 0 10px 0 !important;
        margin-bottom: 15px !important;
      }
      .menu-btn, .header-top span {
        display: none !important;
      }
      .editable-input {
        color: #000000 !important;
        border: none !important;
        font-weight: 900 !important;
        margin-bottom: 4px !important;
        padding: 0 !important;
      }
      .editable-input.title {
        font-size: 28px !important;
      }
      .editable-input {
        font-size: 20px !important;
      }

      #windowsContainer, .btn-add, .btn, .sidebar, .delete-row-btn {
        display: none !important;
      }

      #resultContainer {
        display: block !important;
        background: transparent !important;
        border: none !important;
        margin-top: 0 !important;
        padding: 0 !important;
      }
      .table-container {
        border: none !important;
        margin: 0 !important;
      }
      table {
        border: 2.5px solid #000000 !important;
        width: 100% !important;
        page-break-inside: auto;
      }
      tr {
        page-break-inside: avoid;
        page-break-after: auto;
      }
      th {
        background: #e2e8f0 !important;
        color: #000000 !important;
        border: 2px solid #000000 !important;
        font-weight: 900 !important;
        font-size: 20px !important;
        padding: 12px 4px !important;
      }
      td {
        border: 2px solid #000000 !important;
        color: #000000 !important;
        font-weight: 900 !important;
        font-size: 20px !important;
        padding: 16px 4px !important; /* উঁচু প্যাডিং যেন ঘরগুলো বড় দেখায় */
      }
      .glass-size-text {
        color: #000000 !important;
        font-size: 22px !important; /* ইঞ্চি ও সুতার লেখা অনেক বড় */
        font-weight: 900 !important;
      }
      .sn-text {
        color: #000000 !important;
        font-size: 20px !important;
        font-weight: 900 !important;
      }
      .table-select {
        background: transparent !important;
        border: none !important;
        color: #000000 !important;
        font-size: 19px !important;
        font-weight: 900 !important;
        appearance: none;
        -webkit-appearance: none;
        text-align-last: center;
        padding: 0 !important;
      }
      .btn-whatsapp, .btn-pdf {
        display: none !important;
      }
    }
  </style>
</head>
<body>

  <div class="main-container">
    <div class="print-wrapper">
      <!-- History Sidebar -->
      <div id="sidebar" class="sidebar">
        <span class="close-btn" onclick="toggleHistory()">✕ বন্ধ করুন</span>
        <h3 style="color: var(--accent); margin-top: 0;">সম্পূর্ণ হিস্টরি</h3>
        <hr style="border-color: var(--border);">
        <div id="historyContent">কোনো হিস্টরি পাওয়া যায়নি।</div>
      </div>

      <!-- Header Section -->
      <div class="header-card">
        <div class="header-top">
          <button class="menu-btn" onclick="toggleHistory()">☰</button>
          <span style="color: var(--accent); font-weight: bold; font-size: 18px;">গ্লাস কাটিং সাইজ</span>
        </div>
        <input type="text" id="shopName" class="editable-input title" value="আর এম থাই অ্যালুমিনিয়াম" placeholder="দোকানের নাম">
        <input type="text" id="shopPhone" class="editable-input" value="মোবাইল: 01676474412" placeholder="মোবাইল নম্বর">
      </div>

      <!-- Dynamic Input Windows -->
      <div id="windowsContainer">
        <div class="window-row">
          <input type="number" class="mm-h" placeholder="হাইট (mm)">
          <input type="number" class="mm-w" placeholder="চওড়া (mm)">
          <button class="delete-row-btn" onclick="removeWindow(this)">✕</button>
        </div>
      </div>

      <button class="btn btn-add" onclick="addWindow()">+ আরও উইন্ডো যোগ করুন</button>
      <button class="btn" onclick="calculateGlass()">গ্লাস কাটিং সাইজ বের করুন</button>

      <!-- Results Table -->
      <div class="table-container" id="resultContainer" style="display:none;">
        <table>
          <thead>
            <tr>
              <th style="width: 8%;">নং</th>
              <th style="width: 42%;">গ্লাসের সাইজ (ইঞ্চি)</th>
              <th style="width: 16%;">মিলি</th>
              <th style="width: 22%;">কালার</th>
              <th style="width: 12%;">পিস</th>
            </tr>
          </thead>
          <tbody id="glassTableBody"></tbody>
        </table>

        <div style="padding: 10px;">
          <button class="btn btn-whatsapp" onclick="sendWhatsApp()">WhatsApp-এ পাঠান</button>
          <button class="btn btn-pdf" onclick="downloadPDF()">PDF ডাউনলোড / প্রিন্ট</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    function toggleHistory() {
      document.getElementById("sidebar").classList.toggle("active");
    }

    function addWindow() {
      const container = document.getElementById("windowsContainer");
      const div = document.createElement("div");
      div.className = "window-row";
      div.innerHTML = `
        <input type="number" class="mm-h" placeholder="হাইট (mm)">
        <input type="number" class="mm-w" placeholder="চওড়া (mm)">
        <button class="delete-row-btn" onclick="removeWindow(this)">✕</button>
      `;
      container.appendChild(div);
    }

    function removeWindow(button) {
      const rows = document.querySelectorAll("#windowsContainer .window-row");
      if (rows.length > 1) {
        button.parentElement.remove();
      } else {
        alert("কমপক্ষে একটি উইন্ডো থাকা আবশ্যক!");
      }
    }

    function mmToInchSuta(mm) {
      let totalInches = mm / 25.4;
      let inches = Math.floor(totalInches);
      let fraction = totalInches - inches;
      let suta = Math.round(fraction * 8);

      if (suta === 8) {
        inches += 1;
        suta = 0;
      }
      return suta > 0 ? `${inches}" ${suta} সুতা` : `${inches}"`;
    }

    function getQtyOptions(selectedQty = 2) {
      let options = "";
      for (let i = 1; i <= 100; i++) {
        options += `<option value="${i}" ${i === parseInt(selectedQty) ? 'selected' : ''}>${i}</option>`;
      }
      return options;
    }

    function getMmOptions(selectedMm = "5.5mm") {
      const mms = ["5mm", "5.5mm", "6mm", "8mm", "10mm", "12mm", "15mm"];
      return mms.map(mm => `<option value="${mm}" ${mm === selectedMm ? 'selected' : ''}>${mm}</option>`).join('');
    }

    function getColorOptions(selectedColor = "Navy Blue Markeri") {
      const colors = [
        "Clear", "Navy Blue Markeri", "Navy Blue Normal", 
        "Green Markeri", "Green Normal", "Lake Blue Markeri", 
        "Lake Blue Normal", "Dark Grey Normal", "Light Bronze Normal"
      ];
      return colors.map(c => `<option value="${c}" ${c === selectedColor ? 'selected' : ''}>${c}</option>`).join('');
    }

    function calculateGlass() {
      const heights = document.querySelectorAll(".mm-h");
      const widths = document.querySelectorAll(".mm-w");
      const tbody = document.getElementById("glassTableBody");
      tbody.innerHTML = "";

      let historyItems = [];
      let serialNumber = 1;

      heights.forEach((hInput, index) => {
        let hVal = parseFloat(hInput.value);
        let wVal = parseFloat(widths[index].value);

        if (hVal && wVal) {
          let finalH_mm = hVal - 107;
          let finalW_mm = (wVal - 123) / 2;

          let hFormatted = mmToInchSuta(finalH_mm);
          let wFormatted = mmToInchSuta(finalW_mm);

          let finalSizeText = `${hFormatted} × ${wFormatted}`;

          let tr = document.createElement("tr");
          tr.innerHTML = `
            <td class="sn-text">${serialNumber}</td>
            <td class="glass-size-text">${finalSizeText}</td>
            <td>
              <select class="table-select">${getMmOptions("5.5mm")}</select>
            </td>
            <td>
              <select class="table-select">${getColorOptions("Navy Blue Markeri")}</select>
            </td>
            <td>
              <select class="table-select">${getQtyOptions(2)}</select>
            </td>
          `;
          tbody.appendChild(tr);

          historyItems.push({
            sn: serialNumber,
            size: finalSizeText,
            mm: "5.5mm",
            color: "Navy Blue Markeri",
            qty: 2
          });

          serialNumber++;
        }
      });

      if (tbody.children.length > 0) {
        document.getElementById("resultContainer").style.display = "block";
        saveHistory(historyItems);
      }
    }

    function saveHistory(items) {
      let existing = JSON.parse(localStorage.getItem("glassHistory") || "[]");
      let newEntry = {
        id: Date.now(),
        date: new Date().toLocaleTimeString('bn-BD', { hour: '2-digit', minute: '2-digit' }) + ', ' + new Date().toLocaleDateString('bn-BD'),
        items: items
      };
      existing.unshift(newEntry);
      localStorage.setItem("glassHistory", JSON.stringify(existing));
      renderHistory();
    }

    function renderHistory() {
      let existing = JSON.parse(localStorage.getItem("glassHistory") || "[]");
      let historyContent = document.getElementById("historyContent");
      
      if(existing.length === 0) {
        historyContent.innerHTML = "<div style='color: #94a3b8; text-align: center; margin-top: 20px;'>কোনো হিস্টরি পাওয়া যায়নি।</div>";
        return;
      }
      
      let html = `<button class="clear-all-btn" onclick="clearAllHistory()">সব হিস্টরি মুছুন</button>`;
      
      existing.forEach((entry) => {
        let itemListHtml = entry.items.map(item => 
          `<li>#${item.sn || 1}: ${item.size} (${item.mm}, ${item.qty} পিস)</li>`
        ).join('');

        html += `
          <div class="history-card">
            <div class="history-header">
              <span class="history-date">${entry.date}</span>
              <div class="history-actions">
                <button class="history-btn btn-reopen" onclick="reopenHistory(${entry.id})" title="পুনরায় খুলুন">📂 খুলুন</button>
                <button class="history-btn btn-delete-item" onclick="deleteHistoryItem(${entry.id})" title="মুছে ফেলুন">🗑️</button>
              </div>
            </div>
            <ul style="padding-left: 18px; margin: 5px 0; color: #cbd5e1; font-size: 13px; cursor: pointer;" onclick="reopenHistory(${entry.id})">
              ${itemListHtml}
            </ul>
          </div>
        `;
      });

      historyContent.innerHTML = html;
    }

    function deleteHistoryItem(id) {
      let existing = JSON.parse(localStorage.getItem("glassHistory") || "[]");
      let updated = existing.filter(item => item.id !== id);
      localStorage.setItem("glassHistory", JSON.stringify(updated));
      renderHistory();
    }

    function clearAllHistory() {
      if(confirm("আপনি কি সব হিস্টরি মুছে ফেলতে চান?")) {
        localStorage.removeItem("glassHistory");
        renderHistory();
      }
    }

    function reopenHistory(id) {
      let existing = JSON.parse(localStorage.getItem("glassHistory") || "[]");
      let selectedEntry = existing.find(item => item.id === id);

      if (selectedEntry) {
        const tbody = document.getElementById("glassTableBody");
        tbody.innerHTML = "";

        selectedEntry.items.forEach((item, index) => {
          let tr = document.createElement("tr");
          tr.innerHTML = `
            <td class="sn-text">${item.sn || (index + 1)}</td>
            <td class="glass-size-text">${item.size}</td>
            <td><select class="table-select">${getMmOptions(item.mm)}</select></td>
            <td><select class="table-select">${getColorOptions(item.color)}</select></td>
            <td><select class="table-select">${getQtyOptions(item.qty)}</select></td>
          `;
          tbody.appendChild(tr);
        });

        document.getElementById("resultContainer").style.display = "block";
        toggleHistory();
      }
    }

    function sendWhatsApp() {
      let shopName = document.getElementById("shopName").value;
      let shopPhone = document.getElementById("shopPhone").value;
      
      let message = `*${shopName}*\n${shopPhone}\n---------------------------\n*গ্লাস কাটিং লিস্ট:*\n\n`;
      
      let rows = document.querySelectorAll("#glassTableBody tr");
      rows.forEach((row) => {
        let sn = row.cells[0].innerText;
        let size = row.cells[1].innerText;
        let mm = row.cells[2].querySelector("select").value;
        let color = row.cells[3].querySelector("select").value;
        let qty = row.cells[4].querySelector("select").value;
        
        message += `${sn}. সাইজ: ${size}\n   মিলি: ${mm} | কালার: ${color} | পিস: ${qty}\n\n`;
      });

      let encodedMsg = encodeURIComponent(message);
      window.open(`https://wa.me/?text=${encodedMsg}`, '_blank');
    }

    function downloadPDF() {
      window.print();
    }

    renderHistory();
  </script>
</body>
</html>

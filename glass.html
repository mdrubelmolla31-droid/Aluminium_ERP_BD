<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>গ্লাস কাটিং ক্যালকুলেটর</title>
  <style>
    :root {
      --bg-color: #0b1329;
      --card-bg: #131e3a;
      --accent: #38bdf8;
      --text: #ffffff;
      --border: #1e2d52;
      --input-bg: #091024;
    }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 12px;
      box-sizing: border-box;
    }
    .header-card {
      background: var(--card-bg);
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 15px;
      border: 1px solid var(--border);
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .menu-btn {
      font-size: 26px;
      background: none;
      border: none;
      color: var(--accent);
      cursor: pointer;
      padding: 0;
    }
    .editable-input {
      background: transparent;
      border: none;
      border-bottom: 1px dashed var(--accent);
      color: var(--text);
      font-size: 16px;
      width: 100%;
      margin-bottom: 8px;
      outline: none;
    }
    .editable-input.title {
      font-size: 20px;
      font-weight: bold;
      color: var(--accent);
    }
    
    /* History Sidebar */
    .sidebar {
      position: fixed;
      top: 0; left: -300px;
      width: 280px; height: 100%;
      background: #060b17;
      border-right: 1px solid var(--border);
      transition: 0.3s;
      padding: 15px;
      z-index: 1000;
      overflow-y: auto;
      box-sizing: border-box;
    }
    .sidebar.active { left: 0; }
    .close-btn { color: #ef4444; float: right; font-size: 20px; cursor: pointer; font-weight: bold; }
    
    /* Input Section */
    .window-row {
      background: var(--card-bg);
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 10px;
      display: flex;
      gap: 10px;
      border: 1px solid var(--border);
    }
    .window-row input {
      width: 50%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--input-bg);
      color: #fff;
      font-size: 16px;
      text-align: center;
      box-sizing: border-box;
      outline: none;
    }

    /* Action Buttons */
    .btn {
      background: var(--accent);
      color: #0b1329;
      border: none;
      padding: 14px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
      font-size: 16px;
    }
    .btn-add { background: #22c55e; color: #fff; }
    .btn-whatsapp { background: #25D366; color: #fff; margin-top: 15px; }
    .btn-pdf { background: #ef4444; color: #fff; margin-top: 10px; }

    /* Table Design */
    .table-container {
      width: 100%;
      margin-top: 15px;
      background: var(--card-bg);
      border-radius: 10px;
      border: 1px solid var(--border);
      overflow: hidden;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }
    th, td {
      padding: 8px 4px;
      border: 1px solid var(--border);
      text-align: center;
      word-wrap: break-word;
    }
    th { background: #081023; color: var(--accent); font-size: 13px; font-weight: 600; }

    /* গ্লাসের মূল মাপে বড় ও স্পষ্ট ফন্ট */
    .glass-size-text {
      font-size: 17px !important;
      font-weight: 800 !important;
      color: #facc15 !important;
      text-shadow: 0px 0px 1px #000;
      line-height: 1.3;
    }

    /* Dropdown Styling */
    .table-select {
      width: 100%;
      padding: 6px 0px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      color: #fff;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      outline: none;
    }

    /* ==========================================
       PRINT / PDF DESIGN (প্রিন্টের জন্য বিশেষ স্টাইল)
       ========================================== */
    @media print {
      body {
        background-color: #ffffff !important;
        color: #000000 !important;
        padding: 0 !important;
      }
      /* হেডারকে মেমোর মতো রূপ দেওয়া */
      .header-card {
        background: transparent !important;
        border: none !important;
        border-bottom: 2px solid #000 !important;
        border-radius: 0 !important;
        padding: 0 0 10px 0 !important;
        margin-bottom: 20px !important;
      }
      .menu-btn, .header-top span {
        display: none !important; /* ৩-লাইন মেনু প্রিন্টে আসবে না */
      }
      .editable-input {
        color: #000000 !important;
        border: none !important;
        font-weight: bold !important;
      }
      .editable-input.title {
        font-size: 24px !important;
      }

      /* ইনপুট ফিল্ড ও বাটনসমূহ হাইড করে দেওয়া */
      #windowsContainer, .btn-add, .btn, .sidebar {
        display: none !important;
      }

      /* ফলাফল টেবিল সম্পূর্ণ স্পষ্ট করা */
      #resultContainer {
        display: block !important;
        background: transparent !important;
        border: none !important;
      }
      table {
        border: 1px solid #000 !important;
      }
      th {
        background: #f0f0f0 !important;
        color: #000000 !important;
        border: 1px solid #000 !important;
        font-weight: bold !important;
      }
      td {
        border: 1px solid #000 !important;
        color: #000000 !important;
      }
      .glass-size-text {
        color: #000000 !important; /* প্রিন্টে কালো ও স্পষ্ট আসবে */
        font-size: 16px !important;
      }
      .table-select {
        background: transparent !important;
        border: none !important;
        color: #000000 !important;
        font-weight: bold !important;
        appearance: none;
        -webkit-appearance: none;
        text-align-last: center;
      }
      .btn-whatsapp, .btn-pdf {
        display: none !important; /* বাটন প্রিন্টে আসবে না */
      }
    }
  </style>
</head>
<body>

  <!-- History Sidebar -->
  <div id="sidebar" class="sidebar">
    <span class="close-btn" onclick="toggleHistory()">✕ বন্ধ করুন</span>
    <h3 style="color: var(--accent); margin-top: 0;">সম্পূর্ণ হিস্টরি</h3>
    <hr style="border-color: var(--border);">
    <div id="historyContent">কোনো হিস্টরি পাওয়া যায়নি।</div>
  </div>

  <!-- Header Section -->
  <div class="header-card">
    <div class="header-top">
      <button class="menu-btn" onclick="toggleHistory()">☰</button>
      <span style="color: var(--accent); font-weight: bold; font-size: 18px;">গ্লাস কাটিং সাইজ</span>
    </div>
    <input type="text" id="shopName" class="editable-input title" value="মেসার্স গ্লাস অ্যান্ড থাই হাউস" placeholder="দোকানের নাম">
    <input type="text" id="shopPhone" class="editable-input" value="মোবাইল: ০১XXXXXXXXX" placeholder="মোবাইল নম্বর">
  </div>

  <!-- Dynamic Input Windows -->
  <div id="windowsContainer">
    <div class="window-row">
      <input type="number" class="mm-h" placeholder="হাইট (mm)">
      <input type="number" class="mm-w" placeholder="চওড়া (mm)">
    </div>
  </div>

  <button class="btn btn-add" onclick="addWindow()">+ আরও উইন্ডো যোগ করুন</button>
  <button class="btn" onclick="calculateGlass()">গ্লাস কাটিং সাইজ বের করুন</button>

  <!-- Results Table -->
  <div class="table-container" id="resultContainer" style="display:none;">
    <table>
      <thead>
        <tr>
          <th style="width: 38%;">গ্লাসের সাইজ (ইঞ্চি)</th>
          <th style="width: 16%;">মিলি</th>
          <th style="width: 32%;">কালার</th>
          <th style="width: 14%;">পিস</th>
        </tr>
      </thead>
      <tbody id="glassTableBody"></tbody>
    </table>

    <div style="padding: 10px;">
      <button class="btn btn-whatsapp" onclick="sendWhatsApp()">WhatsApp-এ পাঠান</button>
      <button class="btn btn-pdf" onclick="downloadPDF()">PDF ডাউনলোড</button>
    </div>
  </div>

  <script>
    function toggleHistory() {
      document.getElementById("sidebar").classList.toggle("active");
    }

    function addWindow() {
      const container = document.getElementById("windowsContainer");
      const div = document.createElement("div");
      div.className = "window-row";
      div.innerHTML = `
        <input type="number" class="mm-h" placeholder="হাইট (mm)">
        <input type="number" class="mm-w" placeholder="চওড়া (mm)">
      `;
      container.appendChild(div);
    }

    function mmToInchSuta(mm) {
      let totalInches = mm / 25.4;
      let inches = Math.floor(totalInches);
      let fraction = totalInches - inches;
      let suta = Math.round(fraction * 8);

      if (suta === 8) {
        inches += 1;
        suta = 0;
      }
      return suta > 0 ? `${inches}" ${suta} সুতা` : `${inches}"`;
    }

    function getQtyOptions() {
      let options = "";
      for (let i = 1; i <= 100; i++) {
        options += `<option value="${i}" ${i === 2 ? 'selected' : ''}>${i}</option>`;
      }
      return options;
    }

    function calculateGlass() {
      const heights = document.querySelectorAll(".mm-h");
      const widths = document.querySelectorAll(".mm-w");
      const tbody = document.getElementById("glassTableBody");
      tbody.innerHTML = "";

      let historyData = [];

      heights.forEach((hInput, index) => {
        let hVal = parseFloat(hInput.value);
        let wVal = parseFloat(widths[index].value);

        if (hVal && wVal) {
          let finalH_mm = hVal - 107;
          let finalW_mm = (wVal - 125) / 2;

          let hFormatted = mmToInchSuta(finalH_mm);
          let wFormatted = mmToInchSuta(finalW_mm);

          let finalSizeText = `${hFormatted} × ${wFormatted}`;

          let tr = document.createElement("tr");
          tr.innerHTML = `
            <td class="glass-size-text">${finalSizeText}</td>
            <td>
              <select class="table-select">
                <option value="5mm">5mm</option>
                <option value="5.5mm" selected>5.5mm</option>
                <option value="6mm">6mm</option>
                <option value="8mm">8mm</option>
                <option value="10mm">10mm</option>
                <option value="12mm">12mm</option>
                <option value="15mm">15mm</option>
              </select>
            </td>
            <td>
              <select class="table-select">
                <option value="Clear">Clear</option>
                <option value="Navy Blue Marker" selected>Navy Blue Marker</option>
                <option value="Navy Blue Normal">Navy Blue Normal</option>
                <option value="Green Marker">Green Marker</option>
                <option value="Green Normal">Green Normal</option>
                <option value="Lake Blue Marker">Lake Blue Marker</option>
                <option value="Lake Blue Normal">Lake Blue Normal</option>
                <option value="Dark Grey Normal">Dark Grey Normal</option>
                <option value="Light Bronze Normal">Light Bronze Normal</option>
              </select>
            </td>
            <td>
              <select class="table-select">
                ${getQtyOptions()}
              </select>
            </td>
          `;
          tbody.appendChild(tr);

          historyData.push(`উইন্ডো ${index+1}: ${finalSizeText}`);
        }
      });

      if (tbody.children.length > 0) {
        document.getElementById("resultContainer").style.display = "block";
        saveHistory(historyData);
      }
    }

    function saveHistory(data) {
      let existing = JSON.parse(localStorage.getItem("glassHistory") || "[]");
      let newEntry = {
        date: new Date().toLocaleTimeString('bn-BD', { hour: '2-digit', minute: '2-digit' }) + ', ' + new Date().toLocaleDateString('bn-BD'),
        items: data
      };
      existing.unshift(newEntry);
      localStorage.setItem("glassHistory", JSON.stringify(existing));
      renderHistory();
    }

    function renderHistory() {
      let existing = JSON.parse(localStorage.getItem("glassHistory") || "[]");
      let historyContent = document.getElementById("historyContent");
      if(existing.length === 0) return;
      
      let html = "";
      existing.forEach((item) => {
        html += `<div style="border-bottom:1px solid var(--border); padding:8px 0;">
          <small style="color:var(--accent); font-weight:bold;">${item.date}</small>
          <ul style="padding-left:15px; margin:5px 0; color:#cbd5e1;">
            ${item.items.map(i => `<li>${i}</li>`).join('')}
          </ul>
        </div>`;
      });
      historyContent.innerHTML = html;
    }

    // WhatsApp শেয়ার লজিক (দোকানের নাম ও নাম্বারের সাথে স্পষ্ট টেক্সট হিসেবে যাবে)
    function sendWhatsApp() {
      let shopName = document.getElementById("shopName").value;
      let shopPhone = document.getElementById("shopPhone").value;
      
      let message = `*${shopName}*\n${shopPhone}\n---------------------------\n*গ্লাস কাটিং লিস্ট:*\n\n`;
      
      let rows = document.querySelectorAll("#glassTableBody tr");
      rows.forEach((row, i) => {
        let size = row.cells[0].innerText;
        let mm = row.cells[1].querySelector("select").value;
        let color = row.cells[2].querySelector("select").value;
        let qty = row.cells[3].querySelector("select").value;
        
        message += `${i+1}. সাইজ: ${size}\n   মিলি: ${mm} | কালার: ${color} | পিস: ${qty}\n\n`;
      });

      let encodedMsg = encodeURIComponent(message);
      window.open(`https://wa.me/?text=${encodedMsg}`, '_blank');
    }

    function downloadPDF() {
      window.print();
    }

    renderHistory();
  </script>
</body>
</html>

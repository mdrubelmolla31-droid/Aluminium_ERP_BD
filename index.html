<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aluminium ERP BD v2</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="mobile-app">
    <!-- Top Bar -->
    <div class="app-header">
        <div class="menu-icon">☰</div>
        <div class="app-title">Dashboard</div>
        <div class="notification-icon">🔔</div>
    </div>

    <!-- Welcome Banner (Premium Gradient) -->
    <div class="welcome-card">
        <div>
            <h2>Welcome, Admin</h2>
            <p>Aluminium ERP BD v2</p>
        </div>
        <div class="user-avatar">👤</div>
    </div>

    <!-- 2-Column Menu Grid -->
    <div class="menu-grid">
        <div class="card card-company" onclick="location.href='master.html'">
            <div class="card-icon">🏢</div>
            <div class="card-title">Company</div>
        </div>

        <div class="card card-profile" onclick="alert('Profile Coming Soon!')">
            <div class="card-icon">👤</div>
            <div class="card-title">Profile</div>
        </div>

        <div class="card card-customer" onclick="alert('Customer List Coming Soon!')">
            <div class="card-icon">👥</div>
            <div class="card-title">Customer</div>
        </div>

        <div class="card card-stock" onclick="alert('Stock Management Coming Soon!')">
            <div class="card-icon">📦</div>
            <div class="card-title">Stock</div>
        </div>

        <div class="card card-quotation" onclick="location.href='quotation.html'">
            <div class="card-icon">📄</div>
            <div class="card-title">Quotation</div>
        </div>

        <div class="card card-calc" onclick="location.href='calculator.html'">
            <div class="card-icon">🧮</div>
            <div class="card-title">Material Calculator</div>
        </div>
    </div>
</div>

<script src="license.js"></script>
</body>
</html>

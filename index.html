<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aluminium ERP BD v2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        /* Premium Matte Dark Background */
        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            display: flex;
            justify-content: center;
            padding: 12px;
            min-height: 100vh;
        }

        .mobile-app {
            width: 100%;
            max-width: 450px;
            background: #111827;
            border-radius: 28px;
            padding: 22px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            border: 1px solid #1f2937;
        }

        /* Top Bar */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
        }

        .header-title {
            font-size: 20px;
            font-weight: 700;
            color: #f9fafb;
            letter-spacing: 0.5px;
        }

        .icon-btn {
            background: #1f2937;
            border-radius: 12px;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            border: 1px solid #374151;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* Premium Titanium Gold Card */
        .welcome-card {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border-radius: 22px;
            padding: 22px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border: 1px solid #d97706; /* Metallic Gold Border */
            box-shadow: 0 8px 25px rgba(217, 119, 6, 0.15);
        }

        .welcome-card h2 {
            font-size: 22px;
            font-weight: 700;
            color: #fbbf24; /* Gold Accent */
            margin-bottom: 4px;
        }

        .welcome-card p {
            font-size: 13px;
            color: #9ca3af;
        }

        .avatar-box {
            background: rgba(251, 191, 36, 0.15);
            border: 1px solid #fbbf24;
            width: 54px;
            height: 54px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
        }

        /* 2-Column Grid Menu */
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .menu-card {
            background: #1f2937;
            border-radius: 20px;
            padding: 22px 15px;
            text-align: center;
            cursor: pointer;
            border: 1px solid #374151;
            box-shadow: 0 6px 15px rgba(0,0,0,0.3);
            transition: all 0.2s ease;
        }

        .menu-card:active {
            transform: scale(0.95);
            background: #111827;
        }

        .icon-wrapper {
            width: 58px;
            height: 58px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin: 0 auto 12px auto;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .card-label {
            font-size: 15px;
            font-weight: 600;
            color: #e5e7eb;
        }

        /* Dark Premium Soft Accents */
        .bg-company { background: rgba(59, 130, 246, 0.15); color: #60a5fa; }
        .bg-profile { background: rgba(168, 85, 247, 0.15); color: #c084fc; }
        .bg-customer { background: rgba(34, 197, 94, 0.15); color: #4ade80; }
        .bg-stock { background: rgba(249, 115, 22, 0.15); color: #fb923c; }
        .bg-quotation { background: rgba(239, 68, 68, 0.15); color: #f87171; }
        .bg-calc { background: rgba(20, 184, 166, 0.15); color: #2dd4bf; }
    </style>
</head>
<body>

<div class="mobile-app">
    <!-- Top Header Bar -->
    <div class="app-header">
        <div class="icon-btn">☰</div>
        <div class="header-title">Dashboard</div>
        <!-- Aluminum Profile Icon instead of Bell -->
        <div class="icon-btn" title="Aluminium Profiles">🏗️</div>
    </div>

    <!-- Welcome Titanium Banner -->
    <div class="welcome-card">
        <div>
            <h2>Welcome, Admin</h2>
            <p>Aluminium ERP BD v2</p>
        </div>
        <div class="avatar-box">👤</div>
    </div>

    <!-- 2-Column Menu Grid -->
    <div class="menu-grid">
        <div class="menu-card" onclick="location.href='master.html'">
            <div class="icon-wrapper bg-company">🏢</div>
            <div class="card-label">Company</div>
        </div>

        <div class="menu-card" onclick="alert('Profile Page Coming Soon!')">
            <div class="icon-wrapper bg-profile">👤</div>
            <div class="card-label">Profile</div>
        </div>

        <div class="menu-card" onclick="alert('Customer Page Coming Soon!')">
            <div class="icon-wrapper bg-customer">👥</div>
            <div class="card-label">Customer</div>
        </div>

        <div class="menu-card" onclick="alert('Stock Page Coming Soon!')">
            <div class="icon-wrapper bg-stock">📦</div>
            <div class="card-label">Stock</div>
        </div>

        <div class="menu-card" onclick="location.href='quotation.html'">
            <div class="icon-wrapper bg-quotation">📄</div>
            <div class="card-label">Quotation</div>
        </div>

        <div class="menu-card" onclick="location.href='calculator.html'">
            <div class="icon-wrapper bg-calc">🧮</div>
            <div class="card-label">Material Calculator</div>
        </div>
    </div>
</div>

<script src="license.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aluminium ERP BD v2 Pro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            display: flex;
            justify-content: center;
            padding: 12px;
            min-height: 100vh;
        }

        .mobile-app {
            width: 100%;
            max-width: 450px;
            background: #111827;
            border-radius: 28px;
            padding: 22px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            border: 1px solid #1f2937;
            position: relative;
        }

        /* Top Bar */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
        }

        .header-title {
            font-size: 20px;
            font-weight: 700;
            color: #f9fafb;
        }

        .icon-btn {
            background: #1f2937;
            border-radius: 12px;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            border: 1px solid #374151;
            user-select: none;
        }

        /* Welcome Banner */
        .welcome-card {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border-radius: 22px;
            padding: 22px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border: 1px solid #d97706;
            box-shadow: 0 8px 25px rgba(217, 119, 6, 0.15);
        }

        .welcome-card h2 {
            font-size: 20px;
            font-weight: 700;
            color: #fbbf24;
            margin-bottom: 4px;
        }

        .welcome-card p {
            font-size: 13px;
            color: #9ca3af;
        }

        .avatar-box {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            border: 2px solid #fbbf24;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            overflow: hidden;
            background: rgba(251, 191, 36, 0.15);
            cursor: pointer;
        }

        .avatar-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .license-status {
            font-size: 11px;
            background: rgba(34, 197, 94, 0.2);
            color: #4ade80;
            padding: 4px 8px;
            border-radius: 6px;
            display: inline-block;
            margin-top: 6px;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        /* Grid Menu */
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .menu-card {
            background: #1f2937;
            border-radius: 20px;
            padding: 22px 15px;
            text-align: center;
            cursor: pointer;
            border: 1px solid #374151;
            box-shadow: 0 6px 15px rgba(0,0,0,0.3);
            transition: all 0.2s ease;
        }

        .menu-card:active {
            transform: scale(0.95);
        }

        .icon-wrapper {
            width: 58px;
            height: 58px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin: 0 auto 12px auto;
        }

        .card-label {
            font-size: 15px;
            font-weight: 600;
            color: #e5e7eb;
        }

        .bg-company { background: rgba(59, 130, 246, 0.15); color: #60a5fa; }
        .bg-profile { background: rgba(168, 85, 247, 0.15); color: #c084fc; }
        .bg-customer { background: rgba(34, 197, 94, 0.15); color: #4ade80; }
        .bg-stock { background: rgba(249, 115, 22, 0.15); color: #fb923c; }
        .bg-quotation { background: rgba(239, 68, 68, 0.15); color: #f87171; }
        .bg-calc { background: rgba(20, 184, 166, 0.15); color: #2dd4bf; }

        /* Modal Design */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(6px);
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-card {
            background: #111827;
            border: 1px solid #d97706;
            padding: 26px;
            border-radius: 24px;
            width: 100%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .modal-card h3 {
            color: #fbbf24;
            margin-bottom: 10px;
            font-size: 18px;
        }

        .modal-card p {
            font-size: 13px;
            color: #9ca3af;
            margin-bottom: 16px;
        }

        .modal-card input[type="password"],
        .modal-card input[type="text"] {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid #374151;
            background: #1f2937;
            color: white;
            font-size: 16px;
            margin-bottom: 16px;
            outline: none;
            text-align: center;
        }

        .btn-primary {
            background: #d97706;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            width: 100%;
        }

        .btn-whatsapp {
            background: #25D366;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
        }

        .btn-cancel {
            background: transparent;
            color: #9ca3af;
            border: none;
            margin-top: 12px;
            cursor: pointer;
            font-size: 13px;
        }
    </style>
</head>
<body>

<div class="mobile-app">
    <!-- Top Bar -->
    <div class="app-header">
        <div class="icon-btn">☰</div>
        <div class="header-title">Dashboard</div>
        <!-- 5 Taps for Hidden Master Key Input -->
        <div class="icon-btn" id="lockIconBtn" onclick="handleLockTap()" title="Tap 5 times for Master Key">🔒</div>
    </div>

    <!-- Welcome Banner -->
    <div class="welcome-card">
        <div>
            <h2 id="userNameDisplay">Welcome, User</h2>
            <p>Aluminium ERP BD v2</p>
            <span class="license-status" id="licenseBadge">✓ Active License</span>
        </div>
        <div class="avatar-box" id="avatarDisplay" onclick="openProfileModal()">👤</div>
    </div>

    <!-- 2-Column Menu Grid -->
    <div class="menu-grid">
        <div class="menu-card" onclick="location.href='master.html'">
            <div class="icon-wrapper bg-company">🏢</div>
            <div class="card-label">Company</div>
        </div>
        <div class="menu-card" onclick="openProfileModal()">
            <div class="icon-wrapper bg-profile">👤</div>
            <div class="card-label">Profile</div>
        </div>
        <div class="menu-card" onclick="alert('Customer Feature Ready!')">
            <div class="icon-wrapper bg-customer">👥</div>
            <div class="card-label">Customer</div>
        </div>
        <div class="menu-card" onclick="alert('Stock Feature Ready!')">
            <div class="icon-wrapper bg-stock">📦</div>
            <div class="card-label">Stock</div>
        </div>
        <div class="menu-card" onclick="location.href='quotation.html'">
            <div class="icon-wrapper bg-quotation">📄</div>
            <div class="card-label">Quotation</div>
        </div>
        <div class="menu-card" onclick="location.href='calculator.html'">
            <div class="icon-wrapper bg-calc">🧮</div>
            <div class="card-label">Material Calculator</div>
        </div>
    </div>
</div>

<!-- Master Key / License Activation Modal -->
<div class="modal-overlay" id="masterKeyModal">
    <div class="modal-card">
        <h3>🔑 Activation / Master Access</h3>
        <p>লাইসেন্স কি অথবা মাস্টার কি ম্যানুয়ালি টাইপ করুন।</p>
        <input type="password" id="masterKeyInput" placeholder="Enter Key Here" autocomplete="off">
        
        <button class="btn-primary" onclick="verifyMasterKey()">Submit Key</button>
        
        <!-- Direct WhatsApp Connect Button -->
        <a href="https://wa.me/8801676474412?text=Hello,%20I%20need%20a%20License%20Key%20for%20Aluminium%20ERP%20Software." target="_blank" class="btn-whatsapp">
            💬 Get License Key via WhatsApp
        </a>

        <button class="btn-cancel" onclick="closeMasterModal()">Close</button>
    </div>
</div>

<!-- Edit Profile Modal -->
<div class="modal-overlay" id="profileModal">
    <div class="modal-card">
        <h3>✏️ এডিট প্রোফাইল</h3>
        <input type="text" id="usernameInput" placeholder="আপনার নাম লিখুন">
        <button class="btn-primary" onclick="saveProfile()">Save Profile</button>
        <button class="btn-cancel" onclick="closeProfileModal()">Cancel</button>
    </div>
</div>

<script src="license.js"></script>
<script>
    let tapCount = 0;
    let tapTimer = null;

    // 5-Tap Hidden Logic
    function handleLockTap() {
        tapCount++;
        clearTimeout(tapTimer);

        if (tapCount >= 5) {
            tapCount = 0;
            openMasterModal();
        } else {
            tapTimer = setTimeout(() => {
                tapCount = 0;
            }, 1500);
        }
    }

    function openMasterModal() {
        // Strict Rule: Never auto-fill input box
        document.getElementById("masterKeyInput").value = "";
        document.getElementById("masterKeyModal").style.display = "flex";
    }

    function closeMasterModal() {
        document.getElementById("masterKeyModal").style.display = "none";
    }

    function verifyMasterKey() {
        let inputKey = document.getElementById("masterKeyInput").value.trim();
        
        // Custom Master Key Check
        if (inputKey === "mdrubelmolla1989") {
            alert("✅ Master Access Granted!");
            localStorage.setItem("erp_unlocked", "true");
            closeMasterModal();
        } else {
            alert("❌ ভুল কি! সঠিক মাস্টার কি বা লাইসেন্স কি টাইপ করুন।");
        }
    }

    function openProfileModal() {
        document.getElementById("profileModal").style.display = "flex";
    }

    function closeProfileModal() {
        document.getElementById("profileModal").style.display = "none";
    }

    function saveProfile() {
        let name = document.getElementById("usernameInput").value.trim();
        if (name) {
            localStorage.setItem("erp_user_name", name);
            document.getElementById("userNameDisplay").innerText = "Welcome, " + name;
        }
        closeProfileModal();
    }

    document.addEventListener("DOMContentLoaded", () => {
        let savedName = localStorage.getItem("erp_user_name");
        if (savedName) document.getElementById("userNameDisplay").innerText = "Welcome, " + savedName;
    });
</script>
</body>
</html>

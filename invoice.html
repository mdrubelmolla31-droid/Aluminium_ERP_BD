<style>

/* =========================================
   RESET
========================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    background: #eef2f7;
    color: #111827;
    font-weight: 700;
    padding: 20px;
}


/* =========================================
   MAIN CONTAINER
========================================= */

.container {
    width: 100%;
    max-width: 900px;
    margin: auto;
    background: #ffffff;
    min-height: 1120px;
    padding: 0 45px 35px 45px;
    box-shadow: 0 5px 25px rgba(0,0,0,0.12);
    overflow: hidden;
}


/* =========================================
   TOP BAR
========================================= */

.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    margin-bottom: 5px;
}

.back-btn {
    background: #111827;
    color: white;
    text-decoration: none;
    padding: 7px 12px;
    border-radius: 5px;
    font-size: 12px;
}


/* =========================================
   BLUE WAVE HEADER
========================================= */

.invoice-header {
    position: relative;
    margin-left: -45px;
    margin-right: -45px;
    margin-bottom: 35px;

    min-height: 250px;

    background: linear-gradient(
        135deg,
        #07549b 0%,
        #0b65b8 45%,
        #063b78 100%
    );

    color: white;
    padding: 50px 55px 90px 55px;

    overflow: hidden;
}


/* বড় নিচের সাদা Wave */

.invoice-header::after {

    content: "";

    position: absolute;

    left: -5%;
    right: -5%;
    bottom: -115px;

    height: 180px;

    background: #ffffff;

    border-radius: 50% 50% 0 0 / 45% 45% 0 0;

    transform: rotate(-2deg);

}


/* উপরের হালকা Wave */

.invoice-header::before {

    content: "";

    position: absolute;

    width: 75%;
    height: 55px;

    left: -5%;
    top: -28px;

    background: rgba(255,255,255,0.15);

    border-radius: 50%;

    transform: rotate(-7deg);

}


/* =========================================
   HEADER TITLE
========================================= */

.header-main {
    position: relative;
    z-index: 5;

    display: flex;
    justify-content: space-between;
    align-items: flex-start;
}

.invoice-title {

    font-size: 48px;
    letter-spacing: 2px;
    font-weight: 900;
    color: white;
}

.invoice-number {

    font-size: 17px;
    font-weight: 900;
    padding-top: 15px;
    white-space: nowrap;
}


/* =========================================
   SHOP INFORMATION
========================================= */

.shop-information {

    position: relative;
    z-index: 5;

    margin-top: 25px;

    display: flex;
    justify-content: space-between;

    gap: 30px;
}

.shop-left,
.shop-right {

    width: 48%;
}

.shop-right {
    text-align: right;
}

.shop-name {

    display: inline-block;

    background: white;
    color: #07549b;

    padding: 7px 12px;

    border-radius: 5px;

    font-size: 20px;
    font-weight: 900;

    margin-bottom: 7px;
}

.shop-slogan {

    font-size: 11px;
    line-height: 1.5;
    color: #ffffff;
}

.shop-details {

    margin-top: 8px;

    font-size: 11px;
    line-height: 1.6;
}

.shop-details input {

    background: transparent;
    color: white;

    border: none;
    border-bottom: 1px dashed rgba(255,255,255,0.7);

    outline: none;

    font-size: 11px;
    font-weight: 700;

    text-align: center;
}


/* =========================================
   BILL TO / FROM
========================================= */

.bill-info {

    display: flex;
    justify-content: space-between;

    gap: 50px;

    margin-bottom: 20px;
}

.bill-to,
.bill-from {

    width: 50%;
}

.bill-from {
    text-align: right;
}

.bill-heading {

    font-size: 22px;
    color: #07549b;

    margin-bottom: 8px;

    font-weight: 900;
}

.bill-info input {

    width: 100%;

    border: none;
    border-bottom: 1px solid #cbd5e1;

    padding: 4px 0;

    font-size: 13px;
    font-weight: 700;

    outline: none;

    background: transparent;
}

.bill-from input {
    text-align: right;
}


/* =========================================
   DATE / BILL NUMBER
========================================= */

.date-row {

    display: flex;
    justify-content: space-between;

    margin-bottom: 20px;

    font-size: 13px;
}

.date-row label {
    color: #374151;
}

.date-row input {

    border: none;
    border-bottom: 1px solid #cbd5e1;

    outline: none;

    font-size: 13px;
    font-weight: 700;

    padding: 3px;

    width: 130px;
}


/* =========================================
   INVOICE TABLE
========================================= */

.table-responsive {

    width: 100%;
    overflow-x: auto;

    margin-top: 10px;
}

.invoice-table {

    width: 100%;

    border-collapse: collapse;

    table-layout: fixed;

    font-size: 12px;
}

.invoice-table th {

    background: #07549b;

    color: white;

    border: 1px solid #07549b;

    padding: 10px 5px;

    font-size: 12px;

    font-weight: 900;
}

.invoice-table td {

    border: 1px solid #b7bec8;

    padding: 6px 5px;

    text-align: center;

    height: 45px;

    font-weight: 700;

    vertical-align: middle;
}

.invoice-table td:nth-child(2) {

    text-align: left;

}

.invoice-table input {

    width: 100%;

    border: none;

    outline: none;

    background: transparent;

    text-align: center;

    font-size: 12px;

    font-weight: 700;

    color: #111827;
}

.invoice-table textarea {

    width: 100%;

    border: none;

    outline: none;

    resize: vertical;

    background: transparent;

    font-size: 12px;

    font-weight: 700;

    color: #111827;

    min-height: 32px;

    text-align: left;
}


/* =========================================
   COLUMN WIDTH
========================================= */

.invoice-table th:nth-child(1) {
    width: 7%;
}

.invoice-table th:nth-child(2) {
    width: 39%;
}

.invoice-table th:nth-child(3) {
    width: 10%;
}

.invoice-table th:nth-child(4) {
    width: 12%;
}

.invoice-table th:nth-child(5) {
    width: 14%;
}

.invoice-table th:nth-child(6) {
    width: 12%;
}

.invoice-table th:nth-child(7) {
    width: 6%;
}


/* =========================================
   TOTAL BOX
========================================= */

.total-section {

    display: flex;

    justify-content: flex-end;

    margin-top: 25px;
}

.total-box {

    width: 55%;

    background: #07549b;

    color: white;

    padding: 11px 18px;

    display: flex;

    justify-content: space-between;

    align-items: center;

    font-size: 15px;

    font-weight: 900;
}

.total-box input {

    width: 130px;

    outline: none;

    background: transparent;

    color: white;

    text-align: right;

    font-size: 16px;

    font-weight: 900;
}


/* =========================================
   NOTE
========================================= */

.in-words {

    line-height: 2;
}

.in-words strong {

}

/* =========================================

========================================= */

.bottom-section {

.payment-info {

.thank-you {

/* =========================================
   SIGNATURE
========================================= */

.signature-box {

.sig-line {

/* =========================================
   BUTTONS
========================================= */

.btn-container {

    max-width: 900px;

    margin: 15px auto;

    display: flex;

    justify-content: center;

    gap: 10px;
}

.btn {

.btn-add {

.btn-whatsapp {

}

.btn-del {

    background: #dc2626;

    color: white;

    border: none;

    font-weight: 900;

    cursor: pointer;
}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 650px) {

    body {
        padding: 0;
        background: white;
    }

    .container {
        padding: 0 15px 25px 15px;
        box-shadow: none;
        min-height: auto;
    }

    .top-bar {
        padding: 8px 0;
    }

    .invoice-header {
        margin-left: -15px;
        margin-right: -15px;

        padding: 35px 20px 80px 20px;

        min-height: 220px;
    }

    .invoice-title {
        font-size: 34px;
    }

    .invoice-number {
        font-size: 12px;
        padding-top: 10px;
    }

    .shop-information {
        gap: 10px;
    }

    .shop-name {
        font-size: 15px;
    }

    .shop-slogan {
        font-size: 8px;
    }

    .shop-details {
        font-size: 8px;
    }

    .shop-details input {
        font-size: 8px;
    }

    .bill-info {
        gap: 15px;
    }

    .bill-heading {
        font-size: 17px;
    }

    .bill-info input {
        font-size: 10px;
    }

    .date-row {
        font-size: 11px;
    }

    .date-row input {
        font-size: 11px;
    }

    .invoice-table {
        min-width: 650px;
    }

    .table-responsive {
        overflow-x: auto;
    }

    .total-box {
        width: 70%;
        font-size: 12px;
    }

    .total-box input {
        font-size: 13px;
        width: 90px;
    }

    .bottom-section {
        flex-direction: column;
        align-items: stretch;
    }

    .payment-info,
    .thank-you {
        width: 100%;
    }

    .thank-you {
        font-size: 30px;
        text-align: right;
    }

    .in-words {
        width: 100%;
    }

    .signature-box {
        margin-top: 40px;
    }

}


/* =========================================
   PRINT / A4 PDF
========================================= */

@media print {

    .invoice-table th {

        print-color-adjust: exact;
    }

    .total-box {
        background: #07549b !important;

        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
    }

    input,
    textarea {
        border: none !important;
        background: transparent !important;
        box-shadow: none !important;
    }

}

    document.getElementById('billDate').value =

    */

    addInvoiceRow();

});

/* =========================================
   ADD INVOICE ROW
========================================= */

function addInvoiceRow() {

    let tbody =
        document.getElementById(
            'invoiceTableBody'
        );


    let rowCount =
        tbody.rows.length + 1;


    let tr =
        document.createElement('tr');


    tr.innerHTML = `

        <td>
            ${
                rowCount < 10
                ? '0' + rowCount
                : rowCount
            }
        </td>


        <td>

            <textarea
                placeholder="কাজের বিবরণ..."
            ></textarea>

        </td>


        <td>

            <input
                type="number"
                class="item-qty"
                value="1"
                placeholder="0"
                oninput="calculateRow(this)"
            >

        </td>


        <td>

            <input
                type="text"
                class="item-unit"
                value="sft"
                placeholder="Unit"
            >

        </td>


        <td>

            <input
                type="number"
                class="item-rate"
                placeholder="0"
                oninput="calculateRow(this)"
            >

        </td>


        <td>

            <input
                type="number"
                class="item-amount"
                placeholder="0"
                readonly
            >

        </td>


        <td class="no-print">

            <button
                class="btn-del"
                type="button"
                onclick="removeInvoiceRow(this)"
            >
                X
            </button>

        </td>

    `;


    tbody.appendChild(tr);


    updateRowIndices();

}


/* =========================================
   REMOVE ROW
========================================= */

function removeInvoiceRow(btn) {

    let tbody =
        document.getElementById(
            'invoiceTableBody'
        );


    if (tbody.rows.length > 1) {

        btn.closest('tr').remove();

        updateRowIndices();

        calculateGrandTotal();

    }

    else {

        alert(
            "কমপক্ষে একটি রো থাকতে হবে!"
        );

    }

}


/* =========================================
   UPDATE SERIAL
========================================= */

function updateRowIndices() {

    let rows =
        document.querySelectorAll(
            '#invoiceTableBody tr'
        );


    rows.forEach(function(row, index) {

        let num = index + 1;


        row.cells[0].innerText =
            num < 10
            ? '0' + num
            : num;

    });

}


/* =========================================
   CALCULATE ROW
========================================= */

function calculateRow(input) {

    let row =
        input.closest('tr');


    let qty =
        parseFloat(
            row.querySelector(
                '.item-qty'
            ).value
        ) || 0;


    let rate =
        parseFloat(
            row.querySelector(
                '.item-rate'
            ).value
        ) || 0;


    let amount =
        qty * rate;


    row.querySelector(
        '.item-amount'
    ).value =
        amount.toFixed(2);


    calculateGrandTotal();

}


/* =========================================
   GRAND TOTAL
========================================= */

function calculateGrandTotal() {

    let total = 0;


    document
        .querySelectorAll(
            '.item-amount'
        )
        .forEach(function(inp) {

            total +=
                parseFloat(
                    inp.value
                ) || 0;

        });


    document.getElementById(
        'grandTotal'
    ).value =
        total.toFixed(2);

}


/* =========================================
   WHATSAPP BILL
========================================= */

function sendBillToWhatsApp() {

    let name =
        document.getElementById(
            'custName'
        ).value.trim();


    let mobile =
        document.getElementById(
            'custMobile'
        ).value.trim();


    let billNo =
        document.getElementById(
            'billNo'
        ).value.trim();


    let date =
        document.getElementById(
            'billDate'
        ).value.trim();


    let grandTotal =
        document.getElementById(
            'grandTotal'
        ).value;


    if (!mobile) {

        alert(
            "দয়া করে কাস্টমারের WhatsApp / মোবাইল নম্বর লিখুন!"
        );

        return;

    }


    /* =====================================
       MOBILE FORMAT
    ====================================== */

    let formattedMobile =
        mobile.replace(
            /[^0-9]/g,
            ''
        );


    if (
        formattedMobile.startsWith('0')
    ) {

        formattedMobile =
            '88' + formattedMobile;

    }


    /* =====================================
       MESSAGE
    ====================================== */

    let msg =
        `*--- RM THAI ALUMINIUM ---*\n`;

    msg +=
        `*Bill / Invoice Summary*\n\n`;

    msg +=
        `📄 *Bill No:* ${billNo}\n`;

    msg +=
        `📅 *Date:* ${date}\n`;

    msg +=
        `👤 *Customer Name:* ${
            name || 'N/A'
        }\n\n`;

    msg +=
        `*Item Breakdown:*\n`;


    let rows =
        document.querySelectorAll(
            '#invoiceTableBody tr'
        );


    rows.forEach(
        function(row, idx) {

            let desc =
                row.querySelector(
                    'textarea'
                ).value.trim()
                ||
                'Item ' + (idx + 1);


            let qty =
                row.querySelector(
                    '.item-qty'
                ).value || 0;


            let unit =
                row.querySelector(
                    '.item-unit'
                ).value || '';


            let amount =
                row.querySelector(
                    '.item-amount'
                ).value || 0;


            msg +=
                `${idx + 1}. ${desc} ` +
                `(${qty} ${unit}) ` +
                `- Tk. ${amount}\n`;

        }
    );


    msg +=
        `\n💰 *Total Amount: Tk. ${grandTotal}*\n\n`;


    msg +=
        `Thank you for doing business with us!`;


    /* =====================================
       WAIT FOR WHATSAPP RETURN
    ====================================== */

    isWaitingForSavePrompt = true;


    let waUrl =
        `https://wa.me/${formattedMobile}` +
        `?text=${encodeURIComponent(msg)}`;


    window.open(
        waUrl,
        '_blank'
    );

}

<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bill & Invoice - Aluminium ERP BD</title>

<style>

* {
    box-sizing: border-box;
    font-family: Arial, "Segoe UI", sans-serif;
}

body {
    margin: 0;
    padding: 15px;
    background: #e5e7eb;
    color: #222;
}

.invoice-page {
    width: 100%;
    max-width: 850px;
    margin: auto;
    background: #ffffff;
    min-height: 1100px;
    padding: 0 45px 40px 45px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.15);
}

/* =========================
   TOP BLUE HEADER
========================= */

.invoice-header {
    position: relative;
    margin-left: -45px;
    margin-right: -45px;
    height: 230px;
    background: #0755a5;
    overflow: hidden;
    padding: 55px 55px 0 55px;
    color: white;
}

/* উপরের হালকা বাঁকা অংশ */

.invoice-header::before {
    content: "";
    position: absolute;
    top: -115px;
    left: -80px;
    width: 850px;
    height: 190px;
    background: #1268bb;
    border-radius: 0 0 55% 45%;
    transform: rotate(-4deg);
}

/* নিচের সাদা wave */

.invoice-header::after {
    content: "";
    position: absolute;
    left: -5%;
    bottom: -95px;
    width: 110%;
    height: 150px;
    background: white;
    border-radius: 50% 50% 0 0;
    transform: rotate(-3deg);
}

/* Header content */

.header-content {
    position: relative;
    z-index: 5;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
}

.invoice-title {
    font-size: 46px;
    font-weight: 900;
    letter-spacing: 2px;
    color: #ffffff;
}

.invoice-number {
    font-size: 18px;
    font-weight: 800;
    margin-top: 10px;
    color: #ffffff;
}

/* =========================
   COMPANY
========================= */

.company-area {
    text-align: center;
    margin-top: -10px;
    position: relative;
    z-index: 10;
}

.company-name {
    display: inline-block;
    font-size: 24px;
    font-weight: 900;
    color: #0755a5;
    margin-top: -15px;
}

.company-tagline {
    font-size: 11px;
    color: #555;
    margin-top: 3px;
}

/* =========================
   BILL TO / FROM
========================= */

.bill-info {
    display: flex;
    justify-content: space-between;
    gap: 40px;
    margin-top: 25px;
    margin-bottom: 15px;
}

.bill-box {
    width: 48%;
}

.bill-box.from {
    text-align: right;
}

.bill-heading {
    font-size: 19px;
    font-weight: 900;
    color: #222;
    margin-bottom: 7px;
}

.bill-box input,
.bill-box textarea {
    width: 100%;
    border: none;
    outline: none;
    background: transparent;
    color: #555;
    font-size: 14px;
    font-weight: 600;
    padding: 2px 0;
}

.bill-box textarea {
    resize: none;
    height: 45px;
}

.bill-box.from input,
.bill-box.from textarea {
    text-align: right;
}

/* =========================
   DATE
========================= */

.date-row {
    margin-top: 20px;
    margin-bottom: 25px;
}

.date-row label {
    font-size: 14px;
    font-weight: 800;
    color: #666;
}

.date-row input {
    border: none;
    outline: none;
    font-size: 14px;
    font-weight: 700;
    color: #555;
    margin-left: 5px;
}

/* =========================
   INVOICE TABLE
========================= */

.invoice-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
}

.invoice-table th {
    background: #0755a5;
    color: white;
    font-size: 14px;
    font-weight: 900;
    padding: 10px 7px;
    border: 1px solid #0755a5;
    text-align: center;
}

.invoice-table td {
    border: 1px solid #aaa;
    padding: 6px;
    height: 45px;
    font-size: 13px;
    text-align: center;
    vertical-align: middle;
}

.invoice-table td.description {
    text-align: left;
}

.invoice-table input,
.invoice-table textarea {
    width: 100%;
    border: none;
    outline: none;
    background: transparent;
    font-size: 13px;
    font-weight: 600;
    color: #333;
}

.invoice-table textarea {
    resize: vertical;
    min-height: 30px;
}

/* =========================
   SUB TOTAL
========================= */

.total-area {
    display: flex;
    justify-content: flex-end;
    margin-top: 0;
}

.sub-total {
    width: 52%;
    background: #0755a5;
    color: white;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 11px 18px;
    font-size: 16px;
    font-weight: 900;
}

.sub-total input {
    width: 120px;
    border: none;
    outline: none;
    background: transparent;
    color: white;
    text-align: right;
    font-size: 16px;
    font-weight: 900;
}

/* =========================
   NOTE
========================= */

.note-section {
    margin-top: 25px;
    width: 45%;
}

.note-title {
    font-size: 16px;
    font-weight: 900;
    margin-bottom: 5px;
}

.note-line {
    border-bottom: 1px solid #aaa;
    height: 27px;
}

.note-line input {
    width: 100%;
    height: 25px;
    border: none;
    outline: none;
    background: transparent;
    font-size: 13px;
}

/* =========================
   PAYMENT
========================= */

.bottom-area {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-top: 40px;
}

.payment-info {
    width: 48%;
}

.payment-title {
    font-size: 17px;
    font-weight: 900;
    margin-bottom: 8px;
}

.payment-row {
    font-size: 13px;
    margin: 5px 0;
    color: #444;
}

.payment-row strong {
    color: #222;
}

.payment-row input {
    border: none;
    outline: none;
    background: transparent;
    font-size: 13px;
    font-weight: 600;
    color: #555;
    margin-left: 8px;
}

/* =========================
   THANK YOU
========================= */

.thank-you {
    width: 45%;
    text-align: center;
    font-size: 36px;
    font-weight: 500;
    color: #0755a5;
}

/* =========================
   ACTION BUTTONS
========================= */

.action-buttons {
    max-width: 850px;
    margin: 20px auto;
    text-align: center;
}

.action-buttons button {
    border: none;
    border-radius: 7px;
    padding: 12px 25px;
    margin: 5px;
    color: white;
    background: #0755a5;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
}

.action-buttons button:hover {
    opacity: 0.9;
}

/* =========================
   PRINT
========================= */

@media print {

    body {
        background: white;
        padding: 0;
    }

    .invoice-page {
        width: 100%;
        max-width: none;
        min-height: auto;
        box-shadow: none;
        padding: 0 35px 25px 35px;
    }

    .invoice-header {
        margin-left: -35px;
        margin-right: -35px;
    }

    .action-buttons {
        display: none !important;
    }

    input,
    textarea {
        color: #222 !important;
    }

    .invoice-table th {
        background: #0755a5 !important;
        color: white !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
    }

    .sub-total {
        background: #0755a5 !important;
        color: white !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
    }

    .invoice-header {
        background: #0755a5 !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
    }

}

/* Mobile */

@media screen and (max-width: 600px) {

    body {
        padding: 0;
    }

    .invoice-page {
        padding: 0 15px 25px 15px;
    }

    .invoice-header {
        margin-left: -15px;
        margin-right: -15px;
        padding-left: 25px;
        padding-right: 25px;
        height: 210px;
    }

    .invoice-title {
        font-size: 34px;
    }

    .invoice-number {
        font-size: 13px;
    }

    .bill-info {
        gap: 15px;
    }

    .bill-heading {
        font-size: 16px;
    }

    .bill-box input,
    .bill-box textarea {
        font-size: 12px;
    }

    .invoice-table {
        font-size: 11px;
    }

    .invoice-table th {
        font-size: 11px;
        padding: 7px 3px;
    }

    .invoice-table td {
        font-size: 11px;
        padding: 4px 2px;
    }

    .sub-total {
        width: 60%;
        font-size: 13px;
    }

    .thank-you {
        font-size: 27px;
    }

}

</style>

</head>

<body>

<script>

document.addEventListener("DOMContentLoaded", function () {

    // =========================
    // DATE
    // =========================

    const today = new Date();

    const dd = String(today.getDate()).padStart(2, "0");
    const mm = String(today.getMonth() + 1).padStart(2, "0");
    const yyyy = today.getFullYear();

    const dateBox = document.getElementById("billDate");

    if (dateBox) {
        dateBox.value = dd + "-" + mm + "-" + yyyy;
    }


    // =========================
    // LOAD QUOTATION DATA
    // =========================

    const savedQuotation =
        JSON.parse(localStorage.getItem("quotation")) || null;

    if (savedQuotation) {

        const setValue = (id, value) => {

            const el = document.getElementById(id);

            if (el && value !== undefined && value !== null) {
                el.value = value;
            }

        };


        setValue("custName", savedQuotation.customerName);
        setValue("custMobile", savedQuotation.mobile);
        setValue("custAddress", savedQuotation.address);

        setValue("billNo", savedQuotation.billNo);

        setValue("company", savedQuotation.company);
        setValue("series", savedQuotation.series);
        setValue("aluThickness", savedQuotation.aluThickness);

        setValue("glassCompany", savedQuotation.glassCompany);
        setValue("glassThickness", savedQuotation.glassThickness);
        setValue("glassColour", savedQuotation.glassColour);

    }


    // =========================
    // FIRST INVOICE ROW
    // =========================

    addInvoiceRow();

});


// =====================================
// ADD INVOICE ROW
// =====================================

function addInvoiceRow() {

    const tbody =
        document.getElementById("invoiceTableBody");

    if (!tbody) return;


    const row = document.createElement("tr");


    row.innerHTML = `

        <td class="sl-number"></td>

        <td>
            <textarea
                class="item-description"
                placeholder="Your Description"
            ></textarea>
        </td>

        <td>
            <input
                type="number"
                class="item-qty"
                value="1"
                min="0"
                oninput="calculateRow(this)"
            >
        </td>

        <td>
            <input
                type="text"
                class="item-unit"
                value="sft"
            >
        </td>

        <td>
            <input
                type="number"
                class="item-rate"
                value="0"
                min="0"
                oninput="calculateRow(this)"
            >
        </td>

        <td>
            <input
                type="number"
                class="item-amount"
                value="0.00"
                readonly
            >
        </td>

        <td class="no-print">
            <button
                type="button"
                class="btn-del"
                onclick="removeInvoiceRow(this)"
            >
                X
            </button>
        </td>

    `;


    tbody.appendChild(row);

    updateRowNumbers();

}


// =====================================
// REMOVE ROW
// =====================================

function removeInvoiceRow(button) {

    const tbody =
        document.getElementById("invoiceTableBody");

    if (!tbody) return;


    if (tbody.rows.length <= 1) {

        alert("কমপক্ষে একটি Item থাকতে হবে!");

        return;
    }


    const row =
        button.closest("tr");

    if (row) {
        row.remove();
    }


    updateRowNumbers();

    calculateGrandTotal();

}


// =====================================
// ROW NUMBER
// =====================================

function updateRowNumbers() {

    const rows =
        document.querySelectorAll(
            "#invoiceTableBody tr"
        );


    rows.forEach(function (row, index) {

        const number =
            index + 1;

        const cell =
            row.querySelector(".sl-number");

        if (cell) {

            cell.innerText =
                number < 10
                    ? "0" + number
                    : number;

        }

    });

}


// =====================================
// CALCULATE ROW
// =====================================

function calculateRow(input) {

    const row =
        input.closest("tr");

    if (!row) return;


    const qty =
        parseFloat(
            row.querySelector(".item-qty").value
        ) || 0;


    const rate =
        parseFloat(
            row.querySelector(".item-rate").value
        ) || 0;


    const amount =
        qty * rate;


    row.querySelector(
        ".item-amount"
    ).value = amount.toFixed(2);


    calculateGrandTotal();

}


// =====================================
// GRAND TOTAL
// =====================================

function calculateGrandTotal() {

    let total = 0;


    document
        .querySelectorAll(".item-amount")
        .forEach(function (input) {

            total +=
                parseFloat(input.value) || 0;

        });


    const totalBox =
        document.getElementById("grandTotal");


    if (totalBox) {

        totalBox.value =
            total.toFixed(2);

    }

}


// =====================================
// SAVE CURRENT BILL
// =====================================

function saveBillData() {

    const billData = {

        customerName:
            document.getElementById("custName")?.value || "",

        mobile:
            document.getElementById("custMobile")?.value || "",

        address:
            document.getElementById("custAddress")?.value || "",

        billNo:
            document.getElementById("billNo")?.value || "",

        date:
            document.getElementById("billDate")?.value || "",

        bankName:
            document.getElementById("bankName")?.value || "",

        bankNumber:
            document.getElementById("bankNumber")?.value || "",

        email:
            document.getElementById("shopEmail")?.value || "",

        note1:
            document.getElementById("note1")?.value || "",

        note2:
            document.getElementById("note2")?.value || "",

        note3:
            document.getElementById("note3")?.value || "",

        grandTotal:
            document.getElementById("grandTotal")?.value || "0.00"

    };


    localStorage.setItem(
        "lastBill",
        JSON.stringify(billData)
    );

}


// =====================================
// PDF / PRINT
// =====================================

function printPDF() {

    saveBillData();

    window.print();

}


// =====================================
// PRINT BUTTON SUPPORT
// =====================================

document.addEventListener(
    "click",
    function (event) {

        const button =
            event.target.closest(
                '[onclick="window.print()"]'
            );


        if (button) {

            event.preventDefault();

            printPDF();

        }

    }
);

</script>

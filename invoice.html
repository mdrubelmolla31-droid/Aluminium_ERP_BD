<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bill & Invoice - Aluminium ERP BD</title>
<style>
* {
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
    font-weight: 700;
}
body {
    margin: 0;
    padding: 10px;
    background: #e2e8f0;
    color: #111;
}
.container {
    width: 100%;
    max-width: 800px;
    margin: 0 auto;
    background: #fff;
    padding-bottom: 20px;
    box-shadow: 0 0 10px rgba(0,0,0,0.2);
}
.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 20px;
    background: #1e293b;
    color: white;
}
.back-btn {
    color: #fff;
    text-decoration: none;
    font-size: 12px;
}

/* =========================================
   হেডার ডিজাইন (দোকানের নামসহ হেডারের ভেতরে)
========================================= */
.invoice-header {
    position: relative;
    background: #0256b1; /* মূল ডিপ নীল রং */
    height: 155px;
    padding: 15px 25px;
    overflow: hidden;
    color: #fff;
    text-align: center;
}

/* নিচের কার্ভ বা ঢেউ ডিজাইন */
.invoice-header::after {
    content: '';
    position: absolute;
    bottom: -2px;
    left: -10%;
    width: 120%;
    height: 35px;
    background: #fff;
    border-radius: 50% 50% 0 0 / 100% 100% 0 0;
    z-index: 2;
}

.invoice-top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    z-index: 10;
    position: relative;
}

.invoice-main-title {
    font-size: 22px;
    color: #fff;
    letter-spacing: 1px;
    font-weight: 900;
}

.bill-number-box {
    display: flex;
    align-items: center;
    gap: 4px;
    color: #fff;
    font-size: 11px;
}
.bill-number-box input {
    width: 90px;
    border: none;
    background: transparent;
    color: #fff;
    outline: none;
    font-size: 11px;
    font-weight: 900;
    text-align: right;
}

/* হেডারের ভেতরে থাকা দোকানের নাম ও স্লোগান */
.shop-name {
    display: inline-block;
    font-size: 22px;
    font-weight: 900;
    color: #ffffff !important;
    background: transparent;
    border: none;
    outline: none;
    text-align: center;
    text-transform: uppercase;
    width: 100%;
    margin-top: 5px;
    z-index: 10;
    position: relative;
}

.shop-subtitle {
    color: #e2e8f0;
    font-size: 9px;
    margin-top: 2px;
    z-index: 10;
    position: relative;
}

/* বিল ইনফো */
.bill-info {
    display: flex;
    justify-content: space-between;
    padding: 0 25px;
    margin: 10px 0 15px 0;
}
.bill-to, .bill-from {
    width: 45%;
}
.bill-from {
    text-align: right;
}
.bill-info h3 {
    margin: 0 0 5px;
    font-size: 12px;
    color: #000;
}
.bill-info input {
    width: 100%;
    border: none;
    outline: none;
    padding: 2px 0;
    font-size: 11px;
    background: transparent;
    color: #000;
}
.bill-from input {
    text-align: right;
}

.date-row {
    padding: 0 25px;
    margin-bottom: 12px;
    font-size: 11px;
}
.date-row input {
    border: none;
    outline: none;
    font-size: 11px;
    background: transparent;
    font-weight: 900;
}

/* টেবিল ডিজাইন */
.table-responsive {
    padding: 0 25px;
    width: 100%;
}
.invoice-table {
    width: 100%;
    border-collapse: collapse;
}
.invoice-table th {
    background: #0256b1;
    color: #fff;
    border: 1px solid #0256b1;
    padding: 6px 4px;
    text-align: center;
    font-size: 10px;
}
.invoice-table td {
    border: 1px solid #aaa;
    padding: 4px;
    text-align: center;
    vertical-align: middle;
    font-size: 10px;
}

/* কলামের সঠিক মাপ */
.invoice-table th:nth-child(1), .invoice-table td:nth-child(1) { width: 34%; text-align: left; }
.invoice-table th:nth-child(2), .invoice-table td:nth-child(2) { width: 10%; }
.invoice-table th:nth-child(3), .invoice-table td:nth-child(3) { width: 14%; }
.invoice-table th:nth-child(4), .invoice-table td:nth-child(4) { width: 14%; }
.invoice-table th:nth-child(5), .invoice-table td:nth-child(5) { width: 18%; }
.invoice-table th:nth-child(6), .invoice-table td:nth-child(6) { width: 10%; }

.invoice-table input, .invoice-table textarea {
    width: 100%;
    border: none;
    outline: none;
    background: transparent;
    color: #000;
    font-size: 10px;
    font-weight: 700;
    text-align: center;
}
.item-description {
    min-height: 28px;
    resize: vertical;
    text-align: left !important;
    padding: 2px;
}
.invoice-table td:nth-child(3), .invoice-table td:nth-child(4), .invoice-table td:nth-child(5) {
    text-align: center;
}

.btn-del {
    background: #dc2626;
    color: #fff;
    border: none;
    border-radius: 3px;
    padding: 2px 5px;
    font-size: 9px;
    cursor: pointer;
}
.btn-add {
    margin: 10px 25px;
    padding: 5px 10px;
    background: #198754;
    color: #fff;
    border: none;
    border-radius: 4px;
    font-size: 10px;
    cursor: pointer;
}

/* গ্র্যান্ড টোটাল সেকশন */
.total-section {
    display: flex;
    justify-content: flex-end;
    padding: 0 25px;
    margin-top: 10px;
}
.total-box {
    width: 40%;
    background: #0256b1;
    color: #fff;
    padding: 6px 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
}
.total-box input {
    width: 90px;
    border: none;
    background: transparent;
    color: #fff;
    outline: none;
    text-align: right;
    font-size: 11px;
    font-weight: 900;
}

.note-section {
    padding: 0 25px;
    margin-top: 15px;
    width: 50%;
}
.note-title {
    font-size: 11px;
    margin-bottom: 4px;
}
.note-line {
    width: 100%;
    border: none;
    border-bottom: 1px solid #aaa;
    outline: none;
    background: transparent;
    margin: 4px 0;
    padding: 2px 0;
    font-size: 10px;
}

.bottom-area {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding: 0 25px;
    margin-top: 20px;
}
.payment-info {
    width: 50%;
    font-size: 10px;
}
.payment-title {
    font-size: 11px;
    margin-bottom: 4px;
}
.payment-row {
    display: flex;
    gap: 8px;
    margin: 2px 0;
}
.payment-row strong {
    min-width: 50px;
}
.payment-row input {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    font-size: 10px;
}
.thank-you {
    width: 40%;
    text-align: right;
    font-size: 22px;
    color: #0256b1;
    font-weight: bold;
}

.action-buttons {
    text-align: center;
    margin-top: 20px;
}
.btn-print {
    background: #1d4ed8;
    color: #ffffff;
    border: none;
    border-radius: 8px;
    padding: 10px 20px;
    font-size: 14px;
    cursor: pointer;
}

@media print {
    @page { size: A4 portrait; margin: 10mm; }
    body { background: #fff; padding: 0; }
    .container { box-shadow: none; max-width: 100%; padding: 0; margin: 0; }
    .top-bar, .action-buttons, .btn-add, .no-print, .btn-del { display: none !important; }
    
    .invoice-header, .invoice-header::after, .invoice-table th, .total-box { 
        -webkit-print-color-adjust: exact !important; 
        print-color-adjust: exact !important; 
    }
    input, textarea { border: none !important; background: transparent !important; }
}
</style>
</head>
<body>

<div class="container" id="invoiceContainer">

    <div class="top-bar no-print">
        <a href="index.html" class="back-btn">⬅️ Back to Dashboard</a>
        <span>PDF Creator</span>
    </div>

    <!-- হেডার (দোকানের নাম ও ইনভয়েস টাইটেল একসাথে) -->
    <div class="invoice-header">
        <div class="invoice-top-row">
            <div class="invoice-main-title">INVOICE</div>
            <div class="bill-number-box">
                <span>NO:</span>
                <input type="text" id="billNo" value="INV-12345-1">
            </div>
        </div>

        <input type="text" class="shop-name" value="RM THAI ALUMINIUM">
        <div class="shop-subtitle">Experts in Thai Windows, Doors, Glass Works & False Ceilings</div>
    </div>

    <div class="bill-info">
        <div class="bill-to">
            <h3>Bill To:</h3>
            <input type="text" id="custName" value="RM COMPUTER">
            <input type="text" id="custMobile" value="01712345678">
            <input type="text" id="custAddress" value="পাবনা">
        </div>
        <div class="bill-from">
            <h3>From:</h3>
            <input type="text" value="Rubel Molla">
            <input type="text" value="01676-474412">
            <input type="text" value="47/4, Haji Ali Hossain Road, Mirpur-13, Dhaka-1216">
        </div>
    </div>

    <div class="date-row">
        <strong>Date:</strong> <input type="text" id="billDate">
    </div>

    <div class="table-responsive">
        <table class="invoice-table">
            <thead>
                <tr>
                    <th>Description</th>
                    <th>Qty</th>
                    <th>Rate</th>
                    <th>Sqft</th>
                    <th>Amount</th>
                    <th class="no-print">Act</th>
                </tr>
            </thead>
            <tbody id="invoiceTableBody"></tbody>
        </table>
    </div>

    <button type="button" class="btn-add no-print" onclick="addInvoiceRow()">+ Add Item</button>

    <div class="total-section">
        <div class="total-box">
            <span>Grand Total</span>
            <span>Tk. <input type="text" id="grandTotal" value="0.00" readonly></span>
        </div>
    </div>

    <div class="note-section">
        <div class="note-title">Note:</div>
        <input type="text" class="note-line">
        <input type="text" class="note-line">
        <input type="text" class="note-line">
    </div>

    <div class="bottom-area">
        <div class="payment-info">
            <div class="payment-title">Payment Information:</div>
            <div class="payment-row"><strong>Bank:</strong> <input type="text" value="Name Bank"></div>
            <div class="payment-row"><strong>No Bank:</strong> <input type="text" value="123-456-7890"></div>
            <div class="payment-row"><strong>Email:</strong> <input type="text" value="reallygreatsite.com"></div>
        </div>
        <div class="thank-you">Thank You!</div>
    </div>

</div>

<div class="action-buttons no-print">
    <button type="button" class="btn-print" onclick="printInvoice()">🖨️ Save as PDF</button>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const today = new Date();
    const dd = String(today.getDate()).padStart(2, "0");
    const mm = String(today.getMonth() + 1).padStart(2, "0");
    const yyyy = today.getFullYear();
    document.getElementById("billDate").value = dd + "-" + mm + "-" + yyyy;

    addInvoiceRow("", 1, "", "");
    addInvoiceRow("", 1, "", "");
});

function addInvoiceRow(description = "", qty = 1, rate = "", sqft = "") {
    const tbody = document.getElementById("invoiceTableBody");
    const tr = document.createElement("tr");
    tr.innerHTML = `
        <td><textarea class="item-description" placeholder="Description...">${description}</textarea></td>
        <td><input type="number" class="item-qty" value="${qty}" min="0" step="0.01" oninput="calculateRow(this)"></td>
        <td><input type="number" class="item-rate" value="${rate}" min="0" step="0.01" placeholder="Rate" oninput="calculateRow(this)"></td>
        <td><input type="number" class="item-sqft" value="${sqft}" min="0" step="0.01" placeholder="Sqft" oninput="calculateRow(this)"></td>
        <td><input type="text" class="item-amount" value="0.00" readonly></td>
        <td class="no-print"><button type="button" class="btn-del" onclick="removeInvoiceRow(this)">X</button></td>
    `;
    tbody.appendChild(tr);
    calculateRow(tr.querySelector(".item-qty"));
}

function removeInvoiceRow(btn) {
    const tbody = document.getElementById("invoiceTableBody");
    if (tbody.rows.length <= 1) {
        alert("At least one item is required!");
        return;
    }
    btn.closest("tr").remove();
    calculateGrandTotal();
}

function calculateRow(input) {
    const row = input.closest("tr");
    const qty = parseFloat(row.querySelector(".item-qty").value) || 0;
    const rate = parseFloat(row.querySelector(".item-rate").value) || 0;
    const sqft = parseFloat(row.querySelector(".item-sqft").value) || 0;
    
    // হিসাব: (Qty * Rate * Sqft) অথবা শুধু (Qty * Rate) যদি Sqft না থাকে
    let amount = 0;
    if(sqft > 0) {
        amount = qty * rate * sqft;
    } else {
        amount = qty * rate;
    }
    
    row.querySelector(".item-amount").value = amount.toFixed(2);
    calculateGrandTotal();
}

function calculateGrandTotal() {
    let total = 0;
    document.querySelectorAll("#invoiceTableBody .item-amount").forEach(input => {
        let val = parseFloat(input.value);
        if(!isNaN(val)) {
            total += val;
        }
    });
    document.getElementById("grandTotal").value = total.toFixed(2);
}

function printInvoice() {
    calculateGrandTotal();
    window.print();
}
</script>

</body>
</html>

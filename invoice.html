<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bill & Invoice - Aluminium ERP BD</title>
<style>
* {
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
    font-weight: 700;
}
body {
    margin: 0;
    padding: 15px;
    background: #525252; /* ডার্ক ব্যাকগ্রাউন্ড (আপনার ছবির মত) */
    color: #111;
}
.container {
    width: 100%;
    max-width: 800px;
    margin: 0 auto;
    background: #fff;
    padding: 0 0 20px 0; /* প্যাডিং কমানো হয়েছে হেডারের জন্য */
    box-shadow: 0 0 10px rgba(0,0,0,0.5);
}
.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 20px;
    background: #1e293b;
    color: white;
}
.back-btn {
    color: #fff;
    text-decoration: none;
    font-size: 12px;
}

/* =========================================
   নতুন কার্ভড (Curved) হেডার ডিজাইন
========================================= */
.invoice-header {
    position: relative;
    background: #1360a8; /* মূল নীল রং */
    height: 120px;
    padding: 20px 30px;
    overflow: hidden;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
}

/* হালকা নীল ঢেউ */
.invoice-header::before {
    content: '';
    position: absolute;
    bottom: 20px;
    left: -10%;
    width: 120%;
    height: 70px;
    background: #0975d6;
    border-radius: 50% 50% 0 0 / 100% 100% 0 0;
    z-index: 1;
}

/* সাদা ঢেউ (যা হেডারের নিচে কার্ভ তৈরি করেছে) */
.invoice-header::after {
    content: '';
    position: absolute;
    bottom: -2px; /* প্রিন্টে গ্যাপ এড়াতে */
    left: -10%;
    width: 120%;
    height: 35px;
    background: #fff;
    border-radius: 50% 50% 0 0 / 100% 100% 0 0;
    z-index: 2;
}

.invoice-main-title {
    position: relative;
    z-index: 10;
    font-size: 26px;
    color: #fff;
    letter-spacing: 1px;
}

.bill-number-box {
    position: relative;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 4px;
    color: #000;
    font-size: 11px;
}
.bill-number-box input {
    width: 90px;
    border: none;
    background: transparent;
    color: #000;
    outline: none;
    font-size: 11px;
    font-weight: 900;
}

/* =========================================
   দোকানের নাম ও ঠিকানা (হেডারের নিচে)
========================================= */
.shop-info-section {
    text-align: center;
    padding: 0 20px 10px;
}

.shop-name {
    display: inline-block;
    font-size: 22px;
    font-weight: 900;
    color: #1360a8 !important; /* নীল রং */
    background: transparent;
    border: none;
    outline: none;
    text-align: center;
    text-transform: uppercase;
    width: 100%;
}

.shop-subtitle {
    color: #333;
    font-size: 10px;
    margin-bottom: 5px;
}

/* বিল ইনফো */
.bill-info {
    display: flex;
    justify-content: space-between;
    padding: 0 30px;
    margin: 15px 0;
}
.bill-to, .bill-from {
    width: 45%;
}
.bill-from {
    text-align: right;
}
.bill-info h3 {
    margin: 0 0 6px;
    font-size: 13px;
    color: #000;
}
.bill-info input {
    width: 100%;
    border: none;
    outline: none;
    padding: 2px 0;
    font-size: 11px;
    background: transparent;
    color: #000;
}
.bill-from input {
    text-align: right;
}

.date-row {
    padding: 0 30px;
    margin-bottom: 15px;
    font-size: 11px;
}
.date-row input {
    border: none;
    outline: none;
    font-size: 11px;
    background: transparent;
    font-weight: 900;
}

/* টেবিল ডিজাইন */
.table-responsive {
    padding: 0 30px;
    width: 100%;
}
.invoice-table {
    width: 100%;
    border-collapse: collapse;
}
.invoice-table th {
    background: transparent;
    color: #000;
    border: 1px solid #000;
    padding: 6px;
    text-align: center;
    font-size: 11px;
}
.invoice-table td {
    border: 1px solid #000;
    padding: 4px;
    text-align: center;
    vertical-align: middle;
    font-size: 10px;
}
.invoice-table th:nth-child(1), .invoice-table td:nth-child(1) { width: 45%; text-align: left; padding-left: 10px;}
.invoice-table th:nth-child(2), .invoice-table td:nth-child(2) { width: 15%; }
.invoice-table th:nth-child(3), .invoice-table td:nth-child(3) { width: 20%; }
.invoice-table th:nth-child(4), .invoice-table td:nth-child(4) { width: 20%; }

.invoice-table input, .invoice-table textarea {
    width: 100%;
    border: none;
    outline: none;
    background: transparent;
    color: #000;
    font-size: 10px;
    font-weight: 700;
    text-align: center;
}
.item-description {
    min-height: 25px;
    resize: vertical;
    text-align: left !important;
}

.btn-del {
    background: #dc2626;
    color: #fff;
    border: none;
    border-radius: 3px;
    padding: 2px 5px;
    font-size: 9px;
    cursor: pointer;
}
.btn-add {
    margin: 10px 30px;
    padding: 6px 12px;
    background: #198754;
    color: #fff;
    border: none;
    border-radius: 4px;
    font-size: 10px;
    cursor: pointer;
}

/* সাব টোটাল */
.total-section {
    display: flex;
    justify-content: flex-end;
    padding: 0 30px;
}
.total-box {
    width: 40%;
    background: #1360a8;
    color: #fff;
    padding: 6px 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
}
.total-box input {
    width: 90px;
    border: none;
    background: transparent;
    color: #fff;
    outline: none;
    text-align: right;
    font-size: 12px;
}

.note-section {
    padding: 0 30px;
    margin-top: 15px;
    width: 50%;
}
.note-title {
    font-size: 11px;
    margin-bottom: 5px;
}
.note-line {
    width: 100%;
    border: none;
    border-bottom: 1px solid #aaa;
    outline: none;
    background: transparent;
    margin: 4px 0;
    padding: 2px 0;
    font-size: 10px;
}

.bottom-area {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding: 0 30px;
    margin-top: 20px;
}
.payment-info {
    width: 50%;
    font-size: 10px;
}
.payment-title {
    font-size: 11px;
    margin-bottom: 5px;
}
.payment-row {
    display: flex;
    gap: 8px;
    margin: 2px 0;
}
.payment-row strong {
    min-width: 50px;
}
.payment-row input {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    font-size: 10px;
}
.thank-you {
    width: 40%;
    text-align: right;
    font-size: 22px;
    color: #1360a8;
    font-weight: bold;
}

.action-buttons {
    text-align: center;
    margin-top: 20px;
}
.btn-print {
    background: #1d4ed8;
    color: #ffffff;
    border: none;
    border-radius: 8px;
    padding: 10px 20px;
    font-size: 14px;
    cursor: pointer;
}

@media print {
    @page { size: A4 portrait; margin: 0; }
    body { background: #fff; padding: 0; }
    .container { box-shadow: none; max-width: 100%; padding: 0; margin: 0; }
    .top-bar, .action-buttons, .btn-add, .no-print, .btn-del { display: none !important; }
    
    /* প্রিন্টে কালার ঠিক রাখার জন্য */
    .invoice-header, .invoice-header::before, .invoice-header::after, .total-box { 
        -webkit-print-color-adjust: exact !important; 
        print-color-adjust: exact !important; 
    }
    
    .invoice-header {
        height: 120px !important;
    }
    input, textarea { border: none !important; background: transparent !important; }
}
</style>
</head>
<body>

<div class="container" id="invoiceContainer">

    <div class="top-bar no-print">
        <a href="index.html" class="back-btn">⬅️ Back to Dashboard</a>
        <span>PDF Creator</span>
    </div>

    <!-- হুবহু কার্ভড (Curved) হেডার -->
    <div class="invoice-header">
        <div class="invoice-main-title">INVOICE</div>
        <div class="bill-number-box">
            <span>NO:</span>
            <input type="text" id="billNo" value="INV-12345-1">
        </div>
    </div>

    <!-- হেডারের নিচে দোকানের নাম ও ঠিকানা -->
    <div class="shop-info-section">
        <input type="text" class="shop-name" value="RM THAI ALUMINIUM">
        <div class="shop-subtitle">Experts in Thai Windows, Doors, Glass Works & False Ceilings</div>
    </div>

    <div class="bill-info">
        <div class="bill-to">
            <h3>Bill To:</h3>
            <input type="text" id="custName" value="RM COMPUTER">
            <input type="text" id="custMobile" value="01712345678">
            <input type="text" id="custAddress" value="পাবনা">
        </div>
        <div class="bill-from">
            <h3>From:</h3>
            <input type="text" value="Rubel Molla">
            <input type="text" value="01676-474412">
            <input type="text" value="47/4, Haji Ali Hossain Road, Mirpur-13, Dhaka-1216">
        </div>
    </div>

    <div class="date-row">
        <strong>Date:</strong> <input type="text" id="billDate">
    </div>

    <div class="table-responsive">
        <table class="invoice-table">
            <thead>
                <tr>
                    <th>Description</th>
                    <th>Qty</th>
                    <th>Price</th>
                    <th>Total <span class="no-print" style="float:right;">Del</span></th>
                </tr>
            </thead>
            <tbody id="invoiceTableBody"></tbody>
        </table>
    </div>

    <button type="button" class="btn-add no-print" onclick="addInvoiceRow()">+ Add Item</button>

    <div class="total-section">
        <div class="total-box">
            <span>Sub Total</span>
            <span>Tk. <input type="text" id="grandTotal" value="0.00" readonly></span>
        </div>
    </div>

    <div class="note-section">
        <div class="note-title">Note:</div>
        <input type="text" class="note-line">
        <input type="text" class="note-line">
        <input type="text" class="note-line">
    </div>

    <div class="bottom-area">
        <div class="payment-info">
            <div class="payment-title">Payment Information:</div>
            <div class="payment-row"><strong>Bank:</strong> <input type="text" value="Name Bank"></div>
            <div class="payment-row"><strong>No Bank:</strong> <input type="text" value="123-456-7890"></div>
            <div class="payment-row"><strong>Email:</strong> <input type="text" value="reallygreatsite.com"></div>
        </div>
        <div class="thank-you">Thank You!</div>
    </div>

</div>

<div class="action-buttons no-print">
    <button type="button" class="btn-print" onclick="printInvoice()">🖨️ Save as PDF</button>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const today = new Date();
    const dd = String(today.getDate()).padStart(2, "0");
    const mm = String(today.getMonth() + 1).padStart(2, "0");
    const yyyy = today.getFullYear();
    document.getElementById("billDate").value = dd + "-" + mm + "-" + yyyy;

    addInvoiceRow("Your Description 1", 1, "");
    addInvoiceRow("Your Description 2", 1, "");
});

function addInvoiceRow(description = "", qty = 1, price = "") {
    const tbody = document.getElementById("invoiceTableBody");
    const tr = document.createElement("tr");
    tr.innerHTML = `
        <td><textarea class="item-description" placeholder="Description...">${description}</textarea></td>
        <td><input type="number" class="item-qty" value="${qty}" min="0" oninput="calculateRow(this)"></td>
        <td><input type="number" class="item-rate" value="${price}" min="0" placeholder="Price" oninput="calculateRow(this)"></td>
        <td>
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <input type="text" class="item-amount" value="sft" readonly style="width:70%;">
                <button type="button" class="btn-del no-print" onclick="removeInvoiceRow(this)">X</button>
            </div>
        </td>
    `;
    tbody.appendChild(tr);
}

function removeInvoiceRow(btn) {
    const tbody = document.getElementById("invoiceTableBody");
    if (tbody.rows.length <= 1) {
        alert("At least one item is required!");
        return;
    }
    btn.closest("tr").remove();
    calculateGrandTotal();
}

function calculateRow(input) {
    const row = input.closest("tr");
    const qty = parseFloat(row.querySelector(".item-qty").value) || 0;
    const rate = parseFloat(row.querySelector(".item-rate").value) || 0;
    
    let total = qty * rate;
    
    // If rate is provided, show amount. Otherwise show 'sft' placeholder
    if(rate > 0) {
        row.querySelector(".item-amount").value = total.toFixed(2);
    } else {
        row.querySelector(".item-amount").value = "sft";
    }
    calculateGrandTotal();
}

function calculateGrandTotal() {
    let total = 0;
    document.querySelectorAll("#invoiceTableBody .item-amount").forEach(input => {
        let val = parseFloat(input.value);
        if(!isNaN(val)) {
            total += val;
        }
    });
    document.getElementById("grandTotal").value = total.toFixed(2);
}

function printInvoice() {
    calculateGrandTotal();
    window.print();
}
</script>

</body>
</html>

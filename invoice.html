<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Bill & Invoice - Aluminium ERP BD</title>

<style>

/* =====================================
   BASIC
===================================== */

* {
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
    font-weight: 700;
}

body {
    margin: 0;
    padding: 15px;
    background: #f1f5f9;
    color: #111;
}


/* =====================================
   MAIN CONTAINER
===================================== */

.container {
    width: 100%;
    max-width: 850px;
    margin: 0 auto;
    background: #fff;
    padding: 20px;
}


/* =====================================
   TOP BUTTON
===================================== */

.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
}

.back-btn {
    background: #1e293b;
    color: #fff;
    border: none;
    padding: 7px 12px;
    border-radius: 5px;
    text-decoration: none;
    font-size: 11px;
}


/* =====================================
   BLUE HEADER
===================================== */

.invoice-header {
    position: relative;

    background:
        linear-gradient(
            175deg,
            #07549b 0%,
            #0b5fae 55%,
            #063b78 100%
        );

    min-height: 190px;

    padding: 18px 18px 35px;

    margin-bottom: 12px;

    overflow: hidden;

    color: #fff;
}


/* Decorative lower white wave */

.invoice-header::after {
    content: "";
    position: absolute;

    left: -5%;
    right: -5%;
    bottom: -65px;

    height: 105px;

    background: #fff;

    border-radius: 50% 50% 0 0 / 55% 55% 0 0;
}


/* =====================================
   INVOICE TITLE
===================================== */

.invoice-title-row {
    position: relative;
    z-index: 2;

    display: flex;
    justify-content: space-between;
    align-items: center;

    width: 100%;
}


/* ছোট INVOICE লেখা */

.invoice-main-title {
    font-size: 27px;
    line-height: 1;

    color: #fff;

    letter-spacing: 1px;

    font-weight: 900;
}


/* Editable Bill No */

.bill-number-box {
    display: flex;
    align-items: center;
    gap: 4px;

    color: #fff;

    font-size: 12px;

    font-weight: 900;
}

.bill-number-box input {
    width: 115px;

    border: none;
    border-bottom: 1px solid rgba(255,255,255,0.8);

    background: transparent;

    color: #fff;

    outline: none;

    text-align: right;

    font-size: 12px;

    font-weight: 900;
}


/* =====================================
   SHOP NAME
===================================== */

.shop-name-wrapper {
    position: absolute;

    z-index: 3;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    width: 100%;

    text-align: center;
}

.shop-name {
    display: inline-block;

    font-size: 32px;

    line-height: 1.1;

    font-weight: 900;

    color: #fff;

    background: transparent;

    border: none;

    outline: none;

    text-align: center;

    text-transform: uppercase;

    text-shadow:
        0 2px 3px rgba(0,0,0,0.35);

    max-width: 95%;

    word-break: break-word;
}


/* =====================================
   SHOP SUBTITLE
===================================== */

.shop-subtitle {
    position: absolute;

    z-index: 3;

    left: 50%;
    top: calc(50% + 42px);

    transform: translateX(-50%);

    width: 95%;

    text-align: center;

    color: #fff;

    font-size: 9px;

    font-weight: 700;
}


/* =====================================
   SHOP DETAILS
===================================== */

.shop-details {
    position: absolute;

    z-index: 3;

    left: 50%;
    bottom: 12px;

    transform: translateX(-50%);

    width: 94%;

    text-align: center;

    color: #fff;

    font-size: 9px;

    line-height: 1.5;
}

.shop-details input {
    border: none;

    border-bottom: 1px dashed
        rgba(255,255,255,0.8);

    background: transparent;

    color: #fff;

    outline: none;

    text-align: center;

    font-size: 9px;

    font-weight: 700;
}


/* =====================================
   BILL TO / FROM
===================================== */

.bill-info {
    display: flex;

    justify-content: space-between;

    gap: 20px;

    margin: 15px 5px 18px;
}

.bill-to,
.bill-from {
    width: 48%;
}

.bill-from {
    text-align: right;
}

.bill-info h3 {
    margin: 0 0 6px;

    font-size: 14px;

    color: #222;
}

.bill-info input {
    width: 100%;

    border: none;

    border-bottom: 1px solid #aaa;

    outline: none;

    padding: 3px 0;

    font-size: 11px;

    background: transparent;

    color: #222;
}

.bill-from input {
    text-align: right;
}


/* =====================================
   DATE
===================================== */

.date-row {
    margin: 8px 5px 18px;

    font-size: 11px;
}

.date-row input {
    border: none;

    border-bottom: 1px solid #aaa;

    outline: none;

    font-size: 11px;

    padding: 3px;

    background: transparent;
}


/* =====================================
   INVOICE TABLE
===================================== */

.table-responsive {
    width: 100%;

    overflow-x: auto;
}

.invoice-table {
    width: 100%;

    border-collapse: collapse;

    table-layout: fixed;
}

.invoice-table th {
    background: #07549b;

    color: #fff;

    border: 1px solid #07549b;

    padding: 7px 4px;

    text-align: center;

    font-size: 11px;

    font-weight: 900;
}

.invoice-table td {
    border: 1px solid #aaa;

    padding: 4px;

    text-align: center;

    vertical-align: middle;

    font-size: 10px;
}


/* Description column */

.invoice-table th:nth-child(1),
.invoice-table td:nth-child(1) {
    width: 43%;
}


/* Qty */

.invoice-table th:nth-child(2),
.invoice-table td:nth-child(2) {
    width: 12%;
}


/* Rate */

.invoice-table th:nth-child(3),
.invoice-table td:nth-child(3) {
    width: 15%;
}


/* Sqft */

.invoice-table th:nth-child(4),
.invoice-table td:nth-child(4) {
    width: 12%;
}


/* Total */

.invoice-table th:nth-child(5),
.invoice-table td:nth-child(5) {
    width: 18%;
}


/* =====================================
   TABLE INPUTS
===================================== */

.invoice-table input,
.invoice-table textarea {
    width: 100%;

    border: none;

    outline: none;

    background: transparent;

    color: #111;

    font-size: 10px;

    font-weight: 700;
}

.invoice-table textarea {
    min-height: 34px;

    resize: vertical;

    text-align: left;

    padding: 3px;

    line-height: 1.3;
}

.invoice-table input {
    text-align: center;

    padding: 3px;
}


/* =====================================
   REMOVE BUTTON
===================================== */

.btn-del {
    background: #dc2626;

    color: #fff;

    border: none;

    border-radius: 3px;

    padding: 3px 6px;

    font-size: 9px;

    cursor: pointer;
}


/* =====================================
   ADD ITEM BUTTON
===================================== */

.btn-add {
    margin-top: 8px;

    padding: 6px 10px;

    background: #198754;

    color: #fff;

    border: none;

    border-radius: 4px;

    font-size: 10px;

    cursor: pointer;
}


/* =====================================
   SUB TOTAL
===================================== */

.total-section {
    display: flex;

    justify-content: flex-end;

    margin-top: 8px;
}

.total-box {
    width: 40%;

    background: #07549b;

    color: #fff;

    padding: 7px 10px;

    display: flex;

    justify-content: space-between;

    align-items: center;

    font-size: 12px;

    font-weight: 900;
}

.total-box input {
    width: 90px;

    border: none;

    background: transparent;

    color: #fff;

    outline: none;

    text-align: right;

    font-size: 12px;

    font-weight: 900;
}
        /* =====================================
       NOTE SECTION
    ===================================== */

    .note-section {
        margin-top: 18px;
        width: 45%;
    }

    .note-title {
        font-size: 12px;
        font-weight: 900;
        margin-bottom: 5px;
    }

    .note-line {
        width: 100%;
        border: none;
        border-bottom: 1px solid #aaa;
        outline: none;
        background: transparent;
        margin: 5px 0;
        padding: 3px 0;
        font-size: 10px;
    }


    /* =====================================
       PAYMENT + THANK YOU
    ===================================== */

    .bottom-area {
        display: flex;

        justify-content: space-between;

        align-items: flex-end;

        margin-top: 25px;

        gap: 20px;
    }

    .payment-info {
        width: 55%;

        font-size: 10px;

        line-height: 1.6;
    }

    .payment-title {
        font-size: 12px;

        font-weight: 900;

        margin-bottom: 5px;
    }

    .payment-row {
        display: flex;

        gap: 8px;

        margin: 3px 0;
    }

    .payment-row strong {
        min-width: 55px;
    }

    .payment-row input {
        flex: 1;

        border: none;

        border-bottom: 1px solid #aaa;

        outline: none;

        background: transparent;

        font-size: 10px;

        padding: 2px;
    }


    /* =====================================
       THANK YOU
    ===================================== */

    .thank-you {
        width: 40%;

        text-align: center;

        font-size: 28px;

        color: #07549b;

        font-weight: 500;
    }


    /* =====================================
       ACTION BUTTONS
    ===================================== */

    .action-buttons {
        width: 100%;

        max-width: 850px;

        margin: 15px auto;

        display: flex;

        justify-content: center;

        gap: 10px;
    }

    .action-buttons button {
        border: none;

        border-radius: 5px;

        padding: 9px 18px;

        color: #fff;

        font-size: 12px;

        font-weight: 900;

        cursor: pointer;
    }

    .print-btn {
        background: #07549b;
    }

    .add-btn {
        background: #198754;
    }


    /* =====================================
       PRINT / PDF
    ===================================== */

    @media print {

        @page {
            size: A4 portrait;
            margin: 7mm;
        }

        body {
            margin: 0;
            padding: 0;
            background: #fff;
        }

        .container {
            width: 100%;
            max-width: none;
            margin: 0;
            padding: 10px;
            border: none;
        }

        .top-bar,
        .action-buttons,
        .btn-add,
        .no-print {
            display: none !important;
        }

        .invoice-header {
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        .invoice-table th,
        .total-box {
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        input,
        textarea {
            border: none !important;
            background: transparent !important;
            color: #000 !important;
        }

        .bill-number-box input {
            color: #fff !important;
        }

        .shop-name {
            color: #fff !important;
        }

        .invoice-table {
            page-break-inside: avoid;
        }

        .bottom-area {
            page-break-inside: avoid;
        }
    }


    /* =====================================
       MOBILE
    ===================================== */

    @media (max-width: 600px) {

        body {
            padding: 5px;
        }

        .container {
            padding: 10px;
        }

        .invoice-header {
            min-height: 160px;
            padding: 14px 10px 25px;
        }

        .invoice-main-title {
            font-size: 21px;
        }

        .bill-number-box {
            font-size: 9px;
        }

        .bill-number-box input {
            width: 80px;
            font-size: 9px;
        }

        .shop-name {
            font-size: 25px;
        }

        .shop-subtitle {
            font-size: 7px;
        }

        .shop-details {
            font-size: 7px;
        }

        .shop-details input {
            font-size: 7px;
        }

        .bill-info {
            gap: 10px;
            margin-left: 2px;
            margin-right: 2px;
        }

        .bill-info h3 {
            font-size: 11px;
        }

        .bill-info input {
            font-size: 9px;
        }

        .date-row {
            font-size: 9px;
        }

        .invoice-table th,
        .invoice-table td {
            font-size: 8px;
            padding: 3px 2px;
        }

        .invoice-table input,
        .invoice-table textarea {
            font-size: 8px;
        }

        .total-box {
            width: 48%;
            font-size: 9px;
        }

        .total-box input {
            width: 65px;
            font-size: 9px;
        }

        .note-section {
            width: 50%;
        }

        .bottom-area {
            gap: 8px;
        }

        .payment-info {
            font-size: 8px;
        }

        .payment-title {
            font-size: 9px;
        }

        .payment-row strong {
            min-width: 40px;
        }

        .payment-row input {
            font-size: 8px;
        }

        .thank-you {
            font-size: 20px;
        }
    }

</style>
</style>

</head>

<body>

<script>

/* =========================================
   INVOICE JAVASCRIPT
   PART-4
========================================= */

let invoiceLoaded = false;


/* =========================================
   PAGE LOAD
========================================= */

document.addEventListener("DOMContentLoaded", function () {

    const quotation =
        JSON.parse(localStorage.getItem("quotation")) || {};


    /* CUSTOMER */

    const custName =
        document.getElementById("custName");

    const custMobile =
        document.getElementById("custMobile");

    const custAddress =
        document.getElementById("custAddress");


    if (custName) {
        custName.value =
            quotation.customerName || "";
    }

    if (custMobile) {
        custMobile.value =
            quotation.mobile || "";
    }

    if (custAddress) {
        custAddress.value =
            quotation.address || "";
    }


    /* =====================================
       BILL NUMBER
    ===================================== */

    const billNo =
        document.getElementById("billNo");

    if (billNo) {

        billNo.value =
            localStorage.getItem("billNo") || "01";

    }


    /* =====================================
       DATE
    ===================================== */

    const billDate =
        document.getElementById("billDate");

    if (billDate) {

        const today = new Date();

        const dd =
            String(today.getDate())
                .padStart(2, "0");

        const mm =
            String(today.getMonth() + 1)
                .padStart(2, "0");

        const yyyy =
            today.getFullYear();

        billDate.value =
            dd + "-" + mm + "-" + yyyy;

    }


    /* =====================================
       LOAD CALCULATOR DATA
    ===================================== */

    loadQuotationItems();

    invoiceLoaded = true;

});


/* =========================================
   LOAD QUOTATION ITEMS
========================================= */

function loadQuotationItems() {

    const quotation =
        JSON.parse(
            localStorage.getItem("quotation")
        ) || {};


    const aluminium =
        cleanNumber(
            quotation.totalAluminium
        );


    const glass =
        cleanNumber(
            quotation.glass
        );


    const hardware =
        cleanNumber(
            quotation.hardwareCost
        );


    const fittings =
        cleanNumber(
            quotation.fittingsCost
        );


    const labour =
        cleanNumber(
            quotation.labourCost
        );


    let loaded = false;


    /* =====================================
       ALUMINIUM
    ===================================== */

    if (aluminium > 0) {

        addInvoiceRow(
            "Aluminium",
            1,
            "",
            aluminium
        );

        loaded = true;

    }


    /* =====================================
       GLASS
    ===================================== */

    if (glass > 0) {

        addInvoiceRow(
            "Glass",
            1,
            "",
            glass
        );

        loaded = true;

    }


    /* =====================================
       HARDWARE
    ===================================== */

    if (hardware > 0) {

        addInvoiceRow(
            "Hardware",
            1,
            hardware,
            1
        );

        loaded = true;

    }


    /* =====================================
       FITTINGS
    ===================================== */

    if (fittings > 0) {

        addInvoiceRow(
            "Fittings",
            1,
            fittings,
            1
        );

        loaded = true;

    }


    /* =====================================
       LABOUR
    ===================================== */

    if (labour > 0) {

        addInvoiceRow(
            "Labour",
            1,
            labour,
            1
        );

        loaded = true;

    }


    /* =====================================
       EMPTY ROW
    ===================================== */

    if (!loaded) {

        addInvoiceRow();

    }


    calculateGrandTotal();

}


/* =========================================
   CLEAN NUMBER
========================================= */

function cleanNumber(value) {

    if (
        value === undefined ||
        value === null
    ) {

        return 0;

    }


    return parseFloat(
        String(value)
            .replace(/[^0-9.-]/g, "")
    ) || 0;

}


/* =========================================
   ADD INVOICE ROW
========================================= */

function addInvoiceRow(
    description = "",
    qty = 1,
    rate = "",
    sqft = ""
) {

    const tbody =
        document.getElementById(
            "invoiceTableBody"
        );


    if (!tbody) return;


    const tr =
        document.createElement("tr");


    tr.innerHTML = `

        <td class="sl-number"></td>

        <td>
            <textarea
                class="item-description"
                placeholder="Description..."
            >${description}</textarea>
        </td>

        <td>
            <input
                type="number"
                class="item-qty"
                value="${qty}"
                min="0"
                step="0.01"
                oninput="calculateRow(this)"
            >
        </td>

        <td>
            <input
                type="number"
                class="item-rate"
                value="${rate}"
                min="0"
                step="0.01"
                placeholder="Rate"
                oninput="calculateRow(this)"
            >
        </td>

        <td>
            <input
                type="number"
                class="item-sqft"
                value="${sqft}"
                min="0"
                step="0.01"
                placeholder="Sqft"
                oninput="calculateRow(this)"
            >
        </td>

        <td>
            <input
                type="number"
                class="item-amount"
                value="0.00"
                readonly
            >
        </td>

        <td class="no-print">

            <button
                type="button"
                class="btn-del"
                onclick="removeInvoiceRow(this)"
            >
                X
            </button>

        </td>

    `;


    tbody.appendChild(tr);


    updateRowIndices();


    calculateRow(
        tr.querySelector(".item-rate")
    );

}


/* =========================================
   REMOVE ROW
========================================= */

function removeInvoiceRow(btn) {

    const tbody =
        document.getElementById(
            "invoiceTableBody"
        );


    if (!tbody) return;


    if (tbody.rows.length <= 1) {

        alert(
            "কমপক্ষে একটি Item রাখতে হবে!"
        );

        return;

    }


    const row =
        btn.closest("tr");


    if (row) {

        row.remove();

    }


    updateRowIndices();

    calculateGrandTotal();

}


/* =========================================
   SERIAL NUMBER
========================================= */

function updateRowIndices() {

    const rows =
        document.querySelectorAll(
            "#invoiceTableBody tr"
        );


    rows.forEach(
        function (row, index) {

            const number =
                index + 1;


            const serial =
                row.querySelector(
                    ".sl-number"
                );


            if (serial) {

                serial.innerText =
                    number < 10
                        ? "0" + number
                        : number;

            }

        }
    );

}


/* =========================================
   CALCULATE ROW

   Qty × Rate × Sqft
========================================= */

function calculateRow(input) {

    const row =
        input.closest("tr");


    if (!row) return;


    const qty =
        parseFloat(
            row.querySelector(
                ".item-qty"
            ).value
        ) || 0;


    const rate =
        parseFloat(
            row.querySelector(
                ".item-rate"
            ).value
        ) || 0;


    const sqft =
        parseFloat(
            row.querySelector(
                ".item-sqft"
            ).value
        ) || 0;


    const amount =
        qty * rate * sqft;


    const amountInput =
        row.querySelector(
            ".item-amount"
        );


    if (amountInput) {

        amountInput.value =
            amount.toFixed(2);

    }


    calculateGrandTotal();

}


/* =========================================
   GRAND TOTAL
========================================= */

function calculateGrandTotal() {

    let total = 0;


    document.querySelectorAll(
        "#invoiceTableBody .item-amount"
    ).forEach(
        function (input) {

            total +=
                parseFloat(
                    input.value
                ) || 0;

        }
    );


    const totalInput =
        document.getElementById(
            "grandTotal"
        );


    if (totalInput) {

        totalInput.value =
            total.toFixed(2);

    }

}


/* =========================================
   BILL NUMBER SAVE
========================================= */

document.addEventListener(
    "input",
    function (event) {

        if (
            event.target &&
            event.target.id === "billNo"
        ) {

            localStorage.setItem(
                "billNo",
                event.target.value
            );

        }

    }
);


/* =========================================
   SAVE INVOICE
========================================= */

function saveInvoiceData() {

    const rows = [];


    document.querySelectorAll(
        "#invoiceTableBody tr"
    ).forEach(
        function (row) {

            const description =
                row.querySelector(
                    ".item-description"
                );


            const qty =
                row.querySelector(
                    ".item-qty"
                );


            const rate =
                row.querySelector(
                    ".item-rate"
                );


            const sqft =
                row.querySelector(
                    ".item-sqft"
                );


            const amount =
                row.querySelector(
                    ".item-amount"
                );


            rows.push({

                description:
                    description
                        ? description.value
                        : "",

                qty:
                    qty
                        ? qty.value
                        : "0",

                rate:
                    rate
                        ? rate.value
                        : "0",

                sqft:
                    sqft
                        ? sqft.value
                        : "0",

                amount:
                    amount
                        ? amount.value
                        : "0"

            });

        }
    );


    const invoice = {

        customer:
            document.getElementById(
                "custName"
            )?.value || "",

        mobile:
            document.getElementById(
                "custMobile"
            )?.value || "",

        address:
            document.getElementById(
                "custAddress"
            )?.value || "",

        billNo:
            document.getElementById(
                "billNo"
            )?.value || "",

        date:
            document.getElementById(
                "billDate"
            )?.value || "",

        total:
            document.getElementById(
                "grandTotal"
            )?.value || "0.00",

        rows: rows

    };


    localStorage.setItem(
        "currentInvoice",
        JSON.stringify(invoice)
    );

}


/* =========================================
   PRINT / PDF
========================================= */

function printInvoice() {

    calculateGrandTotal();

    saveInvoiceData();

    window.print();

}


/* =========================================
   BEFORE PRINT
========================================= */

window.addEventListener(
    "beforeprint",
    function () {

        calculateGrandTotal();

        saveInvoiceData();

    }
);


/* =========================================
   AFTER PRINT
========================================= */

window.addEventListener(
    "afterprint",
    function () {

        saveInvoiceData();

    }
);

</script>
<!-- =========================================

     PRINT BUTTON + FINAL CONTROLS

<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bill & Invoice - RM Thai Aluminium</title>
<!-- Image Download করার জন্য html2canvas লাইব্রেরি যুক্ত করা হলো -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
* {
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
    font-weight: 700;
}
body {
    margin: 0;
    padding: 0;
    background: #e2e8f0;
    color: #000;
}

/* কন্টেইনার সেটআপ */
.container {
    width: 100%;
    max-width: 800px;
    min-height: 1050px;
    margin: 20px auto;
    background: #fff;
    box-shadow: 0 0 15px rgba(0,0,0,0.15);
    display: flex;
    flex-direction: column;
    border: 1px solid #e2e8f0; 
    overflow-x: hidden; 
    padding-bottom: 15px;
    box-sizing: border-box;
}

/* ব্লু কালারের হেডার */
.invoice-header {
    position: relative;
    background: linear-gradient(135deg, #023871 0%, #0c59a4 55%, #022a52 100%);
    height: 75px;
    padding: 0 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    clip-path: polygon(0 0, 100% 0, 100% 75%, 75% 100%, 25% 75%, 0 100%);
    margin-bottom: 5px;
}

.invoice-main-title {
    position: relative;
    z-index: 5;
    font-size: 20px;
    color: #fff;
    letter-spacing: 2px;
    font-weight: 900;
}

.bill-number-box {
    position: relative;
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 2px; 
    color: #fff;
    font-size: 13px;
}
.bill-number-box input {
    width: 95px;
    border: none;
    background: transparent;
    color: #fff;
    outline: none;
    font-size: 13px;
    font-weight: 900;
    text-align: left; 
    padding-left: 2px;
}

/* দোকানের নাম */
.shop-title-section {
    text-align: center;
    margin: 10px 0 12px 0;
    padding: 0 25px;
}
.shop-name {
    display: block;
    font-size: clamp(22px, 5vw, 34px); 
    font-weight: 900;
    color: #0c59a4;
    background: transparent;
    border: none;
    outline: none;
    text-align: center;
    text-transform: uppercase;
    width: 100%;
}
.shop-subtitle {
    display: block;
    width: 100%;
    border: none;
    outline: none;
    background: transparent;
    color: #334155;
    font-size: 12px;
    margin-top: 2px;
    text-align: center;
    font-weight: 700;
}

/* বিল টু এবং ফ্রম */
.bill-info {
    display: flex;
    justify-content: space-between;
    padding: 0 25px;
    margin: 8px 0 8px 0;
}
.bill-to, .bill-from {
    width: 48%; 
}
.bill-from {
    text-align: right;
}
.bill-info h3 {
    margin: 0 0 4px;
    font-size: 13px;
    color: #0d5aa7;
}
.bill-info input, .bill-info textarea {
    width: 100%;
    border: none;
    outline: none;
    padding: 2px 0;
    font-size: 12px;
    background: transparent;
    color: #000;
    font-weight: 700;
}
.bill-info textarea {
    resize: none;
}
.bill-from input, .bill-from textarea {
    text-align: right;
}

.date-row {
    padding: 0 25px;
    margin-bottom: 12px;
    font-size: 12px;
}
.date-row input {
    border: none;
    outline: none;
    font-size: 12px;
    background: transparent;
    font-weight: 900;
    color: #000;
}

/* টেবিল ডিজাইন */
.table-responsive {
    padding: 0 25px;
    width: 100%;
    overflow-x: auto;
}
.invoice-table {
    width: 100%;
    border-collapse: collapse;
}
.invoice-table th {
    background: #0d5aa7;
    color: #fff;
    border: 1px solid #0d5aa7;
    padding: 7px 4px;
    text-align: center;
    font-size: 12px;
}
.invoice-table td {
    border: 1px solid #94a3b8;
    padding: 5px;
    text-align: center;
    vertical-align: middle;
    font-size: 12px;
}

.invoice-table th:nth-child(1), .invoice-table td:nth-child(1) { width: 32%; text-align: left; }
.invoice-table th:nth-child(2), .invoice-table td:nth-child(2) { width: 9%; }
.invoice-table th:nth-child(3), .invoice-table td:nth-child(3) { width: 13%; }
.invoice-table th:nth-child(4), .invoice-table td:nth-child(4) { width: 13%; }
.invoice-table th:nth-child(5), .invoice-table td:nth-child(5) { width: 20%; }
.invoice-table th:nth-child(6), .invoice-table td:nth-child(6) { width: 7%; }

.invoice-table input, .invoice-table textarea {
    width: 100%;
    border: none;
    outline: none;
    background: transparent;
    color: #000;
    font-size: 12px;
    font-weight: 700;
    text-align: center;
}
.item-description {
    min-height: 28px;
    resize: vertical;
    text-align: left !important;
    padding: 2px;
}

.btn-del {
    background: #dc2626;
    color: #fff;
    border: none;
    border-radius: 4px;
    padding: 3px 5px;
    font-size: 10px;
    cursor: pointer;
}
.btn-add {
    margin: 10px 25px;
    padding: 6px 12px;
    background: #198754;
    color: #fff;
    border: none;
    border-radius: 4px;
    font-size: 11px;
    cursor: pointer;
    font-weight: 700;
}

/* গ্র্যান্ড টোটাল */
.total-section {
    display: flex;
    justify-content: flex-end;
    padding: 0 25px;
    margin-top: 10px;
}
.total-box {
    width: auto;
    min-width: 250px; 
    background: #0d5aa7;
    color: #fff;
    padding: 7px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    font-weight: 900;
}
.total-box input {
    width: 110px;
    border: none;
    background: transparent;
    color: #fff;
    outline: none;
    text-align: right;
    font-size: 13px;
    font-weight: 900;
}

.note-section {
    padding: 0 25px;
    margin-top: 10px;
    width: 100%;
    max-width: 400px;
}
.note-title {
    font-size: 12px;
    margin-bottom: 3px;
    color: #0d5aa7;
}
.note-line {
    width: 100%;
    border: none;
    border-bottom: 1px solid #94a3b8;
    outline: none;
    background: transparent;
    margin: 4px 0;
    padding: 2px 0;
    font-size: 11px;
    color: #000;
}

.bottom-area {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding: 0 25px;
    margin-top: 15px;
}
.payment-info {
    width: 100%;
    max-width: 320px;
    font-size: 11px;
}
.payment-title {
    font-size: 12px;
    margin-bottom: 5px;
    color: #0d5aa7;
}
.payment-row {
    display: flex;
    gap: 8px;
    margin: 3px 0;
}
.payment-row strong {
    min-width: 60px;
    color: #000;
}
.payment-row input {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    font-size: 11px;
    color: #000;
    font-weight: 700;
}

/* সিগনেচার সেকশন */
.signature-section {
    margin-top: auto; 
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding: 20px 25px 10px 25px;
}
.sig-box {
    width: 160px; 
    text-align: center;
    font-size: 12px;
    font-weight: 900;
    color: #000;
}
.sig-line {
    width: 100%;
    border-top: 1.5px solid #000; 
    margin-bottom: 6px;
}

.action-buttons {
    text-align: center;
    margin-bottom: 40px;
    margin-top: 20px;
    display: flex;
    justify-content: center;
    gap: 15px;
}
.btn-print {
    background: #1d4ed8;
    color: #ffffff;
    border: none;
    border-radius: 8px;
    padding: 12px 25px;
    font-size: 15px;
    cursor: pointer;
    font-weight: 900;
}

/* নতুন ইমেজ ডাউনলোড বাটন স্টাইল */
.btn-image {
    background: #059669; /* সুন্দর সবুজ রঙ */
    color: #ffffff;
    border: none;
    border-radius: 8px;
    padding: 12px 25px;
    font-size: 15px;
    cursor: pointer;
    font-weight: 900;
}

/* প্রিন্ট মিডিয়া স্টাইল - স্ট্রিক্টলি ১ পেজ A4 এবং আউটলাইন ছাড়া (বর্ডার নেই) */
@media print {
    @page { 
        size: A4 portrait; 
        margin: 0; 
    }
    html, body { 
        width: 210mm;
        height: 297mm;
        margin: 0; 
        padding: 0;
        background: #fff; 
        overflow: hidden !important; 
        -webkit-print-color-adjust: exact !important; 
        print-color-adjust: exact !important; 
    }
    
    .container { 
        box-shadow: none !important; 
        width: 100% !important;
        height: 297mm !important; 
        max-height: 297mm !important;
        margin: 0 !important; 
        padding: 10mm 15mm 10mm 15mm !important; 
        border: none !important; 
        box-sizing: border-box !important;
        display: flex !important;
        flex-direction: column !important;
        justify-content: space-between !important;
        page-break-after: avoid !important; 
        page-break-inside: avoid !important;
    }
    
    .signature-section {
        margin-top: auto !important;
        padding-bottom: 5mm !important;
    }

    .action-buttons, .btn-add, .no-print, .btn-del { display: none !important; }
    
    * {
        color: #000 !important;
        font-weight: 700 !important;
    }

    .invoice-header {
        background: linear-gradient(135deg, #023871 0%, #0c59a4 55%, #022a52 100%) !important;
    }
    .invoice-header *, .total-box, .total-box input { 
        color: #fff !important; 
    }
    .invoice-table th { 
        background: #0d5aa7 !important; 
        color: #fff !important;
    }

    input, textarea { 
        border: none !important; 
        background: transparent !important; 
        color: #000 !important;
    }
}
</style>
</head>
<body>

<div class="container" id="invoiceContainer">

    <div>
        <div class="invoice-header">
            <div class="invoice-main-title">INVOICE</div>
            <div class="bill-number-box">
                <span>NO:</span>
                <input type="text" id="billNo" value="INV-12345-1">
            </div>
        </div>

        <div class="shop-title-section">
            <input type="text" class="shop-name" id="shopName" value="RM THAI ALUMINIUM" oninput="savePersistentData()">
            <input type="text" class="shop-subtitle" id="shopSubtitle" value="Experts in Thai Windows, Doors, Glass Works & False Ceilings" oninput="savePersistentData()">
        </div>

        <div class="bill-info">
            <div class="bill-to">
                <h3>Bill To:</h3>
                <input type="text" id="custName" value="" placeholder="Customer Name">
                <input type="text" id="custMobile" value="" placeholder="Mobile Number">
                <textarea id="custAddress" rows="2" placeholder="Address"></textarea>
            </div>
            <div class="bill-from">
                <h3>From:</h3>
                <input type="text" id="fromName" value="Rubel Molla" oninput="savePersistentData()">
                <input type="text" id="fromPhone" value="01676-474412" oninput="savePersistentData()">
                <textarea id="fromAddress" rows="2" oninput="savePersistentData()">47/4, Haji Ali Hossain Road, Mirpur-13, Dhaka-1216</textarea>
            </div>
        </div>

        <div class="date-row">
            <strong>Date:</strong> <input type="text" id="billDate">
        </div>

        <div class="table-responsive">
            <table class="invoice-table">
                <thead>
                    <tr>
                        <th>Description</th>
                        <th>Qty</th>
                        <th>Rate</th>
                        <th>Sqft</th>
                        <th>Amount</th>
                        <th class="no-print">Act</th>
                    </tr>
                </thead>
                <tbody id="invoiceTableBody"></tbody>
            </table>
        </div>

        <button type="button" class="btn-add no-print" onclick="addInvoiceRow()">+ Add Item</button>

        <div class="total-section">
            <div class="total-box">
                <span>Grand Total Tk.</span>
                <input type="text" id="grandTotal" value="0.00" readonly>
            </div>
        </div>

        <div class="note-section">
            <div class="note-title">Note:</div>
            <input type="text" class="note-line" id="note1" value="Special discount applied." oninput="savePersistentData()">
            <input type="text" class="note-line" id="note2" oninput="savePersistentData()">
        </div>

        <div class="bottom-area">
            <div class="payment-info">
                <div class="payment-title">Payment Information:</div>
                <div class="payment-row"><strong>Bank:</strong> <input type="text" id="paymentBank" value="Name Bank" oninput="savePersistentData()"></div>
                <div class="payment-row"><strong>No Bank:</strong> <input type="text" id="paymentBankNo" value="123-456-7890" oninput="savePersistentData()"></div>
                <div class="payment-row"><strong>Email:</strong> <input type="text" id="paymentEmail" value="reallygreatsite.com" oninput="savePersistentData()"></div>
            </div>
        </div>
    </div>

    <!-- সিগনেচার সেকশন -->
    <div class="signature-section">
        <div class="sig-box">
            <div class="sig-line"></div>
            Customer Signature
        </div>
        
        <div class="sig-box">
            <div class="sig-line"></div>
            Authorized Signature
        </div>
    </div>

</div>

<!-- দুটি বাটন দেওয়া হয়েছে (PDF এবং Image) -->
<div class="action-buttons no-print">
    <button type="button" class="btn-print" onclick="printInvoice()">🖨️ Save as PDF</button>
    <button type="button" class="btn-image" onclick="downloadImage()">🖼️ Download Image</button>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const today = new Date();
    const dd = String(today.getDate()).padStart(2, "0");
    const mm = String(today.getMonth() + 1).padStart(2, "0");
    const yyyy = today.getFullYear();
    document.getElementById("billDate").value = dd + "-" + mm + "-" + yyyy;

    loadPersistentData();
    addInvoiceRow("", 1, "", "");
});

function savePersistentData() {
    const data = {
        shopName: document.getElementById("shopName").value,
        shopSubtitle: document.getElementById("shopSubtitle").value,
        fromName: document.getElementById("fromName").value,
        fromPhone: document.getElementById("fromPhone").value,
        fromAddress: document.getElementById("fromAddress").value,
        paymentBank: document.getElementById("paymentBank").value,
        paymentBankNo: document.getElementById("paymentBankNo").value,
        paymentEmail: document.getElementById("paymentEmail").value,
        note1: document.getElementById("note1").value,
        note2: document.getElementById("note2").value
    };
    localStorage.setItem("rm_invoice_saved_info", JSON.stringify(data));
}

function loadPersistentData() {
    const saved = localStorage.getItem("rm_invoice_saved_info");
    if (saved) {
        try {
            const data = JSON.parse(saved);
            if (data.shopName !== undefined) document.getElementById("shopName").value = data.shopName;
            if (data.shopSubtitle !== undefined) document.getElementById("shopSubtitle").value = data.shopSubtitle;
            if (data.fromName !== undefined) document.getElementById("fromName").value = data.fromName;
            if (data.fromPhone !== undefined) document.getElementById("fromPhone").value = data.fromPhone;
            if (data.fromAddress !== undefined) document.getElementById("fromAddress").value = data.fromAddress;
            if (data.paymentBank !== undefined) document.getElementById("paymentBank").value = data.paymentBank;
            if (data.paymentBankNo !== undefined) document.getElementById("paymentBankNo").value = data.paymentBankNo;
            if (data.paymentEmail !== undefined) document.getElementById("paymentEmail").value = data.paymentEmail;
            if (data.note1 !== undefined) document.getElementById("note1").value = data.note1;
            if (data.note2 !== undefined) document.getElementById("note2").value = data.note2;
        } catch(e) {
            console.error("Error loading saved data", e);
        }
    }
}

function addInvoiceRow(description = "", qty = 1, rate = "", sqft = "") {
    const tbody = document.getElementById("invoiceTableBody");
    const tr = document.createElement("tr");
    tr.innerHTML = `
        <td><textarea class="item-description" placeholder="Description & Size (e.g. 5.0*4)..." oninput="autoExtractSize(this)">${description}</textarea></td>
        <td><input type="number" class="item-qty" value="${qty}" min="0" step="0.01" oninput="calculateRow(this)"></td>
        <td><input type="number" class="item-rate" value="${rate}" min="0" step="0.01" placeholder="Rate" oninput="calculateRow(this)"></td>
        <td><input type="number" class="item-sqft" value="${sqft}" min="0" step="0.01" placeholder="Auto Sqft" oninput="calculateRow(this)"></td>
        <td><input type="text" class="item-amount" value="0.00" readonly></td>
        <td class="no-print"><button type="button" class="btn-del" onclick="removeInvoiceRow(this)">X</button></td>
    `;
    tbody.appendChild(tr);
    autoExtractSize(tr.querySelector(".item-description"));
}

function convertBnToEnNum(str) {
    return str.replace(/[০-৯]/g, function(d) {
        return "০১২৩৪৫৬৭৮৯".indexOf(d);
    });
}

function autoExtractSize(textarea) {
    const text = convertBnToEnNum(textarea.value); 
    const regex = /(\d+(?:\.\d+)?)\s*[\*x×]\s*(\d+(?:\.\d+)?)/i;
    const match = text.match(regex);
    
    const row = textarea.closest("tr");
    
    if (match) {
        const num1 = parseFloat(match[1]);
        const num2 = parseFloat(match[2]);
        const unitSqft = num1 * num2;
        row.dataset.unitSqft = unitSqft; 
    } else {
        delete row.dataset.unitSqft;
    }
    calculateRow(textarea);
}

function removeInvoiceRow(btn) {
    const tbody = document.getElementById("invoiceTableBody");
    if (tbody.rows.length <= 1) {
        alert("কমপক্ষে একটি আইটেম রাখা আবশ্যক!");
        return;
    }
    btn.closest("tr").remove();
    calculateGrandTotal();
}

function calculateRow(element) {
    const row = element.closest("tr");
    const qty = parseFloat(row.querySelector(".item-qty").value) || 0;
    const rate = parseFloat(row.querySelector(".item-rate").value) || 0;
    const sqftInput = row.querySelector(".item-sqft");
    
    if (element === sqftInput) {
        if (qty > 0 && sqftInput.value !== "") {
            row.dataset.unitSqft = (parseFloat(sqftInput.value) / qty);
        }
    } else if (row.dataset.unitSqft) {
        const unitSqft = parseFloat(row.dataset.unitSqft);
        const totalSqft = qty * unitSqft; 
        sqftInput.value = totalSqft > 0 ? totalSqft.toFixed(2) : "";
    }
    
    const sqft = parseFloat(sqftInput.value) || 0;
    let amount = 0;
    
    if (sqft > 0) {
        amount = rate * sqft; 
    } else {
        amount = qty * rate; 
    }
    
    row.querySelector(".item-amount").value = amount.toFixed(2);
    calculateGrandTotal();
}

function calculateGrandTotal() {
    let total = 0;
    document.querySelectorAll("#invoiceTableBody .item-amount").forEach(input => {
        let val = parseFloat(input.value);
        if (!isNaN(val)) {
            total += val;
        }
    });
    document.getElementById("grandTotal").value = total.toFixed(2);
}

function printInvoice() {
    calculateGrandTotal();
    window.print();
}

/* --- নতুন যুক্ত করা ইমেজ ডাউনলোড ফাংশন --- */
function downloadImage() {
    calculateGrandTotal(); 
    
    // যে বিষয়গুলো ইমেজে দেখাতে চাই না, সেগুলো সাময়িক হাইড করা
    const hideElements = document.querySelectorAll('.no-print');
    hideElements.forEach(el => el.style.display = 'none');

    const container = document.getElementById("invoiceContainer");

    // scale: 3 দিয়ে হাই কোয়ালিটি ইমেজ জেনারেট করা হচ্ছে
    html2canvas(container, { scale: 3, useCORS: true }).then(canvas => {
        const link = document.createElement('a');
        const invoiceNo = document.getElementById('billNo').value || "Invoice";
        link.download = invoiceNo + '.png'; // ফাইলের নাম
        link.href = canvas.toDataURL('image/png');
        link.click();

        // ইমেজ তৈরি হয়ে গেলে আবার বাটনগুলো ফিরিয়ে আনা
        hideElements.forEach(el => el.style.display = '');
    }).catch(err => {
        console.error("Image capture error: ", err);
        alert("ইমেজ তৈরি করতে সমস্যা হয়েছে!");
        hideElements.forEach(el => el.style.display = '');
    });
}
</script>

</body>
</html>

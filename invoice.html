<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bill & Invoice - Aluminium ERP BD</title>
<style>
* {
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
    font-weight: 700;
}
body {
    margin: 0;
    padding: 10px;
    background: #e2e8f0;
    color: #111;
}
.container {
    width: 100%;
    max-width: 800px;
    margin: 0 auto;
    background: #fff;
    padding-bottom: 25px;
    box-shadow: 0 0 15px rgba(0,0,0,0.15);
}
.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 20px;
    background: #1e293b;
    color: white;
}
.back-btn {
    color: #fff;
    text-decoration: none;
    font-size: 13px;
}

/* =========================================
   হুবহু আপনার মূল ছবির মতো নিখুঁত ওয়েভ হেডার (Clip-path দিয়ে করা)
========================================= */
.invoice-header {
    position: relative;
    background: linear-gradient(135deg, #023871 0%, #0c59a4 55%, #022a52 100%);
    height: 120px;
    padding: 0 35px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    /* আপনার ছবির মতো নিখুঁত ওয়েভ ও কার্ভ শেপ তৈরি করতে clip-path ব্যবহার করা হয়েছে */
    clip-path: polygon(0 0, 100% 0, 100% 85%, 75% 100%, 25% 85%, 0 100%);
    margin-bottom: 10px;
}

.invoice-main-title {
    position: relative;
    z-index: 5;
    font-size: 26px;
    color: #fff;
    letter-spacing: 2px;
    font-weight: 900;
}

.bill-number-box {
    position: relative;
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 4px;
    color: #fff;
    font-size: 13px;
}
.bill-number-box input {
    width: 110px;
    border: none;
    background: transparent;
    color: #fff;
    outline: none;
    font-size: 13px;
    font-weight: 900;
    text-align: right;
}

/* বিল ইনফো (এডিটেবল) */
.bill-info {
    display: flex;
    justify-content: space-between;
    padding: 0 30px;
    margin: 15px 0 12px 0;
}
.bill-to, .bill-from {
    width: 46%;
}
.bill-from {
    text-align: right;
}
.bill-info h3 {
    margin: 0 0 5px;
    font-size: 13px;
    color: #0d5aa7;
}
.bill-info input, .bill-info textarea {
    width: 100%;
    border: none;
    outline: none;
    padding: 3px 0;
    font-size: 12px;
    background: transparent;
    color: #111;
    font-weight: 700;
}
.bill-from input, .bill-from textarea {
    text-align: right;
}

.date-row {
    padding: 0 30px;
    margin-bottom: 15px;
    font-size: 12px;
}
.date-row input {
    border: none;
    outline: none;
    font-size: 12px;
    background: transparent;
    font-weight: 900;
    color: #111;
}

/* টেবিল ডিজাইন */
.table-responsive {
    padding: 0 30px;
    width: 100%;
}
.invoice-table {
    width: 100%;
    border-collapse: collapse;
}
.invoice-table th {
    background: #0d5aa7;
    color: #fff;
    border: 1px solid #0d5aa7;
    padding: 8px 6px;
    text-align: center;
    font-size: 11px;
}
.invoice-table td {
    border: 1px solid #cbd5e1;
    padding: 6px;
    text-align: center;
    vertical-align: middle;
    font-size: 11px;
}

/* কলাম সাইজ */
.invoice-table th:nth-child(1), .invoice-table td:nth-child(1) { width: 32%; text-align: left; }
.invoice-table th:nth-child(2), .invoice-table td:nth-child(2) { width: 9%; }
.invoice-table th:nth-child(3), .invoice-table td:nth-child(3) { width: 13%; }
.invoice-table th:nth-child(4), .invoice-table td:nth-child(4) { width: 13%; }
.invoice-table th:nth-child(5), .invoice-table td:nth-child(5) { width: 18%; }
.invoice-table th:nth-child(6), .invoice-table td:nth-child(6) { width: 9%; }

.invoice-table input, .invoice-table textarea {
    width: 100%;
    border: none;
    outline: none;
    background: transparent;
    color: #111;
    font-size: 11px;
    font-weight: 700;
    text-align: center;
}
.item-description {
    min-height: 32px;
    resize: vertical;
    text-align: left !important;
    padding: 2px;
}

.btn-del {
    background: #dc2626;
    color: #fff;
    border: none;
    border-radius: 4px;
    padding: 3px 6px;
    font-size: 10px;
    cursor: pointer;
}
.btn-add {
    margin: 12px 30px;
    padding: 6px 12px;
    background: #198754;
    color: #fff;
    border: none;
    border-radius: 4px;
    font-size: 11px;
    cursor: pointer;
    font-weight: 700;
}

/* গ্র্যান্ড টোটাল */
.total-section {
    display: flex;
    justify-content: flex-end;
    padding: 0 30px;
    margin-top: 15px;
}
.total-box {
    width: 45%;
    background: #0d5aa7;
    color: #fff;
    padding: 8px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    font-weight: 900;
}
.total-box input {
    width: 110px;
    border: none;
    background: transparent;
    color: #fff;
    outline: none;
    text-align: right;
    font-size: 13px;
    font-weight: 900;
}

.note-section {
    padding: 0 30px;
    margin-top: 20px;
    width: 60%;
}
.note-title {
    font-size: 12px;
    margin-bottom: 5px;
    color: #0d5aa7;
}
.note-line {
    width: 100%;
    border: none;
    border-bottom: 1px solid #94a3b8;
    outline: none;
    background: transparent;
    margin: 6px 0;
    padding: 3px 0;
    font-size: 11px;
}

.bottom-area {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding: 0 30px;
    margin-top: 25px;
}
.payment-info {
    width: 50%;
    font-size: 11px;
}
.payment-title {
    font-size: 12px;
    margin-bottom: 5px;
    color: #0d5aa7;
}
.payment-row {
    display: flex;
    gap: 8px;
    margin: 3px 0;
}
.payment-row strong {
    min-width: 55px;
}
.payment-row input {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    font-size: 11px;
}
.thank-you {
    width: 40%;
    text-align: right;
    font-size: 24px;
    color: #0d5aa7;
    font-weight: 900;
}

.action-buttons {
    text-align: center;
    margin-top: 25px;
}
.btn-print {
    background: #1d4ed8;
    color: #ffffff;
    border: none;
    border-radius: 8px;
    padding: 12px 25px;
    font-size: 15px;
    cursor: pointer;
    font-weight: 900;
}

@media print {
    @page { size: A4 portrait; margin: 8mm; }
    body { background: #fff; padding: 0; }
    .container { box-shadow: none; max-width: 100%; padding: 0; margin: 0; }
    .top-bar, .action-buttons, .btn-add, .no-print, .btn-del { display: none !important; }
    
    .invoice-header, .invoice-table th, .total-box { 
        -webkit-print-color-adjust: exact !important; 
        print-color-adjust: exact !important; 
    }
    input, textarea { border: none !important; background: transparent !important; }
}
</style>
</head>
<body>

<div class="container" id="invoiceContainer">

    <div class="top-bar no-print">
        <a href="index.html" class="back-btn">⬅️ Back to Dashboard</a>
        <span>PDF Creator</span>
    </div>

    <!-- হুবহু কাঙ্ক্ষিত ছবির মতো কার্ভড ওয়েভ হেডার ডিজাইন -->
    <div class="invoice-header">
        <div class="invoice-main-title">INVOICE</div>
        <div class="bill-number-box">
            <span>NO:</span>
            <input type="text" id="billNo" value="INV-12345-1">
        </div>
    </div>

    <!-- বিল টু এবং ফ্রম (এডিটেবল) -->
    <div class="bill-info">
        <div class="bill-to">
            <h3>Bill To:</h3>
            <input type="text" id="custName" value="RM COMPUTER">
            <input type="text" id="custMobile" value="01712345678">
            <textarea id="custAddress" rows="2">পাবনা</textarea>
        </div>
        <div class="bill-from">
            <h3>From:</h3>
            <input type="text" value="Rubel Molla">
            <input type="text" value="01676-474412">
            <textarea rows="2">47/4, Haji Ali Hossain Road, Mirpur-13, Dhaka-1216</textarea>
        </div>
    </div>

    <div class="date-row">
        <strong>Date:</strong> <input type="text" id="billDate">
    </div>

    <div class="table-responsive">
        <table class="invoice-table">
            <thead>
                <tr>
                    <th>Description</th>
                    <th>Qty</th>
                    <th>Rate</th>
                    <th>Sqft</th>
                    <th>Amount</th>
                    <th class="no-print">Act</th>
                </tr>
            </thead>
            <tbody id="invoiceTableBody"></tbody>
        </table>
    </div>

    <button type="button" class="btn-add no-print" onclick="addInvoiceRow()">+ Add Item</button>

    <div class="total-section">
        <div class="total-box">
            <span>Grand Total</span>
            <span>Tk. <input type="text" id="grandTotal" value="0.00" readonly></span>
        </div>
    </div>

    <div class="note-section">
        <div class="note-title">Note:</div>
        <input type="text" class="note-line" value="Special discount applied.">
        <input type="text" class="note-line">
    </div>

    <div class="bottom-area">
        <div class="payment-info">
            <div class="payment-title">Payment Information:</div>
            <div class="payment-row"><strong>Bank:</strong> <input type="text" value="Name Bank"></div>
            <div class="payment-row"><strong>No Bank:</strong> <input type="text" value="123-456-7890"></div>
            <div class="payment-row"><strong>Email:</strong> <input type="text" value="reallygreatsite.com"></div>
        </div>
        <div class="thank-you">Thank You!</div>
    </div>

</div>

<div class="action-buttons no-print">
    <button type="button" class="btn-print" onclick="printInvoice()">🖨️ Save as PDF</button>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const today = new Date();
    const dd = String(today.getDate()).padStart(2, "0");
    const mm = String(today.getMonth() + 1).padStart(2, "0");
    const yyyy = today.getFullYear();
    document.getElementById("billDate").value = dd + "-" + mm + "-" + yyyy;

    addInvoiceRow("স্লাইডিং জানালা, ৪.৫*৫", 1, 445, "");
    addInvoiceRow("", 1, "", "");
});

function addInvoiceRow(description = "", qty = 1, rate = "", sqft = "") {
    const tbody = document.getElementById("invoiceTableBody");
    const tr = document.createElement("tr");
    tr.innerHTML = `
        <td><textarea class="item-description" placeholder="Description & Size..." oninput="autoExtractSize(this)">${description}</textarea></td>
        <td><input type="number" class="item-qty" value="${qty}" min="0" step="0.01" oninput="calculateRow(this)"></td>
        <td><input type="number" class="item-rate" value="${rate}" min="0" step="0.01" placeholder="Rate" oninput="calculateRow(this)"></td>
        <td><input type="number" class="item-sqft" value="${sqft}" min="0" step="0.01" placeholder="Auto" oninput="calculateRow(this)"></td>
        <td><input type="text" class="item-amount" value="0.00" readonly></td>
        <td class="no-print"><button type="button" class="btn-del" onclick="removeInvoiceRow(this)">X</button></td>
    `;
    tbody.appendChild(tr);
    autoExtractSize(tr.querySelector(".item-description"));
}

function autoExtractSize(textarea) {
    const text = textarea.value;
    const regex = /(\d+(?:\.\d+)?)\s*[\*x×]\s*(\d+(?:\.\d+)?)/i;
    const match = text.match(regex);
    
    const row = textarea.closest("tr");
    const sqftInput = row.querySelector(".item-sqft");
    
    if (match) {
        const num1 = parseFloat(match[1]);
        const num2 = parseFloat(match[2]);
        const calculatedSqft = num1 * num2;
        sqftInput.value = calculatedSqft.toFixed(2);
    }
    calculateRow(textarea);
}

function removeInvoiceRow(btn) {
    const tbody = document.getElementById("invoiceTableBody");
    if (tbody.rows.length <= 1) {
        alert("কমপক্ষে একটি আইটেম রাখা আবশ্যক!");
        return;
    }
    btn.closest("tr").remove();
    calculateGrandTotal();
}

function calculateRow(element) {
    const row = element.closest("tr");
    const qty = parseFloat(row.querySelector(".item-qty").value) || 0;
    const rate = parseFloat(row.querySelector(".item-rate").value) || 0;
    const sqft = parseFloat(row.querySelector(".item-sqft").value) || 0;
    
    let amount = 0;
    if (sqft > 0) {
        amount = qty * rate * sqft;
    } else {
        amount = qty * rate;
    }
    
    row.querySelector(".item-amount").value = amount.toFixed(2);
    calculateGrandTotal();
}

function calculateGrandTotal() {
    let total = 0;
    document.querySelectorAll("#invoiceTableBody .item-amount").forEach(input => {
        let val = parseFloat(input.value);
        if (!isNaN(val)) {
            total += val;
        }
    });
    document.getElementById("grandTotal").value = total.toFixed(2);
}

function printInvoice() {
    calculateGrandTotal();
    window.print();
}
</script>

</body>
</html>

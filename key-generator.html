<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key Generator - Admin Panel</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; padding: 20px; display: flex; justify-content: center; }
        .card { background: #1e293b; padding: 25px; border-radius: 12px; max-width: 400px; width: 100%; }
        h2 { color: #38bdf8; text-align: center; margin-bottom: 20px; }
        label { font-size: 13px; color: #94a3b8; display: block; margin-top: 10px; }
        input, select, button { width: 100%; padding: 10px; margin-top: 5px; border-radius: 6px; border: 1px solid #334155; box-sizing: border-box; }
        input, select { background: #0f172a; color: white; }
        button { background: #0284c7; color: white; font-weight: bold; margin-top: 20px; cursor: pointer; border: none; }
        .result-box { margin-top: 20px; background: #0f172a; padding: 10px; border-radius: 6px; word-break: break-all; border: 1px dashed #38bdf8; color: #4ade80; font-family: monospace; font-size: 13px; }
    </style>
</head>
<body>

<div class="card">
    <h2>👑 Key Generator</h2>
    
    <label>Customer Device ID:</label>
    <input type="text" id="devId" placeholder="e.g. THAI-4829">

    <label>Validity Duration:</label>
    <select id="duration">
        <option value="1">1 Month</option>
        <option value="6">6 Months</option>
        <option value="12">1 Year</option>
        <option value="3650">Lifetime (10 Years)</option>
    </select>

    <button onclick="generateKey()">⚡ Generate Key</button>

    <div class="result-box" id="result">Generated Key will appear here...</div>
</div>

<script>
    function generateKey() {
        let devId = document.getElementById("devId").value.trim();
        let duration = parseInt(document.getElementById("duration").value);

        if(!devId) {
            alert("Device ID দিন!");
            return;
        }

        // মেয়াদ হিসাব (Days to Milliseconds)
        let expiryDate = new Date().getTime() + (duration * 30 * 24 * 60 * 60 * 1000);
        
        // ফরম্যাট: DEVICEID_EXPIRY_SECRET
        let rawString = `${devId}_${expiryDate}_THAI_GLASS_SECRET_2026`;
        
        // Base64 এনক্রিপশন
        let productKey = btoa(rawString);

        document.getElementById("result").innerText = productKey;
    }
</script>

</body>
</html>

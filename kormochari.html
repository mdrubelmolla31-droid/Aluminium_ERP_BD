<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>কর্মচারী অ্যাডভান্স ও বেতন হিসাব</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; }

        header { 
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); 
            color: white; padding: 15px 20px; display: flex; align-items: center; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.15); sticky; top: 0; z-index: 100;
        }

        .menu-btn { 
            background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.3); 
            color: white; font-size: 22px; padding: 6px 14px; border-radius: 8px; 
            cursor: pointer; margin-right: 15px; 
        }

        .container { max-width: 1000px; margin: 20px auto; padding: 0 15px; }

        /* Side Drawer */
        .drawer-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; display: none; }
        .side-drawer { position: fixed; top: 0; left: -350px; width: 320px; height: 100%; background: white; z-index: 1000; transition: left 0.3s; padding: 20px; overflow-y: auto; }
        .side-drawer.open { left: 0; }
        .drawer-overlay.open { display: block; }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; margin-bottom: 4px; font-size: 13px; font-weight: 600; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; }
        
        .btn-submit { background: #1e3c72; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; width: 100%; cursor: pointer; }

        /* Employee Cards */
        .employee-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); text-align: center; position: relative; border-top: 5px solid #2a5298; }
        
        /* Larger HD Profile Picture */
        .card-img-container { width: 140px; height: 140px; margin: 0 auto 15px; border-radius: 50%; overflow: hidden; border: 4px solid #2a5298; box-shadow: 0 4px 8px rgba(0,0,0,0.15); }
        .card-img-container img { width: 100%; height: 100%; object-fit: cover; }
        
        .card h3 { color: #1e3c72; font-size: 20px; margin-bottom: 5px; }
        
        .action-btns { display: flex; gap: 8px; justify-content: center; margin: 12px 0; }
        .btn-call { background: #27ae60; color: white; text-decoration: none; padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: bold; }
        .btn-delete { background: #e74c3c; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; }

        /* Modal Profile View */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1001; overflow-y: auto; }
        .modal-content { background: white; margin: 2% auto; padding: 20px; width: 92%; max-width: 650px; border-radius: 12px; position: relative; }
        .close-btn { position: absolute; right: 15px; top: 15px; font-size: 28px; cursor: pointer; color: #888; }

        .large-profile { text-align: center; margin-bottom: 20px; }
        .large-profile img { width: 160px; height: 160px; border-radius: 50%; object-fit: cover; border: 4px solid #2a5298; }

        .calc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        th { background: #1e3c72; color: white; }

        .whatsapp-btn { background: #25D366; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; width: 100%; cursor: pointer; font-size: 15px; margin-top: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; }
    </style>
</head>
<body>

    <header>
        <button class="menu-btn" onclick="toggleDrawer()">☰</button>
        <div>
            <h2>কর্মচারী হিসাব ও বেতন সিস্টেম</h2>
            <p style="font-size: 12px; opacity: 0.8;">অটোমেটিক মাস শেষে ফাইনাল স্টেটমেন্ট</p>
        </div>
    </header>

    <!-- Side Menu: Add New Employee -->
    <div id="drawerOverlay" class="drawer-overlay" onclick="toggleDrawer()"></div>
    <div id="sideDrawer" class="side-drawer">
        <h3 style="color:#1e3c72; margin-bottom:15px;">নতুন কর্মচারী সেভ করুন</h3>
        <form id="addEmployeeForm">
            <div class="form-group"><label>নাম:</label><input type="text" id="empName" required></div>
            <div class="form-group"><label>পিতার নাম:</label><input type="text" id="empFather" required></div>
            <div class="form-group"><label>মোবাইল (WhatsApp):</label><input type="text" id="empPhone" placeholder="017xxxxxxxx" required></div>
            <div class="form-group"><label>ঠিকানা:</label><input type="text" id="empAddress" required></div>
            <div class="form-group"><label>মাসিক বেতন (৳):</label><input type="number" id="empSalary" required></div>
            <div class="form-group"><label>ক্যামেরা/ফাইল থেকে ছবি:</label><input type="file" id="empPhotoFile" accept="image/*"></div>
            <button type="submit" class="btn-submit">কর্মচারী সেভ করুন</button>
        </form>
    </div>

    <!-- Main Display -->
    <div class="container">
        <div class="employee-list" id="employeeList"></div>
    </div>

    <!-- Employee Full Calculation Profile Modal -->
    <div id="profileModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div id="largeProfileArea" class="large-profile"></div>

            <div style="background: #f8fafc; padding: 15px; border-radius: 8px; margin-bottom: 15px;">
                <h4 style="color: #1e3c72; margin-bottom: 10px;">মাসিক হাজিরা ও বোনাস সেটআপ:</h4>
                <div class="calc-grid">
                    <div>
                        <label style="font-size: 12px;">অনুপস্থিতি (Absents Days):</label>
                        <input type="number" id="absentDays" value="0" min="0" onchange="updateCalculations()">
                    </div>
                    <div>
                        <label style="font-size: 12px;">হাজিরা বোনাস (৳):</label>
                        <input type="number" id="bonusAmount" value="0" min="0" onchange="updateCalculations()">
                    </div>
                </div>
            </div>

            <h4 style="color: #1e3c72;">দৈনিক অগ্রিম / খরচ কাটতি:</h4>
            <form id="transactionForm" style="display:flex; gap:5px; margin: 10px 0;">
                <input type="date" id="transDate" required>
                <input type="number" id="transAmount" placeholder="টাকা (৳)" required>
                <button type="submit" style="background: #2a5298; color: white; border: none; padding: 0 15px; border-radius: 6px; cursor: pointer;">যোগ</button>
            </form>

            <table>
                <thead>
                    <tr><th>তারিখ</th><th>অগ্রিম নিয়েছে (৳)</th><th>অ্যাকশন</th></tr>
                </thead>
                <tbody id="ledgerBody"></tbody>
            </table>

            <div id="summaryBox" style="background: #eef2ff; padding: 15px; border-radius: 8px; margin-top: 15px; line-height: 1.8;"></div>

            <button class="whatsapp-btn" onclick="sendWhatsAppSummary()">
                📲 WhatsApp এ হিসাবের ফাইনাল রিপোর্ট পাঠান
            </button>
        </div>
    </div>

    <script>
        let employees = JSON.parse(localStorage.getItem('employees')) || [];
        let currentEmpId = null;

        function toggleDrawer() {
            document.getElementById('sideDrawer').classList.toggle('open');
            document.getElementById('drawerOverlay').classList.toggle('open');
        }

        function getBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        document.getElementById('addEmployeeForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const photoInput = document.getElementById('empPhotoFile');
            let photoData = 'https://via.placeholder.com/200?text=No+Photo';

            if (photoInput.files && photoInput.files[0]) {
                photoData = await getBase64(photoInput.files[0]);
            }

            const newEmployee = {
                id: Date.now().toString(),
                name: document.getElementById('empName').value,
                father: document.getElementById('empFather').value,
                phone: document.getElementById('empPhone').value,
                address: document.getElementById('empAddress').value,
                salary: parseFloat(document.getElementById('empSalary').value),
                photo: photoData,
                absents: 0,
                bonus: 0,
                transactions: []
            };

            employees.push(newEmployee);
            saveData();
            this.reset();
            toggleDrawer();
            renderEmployees();
        });

        function renderEmployees() {
            const listDiv = document.getElementById('employeeList');
            listDiv.innerHTML = '';

            if (employees.length === 0) {
                listDiv.innerHTML = `<p style="text-align:center; grid-column: 1/-1; color: #777;">কোনো কর্মচারী সেভ করা নেই। মেনু (☰) থেকে যোগ করুন।</p>`;
                return;
            }

            employees.forEach(emp => {
                const totalAdvance = emp.transactions.reduce((sum, tr) => sum + tr.amount, 0);
                const dailyRate = emp.salary / 30; // 30 days average
                const absentDeduction = (emp.absents || 0) * dailyRate;
                const finalPayable = emp.salary - absentDeduction + (emp.bonus || 0) - totalAdvance;

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-img-container" onclick="openProfile('${emp.id}')">
                        <img src="${emp.photo}" alt="Photo">
                    </div>
                    <h3 onclick="openProfile('${emp.id}')" style="cursor:pointer;">${emp.name}</h3>
                    <p style="font-size: 13px; color: #666;">পিতা: ${emp.father}</p>
                    <div class="action-btns">
                        <a href="tel:${emp.phone}" class="btn-call">📞 কল করুন</a>
                        <button onclick="deleteEmployee('${emp.id}')" class="btn-delete">🗑 বাদ দিন</button>
                    </div>
                    <p style="font-size: 14px;">মূল বেতন: ৳${emp.salary}</p>
                    <div style="margin-top: 8px; font-weight: bold; color: ${finalPayable < 0 ? 'red' : 'green'};" onclick="openProfile('${emp.id}')">
                        অবশিষ্ট পাওনা: ৳${Math.round(finalPayable)}
                    </div>
                `;
                listDiv.appendChild(card);
            });
        }

        function deleteEmployee(id) {
            if (confirm("আপনি কি নিশ্চিত এই কর্মচারীকে দোকান/ব্যবসা থেকে বাতিল বা মুছে ফেলতে চান?")) {
                employees = employees.filter(e => e.id !== id);
                saveData();
                renderEmployees();
            }
        }

        function openProfile(id) {
            currentEmpId = id;
            const emp = employees.find(e => e.id === id);
            if (!emp) return;

            document.getElementById('largeProfileArea').innerHTML = `
                <img src="${emp.photo}" alt="Profile">
                <h2 style="color: #1e3c72; margin-top: 8px;">${emp.name}</h2>
                <p>ফোন: ${emp.phone} | পিতা: ${emp.father}</p>
            `;

            document.getElementById('absentDays').value = emp.absents || 0;
            document.getElementById('bonusAmount').value = emp.bonus || 0;

            renderLedger();
            document.getElementById('profileModal').style.display = 'block';
        }

        function updateCalculations() {
            const emp = employees.find(e => e.id === currentEmpId);
            if (!emp) return;

            emp.absents = parseFloat(document.getElementById('absentDays').value) || 0;
            emp.bonus = parseFloat(document.getElementById('bonusAmount').value) || 0;

            saveData();
            renderLedger();
            renderEmployees();
        }

        document.getElementById('transactionForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const date = document.getElementById('transDate').value;
            const amount = parseFloat(document.getElementById('transAmount').value);

            const emp = employees.find(e => e.id === currentEmpId);
            emp.transactions.push({ id: Date.now().toString(), date, amount });

            saveData();
            this.reset();
            renderLedger();
            renderEmployees();
        });

        function renderLedger() {
            const emp = employees.find(e => e.id === currentEmpId);
            const tbody = document.getElementById('ledgerBody');
            tbody.innerHTML = '';
            
            let totalAdvance = 0;
            emp.transactions.forEach(tr => {
                totalAdvance += tr.amount;
                tbody.innerHTML += `
                    <tr>
                        <td>${tr.date}</td>
                        <td style="color: red;">- ৳${tr.amount}</td>
                        <td><button onclick="deleteTrans('${tr.id}')" style="background:red; color:white; border:none; border-radius:3px; padding:2px 6px; cursor:pointer;">X</button></td>
                    </tr>
                `;
            });

            // Automatic calculation logic
            const now = new Date();
            const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate(); // 28, 30, or 31 days dynamically
            const dailyRate = emp.salary / daysInMonth;
            const absentCut = (emp.absents || 0) * dailyRate;
            const finalPayable = emp.salary - absentCut + (emp.bonus || 0) - totalAdvance;

            document.getElementById('summaryBox').innerHTML = `
                <b>মাসিক চূড়ান্ত হিসাব (${daysInMonth} দিনের মাস):</b><br>
                মূল বেতন: ৳${emp.salary}<br>
                অনুপস্থিতি কাটা (${emp.absents || 0} দিন): <span style="color:red;">- ৳${Math.round(absentCut)}</span><br>
                হাজিরা বোনাস: <span style="color:green;">+ ৳${emp.bonus || 0}</span><br>
                মোট অগ্রিম নেওয়া: <span style="color:red;">- ৳${totalAdvance}</span><br>
                <hr style="margin:5px 0;">
                <b>মাস শেষে নিট পরিশোধযোগ্য পাওনা: <span style="color:blue; font-size: 16px;">৳${Math.round(finalPayable)}</span></b>
            `;
        }

        function deleteTrans(transId) {
            const emp = employees.find(e => e.id === currentEmpId);
            emp.transactions = emp.transactions.filter(t => t.id !== transId);
            saveData();
            renderLedger();
            renderEmployees();
        }

        function sendWhatsAppSummary() {
            const emp = employees.find(e => e.id === currentEmpId);
            if (!emp) return;

            const now = new Date();
            const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
            const dailyRate = emp.salary / daysInMonth;
            const totalAdvance = emp.transactions.reduce((sum, tr) => sum + tr.amount, 0);
            const absentCut = (emp.absents || 0) * dailyRate;
            const finalPayable = Math.round(emp.salary - absentCut + (emp.bonus || 0) - totalAdvance);

            let message = `*মাসিক বেতন ও হিসাব স্টেটমেন্ট*\n`;
            message += `নাম: ${emp.name}\n`;
            message += `মূল বেতন: ৳${emp.salary}\n`;
            message += `অনুপস্থিতি (${emp.absents || 0} দিন): -৳${Math.round(absentCut)}\n`;
            message += `হাজিরা বোনাস: +৳${emp.bonus || 0}\n`;
            message += `মোট অগ্রিম নেওয়া: -৳${totalAdvance}\n`;
            message += `------------------------\n`;
            message += `*মাস শেষে অবশিষ্ট পাওনা: ৳${finalPayable}*\n\n`;
            message += `ধন্যবাদ!`;

            let phone = emp.phone.replace(/[^0-9]/g, '');
            if(phone.startsWith('0')) phone = '88' + phone;

            window.open(`https://wa.me/${phone}?text=${encodeURIComponent(message)}`, '_blank');
        }

        function closeModal() {
            document.getElementById('profileModal').style.display = 'none';
            currentEmpId = null;
        }

        function saveData() {
            localStorage.setItem('employees', JSON.stringify(employees));
        }

        renderEmployees();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>কর্মচারী হিসাব ম্যানেজমেন্ট</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; }

        /* Blue Gradient Header like reference image */
        header { 
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); 
            color: white; 
            padding: 15px 20px; 
            display: flex; 
            align-items: center; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        /* 3-Line Menu Button (Matching Image Style) */
        .menu-btn { 
            background: rgba(255, 255, 255, 0.15); 
            border: 1px solid rgba(255, 255, 255, 0.3); 
            color: white; 
            font-size: 22px; 
            padding: 6px 14px; 
            border-radius: 8px; 
            cursor: pointer; 
            transition: 0.3s;
            margin-right: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .menu-btn:hover { background: rgba(255, 255, 255, 0.3); }

        .header-title h2 { font-size: 18px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .header-title p { font-size: 12px; opacity: 0.8; margin-top: 2px; }

        .container { max-width: 1000px; margin: 20px auto; padding: 0 15px; }

        /* Sliding Side-Drawer for Settings / Add Employee */
        .drawer-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.5); z-index: 999; display: none; 
        }
        .side-drawer { 
            position: fixed; top: 0; left: -350px; width: 320px; height: 100%; 
            background: white; z-index: 1000; transition: left 0.3s ease; 
            padding: 20px; box-shadow: 2px 0 10px rgba(0,0,0,0.2); overflow-y: auto; 
        }
        .side-drawer.open { left: 0; }
        .drawer-overlay.open { display: block; }

        .drawer-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #2a5298; padding-bottom: 10px; margin-bottom: 20px; }
        .drawer-header h3 { color: #1e3c72; }
        .close-drawer { font-size: 24px; cursor: pointer; color: #777; font-weight: bold; }

        /* Form Controls */
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 13px; font-weight: 600; color: #333; }
        input[type="text"], input[type="number"], input[type="date"], input[type="file"] { 
            width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; 
        }
        
        .btn-submit { 
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); 
            color: white; border: none; padding: 12px; cursor: pointer; 
            border-radius: 6px; font-weight: bold; width: 100%; font-size: 15px; margin-top: 10px;
        }

        /* Employee Cards List on Main Page */
        .employee-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .card { 
            background: white; padding: 15px; border-radius: 10px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.05); cursor: pointer; 
            transition: transform 0.2s, box-shadow 0.2s; text-align: center; 
            border-top: 4px solid #2a5298; position: relative;
        }
        .card:hover { transform: translateY(-3px); box-shadow: 0 6px 15px rgba(0,0,0,0.1); }
        .card img { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; border: 3px solid #e2e8f0; margin-bottom: 10px; }
        .card h4 { color: #1e3c72; font-size: 18px; margin-bottom: 5px; }
        .card p { color: #555; font-size: 13px; margin: 3px 0; }
        
        .balance-tag { 
            margin-top: 10px; padding: 6px; border-radius: 6px; font-weight: bold; font-size: 14px; background: #f8fafc; 
        }

        /* Profile & Ledger Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1001; overflow-y: auto; }
        .modal-content { background: white; margin: 3% auto; padding: 20px; width: 92%; max-width: 600px; border-radius: 10px; position: relative; }
        .close-btn { position: absolute; right: 15px; top: 15px; font-size: 26px; cursor: pointer; color: #888; }
        
        .profile-header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; background: #f8fafc; padding: 15px; border-radius: 8px; }
        .profile-header img { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 2px solid #2a5298; }

        .transaction-form { display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; }
        .transaction-form input { flex: 1; min-width: 120px; }
        .transaction-form button { background: #2a5298; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th, td { border: 1px solid #e2e8f0; padding: 8px 10px; text-align: center; }
        th { background: #1e3c72; color: white; }

        .summary-box { background: #eef2ff; border: 1px solid #c7d2fe; padding: 12px; border-radius: 6px; margin-top: 15px; text-align: right; line-height: 1.6; }
    </style>
</head>
<body>

    <!-- Header with Blue Gradient and 3-Line Menu -->
    <header>
        <button class="menu-btn" onclick="toggleDrawer()">☰</button>
        <div class="header-title">
            <h2>কর্মচারী হিসাব ম্যানেজমেন্ট</h2>
            <p>দৈনিক হিসাব ও বেতন ট্র্যাকার</p>
        </div>
    </header>

    <!-- Side Drawer Settings (Open by clicking 3-line menu) -->
    <div id="drawerOverlay" class="drawer-overlay" onclick="toggleDrawer()"></div>
    <div id="sideDrawer" class="side-drawer">
        <div class="drawer-header">
            <h3>নতুন কর্মচারী</h3>
            <span class="close-drawer" onclick="toggleDrawer()">&times;</span>
        </div>
        <form id="addEmployeeForm">
            <div class="form-group">
                <label>কর্মচারীর নাম:</label>
                <input type="text" id="empName" required placeholder="যেমন: রহিম আহমেদ">
            </div>
            <div class="form-group">
                <label>বাবার নাম:</label>
                <input type="text" id="empFather" required placeholder="বাবার নাম">
            </div>
            <div class="form-group">
                <label>মোবাইল নাম্বার:</label>
                <input type="text" id="empPhone" required placeholder="017xxxxxxxx">
            </div>
            <div class="form-group">
                <label>ঠিকানা:</label>
                <input type="text" id="empAddress" required placeholder="গ্রাম/শহর, জেলা">
            </div>
            <div class="form-group">
                <label>মাসিক মূল বেতন (৳):</label>
                <input type="number" id="empSalary" required placeholder="যেমন: ১৫০০০">
            </div>
            <div class="form-group">
                <label>ছবির ফাইল বা ক্যামেরা থেকে ছবি নিন:</label>
                <!-- accept="image/*" allows camera or file selection -->
                <input type="file" id="empPhotoFile" accept="image/*">
            </div>
            <button type="submit" class="btn-submit">সেভ করুন</button>
        </form>
    </div>

    <!-- Main Page: List of Employees -->
    <div class="container">
        <div class="employee-list" id="employeeList">
            <!-- Employee profiles will appear here one after another -->
        </div>
    </div>

    <!-- Ledger & Daily Calculation Modal -->
    <div id="profileModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            
            <div id="profileDetails" class="profile-header"></div>
            
            <h4 style="margin-bottom: 10px; color: #1e3c72;">দৈনিক অগ্রিম / খরচ যোগ করুন</h4>
            <form id="transactionForm" class="transaction-form">
                <input type="date" id="transDate" required>
                <input type="number" id="transAmount" placeholder="টাকার পরিমাণ (৳)" required>
                <button type="submit">যোগ করুন</button>
            </form>

            <table>
                <thead>
                    <tr>
                        <th>তারিখ</th>
                        <th>টাকা নিয়েছেন (৳)</th>
                        <th>অ্যাকশন</th>
                    </tr>
                </thead>
                <tbody id="ledgerBody"></tbody>
            </table>

            <div class="summary-box">
                <div id="salaryInfo"></div>
                <div id="totalDeduction"></div>
                <hr style="margin: 8px 0;">
                <div id="remainingBalance"></div>
            </div>
        </div>
    </div>

    <script>
        let employees = JSON.parse(localStorage.getItem('employees')) || [];
        let currentEmployeeId = null;

        // Toggle 3-line Menu Drawer
        function toggleDrawer() {
            document.getElementById('sideDrawer').classList.toggle('open');
            document.getElementById('drawerOverlay').classList.toggle('open');
        }

        // Convert uploaded image file to Base64 String
        function getBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        // Add Employee Form Submit
        document.getElementById('addEmployeeForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const photoInput = document.getElementById('empPhotoFile');
            let photoData = 'https://via.placeholder.com/100?text=No+Photo';

            if (photoInput.files && photoInput.files[0]) {
                photoData = await getBase64(photoInput.files[0]);
            }

            const newEmployee = {
                id: Date.now().toString(),
                name: document.getElementById('empName').value,
                father: document.getElementById('empFather').value,
                phone: document.getElementById('empPhone').value,
                address: document.getElementById('empAddress').value,
                salary: parseFloat(document.getElementById('empSalary').value),
                photo: photoData,
                transactions: []
            };

            employees.push(newEmployee);
            saveData();
            this.reset();
            toggleDrawer(); // Close side menu
            renderEmployees(); // Update main page list
        });

        // Render Employee Cards on Main Page
        function renderEmployees() {
            const listDiv = document.getElementById('employeeList');
            listDiv.innerHTML = '';

            if (employees.length === 0) {
                listDiv.innerHTML = `<p style="text-align:center; grid-column: 1/-1; color: #777; padding: 40px;">কোনো কর্মচারী পাওয়া যায়নি। বামে উপরে (☰) মেনুতে চাপ দিয়ে নতুন কর্মচারী যোগ করুন।</p>`;
                return;
            }

            employees.forEach(emp => {
                const totalTaken = emp.transactions.reduce((sum, tr) => sum + tr.amount, 0);
                const remaining = emp.salary - totalTaken;

                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => openProfile(emp.id);
                card.innerHTML = `
                    <img src="${emp.photo}" alt="Photo">
                    <h4>${emp.name}</h4>
                    <p><strong>ফোন:</strong> ${emp.phone}</p>
                    <p><strong>মূল বেতন:</strong> ৳${emp.salary}</p>
                    <div class="balance-tag" style="color: ${remaining < 0 ? '#e74c3c' : '#27ae60'};">
                        বর্তমান পাওনা: ৳${remaining}
                    </div>
                `;
                listDiv.appendChild(card);
            });
        }

        // Open Profile & Ledger
        function openProfile(id) {
            currentEmployeeId = id;
            const emp = employees.find(e => e.id === id);
            if(!emp) return;

            document.getElementById('profileDetails').innerHTML = `
                <img src="${emp.photo}" alt="Photo">
                <div>
                    <h3 style="color:#1e3c72; margin-bottom: 4px;">${emp.name}</h3>
                    <p style="font-size: 13px; color:#555;"><strong>পিতা:</strong> ${emp.father}</p>
                    <p style="font-size: 13px; color:#555;"><strong>ফোন:</strong> ${emp.phone} | <strong>ঠিকানা:</strong> ${emp.address}</p>
                </div>
            `;
            
            renderLedger();
            document.getElementById('profileModal').style.display = 'block';
        }

        // Close Ledger Modal
        function closeModal() {
            document.getElementById('profileModal').style.display = 'none';
            currentEmployeeId = null;
        }

        // Add Advance Expense
        document.getElementById('transactionForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const date = document.getElementById('transDate').value;
            const amount = parseFloat(document.getElementById('transAmount').value);

            const empIndex = employees.findIndex(e => e.id === currentEmployeeId);
            employees[empIndex].transactions.push({ id: Date.now().toString(), date, amount });
            
            saveData();
            this.reset();
            renderLedger();
            renderEmployees();
        });

        // Render Ledger Entries & Total Calculation
        function renderLedger() {
            const emp = employees.find(e => e.id === currentEmployeeId);
            const tbody = document.getElementById('ledgerBody');
            tbody.innerHTML = '';
            let totalTaken = 0;

            const sortedTransactions = emp.transactions.sort((a, b) => new Date(a.date) - new Date(b.date));

            sortedTransactions.forEach(tr => {
                totalTaken += tr.amount;
                tbody.innerHTML += `
                    <tr>
                        <td>${tr.date}</td>
                        <td style="color: #e74c3c; font-weight:bold;">- ৳${tr.amount}</td>
                        <td><button onclick="deleteTransaction('${tr.id}')" style="background:#e74c3c; color:white; border:none; padding: 4px 8px; border-radius:4px; cursor:pointer;">মুছুন</button></td>
                    </tr>
                `;
            });

            if(sortedTransactions.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" style="color:#888;">এখনো কোনো খরচের হিসাব যোগ করা হয়নি</td></tr>';
            }

            const remaining = emp.salary - totalTaken;

            document.getElementById('salaryInfo').innerHTML = `মাসিক বেতন: <strong>৳${emp.salary}</strong>`;
            document.getElementById('totalDeduction').innerHTML = `মোট নিয়েছে: <strong style="color:#e74c3c;">- ৳${totalTaken}</strong>`;
            document.getElementById('remainingBalance').innerHTML = `অবশিষ্ট পাওনা: <strong style="color: ${remaining < 0 ? '#e74c3c' : '#27ae60'}; font-size:16px;">৳${remaining}</strong>`;
        }

        // Delete Single Entry
        function deleteTransaction(transId) {
            if(!confirm("আপনি কি এই খরচের হিসাবটি মুছে ফেলতে চান?")) return;
            const empIndex = employees.findIndex(e => e.id === currentEmployeeId);
            employees[empIndex].transactions = employees[empIndex].transactions.filter(t => t.id !== transId);
            saveData();
            renderLedger();
            renderEmployees();
        }

        function saveData() {
            localStorage.setItem('employees', JSON.stringify(employees));
        }

        // Initial Load
        renderEmployees();

        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('profileModal');
            if (event.target === modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>

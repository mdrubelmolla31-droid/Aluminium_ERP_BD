<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>কর্মচারী হিসাব ম্যানেজমেন্ট</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 0; }
        header { background-color: #2c3e50; color: white; padding: 15px; text-align: center; }
        .container { max-width: 1000px; margin: 20px auto; padding: 0 15px; }
        
        /* Settings / Form Area */
        .settings-panel { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 30px; }
        .settings-panel h3 { margin-top: 0; color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 5px; display: inline-block; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 15px; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #3498db; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 4px; font-weight: bold; width: 100%; }
        button:hover { background-color: #2980b9; }

        /* Employee Cards */
        .employee-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); cursor: pointer; transition: transform 0.2s; text-align: center; border-top: 4px solid #3498db; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 6px 12px rgba(0,0,0,0.15); }
        .card img { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; background-color: #eee; border: 2px solid #ccc; }
        .card h4 { margin: 10px 0 5px; color: #333; }
        .card p { margin: 0; color: #666; font-size: 14px; }

        /* Modal / Profile View */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.6); z-index: 1000; overflow-y: auto; }
        .modal-content { background-color: white; margin: 5% auto; padding: 25px; width: 90%; max-width: 600px; border-radius: 8px; position: relative; }
        .close-btn { position: absolute; right: 20px; top: 15px; font-size: 28px; font-weight: bold; cursor: pointer; color: #aaa; }
        .close-btn:hover { color: red; }
        
        .profile-header { display: flex; align-items: center; gap: 20px; margin-bottom: 20px; }
        .profile-header img { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; }
        
        .ledger-section { margin-top: 20px; }
        .transaction-form { display: flex; gap: 10px; margin-bottom: 15px; }
        .transaction-form input, .transaction-form button { width: auto; flex: 1; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background-color: #2c3e50; color: white; }
        
        .balance-card { background: #e8f6f3; border: 1px solid #1abc9c; padding: 15px; border-radius: 5px; margin-top: 20px; font-size: 18px; text-align: right; }
        .balance-card strong { color: #e74c3c; }
    </style>
</head>
<body>

    <header>
        <h1>কর্মচারী হিসাব ম্যানেজমেন্ট</h1>
    </header>

    <div class="container">
        <!-- Settings: Add Employee -->
        <div class="settings-panel">
            <h3>নতুন কর্মচারী যুক্ত করুন</h3>
            <form id="addEmployeeForm">
                <div class="form-grid">
                    <input type="text" id="empName" placeholder="কর্মচারীর নাম" required>
                    <input type="text" id="empFather" placeholder="বাবার নাম" required>
                    <input type="text" id="empPhone" placeholder="মোবাইল নাম্বার" required>
                    <input type="text" id="empAddress" placeholder="ঠিকানা" required>
                    <input type="number" id="empSalary" placeholder="মাসিক মূল বেতন (৳)" required>
                    <input type="url" id="empPhoto" placeholder="ছবির লিংক/URL (ঐচ্ছিক)">
                </div>
                <button type="submit">সেভ করুন</button>
            </form>
        </div>

        <!-- Dashboard: Employee List -->
        <div class="employee-list" id="employeeList">
            <!-- Cards will be generated here -->
        </div>
    </div>

    <!-- Profile & Ledger Modal -->
    <div id="profileModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            
            <div id="profileDetails" class="profile-header">
                <!-- Profile details will be injected here -->
            </div>
            
            <hr>
            
            <div class="ledger-section">
                <h3>মাসিক হিসাব (অগ্রিম বা খরচ)</h3>
                
                <form id="transactionForm" class="transaction-form">
                    <input type="date" id="transDate" required>
                    <input type="number" id="transAmount" placeholder="টাকার পরিমাণ (৳)" required>
                    <button type="submit">অ্যাড করুন</button>
                </form>

                <table>
                    <thead>
                        <tr>
                            <th>তারিখ</th>
                            <th>টাকা নিয়েছে (৳)</th>
                            <th>অ্যাকশন</th>
                        </tr>
                    </thead>
                    <tbody id="ledgerBody">
                        <!-- Transactions will be here -->
                    </tbody>
                </table>

                <div class="balance-card">
                    <div id="salaryInfo"></div>
                    <div id="totalDeduction"></div>
                    <hr>
                    <div id="remainingBalance"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let employees = JSON.parse(localStorage.getItem('employees')) || [];
        let currentEmployeeId = null;

        // Form Submit to Add Employee
        document.getElementById('addEmployeeForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const newEmployee = {
                id: Date.now().toString(),
                name: document.getElementById('empName').value,
                father: document.getElementById('empFather').value,
                phone: document.getElementById('empPhone').value,
                address: document.getElementById('empAddress').value,
                salary: parseFloat(document.getElementById('empSalary').value),
                photo: document.getElementById('empPhoto').value || 'https://via.placeholder.com/100?text=No+Image',
                transactions: []
            };

            employees.push(newEmployee);
            saveData();
            this.reset();
            renderEmployees();
        });

        // Render Dashboard Cards
        function renderEmployees() {
            const listDiv = document.getElementById('employeeList');
            listDiv.innerHTML = '';

            employees.forEach(emp => {
                const totalTaken = emp.transactions.reduce((sum, tr) => sum + tr.amount, 0);
                const remaining = emp.salary - totalTaken;

                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => openProfile(emp.id);
                card.innerHTML = `
                    <img src="${emp.photo}" alt="Photo">
                    <h4>${emp.name}</h4>
                    <p>ফোন: ${emp.phone}</p>
                    <p>বেতন: ৳${emp.salary}</p>
                    <p style="color: ${remaining < 0 ? 'red' : 'green'}; font-weight:bold; margin-top:5px;">পাওনা: ৳${remaining}</p>
                `;
                listDiv.appendChild(card);
            });
        }

        // Open Profile & Ledger
        function openProfile(id) {
            currentEmployeeId = id;
            const emp = employees.find(e => e.id === id);
            if(!emp) return;

            document.getElementById('profileDetails').innerHTML = `
                <img src="${emp.photo}" alt="Photo">
                <div>
                    <h2>${emp.name}</h2>
                    <p><strong>বাবার নাম:</strong> ${emp.father} | <strong>ফোন:</strong> ${emp.phone}</p>
                    <p><strong>ঠিকানা:</strong> ${emp.address}</p>
                </div>
            `;
            
            renderLedger();
            document.getElementById('profileModal').style.display = 'block';
        }

        // Close Modal
        function closeModal() {
            document.getElementById('profileModal').style.display = 'none';
            currentEmployeeId = null;
        }

        // Add Transaction (Advance taken)
        document.getElementById('transactionForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const date = document.getElementById('transDate').value;
            const amount = parseFloat(document.getElementById('transAmount').value);

            const empIndex = employees.findIndex(e => e.id === currentEmployeeId);
            employees[empIndex].transactions.push({ id: Date.now().toString(), date, amount });
            
            saveData();
            this.reset();
            renderLedger();
            renderEmployees(); // Update background cards too
        });

        // Render Dates, Transactions and Calculate Balance
        function renderLedger() {
            const emp = employees.find(e => e.id === currentEmployeeId);
            const tbody = document.getElementById('ledgerBody');
            tbody.innerHTML = '';
            let totalTaken = 0;

            // Sort transactions by date
            const sortedTransactions = emp.transactions.sort((a, b) => new Date(a.date) - new Date(b.date));

            sortedTransactions.forEach(tr => {
                totalTaken += tr.amount;
                tbody.innerHTML += `
                    <tr>
                        <td>${formatDate(tr.date)}</td>
                        <td style="color: red;">- ৳${tr.amount}</td>
                        <td><button onclick="deleteTransaction('${tr.id}')" style="background:#e74c3c; padding: 5px 10px; width:auto;">মুছুন</button></td>
                    </tr>
                `;
            });

            if(sortedTransactions.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3">কোনো রেকর্ড নেই</td></tr>';
            }

            const remaining = emp.salary - totalTaken;

            document.getElementById('salaryInfo').innerHTML = `মূল বেতন: <strong>৳${emp.salary}</strong>`;
            document.getElementById('totalDeduction').innerHTML = `মোট নিয়েছে: <strong>- ৳${totalTaken}</strong>`;
            document.getElementById('remainingBalance').innerHTML = `বর্তমান পাওনা: <strong style="color: ${remaining < 0 ? 'red' : '#27ae60'};">৳${remaining}</strong>`;
        }

        // Delete a specific transaction
        function deleteTransaction(transId) {
            if(!confirm("আপনি কি এই রেকর্ডটি মুছে ফেলতে চান?")) return;
            const empIndex = employees.findIndex(e => e.id === currentEmployeeId);
            employees[empIndex].transactions = employees[empIndex].transactions.filter(t => t.id !== transId);
            saveData();
            renderLedger();
            renderEmployees();
        }

        // Helper: Save to Local Storage
        function saveData() {
            localStorage.setItem('employees', JSON.stringify(employees));
        }

        // Helper: Format Date
        function formatDate(dateString) {
            const options = { day: 'numeric', month: 'short', year: 'numeric' };
            return new Date(dateString).toLocaleDateString('bn-BD', options);
        }

        // Initialize App
        renderEmployees();

        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('profileModal');
            if (event.target === modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">

  <title>কর্মচারী হিসাব ও বেতন সিস্টেম</title>
  <style>
    :root {
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --accent: #1e3a8a;
      --accent-hover: #172554;
      --text: #020617;
      --border: #94a3b8;
      --input-bg: #ffffff;
      --header-bg: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
    }
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      background-color: var(--bg-color);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
      font-size: 16px;
    }
    body {
      padding: 15px;
    }
    /* ডেস্কটপ ভিউ ঠিক করতে max-width বাড়ানো হয়েছে */
    .main-container {
      max-width: 1200px; 
      margin: 0 auto;
      width: 100%;
    }

    /* ================= HEADER STYLE ================= */
    .header-card {
      background: var(--header-bg);
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 25px;
      box-shadow: 0 4px 15px rgba(30, 58, 138, 0.3);
      color: #ffffff;
      width: 100%;
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding-bottom: 20px;
    }
    .menu-btn {
      width: 45px;
      height: 45px;
      flex-shrink: 0;
      border: 2px solid rgba(255,255,255,0.4);
      border-radius: 8px;
      background: rgba(255,255,255,0.15);
      color: #ffffff;
      font-size: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      transition: background 0.3s;
    }
    .menu-btn:hover { background: rgba(255,255,255,0.3); }

    .header-titles {
      flex: 1;
      text-align: center;
      padding: 0 15px;
    }

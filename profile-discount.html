<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aluminium Window Cost Calculator</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { margin: 10px; background-color: #f4f4f9; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h2 { text-align: center; font-size: 20px; color: #111; margin-bottom: 15px; }
        
        .discount-section { background: #eef2f5; padding: 10px 15px; border-radius: 6px; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
        .discount-section input { width: 80px; padding: 6px; border: 1px solid #ccc; border-radius: 4px; font-weight: bold; }

        .window-box { border: 1px solid #ddd; padding: 12px; margin-bottom: 12px; border-radius: 6px; background: #fafafa; position: relative; }
        .window-header { font-weight: bold; font-size: 16px; margin-bottom: 10px; color: #007bff; border-bottom: 1px solid #eee; padding-bottom: 5px; }

        /* মোবাইল ফ্রেন্ডলি গ্রিড লেআউট */
        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
        .input-group { display: flex; flex-direction: column; }
        .input-group label { font-size: 12px; font-weight: bold; margin-bottom: 4px; color: #555; }
        .input-group input, .input-group select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; width: 100%; }

        .btn-remove { background: #dc3545; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; margin-top: 10px; width: 100%; font-weight: bold; }
        .btn-add { background: #28a745; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; margin-bottom: 10px; }
        .btn-calc { background: #007bff; color: white; border: none; padding: 12px 15px; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; }

        .total-box { margin-top: 15px; padding: 15px; background: #e6f4ea; border-radius: 6px; text-align: center; }
        .total-box h3 { margin: 0; font-size: 18px; color: #2e7d32; }
    </style>
</head>
<body>

<div class="container">
    <h2>এলুমিনিয়াম উইন্ডো ক্যালকুলেটর</h2>
    
    <div class="discount-section">
        <label><b>ডিসকাウント (%):</b></label>
        <input type="number" id="discountPercent" value="18" placeholder="0"> %
    </div>

    <div id="windowsList"></div>

    <button class="btn-add" onclick="addWindow()">+ নতুন উইন্ডো যোগ করুন</button>
    <button class="btn-calc" onclick="calculateTotal()">মোট হিসাব করুন</button>

    <div class="total-box">
        <h3>সর্বমোট মূল্য: <span id="grandTotal">০</span> টাকা</h3>
    </div>
</div>

<script>
// ১. প্রতি স্কয়ার ফিটের অনুমানিক রেট (আপনার রেট অনুযায়ী এখানে পরিবর্তন করতে পারবেন)
const sqftRateList = {
    "1.2mm": {
        "silver": 450,
        "bronze": 480,
        "woodtech": 550
    },
    "1.5mm": {
        "silver": 520,
        "bronze": 560,
        "woodtech": 650
    }
};

let windowCount = 0;

function addWindow() {
    windowCount++;
    const container = document.getElementById('windowsList');
    
    const windowDiv = document.createElement('div');
    windowDiv.className = 'window-box';
    windowDiv.id = `window_${windowCount}`;
    
    windowDiv.innerHTML = `
        <div class="window-header">উইন্ডো #${windowCount}</div>
        <div class="grid-container">
            <div class="input-group">
                <label>থিকনেস:</label>
                <select class="thickness">
                    <option value="1.2mm">1.2 mm</option>
                    <option value="1.5mm">1.5 mm</option>
                </select>
            </div>

            <div class="input-group">
                <label>কালার:</label>
                <select class="color">
                    <option value="silver">Silver</option>
                    <option value="bronze">Bronze/Black</option>
                    <option value="woodtech">Woodtech</option>
                </select>
            </div>

            <div class="input-group">
                <label>উচ্চতা (ইঞ্চি):</label>
                <input type="number" class="height" placeholder="যেমন: 54" value="54">
            </div>

            <div class="input-group">
                <label>দৈর্ঘ্য (ইঞ্চি):</label>
                <input type="number" class="length" placeholder="যেমন: 60" value="60">
            </div>

            <div class="input-group">
                <label>পরিমাণ (Qty):</label>
                <input type="number" class="qty" placeholder="1" value="1">
            </div>
        </div>
        <button class="btn-remove" onclick="removeWindow('window_${windowCount}')">মুছে ফেলুন</button>
    `;
    
    container.appendChild(windowDiv);
}

function removeWindow(id) {
    document.getElementById(id).remove();
}

function calculateTotal() {
    let rawTotal = 0;
    const discount = parseFloat(document.getElementById('discountPercent').value) || 0;
    const windows = document.querySelectorAll('.window-box');

    windows.forEach(win => {
        const thickness = win.querySelector('.thickness').value;
        const color = win.querySelector('.color').value;
        const heightInch = parseFloat(win.querySelector('.height').value) || 0;
        const lengthInch = parseFloat(win.querySelector('.length').value) || 0;
        const qty = parseInt(win.querySelector('.qty').value) || 1;

        // ১. ইঞ্চি থেকে স্কয়ার ফিট বের করা (উচ্চতা × দৈর্ঘ্য ÷ ১৪৪)
        const totalSqft = (heightInch * lengthInch) / 144;
        
        // ২. প্রতি স্কয়ার ফিটের দাম ধরা
        const ratePerSqft = sqftRateList[thickness][color];

        // ৩. প্রতিটি উইন্ডোর মোট দাম
        const windowCost = totalSqft * ratePerSqft * qty;
        rawTotal += windowCost;
    });

    // ৪. ডিসকাউন্ট বাদ দেওয়া
    const finalTotal = rawTotal - (rawTotal * (discount / 100));
    
    // বাংলাদেশি টাকায় ফরম্যাট করা
    document.getElementById('grandTotal').innerText = Math.round(finalTotal).toLocaleString('bn-BD');
}

// ডিফল্ট প্রথম উইন্ডো
addWindow();
</script>

</body>
</html>

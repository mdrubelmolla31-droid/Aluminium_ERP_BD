<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>Aluminium Window Cost Calculator</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; }
        .container { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .window-box { border: 1px solid #ccc; padding: 15px; margin-bottom: 10px; border-radius: 5px; background: #fafafa; }
        button { padding: 8px 15px; cursor: pointer; border: none; border-radius: 4px; }
        .btn-add { background: #28a745; color: white; }
        .btn-remove { background: #dc3545; color: white; }
        input, select { padding: 6px; margin: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2>এলুমিনিয়াম উইন্ডো ক্যালকুলেটর</h2>
    
    <!-- ডিসকাউন্ট ইনপুট -->
    <label><b>ডিসকাউন্ট (%): </b></label>
    <input type="number" id="discountPercent" value="0" placeholder="0"> %
    <hr>

    <!-- উইন্ডো লিস্ট কন্টেইনার -->
    <div id="windowsList"></div>

    <!-- আনলিমিটেড উইন্ডো যোগ করার বাটন -->
    <button class="btn-add" onclick="addWindow()">+ নতুন উইন্ডো যোগ করুন</button>
    <br><br>
    
    <button style="background: #007bff; color: white; font-size: 16px;" onclick="calculateTotal()">মোট হিসাব করুন</button>

    <h3>সর্বমোট মূল্য: <span id="grandTotal">0</span> টাকা</h3>
</div>

<script>
// ১. প্রাইজ ডেটাবেজ (1.2mm, 1.5mm, কালার এবং মডেল অনুযায়ী)
const priceList = {
    "1.2mm": {
        "silver": 3704,
        "bronze": 4000,
        "woodtech": 4500
    },
    "1.5mm": {
        "silver": 4492,
        "bronze": 4800,
        "woodtech": 5300
    }
};

let windowCount = 0;

// ২. নতুন উইন্ডো যোগ করার ফাংশন (আনলিমিটেড)
function addWindow() {
    windowCount++;
    const container = document.getElementById('windowsList');
    
    const windowDiv = document.createElement('div');
    windowDiv.className = 'window-box';
    windowDiv.id = `window_${windowCount}`;
    
    windowDiv.innerHTML = `
        <h4>উইন্ডো #${windowCount}</h4>
        <label>থিকনেস:</label>
        <select class="thickness">
            <option value="1.2mm">1.2 mm</option>
            <option value="1.5mm">1.5 mm</option>
        </select>

        <label>কালার:</label>
        <select class="color">
            <option value="silver">Silver</option>
            <option value="bronze">Bronze/Black</option>
            <option value="woodtech">Woodtech</option>
        </select>

        <label>উচ্চতা (Height - ft):</label>
        <input type="number" class="height" placeholder="0" value="4">

        <label>দৈর্ঘ্য (Length - ft):</label>
        <input type="number" class="length" placeholder="0" value="5">

        <label>পরিমাণ (Qty):</label>
        <input type="number" class="qty" placeholder="1" value="1">

        <button class="btn-remove" onclick="removeWindow('window_${windowCount}')">মুছে ফেলুন</button>
    `;
    
    container.appendChild(windowDiv);
}

// উইন্ডো মুছে ফেলার ফাংশন
function removeWindow(id) {
    document.getElementById(id).remove();
}

// ৩. মোট হিসাব করার লজিক (ডিসকাউন্ট সহ)
function calculateTotal() {
    let rawTotal = 0;
    const discount = parseFloat(document.getElementById('discountPercent').value) || 0;
    const windows = document.querySelectorAll('.window-box');

    windows.forEach(win => {
        const thickness = win.querySelector('.thickness').value;
        const color = win.querySelector('.color').value;
        const height = parseFloat(win.querySelector('.height').value) || 0;
        const length = parseFloat(win.querySelector('.length').value) || 0;
        const qty = parseInt(win.querySelector('.qty').value) || 1;

        // স্কয়ার ফিট হিসাব (উচ্চতা × দৈর্ঘ্য)
        const sqft = height * length;
        
        // প্রতি স্কয়ার ফিট বা পিসের বেস রেট
        const baseRate = priceList[thickness][color];

        // একটি উইন্ডোর সাবটোটাল
        const windowCost = sqft * baseRate * qty;
        rawTotal += windowCost;
    });

    // ডিসকাউন্ট বাদ দেওয়া
    const finalTotal = rawTotal - (rawTotal * (discount / 100));
    document.getElementById('grandTotal').innerText = finalTotal.toLocaleString('bn-BD');
}

// প্রথম উইন্ডো নিজে থেকেই লোড হওয়ার জন্য
addWindow();
</script>

</body>
</html>

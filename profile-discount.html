<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Profile Discount - Aluminium ERP BD</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            display: flex;
            justify-content: center;
            padding: 16px;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 450px;
        }

        /* Header Layout */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding: 8px 0;
        }

        .back-btn {
            background: #1e293b;
            border: 1px solid #334155;
            color: #fff;
            padding: 8px 14px;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .header-title {
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
        }

        /* Form Card */
        .card {
            background: #111827;
            border: 1px solid #1e293b;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 16px;
            font-weight: bold;
            color: #fbbf24;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: #9ca3af;
            margin-bottom: 6px;
        }

        .form-input, .form-select {
            width: 100%;
            padding: 10px 12px;
            background: #1e293b;
            border: 1px solid #334155;
            color: #ffffff;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .form-input:focus, .form-select:focus {
            border-color: #3b82f6;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: #1d4ed8;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.2s;
        }

        .btn-submit:active {
            background: #2563eb;
        }

        /* List Table/View */
        .discount-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .discount-item {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .company-info h4 {
            font-size: 14px;
            color: #ffffff;
        }

        .company-info p {
            font-size: 12px;
            color: #9ca3af;
        }

        .discount-badge {
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.4);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: bold;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 16px;
            margin-left: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <a href="index.html" class="back-btn">⬅ Back</a>
            <div class="header-title">Company Profile Discount</div>
            <div style="width: 60px;"></div> <!-- Spacer -->
        </div>

        <!-- Add/Edit Discount Form -->
        <div class="card">
            <div class="card-title">🏢 Add Company Discount</div>
            
            <div class="form-group">
                <label for="companyName">Company Name (কোম্পানির নাম)</label>
                <input type="text" id="companyName" class="form-input" placeholder="e.g. Kai Aluminium / Chung Hua">
            </div>

            <div class="form-group">
                <label for="profileType">Profile Category (প্রোফাইল টাইপ)</label>
                <select id="profileType" class="form-select">
                    <option value="All Profiles">All Profiles (সকল প্রোফাইল)</option>
                    <option value="Sliding 3&quot;">Sliding 3" (৩ ইঞ্চি স্লাইডিং)</option>
                    <option value="Sliding 4&quot;">Sliding 4" (৪ ইঞ্চি স্লাইডিং)</option>
                    <option value="Fixed 3&quot;">Fixed 3" (৩ ইঞ্চি ফিক্সড)</option>
                    <option value="Fixed 4&quot;">Fixed 4" (৪ ইঞ্চি ফিক্সড)</option>
                    <option value="Casement Window">Casement Window</option>
                    <option value="Curtain Wall">Curtain Wall</option>
                    <option value="Door Section">Door Section</option>
                </select>
            </div>

            <div class="form-group">
                <label for="discountRate">Discount Rate (%) (ডিসকাউন্ট শতাংশ)</label>
                <input type="number" id="discountRate" class="form-input" placeholder="e.g. 10 or 15">
            </div>

            <button class="btn-submit" onclick="saveDiscount()">💾 Save Discount Rate</button>
        </div>

        <!-- Saved Discounts List -->
        <div class="card">
            <div class="card-title">📋 Saved Company Discounts</div>
            <div class="discount-list" id="discountContainer">
                <!-- Javascript দিয়ে ডাটা লোড হবে -->
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            loadDiscounts();
        });

        function saveDiscount() {
            const compName = document.getElementById("companyName").value.trim();
            const profType = document.getElementById("profileType").value;
            const rate = document.getElementById("discountRate").value.trim();

            if (!compName || !rate) {
                alert("দয়া করে কোম্পানির নাম এবং ডিসকাউন্ট হার সঠিকভাবে লিখুন!");
                return;
            }

            let discounts = JSON.parse(localStorage.getItem("app_company_discounts")) || [];

            const newDiscount = {
                id: Date.now(),
                company: compName,
                category: profType,
                rate: rate
            };

            discounts.push(newDiscount);
            localStorage.setItem("app_company_discounts", JSON.stringify(discounts));

            // Form Reset
            document.getElementById("companyName").value = "";
            document.getElementById("discountRate").value = "";

            loadDiscounts();
            alert("কোম্পানি ডিসকাউন্ট সফলভাবে সেভ হয়েছে!");
        }

        function loadDiscounts() {
            const container = document.getElementById("discountContainer");
            let discounts = JSON.parse(localStorage.getItem("app_company_discounts")) || [];

            if (discounts.length === 0) {
                container.innerHTML = `<p style="color: #9ca3af; font-size: 13px; text-align: center; padding: 10px;">কোনো ডিসকাউন্ট ডাটা সেভ করা নেই।</p>`;
                return;
            }

            let html = "";
            discounts.forEach(item => {
                html += `
                    <div class="discount-item">
                        <div class="company-info">
                            <h4>${item.company}</h4>
                            <p>${item.category}</p>
                        </div>
                        <div style="display: flex; align-items: center;">
                            <span class="discount-badge">${item.rate}% OFF</span>
                            <button class="delete-btn" onclick="deleteDiscount(${item.id})">🗑️</button>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function deleteDiscount(id) {
            if (confirm("আপনি কি এটি মুছে ফেলতে চান?")) {
                let discounts = JSON.parse(localStorage.getItem("app_company_discounts")) || [];
                discounts = discounts.filter(item => item.id !== id);
                localStorage.setItem("app_company_discounts", JSON.stringify(discounts));
                loadDiscounts();
            }
        }
    </script>
</body>
</html>

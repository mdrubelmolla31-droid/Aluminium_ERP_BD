<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aluminum Profile</title>
  <style>
    body {
      background-color: #0b1325;
      color: #ffffff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 15px;
    }

    /* হেডার সেকশন (মুছুন বাটন ছাড়া) */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .back-btn {
      background-color: #1a2a47;
      color: #4ba3e3;
      border: 1px solid #2d4570;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }

    .header-title {
      font-size: 20px;
      font-weight: bold;
      margin: 0 auto;
    }

    /* সার্চ বার */
    .search-box {
      width: 100%;
      padding: 12px;
      background-color: #132038;
      border: 1px solid #25395c;
      border-radius: 8px;
      color: #fff;
      margin-bottom: 15px;
      box-sizing: border-box;
    }

    .selected-title {
      color: #4ba3e3;
      font-size: 16px;
      margin-bottom: 15px;
    }

    /* ডাটা কার্ড */
    .profile-card {
      background-color: #111d33;
      border: 1px solid #1f3354;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 12px;
    }

    .die-tag {
      display: inline-block;
      background-color: #17325c;
      color: #4ba3e3;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .item-title {
      font-size: 16px;
      font-weight: bold;
      margin: 4px 0;
    }

    .item-desc {
      color: #8fa3bf;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <!-- হেডার (মুছুন বাটন ছাড়া) -->
  <div class="top-bar">
    <button class="back-btn" onclick="history.back()">← Back</button>
    <div class="header-title">Aluminum Profile</div>
  </div>

  <!-- সার্চ বার -->
  <input type="text" class="search-box" placeholder="Search item...">

  <div class="selected-title">Selected Category: Sliding Profile (স্লাইডিং প্রোফাইল)</div>

  <!-- ডাটা কার্ড লিস্ট -->
  <div id="profile-container">
    <div class="profile-card">
      <div class="die-tag">Die No: 2121N</div>
      <div class="item-title">3" Sliding outer top</div>
      <div class="item-desc">General Model | Length: 21'-0"</div>
    </div>

    <div class="profile-card">
      <div class="die-tag">Die No: 2120 A</div>
      <div class="item-title">3" Sliding outer Low Bottom</div>
      <div class="item-desc">General Model | Length: 21'-0"</div>
    </div>

    <div class="profile-card">
      <div class="die-tag">Die No: 1437 B</div>
      <div class="item-title">4" Sliding outer top</div>
      <div class="item-desc">Outer Frame 91mm (With Net) | Length: 21'-0"</div>
    </div>
  </div>

</body>
</html>

<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aluminum Profile Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            padding: 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        /* Top Header */
        .header-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid #1e293b;
        }

        .back-btn {
            background: #1e293b;
            color: #38bdf8;
            border: 1px solid #334155;
            padding: 8px 14px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
        }

        .page-title {
            font-size: 18px;
            font-weight: bold;
            color: #ffffff;
        }

        .clear-btn {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }

        .clear-btn:active {
            transform: scale(0.95);
        }

        /* 5 Main Category Buttons Grid */
        .category-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .cat-card {
            background: #111827;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 16px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .cat-card:hover, .cat-card.active {
            border-color: #3b82f6;
            background: #1e293b;
        }

        .cat-card.active {
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.3);
        }

        .cat-icon {
            font-size: 24px;
        }

        .cat-title {
            font-size: 13px;
            font-weight: 600;
            color: #e5e7eb;
        }

        .full-width-card {
            grid-column: span 2;
        }

        /* Search & Info Section */
        .search-box {
            width: 100%;
            padding: 12px;
            background: #111827;
            border: 1px solid #334155;
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            margin-bottom: 16px;
            outline: none;
        }

        .section-header {
            font-size: 15px;
            font-weight: bold;
            color: #38bdf8;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Data List */
        .profile-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .profile-card {
            background: #111827;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .die-badge {
            background: rgba(56, 189, 248, 0.1);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 4px 8px;
            border-radius: 6px;
            font-family: monospace;
            font-weight: bold;
            font-size: 13px;
            display: inline-block;
            margin-bottom: 6px;
        }

        .profile-info {
            flex-grow: 1;
        }

        .profile-name {
            font-size: 14px;
            font-weight: 600;
            color: #f3f4f6;
            margin-bottom: 4px;
        }

        .profile-spec {
            font-size: 12px;
            color: #9ca3af;
        }

        .empty-msg {
            text-align: center;
            color: #6b7280;
            padding: 30px;
            font-size: 14px;
            background: #111827;
            border-radius: 12px;
            border: 1px dashed #1e293b;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header-bar">
            <a href="index.html" class="back-btn">⬅ Back</a>
            <div class="page-title">Aluminum Profile</div>
            <button class="clear-btn" onclick="clearAllData()">🗑️ মুছুন</button>
        </div>

        <!-- 5টি মূল অপশন / ক্যাটাগরি -->
        <div class="category-grid">
            <!-- ১. কার্টেন ওয়াল -->
            <div class="cat-card active" onclick="selectCategory(this, 'Curtain Wall')">
                <div class="cat-icon">🏛️</div>
                <div class="cat-title">1. Curtain Wall</div>
            </div>

            <!-- ২. স্লাইডিং ওয়াল/প্রোফাইল -->
            <div class="cat-card" onclick="selectCategory(this, 'Sliding Profile')">
                <div class="cat-icon">🚪</div>
                <div class="cat-title">2. Sliding Profile</div>
            </div>

            <!-- ৩. পিডিএফ বুক -->
            <div class="cat-card" onclick="selectCategory(this, 'PDF Book')">
                <div class="cat-icon">📖</div>
                <div class="cat-title">3. PDF Book</div>
            </div>

            <!-- ৪. ডিটেইল ক্যাটালগ -->
            <div class="cat-card" onclick="selectCategory(this, 'Detail Catalog')">
                <div class="cat-icon">📋</div>
                <div class="cat-title">4. Detail Catalog</div>
            </div>

            <!-- ৫. পিডিএফ অল (Full Width) -->
            <div class="cat-card full-width-card" onclick="selectCategory(this, 'PDF All')">
                <div class="cat-icon">📚</div>
                <div class="cat-title">5. PDF All</div>
            </div>
        </div>

        <!-- সার্চ বক্স -->
        <input type="text" id="searchInput" class="search-box" placeholder="Search item..." onkeyup="filterProfiles()">

        <!-- সেকশন টাইটেল -->
        <div class="section-header">
            <span id="selectedCatTitle">Selected Category: Curtain Wall</span>
        </div>

        <!-- প্রোফাইল লিস্ট -->
        <div class="profile-list" id="profileList">
            <!-- কার্টেন ওয়ালের ডাটা বা তথ্য এখানে দেখাবে -->
            <div class="profile-card">
                <div class="profile-info">
                    <span class="die-badge">Die No: 9558BB</span>
                    <div class="profile-name">Half (113x34.3.0mm)</div>
                    <div class="profile-spec">Thick: 2.3mm | Nose: 16mm | Length: 21'-0"</div>
                </div>
            </div>
            <div class="profile-card">
                <div class="profile-info">
                    <span class="die-badge">Die No: 9558AB</span>
                    <div class="profile-name">(113x64.3.0mm) 5.Bit</div>
                    <div class="profile-spec">Thick: 3mm | Nose: 16mm | Length: 21'-0"</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ৫টি অপশন সিলেক্ট করার ফাংশন
        function selectCategory(element, catName) {
            let cards = document.querySelectorAll('.cat-card');
            cards.forEach(card => card.classList.remove('active'));
            element.classList.add('active');

            document.getElementById('selectedCatTitle').innerText = "Selected Category: " + catName;
        }

        // সব মুছে ফেলার ফাংশন
        function clearAllData() {
            if (confirm("আপনি কি নিশ্চিত যে সব তথ্য মুছে ফেলতে চান?")) {
                document.getElementById('profileList').innerHTML = `
                    <div class="empty-msg">
                        সব ডাটা মুছে ফেলা হয়েছে! 🗑️
                    </div>
                `;
            }
        }

        // সার্চ ফাংশন
        function filterProfiles() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let cards = document.getElementsByClassName('profile-card');

            for (let i = 0; i < cards.length; i++) {
                let text = cards[i].innerText.toLowerCase();
                if (text.includes(input)) {
                    cards[i].style.display = "flex";
                } else {
                    cards[i].style.display = "none";
                }
            }
        }
    </script>
</body>
</html>

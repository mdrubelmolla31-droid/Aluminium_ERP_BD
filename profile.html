<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aluminum Profile</title>
  <style>
    body {
      background-color: #0b1325;
      color: #ffffff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 15px;
    }

    /* হেডার সেকশন */
    .top-bar {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
    }

    .back-btn {
      background-color: #1a2a47;
      color: #4ba3e3;
      border: 1px solid #2d4570;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }

    .header-title {
      font-size: 20px;
      font-weight: bold;
      margin: 0 auto;
      transform: translateX(-20px); /* সেন্টারে আনার জন্য */
    }

    /* কার্ড গ্রিড লেআউট (২ টি করে কার্ড) */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin-top: 20px;
    }

    /* লিঙ্ক ও কার্ডের স্টাইল */
    .card-link {
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .menu-card {
      background-color: #111d33;
      border: 1px solid #1f3354;
      border-radius: 12px;
      padding: 20px 10px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
    }

    .menu-card:hover {
      background-color: #172847;
      border-color: #2b497a;
    }

    .card-icon {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .card-title {
      font-size: 14px;
      font-weight: 500;
      color: #e1e7f0;
      line-height: 1.4;
    }

    /* ফুল উইডথ কার্ড (EDF All এর জন্য) */
    .full-width {
      grid-column: span 2;
    }
  </style>
</head>
<body>

  <!-- হেডার -->
  <div class="top-bar">
    <button class="back-btn" onclick="history.back()">← Back</button>
    <div class="header-title">Aluminum Profile</div>
  </div>

  <!-- কার্ডগুলোর গ্রিড -->
  <div class="card-grid">

    <!-- ১. Curtain Wall -->
    <div class="menu-card">
      <div class="card-icon">🏛️</div>
      <div class="card-title">Curtain Wall<br>(কার্টেন ওয়াল)</div>
    </div>

    <!-- ২. Sliding Profile -->
    <div class="menu-card">
      <div class="card-icon">🚪</div>
      <div class="card-title">Sliding Profile<br>(স্লাইডিং প্রোফাইল)</div>
    </div>

    <!-- ৩. EDF Book (ফাইল লিঙ্ক যুক্ত করা হয়েছে) -->
    <a href="EDF_Book.pdf" target="_blank" class="card-link">
      <div class="menu-card">
        <div class="card-icon">📖</div>
        <div class="card-title">EDF Book<br>(ইডিএফ বুক)</div>
      </div>
    </a>

    <!-- ৪. Detail Catalog -->
    <div class="menu-card">
      <div class="card-icon">📋</div>
      <div class="card-title">Detail Catalog<br>(ডিটেইল ক্যাটালগ)</div>
    </div>

    <!-- ৫. EDF All (ফুল উইডথ) -->
    <div class="menu-card full-width">
      <div class="card-icon">📚</div>
      <div class="card-title">EDF All<br>(ইডিএফ অল)</div>
    </div>

  </div>

</body>
</html>

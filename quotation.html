<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quotation Slip</title>
<link rel="stylesheet" href="style.css">
<style>
    .invoice-box { max-width: 800px; margin: auto; padding: 30px; border: 1px solid #eee; background: #fff; }
    .header-table, .details-table { width: 100%; margin-bottom: 20px; border-collapse: collapse; }
    .details-table th, .details-table td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    .details-table th { background-color: #f4f4f4; }
    @media print { .no-print { display: none; } }
</style>
</head>
<body>

<div class="invoice-box">
    <div style="text-align: center; margin-bottom: 20px;">
        <h2>ALUMINIUM & GLASS QUOTATION</h2>
        <p>Estimated Cost Breakdown</p>
    </div>

    <table class="header-table">
        <tr>
            <td><strong>Customer Name:</strong> <span id="qName"></span></td>
            <td style="text-align: right;"><strong>Date:</strong> <span id="qDate"></span></td>
        </tr>
        <tr>
            <td><strong>Mobile:</strong> <span id="qMobile"></span></td>
            <td style="text-align: right;"><strong>Address:</strong> <span id="qAddress"></span></td>
        </tr>
    </table>

    <table class="details-table">
        <thead>
            <tr>
                <th>Description</th>
                <th>Specifications</th>
                <th>Total Measurement</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Aluminium Frame</td>
                <td><span id="qCompany"></span> - <span id="qSeries"></span></td>
                <td><span id="qAlu"></span></td>
            </tr>
            <tr>
                <td>Glass Work</td>
                <td>Standard Specification</td>
                <td><span id="qGlass"></span></td>
            </tr>
        </tbody>
    </table>

    <h3 style="text-align: right;">Total Price: <span id="qPrice" style="color:#2563eb;"></span></h3>

    <hr>
    <div class="no-print" style="margin-top:20px; display:flex; gap:10px;">
        <button onclick="window.print()" style="flex:1; padding:10px; background:#2563eb; color:#fff; border:none; cursor:pointer; border-radius:5px;">Print / Save PDF</button>
        <button onclick="saveToDashboard()" style="flex:1; padding:10px; background:#16a34a; color:#fff; border:none; cursor:pointer; border-radius:5px;">Save to Dashboard</button>
        <button onclick="location.href='dashboard.html'" style="flex:1; padding:10px; background:#6b7280; color:#fff; border:none; cursor:pointer; border-radius:5px;">Dashboard</button>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    let data = JSON.parse(localStorage.getItem("quotation")) || {};
    document.getElementById("qName").innerText = data.customerName || "N/A";
    document.getElementById("qMobile").innerText = data.mobile || "N/A";
    document.getElementById("qAddress").innerText = data.address || "N/A";
    document.getElementById("qCompany").innerText = data.company || "N/A";
    document.getElementById("qSeries").innerText = data.series || "N/A";
    document.getElementById("qAlu").innerText = data.totalAluminium || "0 ft";
    document.getElementById("qGlass").innerText = data.glass || "0 Sqft";
    document.getElementById("qPrice").innerText = data.sellingPrice || "0 ৳";
    document.getElementById("qDate").innerText = new Date().toISOString().split('T')[0];
});

function saveToDashboard() {
    let data = JSON.parse(localStorage.getItem("quotation")) || {};
    if (!data.sellingPrice) { alert("কোটেশন ডাটা পাওয়া যায়নি!"); return; }

    let list = JSON.parse(localStorage.getItem("quotationList")) || [];
    list.push({
        date: new Date().toISOString().split('T')[0],
        customerName: data.customerName || "N/A",
        mobile: data.mobile || "N/A",
        company: data.company || "N/A",
        series: data.series || "N/A",
        price: parseFloat(data.sellingPrice) || 0,
        glassSqft: parseFloat(data.glass) || 0
    });

    localStorage.setItem("quotationList", JSON.stringify(list));
    alert("Saved to Dashboard Successfully!");
    window.location.href = "dashboard.html";
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quotation Statement</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f8fafc; color: #1e293b; }
        .invoice-box { max-width: 600px; margin: auto; padding: 20px; background: white; border-radius: 10px; border: 1px solid #e2e8f0; }
        .header { text-align: center; border-bottom: 2px solid #2563eb; padding-bottom: 10px; margin-bottom: 15px; }
        .header h2 { color: #2563eb; margin-bottom: 5px; }
        .info-grid { display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 14px; }
        .table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .table th, .table td { border: 1px solid #cbd5e1; padding: 8px; text-align: center; font-size: 13px; }
        .table th { background: #f1f5f9; }
        .btn-print { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 6px; font-weight: bold; margin-top: 15px; cursor: pointer; }
        @media print { .btn-print { display: none; } }
    </style>
</head>
<body>

    <div class="invoice-box">
        <div class="header">
            <h2 id="qShopName">--</h2>
            <p>Mobile: <span id="qShopPhone">--</span></p>
        </div>

        <div class="info-grid">
            <div>
                <strong>Customer Info:</strong><br>
                Name: <span id="qCustName">--</span><br>
                Phone: <span id="qCustPhone">--</span><br>
                Address: <span id="qCustAddress">--</span>
            </div>
            <div style="text-align: right;">
                <strong>Specs:</strong><br>
                Alu: <span id="qAluSpec">--</span><br>
                Glass: <span id="qGlassSpec">--</span>
            </div>
        </div>

        <h4>Window Dimensions</h4>
        <table class="table">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Height (in)</th>
                    <th>Width (in)</th>
                    <th>Qty</th>
                </tr>
            </thead>
            <tbody id="qWinTable"></tbody>
        </table>

        <br>
        <div style="text-align: right; font-size: 15px;">
            <p>Total Area: <strong id="qTotalArea">0.00 Sqft</strong></p>
            <p style="font-size: 18px; color: #2563eb;">Total Price: <strong id="qTotalPrice">0.00 ৳</strong></p>
        </div>

        <button class="btn-print" onclick="window.print()">Print / Save PDF</button>
    </div>

    <script>
        const data = JSON.parse(localStorage.getItem("active_quotation"));

        if (data) {
            document.getElementById("qShopName").innerText = data.myShopName;
            document.getElementById("qShopPhone").innerText = data.myPhone;
            document.getElementById("qCustName").innerText = data.custName;
            document.getElementById("qCustPhone").innerText = data.custPhone;
            document.getElementById("qCustAddress").innerText = data.custAddress;

            document.getElementById("qAluSpec").innerText = `${data.company} (${data.aluThick}, ${data.aluColor})`;
            document.getElementById("qGlassSpec").innerText = `${data.glassComp} (${data.glassThick}, ${data.glassColor})`;

            document.getElementById("qTotalArea").innerText = data.totalArea;
            document.getElementById("qTotalPrice").innerText = data.totalPrice;

            const tbody = document.getElementById("qWinTable");
            tbody.innerHTML = "";
            if (data.windows && data.windows.length > 0) {
                data.windows.forEach((win, index) => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${index + 1}</td>
                            <td>${win.height}</td>
                            <td>${win.width}</td>
                            <td>${win.qty}</td>
                        </tr>
                    `;
                });
            }
        }
    </script>
</body>
</html>

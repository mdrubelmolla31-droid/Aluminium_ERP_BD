<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aluminium Quotation</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background-color: #f4f6f9; margin: 0; padding: 10px; color: #333; }
    .container { max-width: 650px; margin: 0 auto; }
    
    .card { 
      background: #fff; 
      padding: 15px; 
      border-radius: 10px; 
      box-shadow: 0 2px 8px rgba(0,0,0,0.08); 
      margin-bottom: 15px; 
    }
    
    .card-title { color: #1a73e8; font-size: 16px; font-weight: bold; text-align: center; margin-bottom: 12px; }
    .row { display: flex; gap: 8px; margin-bottom: 8px; }
    .col { flex: 1; }
    label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 4px; }
    input, select { width: 100%; padding: 8px; font-size: 13px; border: 1px solid #ccc; border-radius: 5px; }
    
    .btn { 
      width: 100%; 
      padding: 10px; 
      border: none; 
      border-radius: 6px; 
      font-weight: bold; 
      cursor: pointer; 
      font-size: 14px; 
      margin-top: 8px; 
    }
    
    .btn-add { background-color: #10b981; color: white; }
    .btn-pdf { background-color: #059669; color: white; font-size: 15px; }
    .btn-danger { background-color: #ef4444; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    th, td { border: 1px solid #ddd; padding: 6px; text-align: center; font-size: 12px; }
    th { background-color: #2563eb; color: white; }
    
    /* Printable Quotation Design */
    #printableQuotation { 
      background: #fff; 
      padding: 15px; 
      border: 1px solid #cbd5e1; 
      border-radius: 6px; 
    }
    .pdf-header { text-align: center; border-bottom: 2px solid #2563eb; padding-bottom: 5px; margin-bottom: 10px; }
    .pdf-title { font-size: 18px; font-weight: bold; color: #2563eb; margin: 0; }
    .pdf-info { display: flex; justify-content: space-between; font-size: 12px; background: #f8fafc; padding: 8px; border-radius: 4px; margin-bottom: 10px; border: 1px solid #ddd; }
    .pdf-table { width: 100%; border-collapse: collapse; }
    .pdf-table th, .pdf-table td { border: 1px solid #000; padding: 6px; font-size: 11px; text-align: center; }
    .pdf-table th { background-color: #f1f5f9; color: #000; }

    /* CSS for Print/PDF Mode */
    @media print {
      body * { visibility: hidden; }
      #printableQuotation, #printableQuotation * { visibility: visible; }
      #printableQuotation { 
        position: absolute; 
        left: 0; 
        top: 0; 
        width: 100%; 
        border: none; 
        padding: 0; 
      }
    }
  </style>
</head>
<body>

<div class="container">

  <!-- ১. শপ ইনফো -->
  <div class="card">
    <div class="card-title">My Store / Contact Info</div>
    <div class="row">
      <div class="col"><label>Shop Name</label><input type="text" id="shopName" value="RM Thai Aluminum" oninput="runCalculation()"></div>
      <div class="col"><label>Mobile Number</label><input type="text" id="shopPhone" value="01676474412" oninput="runCalculation()"></div>
    </div>
  </div>

  <!-- ২. কাস্টমার ইনফো -->
  <div class="card">
    <div class="card-title">Customer Details</div>
    <div class="row">
      <div class="col"><label>Customer Name</label><input type="text" id="custName" placeholder="কাস্টমারের নাম" oninput="runCalculation()"></div>
    </div>
    <div class="row">
      <div class="col"><label>Customer Mobile</label><input type="text" id="custPhone" placeholder="মোবাইল নম্বর" oninput="runCalculation()"></div>
      <div class="col"><label>Address</label><input type="text" id="custAddress" placeholder="ঠিকানা" oninput="runCalculation()"></div>
    </div>
  </div>

  <!-- ৩. স্পেসিফিকেশন -->
  <div class="card">
    <div class="card-title">Item Specifications</div>
    <div class="row">
      <div class="col"><label>Aluminium Company</label><select id="aluCompany" onchange="runCalculation()"><option>KAI</option><option>Altech</option></select></div>
      <div class="col"><label>Alu Colour</label><select id="aluColor" onchange="runCalculation()"><option>Silver</option><option>Bronze</option></select></div>
    </div>
    <div class="row">
      <div class="col"><label>Alu Thickness</label><select id="aluThickness" onchange="runCalculation()"><option>1.0 mm</option><option>1.2 mm</option></select></div>
      <div class="col"><label>Series</label><select id="aluSeries" onchange="runCalculation()"><option>Sliding 3"</option></select></div>
    </div>
    <div class="row">
      <div class="col"><label>Glass Company</label><select id="glassCompany" onchange="runCalculation()"><option>Nasir Glass</option></select></div>
      <div class="col"><label>Glass Colour</label><select id="glassColor" onchange="runCalculation()"><option>Clear</option></select></div>
    </div>
    <div class="row">
      <div class="col"><label>Glass Thickness</label><select id="glassThickness" onchange="runCalculation()"><option>5 mm</option></select></div>
    </div>
  </div>

  <!-- ৪. জানালার ইনপুট -->
  <div class="card">
    <div class="card-title">Window Dimensions (Inches)</div>
    <table>
      <thead>
        <tr><th>#</th><th>Height (in)</th><th>Width (in)</th><th>Qty</th><th>Action</th></tr>
      </thead>
      <tbody id="winTableBody">
        <tr>
          <td class="row-index">1</td>
          <td><input type="number" class="w-h" value="54" oninput="runCalculation()"></td>
          <td><input type="number" class="w-w" value="60" oninput="runCalculation()"></td>
          <td><input type="number" class="w-q" value="1" oninput="runCalculation()"></td>
          <td><button class="btn-danger" onclick="removeRow(this)">X</button></td>
        </tr>
      </tbody>
    </table>
    <button class="btn btn-add" onclick="addRow()">+ Add Another Window</button>
  </div>

  <!-- ৫. প্রাইসিং এবং ডাউনলোড -->
  <div class="card">
    <div class="card-title">Pricing & Save Options</div>
    <div class="row">
      <div class="col"><label>Selling Rate (৳/Sqft)</label><input type="number" id="sellingRate" value="450" oninput="runCalculation()"></div>
      <div class="col"><label>Total Price (৳)</label><input type="number" id="calcTotalPrice" readonly style="background:#eee; font-weight:bold;"></div>
    </div>
    <button class="btn btn-pdf" onclick="downloadPDF()">📄 Download PDF</button>
  </div>

  <!-- ৬. লাইভ প্রিভিউ -->
  <div class="card">
    <div class="card-title">Live Quotation Preview</div>
    <div id="printableQuotation">
      <div class="pdf-header">
        <p class="pdf-title" id="pShop"></p>
        <p style="margin:2px; font-size:12px;">Mobile: <span id="pPhone"></span></p>
      </div>

      <div class="pdf-info">
        <div>
          <div><b>Customer:</b> <span id="pCust"></span></div>
          <div><b>Mobile:</b> <span id="pCustMob"></span></div>
          <div><b>Address:</b> <span id="pAddr"></span></div>
        </div>
        <div style="text-align:right;">
          <div><b>Date:</b> <span id="pDate"></span></div>
        </div>
      </div>

      <div style="font-size: 11px; margin-bottom: 8px; color: #2563eb; font-weight: bold;" id="pSpec"></div>

      <table class="pdf-table">
        <thead>
          <tr><th>#</th><th>Size (H x W)</th><th>Qty</th><th>Sqft</th><th>Rate</th><th>Total</th></tr>
        </thead>
        <tbody id="pdfTableBody"></tbody>
      </table>

      <h3 style="text-align:right; color:#2563eb; margin-top:10px;">Grand Total: ৳<span id="pGrandTotal">0.00</span></h3>
    </div>
  </div>

</div>

<script>
  window.onload = function() { runCalculation(); };

  function addRow() {
    let tbody = document.getElementById('winTableBody');
    let tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="row-index"></td>
      <td><input type="number" class="w-h" value="54" oninput="runCalculation()"></td>
      <td><input type="number" class="w-w" value="60" oninput="runCalculation()"></td>
      <td><input type="number" class="w-q" value="1" oninput="runCalculation()"></td>
      <td><button class="btn-danger" onclick="removeRow(this)">X</button></td>
    `;
    tbody.appendChild(tr);
    updateIndexes();
    runCalculation();
  }

  function removeRow(btn) {
    btn.parentElement.parentElement.remove();
    updateIndexes();
    runCalculation();
  }

  function updateIndexes() {
    let rows = document.querySelectorAll('#winTableBody tr');
    rows.forEach((row, i) => row.querySelector('.row-index').innerText = i + 1);
  }

  function runCalculation() {
    document.getElementById('pShop').innerText = document.getElementById('shopName').value;
    document.getElementById('pPhone').innerText = document.getElementById('shopPhone').value;
    document.getElementById('pCust').innerText = document.getElementById('custName').value;
    document.getElementById('pCustMob').innerText = document.getElementById('custPhone').value;
    document.getElementById('pAddr').innerText = document.getElementById('custAddress').value;

    let alu = `${document.getElementById('aluCompany').value} (${document.getElementById('aluColor').value}, ${document.getElementById('aluThickness').value})`;
    let gls = `${document.getElementById('glassCompany').value} (${document.getElementById('glassThickness').value} ${document.getElementById('glassColor').value})`;
    document.getElementById('pSpec').innerText = `Spec: ${alu} | ${gls}`;

    let heights = document.querySelectorAll('.w-h');
    let widths = document.querySelectorAll('.w-w');
    let qtys = document.querySelectorAll('.w-q');
    let rate = parseFloat(document.getElementById('sellingRate').value) || 0;

    let tbody = document.getElementById('pdfTableBody');
    tbody.innerHTML = '';
    let totalAmt = 0;

    for (let i = 0; i < heights.length; i++) {
      let h = parseFloat(heights[i].value) || 0;
      let w = parseFloat(widths[i].value) || 0;
      let q = parseFloat(qtys[i].value) || 0;

      if (h > 0 && w > 0 && q > 0) {
        let sqft = ((h * w) / 144) * q;
        let rowTotal = sqft * rate;
        totalAmt += rowTotal;

        tbody.innerHTML += `
          <tr>
            <td>${i + 1}</td>
            <td>${h}" x ${w}"</td>
            <td>${q}</td>
            <td>${sqft.toFixed(2)}</td>
            <td>৳${rate}</td>
            <td>৳${rowTotal.toFixed(2)}</td>
          </tr>
        `;
      }
    }

    document.getElementById('calcTotalPrice').value = totalAmt.toFixed(2);
    document.getElementById('pGrandTotal').innerText = totalAmt.toFixed(2);
    document.getElementById('pDate').innerText = new Date().toLocaleDateString('en-US');
  }

  function downloadPDF() {
    runCalculation();
    window.print();
  }
</script>

</body>
</html>

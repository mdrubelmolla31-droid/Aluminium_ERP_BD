<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rate Settings</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">
        <h2 class="title">Rate Settings</h2>
        <a href="#" class="subtitle-link">Master Data</a>

        <!-- Master Inputs -->
        <div class="input-group">
            <label>New Company</label>
            <input type="text">
            <button class="btn btn-blue">Add Company</button>
        </div>

        <div class="input-group">
            <label>New Series</label>
            <input type="text">
            <button class="btn btn-blue">Add Series</button>
        </div>

        <div class="input-group">
            <label>New Aluminium Thickness</label>
            <input type="text">
            <button class="btn btn-blue">Add Thickness</button>
        </div>

        <div class="input-group">
            <label>New Glass Company</label>
            <input type="text">
            <button class="btn btn-blue">Add Glass Company</button>
        </div>

        <hr class="divider">

        <!-- Dropdowns -->
        <div class="form-control">
            <label>Company</label>
            <select><option>KAI</option></select>
        </div>

        <div class="form-control">
            <label>Series</label>
            <select><option>Sliding Window 3"</option></select>
        </div>

        <div class="form-control">
            <label>Aluminium Thickness</label>
            <select><option>1.0 mm</option></select>
        </div>

        <div class="form-control">
            <label>Glass Company</label>
            <select><option>Xinyi</option></select>
        </div>

        <div class="form-control">
            <label>Glass Thickness</label>
            <select><option>5 mm</option></select>
        </div>

        <div class="form-control">
            <label>Glass Colour</label>
            <select><option>Clear</option></select>
        </div>

        <!-- Rates Inputs -->
        <div class="form-control">
            <label>Aluminium Rate (৳/ft)</label>
            <input type="number">
        </div>

        <div class="form-control">
            <label>Glass Rate (৳/Sqft)</label>
            <input type="number">
        </div>

        <div class="form-control">
            <label>Hardware Rate (৳/Sqft)</label>
            <input type="number">
        </div>

        <div class="form-control">
            <label>Fittings Rate (৳/Sqft)</label>
            <input type="number">
        </div>

        <div class="form-control">
            <label>Labour Rate (৳/Sqft)</label>
            <input type="number">
        </div>

        <div class="form-control">
            <label>Profit (%)</label>
            <input type="number">
        </div>

        <button class="btn btn-dark-blue">Save Rate</button>
    </div>

    <!-- Saved Rate List -->
    <div class="table-section">
        <h3 class="table-title">Saved Rate List</h3>
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Company</th>
                        <th>Series</th>
                        <th>Alu</th>
                        <th>Glass</th>
                        <th>Thick</th>
                        <th>Colour</th>
                        <th>Alu Rate</th>
                        <th>Glass</th>
                        <th>HW</th>
                        <th>Fit</th>
                        <th>Labour</th>
                        <th>Profit</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>MAX</td>
                        <td>Sliding Window 3"</td>
                        <td>1.0 mm</td>
                        <td>Nasir</td>
                        <td>6 mm</td>
                        <td>Clear</td>
                        <td>300</td>
                        <td>150</td>
                        <td>48</td>
                        <td>30</td>
                        <td>10</td>
                        <td>20%</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</body>
</html>

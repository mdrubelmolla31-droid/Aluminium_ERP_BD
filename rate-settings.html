<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rate Settings - RM Thai Aluminium</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f1f5f9; margin: 0; padding: 12px; color: #0f172a; }
    .container { max-width: 650px; margin: 0 auto; }

    .card {
      background: #ffffff;
      padding: 16px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      margin-bottom: 16px;
      border: 1px solid #e2e8f0;
    }

    .card-title {
      color: #1e40af;
      font-size: 18px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 14px;
      border-bottom: 2px solid #eff6ff;
      padding-bottom: 6px;
    }

    /* ছবির মতো একটির নিচে একটি ফিল্ড সাজানোর স্টাইল */
    .form-group {
      margin-bottom: 12px;
    }

    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; color: #334155; }
    
    input, select {
      width: 100%;
      padding: 10px;
      font-size: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background-color: #fff;
      margin-bottom: 6px;
    }

    .btn-action {
      width: 100%;
      padding: 10px;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      margin-bottom: 14px;
    }

    .btn-action:hover { background-color: #1d4ed8; }

    .btn-save {
      width: 100%;
      padding: 12px;
      background-color: #1d4ed8;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }

    /* টেবিল যাতে এক স্ক্রিনে সুন্দর দেখায় */
    .table-container {
      width: 100%;
      overflow-x: auto;
      margin-top: 10px;
    }

    .rate-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .rate-table th {
      background-color: #2563eb;
      color: white;
      padding: 6px 2px;
      font-size: 10px;
      font-weight: 600;
      text-align: center;
      border: 1px solid #1d4ed8;
      word-break: break-word;
    }

    .rate-table td {
      padding: 7px 2px;
      border: 1px solid #cbd5e1;
      text-align: center;
      color: #0f172a;
      font-size: 11px;
      font-weight: 500;
      white-space: nowrap;
    }

    .rate-table tr:nth-child(even) { background-color: #f8fafc; }

    .btn-del {
      background-color: #ef4444;
      color: white;
      border: none;
      padding: 3px 6px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 10px;
    }
  </style>
</head>
<body>

<div class="container">

  <!-- মাস্টার ডাটা ও রেট সেটিংস ইনপুট সেকশন -->
  <div class="card">
    <div class="card-title">Rate Settings</div>
    <div style="text-align:center; font-weight:bold; color:#2563eb; margin-bottom:12px; font-size:14px;">Master Data</div>

    <!-- নিউ কোম্পানি অ্যাড -->
    <div class="form-group">
      <label>New Company</label>
      <input type="text" id="newCompanyName" placeholder="Enter Company Name">
      <button class="btn-action" onclick="addCompany()">Add Company</button>
    </div>

    <!-- নিউ সিরিজ অ্যাড -->
    <div class="form-group">
      <label>New Series</label>
      <input type="text" id="newSeriesName" placeholder="Enter Series Name">
      <button class="btn-action" onclick="addSeries()">Add Series</button>
    </div>

    <!-- নিউ থিকনেস অ্যাড -->
    <div class="form-group">
      <label>New Aluminium Thickness</label>
      <input type="text" id="newThickName" placeholder="Enter Thickness (e.g. 1.2 mm)">
      <button class="btn-action" onclick="addThickness()">Add Thickness</button>
    </div>

    <!-- নিউ গ্লাস কোম্পানি অ্যাড -->
    <div class="form-group">
      <label>New Glass Company</label>
      <input type="text" id="newGlassCoName" placeholder="Enter Glass Company">
      <button class="btn-action" onclick="addGlassCompany()">Add Glass Company</button>
    </div>

    <!-- ড্রপডাউন সিলেকশন এবং রেট ইনপুট -->
    <div class="form-group">
      <label>Company</label>
      <select id="companySelect"></select>
    </div>

    <div class="form-group">
      <label>Series</label>
      <select id="seriesSelect"></select>
    </div>

    <div class="form-group">
      <label>Aluminium Thickness</label>
      <select id="thicknessSelect"></select>
    </div>

    <div class="form-group">
      <label>Aluminium Colour</label>
      <select id="aluColorSelect">
        <option>Silver</option>
        <option>Bronze</option>
        <option>Black</option>
        <option>Anodized</option>
      </select>
    </div>

    <div class="form-group">
      <label>Glass Company</label>
      <select id="glassCompanySelect"></select>
    </div>

    <div class="form-group">
      <label>Glass Thickness</label>
      <select id="glassThicknessSelect">
        <option>5 mm</option>
        <option>5.5 mm</option>
        <option>6 mm</option>
        <option>8 mm</option>
      </select>
    </div>

    <div class="form-group">
      <label>Glass Colour</label>
      <select id="glassColorSelect">
        <option>Clear</option>
        <option>Blue</option>
        <option>Green</option>
        <option>Dark Blue</option>
        <option>Mercury</option>
      </select>
    </div>

    <div class="form-group">
      <label>Aluminium Rate (৳/ft)</label>
      <input type="number" id="aluRate" placeholder="180">
    </div>

    <div class="form-group">
      <label>Glass Rate (৳/Sqft)</label>
      <input type="number" id="glassRate" placeholder="125">
    </div>

    <div class="form-group">
      <label>Hardware Rate (৳/Sqft)</label>
      <input type="number" id="hwRate" placeholder="30">
    </div>

    <div class="form-group">
      <label>Fittings Rate (৳/Sqft)</label>
      <input type="number" id="fitRate" placeholder="30">
    </div>

    <div class="form-group">
      <label>Labour Rate (৳/Sqft)</label>
      <input type="number" id="labourRate" placeholder="10">
    </div>

    <div class="form-group">
      <label>Profit (%)</label>
      <input type="number" id="profit" placeholder="20">
    </div>

    <button class="btn-save" onclick="saveRate()">Save Rate</button>
  </div>

  <!-- সেভ হওয়া রেটের তালিকা টেবিল -->
  <div class="card">
    <div class="card-title">Saved Rate List</div>
    
    <div class="table-container">
      <table class="rate-table">
        <thead>
          <tr>
            <th style="width: 8%;">Company</th>
            <th style="width: 12%;">Series</th>
            <th style="width: 7%;">Alu</th>
            <th style="width: 8%;">Glass</th>
            <th style="width: 7%;">Thick</th>
            <th style="width: 8%;">Colour</th>
            <th style="width: 6%;">Alu Rate</th>
            <th style="width: 6%;">Glass</th>
            <th style="width: 5%;">HW</th>
            <th style="width: 5%;">Fit</th>
            <th style="width: 6%;">Labour</th>
            <th style="width: 6%;">Profit</th>
            <th style="width: 4%;">X</th>
          </tr>
        </thead>
        <tbody id="rateTableBody">
        </tbody>
      </table>
    </div>
  </div>

</div>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    loadDropdowns();
    loadRateList();
  });

  function getStorageData(key, defaultVal) {
    return JSON.parse(localStorage.getItem(key)) || defaultVal;
  }

  function setStorageData(key, data) {
    localStorage.setItem(key, JSON.stringify(data));
  }

  function loadDropdowns() {
    let companies = getStorageData('companyList', ['KAI', 'MAX', 'ALFA', 'BTA']);
    let series = getStorageData('seriesList', ['Sliding Window 3"', 'Sliding Window 4"']);
    let thickness = getStorageData('thickList', ['1.0 mm', '1.2 mm', '1.4 mm']);
    let glassCo = getStorageData('glassCoList', ['Nasir', 'Bengal', 'PHP']);

    populateSelect('companySelect', companies);
    populateSelect('seriesSelect', series);
    populateSelect('thicknessSelect', thickness);
    populateSelect('glassCompanySelect', glassCo);
  }

  function populateSelect(elementId, items) {
    let select = document.getElementById(elementId);
    select.innerHTML = '';
    items.forEach(item => {
      let opt = document.createElement('option');
      opt.value = item;
      opt.textContent = item;
      select.appendChild(opt);
    });
  }

  function addCompany() {
    let val = document.getElementById('newCompanyName').value.trim();
    if(!val) return alert("কোম্পানির নাম লিখুন!");
    let list = getStorageData('companyList', ['KAI', 'MAX', 'ALFA', 'BTA']);
    if(!list.includes(val)) { list.push(val); setStorageData('companyList', list); loadDropdowns(); document.getElementById('newCompanyName').value=''; alert("কোম্পানি যুক্ত হয়েছে!"); }
  }

  function addSeries() {
    let val = document.getElementById('newSeriesName').value.trim();
    if(!val) return alert("সিরিজের নাম লিখুন!");
    let list = getStorageData('seriesList', ['Sliding Window 3"', 'Sliding Window 4"']);
    if(!list.includes(val)) { list.push(val); setStorageData('seriesList', list); loadDropdowns(); document.getElementById('newSeriesName').value=''; alert("সিরিজ যুক্ত হয়েছে!"); }
  }

  function addThickness() {
    let val = document.getElementById('newThickName').value.trim();
    if(!val) return alert("থিকনেস লিখুন!");
    let list = getStorageData('thickList', ['1.0 mm', '1.2 mm', '1.4 mm']);
    if(!list.includes(val)) { list.push(val); setStorageData('thickList', list); loadDropdowns(); document.getElementById('newThickName').value=''; alert("থিকনেস যুক্ত হয়েছে!"); }
  }

  function addGlassCompany() {
    let val = document.getElementById('newGlassCoName').value.trim();
    if(!val) return alert("গ্লাস কোম্পানির নাম লিখুন!");
    let list = getStorageData('glassCoList', ['Nasir', 'Bengal', 'PHP']);
    if(!list.includes(val)) { list.push(val); setStorageData('glassCoList', list); loadDropdowns(); document.getElementById('newGlassCoName').value=''; alert("গ্লাস কোম্পানি যুক্ত হয়েছে!"); }
  }

  function saveRate() {
    let rateData = {
      company: document.getElementById('companySelect').value,
      series: document.getElementById('seriesSelect').value,
      aluThick: document.getElementById('thicknessSelect').value,
      aluColor: document.getElementById('aluColorSelect').value,
      glassCo: document.getElementById('glassCompanySelect').value,
      glassThick: document.getElementById('glassThicknessSelect').value,
      glassColor: document.getElementById('glassColorSelect').value,
      aluRate: parseFloat(document.getElementById('aluRate').value) || 0,
      glassRate: parseFloat(document.getElementById('glassRate').value) || 0,
      hwRate: parseFloat(document.getElementById('hwRate').value) || 0,
      fitRate: parseFloat(document.getElementById('fitRate').value) || 0,
      labourRate: parseFloat(document.getElementById('labourRate').value) || 0,
      profit: parseFloat(document.getElementById('profit').value) || 0
    };

    let rateList = getStorageData('rateList', []);
    rateList.push(rateData);
    setStorageData('rateList', rateList);

    alert("রেট সফলভাবে সেভ হয়েছে!");
    loadRateList();
  }

  function loadRateList() {
    let rateList = getStorageData('rateList', []);
    let tbody = document.getElementById('rateTableBody');
    tbody.innerHTML = '';

    if (rateList.length === 0) {
      tbody.innerHTML = '<tr><td colspan="13" style="padding:10px; font-size:12px;">কোনো রেট সেভ করা নেই</td></tr>';
      return;
    }

    rateList.forEach((item, index) => {
      let tr = document.createElement('tr');
      let sName = item.series ? item.series.replace('Sliding Window', 'SW') : '-';

      tr.innerHTML = `
        <td>${item.company || '-'}</td>
        <td>${sName}</td>
        <td>${item.aluThick || '-'}</td>
        <td>${item.glassCo || '-'}</td>
        <td>${item.glassThick || '-'}</td>
        <td>${item.glassColor || '-'}</td>
        <td>${item.aluRate}</td>
        <td>${item.glassRate}</td>
        <td>${item.hwRate}</td>
        <td>${item.fitRate}</td>
        <td>${item.labourRate}</td>
        <td>${item.profit}%</td>
        <td><button class="btn-del" onclick="deleteRate(${index})">X</button></td>
      `;
      tbody.appendChild(tr);
    });
  }

  function deleteRate(index) {
    if (confirm("আপনি কি এই রেটটি মুছে ফেলতে চান?")) {
      let rateList = getStorageData('rateList', []);
      rateList.splice(index, 1);
      setStorageData('rateList', rateList);
      loadRateList();
    }
  }
</script>

</body>
</html>

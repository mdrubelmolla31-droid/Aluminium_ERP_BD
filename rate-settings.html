<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rate Settings - One Screen View</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f1f5f9; margin: 0; padding: 8px; color: #0f172a; }
    .container { max-width: 100%; margin: 0 auto; }

    .card {
      background: #ffffff;
      padding: 12px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      margin-bottom: 12px;
      border: 1px solid #e2e8f0;
    }

    .card-title {
      color: #1e40af;
      font-size: 16px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 10px;
      border-bottom: 2px solid #eff6ff;
      padding-bottom: 4px;
    }

    .row { display: flex; gap: 6px; margin-bottom: 8px; }
    .col { flex: 1; }

    label { display: block; font-size: 11px; font-weight: 600; margin-bottom: 2px; color: #334155; }
    input, select {
      width: 100%;
      padding: 6px;
      font-size: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      background-color: #fff;
    }

    .btn-save {
      width: 100%;
      padding: 10px;
      background-color: #1d4ed8;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      margin-top: 6px;
    }

    /* এক স্ক্রিনশটে পুরো রো দেখানোর বিশেষ টেবিল স্টাইল */
    .table-container {
      width: 100%;
      overflow-x: hidden; /* স্ক্রল বন্ধ, সব এক ফ্রেমে থাকবে */
      margin-top: 8px;
    }

    .rate-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed; /* কলামগুলো যেন ঠিকমতো চেপে ধরে সেটে যায় */
    }

    .rate-table th {
      background-color: #2563eb;
      color: white;
      padding: 4px 1px;
      font-size: 8px; /* ছোট ফন্ট যাতে এক স্ক্রিনে ধরে */
      font-weight: 600;
      text-align: center;
      border: 1px solid #1d4ed8;
      word-wrap: break-word;
    }

    .rate-table td {
      padding: 5px 1px;
      border: 1px solid #cbd5e1;
      text-align: center;
      color: #0f172a;
      font-size: 9px; /* এক লাইনে সব দেখানোর জন্য সাইজ অ্যাডজাস্টড */
      font-weight: 500;
      white-space: nowrap;
    }

    .rate-table tr:nth-child(even) { background-color: #f8fafc; }

    .btn-del {
      background-color: #ef4444;
      color: white;
      border: none;
      padding: 2px 4px;
      border-radius: 3px;
      cursor: pointer;
      font-size: 8px;
    }
  </style>
</head>
<body>

<div class="container">

  <!-- রেট ইনপুট ফরম -->
  <div class="card">
    <div class="card-title">Rate Settings Input</div>

    <div class="row">
      <div class="col">
        <label>Alu Co.</label>
        <select id="aluCompany"><option>KAI</option><option>Altech</option><option>BTA</option></select>
      </div>
      <div class="col">
        <label>Series</label>
        <select id="aluSeries">
          <option value="Sliding Window 3">Sliding Window 3"</option>
          <option value="Sliding Window 4">Sliding Window 4"</option>
        </select>
      </div>
      <div class="col">
        <label>Alu Thick</label>
        <select id="aluThickness"><option>1.0 mm</option><option>1.2 mm</option><option>1.5 mm</option></select>
      </div>
      <div class="col">
        <label>Alu Colour</label>
        <select id="aluColor"><option>Silver</option><option>Bronze</option><option>Black</option></select>
      </div>
    </div>

    <div class="row">
      <div class="col">
        <label>Glass Co.</label>
        <select id="glassCompany"><option>Nasir</option><option>PHP</option><option>Other</option></select>
      </div>
      <div class="col">
        <label>Glass Thick</label>
        <select id="glassThickness"><option>5 mm</option><option>6 mm</option></select>
      </div>
      <div class="col">
        <label>Glass Colour</label>
        <select id="glassColor"><option>Clear</option><option>Dark Blue</option><option>Green</option></select>
      </div>
    </div>

    <div class="row">
      <div class="col">
        <label>Alu Rate</label>
        <input type="number" id="aluRate" placeholder="180">
      </div>
      <div class="col">
        <label>Glass Rate</label>
        <input type="number" id="glassRate" placeholder="125">
      </div>
      <div class="col">
        <label>Net Rate</label>
        <input type="number" id="netRate" placeholder="45">
      </div>
      <div class="col">
        <label>HW Rate</label>
        <input type="number" id="hwRate" placeholder="30">
      </div>
    </div>

    <div class="row">
      <div class="col">
        <label>Fit Rate</label>
        <input type="number" id="fitRate" placeholder="30">
      </div>
      <div class="col">
        <label>Labour Rate</label>
        <input type="number" id="labourRate" placeholder="10">
      </div>
      <div class="col">
        <label>Profit (%)</label>
        <input type="number" id="profit" placeholder="15">
      </div>
    </div>

    <button class="btn-save" onclick="saveRate()">Save Rate</button>
  </div>

  <!-- এক স্ক্রিনশটে পুরো রো দেখার টেবিল -->
  <div class="card">
    <div class="card-title">Saved Rate List</div>
    
    <div class="table-container">
      <table class="rate-table">
        <thead>
          <tr>
            <th style="width: 7%;">Co.</th>
            <th style="width: 13%;">Series</th>
            <th style="width: 8%;">Thick</th>
            <th style="width: 8%;">Color</th>
            <th style="width: 8%;">G.Co</th>
            <th style="width: 7%;">G.Thk</th>
            <th style="width: 8%;">G.Clr</th>
            <th style="width: 6%;">Alu</th>
            <th style="width: 6%;">Gls</th>
            <th style="width: 6%;">Net</th>
            <th style="width: 5%;">HW</th>
            <th style="width: 5%;">Fit</th>
            <th style="width: 5%;">Lab</th>
            <th style="width: 5%;">Prf%</th>
            <th style="width: 3%;">X</th>
          </tr>
        </thead>
        <tbody id="rateTableBody">
        </tbody>
      </table>
    </div>
  </div>

</div>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    loadRateList();
  });

  function saveRate() {
    let rateData = {
      aluCompany: document.getElementById('aluCompany').value,
      aluSeries: document.getElementById('aluSeries').value,
      aluThickness: document.getElementById('aluThickness').value,
      aluColor: document.getElementById('aluColor').value,
      glassCompany: document.getElementById('glassCompany').value,
      glassThickness: document.getElementById('glassThickness').value,
      glassColor: document.getElementById('glassColor').value,
      aluRate: parseFloat(document.getElementById('aluRate').value) || 0,
      glassRate: parseFloat(document.getElementById('glassRate').value) || 0,
      netRate: parseFloat(document.getElementById('netRate').value) || 0,
      hwRate: parseFloat(document.getElementById('hwRate').value) || 0,
      fitRate: parseFloat(document.getElementById('fitRate').value) || 0,
      labourRate: parseFloat(document.getElementById('labourRate').value) || 0,
      profit: parseFloat(document.getElementById('profit').value) || 0
    };

    let rateList = JSON.parse(localStorage.getItem('rateList')) || [];
    rateList.push(rateData);
    localStorage.setItem('rateList', JSON.stringify(rateList));

    alert("রেট সেভ হয়েছে!");
    loadRateList();
  }

  function loadRateList() {
    let rateList = JSON.parse(localStorage.getItem('rateList')) || [];
    let tbody = document.getElementById('rateTableBody');
    tbody.innerHTML = '';

    if (rateList.length === 0) {
      tbody.innerHTML = '<tr><td colspan="15" style="font-size:10px;">কোনো রেট নেই</td></tr>';
      return;
    }

    rateList.forEach((item, index) => {
      let tr = document.createElement('tr');
      
      // শর্ট নাম করে দেওয়া হলো যাতে পুরো রো এক স্ক্রিনে আঁটে
      let sName = item.aluSeries ? item.aluSeries.replace('Sliding Window', 'SW') : '-';

      tr.innerHTML = `
        <td>${item.aluCompany || '-'}</td>
        <td>${sName}</td>
        <td>${item.aluThickness || '-'}</td>
        <td>${item.aluColor || '-'}</td>
        <td>${item.glassCompany || '-'}</td>
        <td>${item.glassThickness || '-'}</td>
        <td>${item.glassColor || '-'}</td>
        <td>${item.aluRate}</td>
        <td>${item.glassRate}</td>
        <td>${item.netRate}</td>
        <td>${item.hwRate}</td>
        <td>${item.fitRate}</td>
        <td>${item.labourRate}</td>
        <td>${item.profit}%</td>
        <td><button class="btn-del" onclick="deleteRate(${index})">X</button></td>
      `;
      tbody.appendChild(tr);
    });
  }

  function deleteRate(index) {
    if (confirm("মুছে ফেলবেন?")) {
      let rateList = JSON.parse(localStorage.getItem('rateList')) || [];
      rateList.splice(index, 1);
      localStorage.setItem('rateList', JSON.stringify(rateList));
      loadRateList();
    }
  }
</script>

</body>
</html>

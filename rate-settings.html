<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rate Settings - RM Thai Aluminium</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f1f5f9; margin: 0; padding: 10px; color: #0f172a; }
    .container { max-width: 600px; margin: 0 auto; }

    .card {
      background: #ffffff;
      padding: 14px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      margin-bottom: 14px;
      border: 1px solid #cbd5e1;
    }

    .card-title {
      color: #1d4ed8;
      font-size: 17px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 12px;
    }

    .field-group { margin-bottom: 10px; }
    label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 3px; color: #334155; }
    
    input, select {
      width: 100%;
      padding: 8px;
      font-size: 13px;
      border: 2px solid #475569;
      border-radius: 6px;
      background-color: #fff;
      color: #0f172a;
      outline: none;
    }

    input:focus, select:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
    }

    .btn-save {
      width: 100%;
      padding: 11px;
      background-color: #1d4ed8;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      margin-top: 10px;
    }

    .table-container {
      width: 100%;
      overflow-x: auto;
      margin-top: 8px;
    }

    .rate-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: auto;
      min-width: 900px;
    }

    .rate-table th {
      background-color: #2563eb;
      color: white;
      padding: 8px 5px;
      font-size: 11px;
      font-weight: 600;
      text-align: center;
      border: 1px solid #1d4ed8;
      white-space: normal;
      word-break: break-word;
    }

    .rate-table td {
      padding: 6px 4px;
      border: 1px solid #cbd5e1;
      text-align: center;
      color: #0f172a;
      font-size: 11px;
      font-weight: 500;
      white-space: normal;
      word-break: break-word;
      line-height: 1.3;
    }

    .rate-table tr:nth-child(even) { background-color: #f8fafc; }

    .btn-del {
      background-color: #ef4444;
      color: white;
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 10px;
    }
    
    .btn-del:hover {
      background-color: #dc2626;
    }
  </style>
</head>
<body>

<div class="container">

  <div class="card">
    <div class="card-title">Rate Settings</div>

    <!-- Main Inputs -->
    <div class="field-group">
      <label>Company</label>
      <select id="company">
        <option value="">-- সিলেক্ট করুন --</option>
        <option value="কাই (Kai)">কাই (Kai)</option>
        <option value="অলটেক (Altech)">অলটেক (Altech)</option>
        <option value="আলফা (Alpha)">আলফা (Alpha)</option>
        <option value="এলুম্যাক্স (Alumax)">এলুম্যাক্স (Alumax)</option>
        <option value="নাসির (Nasir)">নাসির (Nasir)</option>
        <option value="ম্যাক্স (Max)">ম্যাক্স (Max)</option>
        <option value="ম্যাক্স প্রো (Max Pro)">ম্যাক্স প্রো (Max Pro)</option>
        <option value="বিটিএ (BTA)">বিটিএ (BTA)</option>
        <option value="চুংহুয়া (Chunghua)">চুংহুয়া (Chunghua)</option>
        <option value="অ্যালকো (Alco)">অ্যালকো (Alco)</option>
        <option value="ফ্রেশ (Fresh)">ফ্রেশ (Fresh)</option>
        <option value="নিক্কি (Nikki)">নিক্কি (Nikki)</option>
        <option value="ইডিএফ (EDF)">ইডিএফ (EDF)</option>
      </select>
    </div>

    <div class="field-group">
      <label>Series</label>
      <select id="series">
        <option value="">-- সিলেক্ট করুন --</option>
        <option value='Sliding 3"'>Sliding 3"</option>
        <option value='Sliding 4"'>Sliding 4"</option>
      </select>
    </div>

    <div class="field-group">
      <label>Aluminium Thickness</label>
      <select id="aluThickness">
        <option value="">-- সিলেক্ট করুন --</option>
        <option value="1.0 mm">1.0 mm</option>
        <option value="1.2 mm">1.2 mm</option>
        <option value="1.5">1.5</option>
      </select>
    </div>

    <div class="field-group">
      <label>Aluminium Colour</label>
      <select id="aluColour">
        <option value="">-- সিলেক্ট করুন --</option>
        <option value="সিলভার (Silver)">সিলভার (Silver)</option>
        <option value="ব্ল্যাক (Black)">ব্ল্যাক (Black)</option>
        <option value="ব্রঞ্জ (Bronze)">ব্রঞ্জ (Bronze)</option>
        <option value="উডেন (Wooden)">উডেন (Wooden)</option>
        <option value="গোল্ডেন (Golden)">গোল্ডেন (Golden)</option>
        <option value="সার্কেল গ্রে (Circle Grey)">সার্কেল গ্রে (Circle Grey)</option>
      </select>
    </div>

    <div class="field-group">
      <label>Glass Company</label>
      <select id="glassCompany">
        <option value="">-- সিলেক্ট করুন --</option>
        <option value="নাসির (Nasir)">নাসির (Nasir)</option>
        <option value="আকিজ (Akij)">আকিজ (Akij)</option>
        <option value="পিএসপি (PSP)">পিএসপি (PSP)</option>
        <option value="বেলজিয়াম (Belgium)">বেলজিয়াম (Belgium)</option>
      </select>
    </div>

    <div class="field-group">
      <label>Glass Thickness</label>
      <select id="glassThickness">
        <option value="">-- সিলেক্ট করুন --</option>
        <option value="৫ এমএম (5 mm)">৫ এমএম (5 mm)</option>
        <option value="৪ এমএম (4 mm)">৪ এমএম (4 mm)</option>
        <option value="৫.৫ এমএম (5.5 mm)">৫.৫ এমএম (5.5 mm)</option>
        <option value="৬ এমএম (6 mm)">৬ এমএম (6 mm)</option>
      </select>
    </div>

    <div class="field-group">
      <label>Glass Colour</label>
      <select id="glassColour">
        <option value="">-- সিলেক্ট করুন --</option>
        <option value="ক্লিয়ার (Clear)">ক্লিয়ার (Clear)</option>
        <option value="গ্রিন মার্কার (Green Marker)">গ্রিন মার্কার (Green Marker)</option>
        <option value="ব্লু মার্কার (Blue Marker)">ব্লু মার্কার (Blue Marker)</option>
        <option value="গোল্ডেন মার্কার (Golden Marker)">গোল্ডেন মার্কার (Golden Marker)</option>
        <option value="লেক ব্লু (Lake Blue)">লেক ব্লু (Lake Blue)</option>
        <option value="এমবোস (ambos)">এমবোস (ambos)</option>
        <option value="উইনার (winer)">উইনার (winer)</option>
        <option value="ফ্রস্টেড (Frosted)">ফ্রস্টেড (Frosted)</option>
      </select>
    </div>

    <div class="field-group">
      <label>Aluminium Rate (৳/Sqft)</label>
      <input type="number" id="aluRate" placeholder="200">
    </div>

    <div class="field-group">
      <label>Glass Rate (৳/Sqft)</label>
      <input type="number" id="glassRate" placeholder="150">
    </div>

    <div class="field-group">
      <label>Hardware Rate (৳/Sqft)</label>
      <input type="number" id="hwRate" placeholder="40">
    </div>

    <div class="field-group">
      <label>Fittings Rate (৳/Sqft)</label>
      <input type="number" id="fitRate" placeholder="45">
    </div>

    <div class="field-group">
      <label>Labour Rate (৳/Sqft)</label>
      <input type="number" id="labourRate" placeholder="10">
    </div>

    <div class="field-group">
      <label>Profit (%)</label>
      <input type="number" id="profit" placeholder="5">
    </div>

    <button class="btn-save" onclick="saveRate()">Save Rate</button>
  </div>

  <!-- Saved Rate List Table -->
  <div class="card">
    <div class="card-title">Saved Rate List</div>
    
    <div class="table-container">
      <table class="rate-table">
        <thead>
          <tr>
            <th>Company</th>
            <th>Series</th>
            <th>Alu Thick</th>
            <th>Alu Colour</th>
            <th>Glass Co.</th>
            <th>Glass Thick</th>
            <th>Glass Colour</th>
            <th>Alu Rate</th>
            <th>Glass Rate</th>
            <th>HW Rate</th>
            <th>Fit Rate</th>
            <th>Labour</th>
            <th>Profit (%)</th>
            <th>Delete</th>
          </tr>
        </thead>
        <tbody id="rateTableBody">
        </tbody>
      </table>
    </div>
  </div>

</div>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    loadRateList();
  });

  function saveRate() {
    let companyVal = document.getElementById('company').value;
    if (!companyVal) {
      alert("দয়া করে কোম্পানি সিলেক্ট করুন!");
      return;
    }

    let rateData = {
      company: companyVal,
      series: document.getElementById('series').value,
      aluThickness: document.getElementById('aluThickness').value,
      aluColour: document.getElementById('aluColour').value,
      glassCompany: document.getElementById('glassCompany').value,
      glassThickness: document.getElementById('glassThickness').value,
      glassColour: document.getElementById('glassColour').value,
      aluRate: parseFloat(document.getElementById('aluRate').value) || 0,
      glassRate: parseFloat(document.getElementById('glassRate').value) || 0,
      hwRate: parseFloat(document.getElementById('hwRate').value) || 0,
      fitRate: parseFloat(document.getElementById('fitRate').value) || 0,
      labourRate: parseFloat(document.getElementById('labourRate').value) || 0,
      profit: parseFloat(document.getElementById('profit').value) || 0
    };

    let rateList = JSON.parse(localStorage.getItem('rateList')) || [];
    rateList.push(rateData);
    
    localStorage.setItem('rateList', JSON.stringify(rateList));
    localStorage.setItem('rateSettingsData', JSON.stringify(rateList));

    alert("রেট সফলভাবে সেভ হয়েছে!");
    loadRateList();
  }

  function loadRateList() {
    let rateList = JSON.parse(localStorage.getItem('rateList')) || [];
    let tbody = document.getElementById('rateTableBody');
    tbody.innerHTML = '';

    if (rateList.length === 0) {
      tbody.innerHTML = '<tr><td colspan="14" style="padding:10px; font-size:11px;">কোনো রেট সেভ করা নেই</td></tr>';
      return;
    }

    rateList.forEach((item, index) => {
      let tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${item.company || '-'}</td>
        <td>${item.series || '-'}</td>
        <td>${item.aluThickness || '-'}</td>
        <td>${item.aluColour || '-'}</td>
        <td>${item.glassCompany || '-'}</td>
        <td>${item.glassThickness || '-'}</td>
        <td>${item.glassColour || '-'}</td>
        <td>${item.aluRate}</td>
        <td>${item.glassRate}</td>
        <td>${item.hwRate}</td>
        <td>${item.fitRate}</td>
        <td>${item.labourRate}</td>
        <td>${item.profit}%</td>
        <td><button class="btn-del" onclick="deleteRate(${index})">Delete</button></td>
      `;
      tbody.appendChild(tr);
    });
  }

  function deleteRate(index) {
    if (confirm("রেটটি মুছে ফেলতে চান?")) {
      let rateList = JSON.parse(localStorage.getItem('rateList')) || [];
      rateList.splice(index, 1);
      localStorage.setItem('rateList', JSON.stringify(rateList));
      localStorage.setItem('rateSettingsData', JSON.stringify(rateList));
      loadRateList();
    }
  }
</script>

</body>
</html>

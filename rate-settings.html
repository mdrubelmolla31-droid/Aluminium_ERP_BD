<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rate Settings - RM Thai Aluminium</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
    body { background-color: #f1f5f9; padding: 10px; color: #0f172a; }
    .container { max-width: 600px; margin: 0 auto; }

    /* ================= HEADER STYLE ================= */
    .invoice-header {
      position: relative;
      background: linear-gradient(135deg, #123a8c 0%, #1557c0 45%, #2563d9 100%);
      color: #ffffff;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 4px 15px rgba(20, 70, 160, 0.2);
    }

    .header-top {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .menu-btn {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 8px;
      background: rgba(255,255,255,0.18);
      color: #ffffff;
      font-size: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .header-title-area {
      flex: 1;
    }

    .header-main-title {
      font-size: 18px;
      font-weight: 900;
      text-transform: uppercase;
      line-height: 1.2;
    }

    .header-sub-title {
      margin-top: 3px;
      font-size: 12px;
      font-weight: 600;
      opacity: 0.9;
    }

    .shop-details {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .shop-details input {
      width: 100%;
      height: 36px;
      padding: 4px 10px;
      border: none;
      border-radius: 6px;
      background: rgba(255,255,255,0.95);
      color: #111827;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
      outline: none;
    }

    /* ================= SIDEBAR MENU ================= */
    .sidebar {
      position: fixed;
      top: 0;
      left: -320px;
      width: 320px;
      max-width: 88vw;
      height: 100vh;
      background: #ffffff;
      box-shadow: 8px 0 25px rgba(0,0,0,0.25);
      transition: left 0.28s ease;
      z-index: 5000;
      padding: 16px;
      overflow-y: auto;
    }

    .sidebar.active {
      left: 0;
    }

    .sidebar-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.4);
      display: none;
      z-index: 4999;
    }

    .sidebar-overlay.active {
      display: block;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 2px solid #e2e8f0;
    }

    .sidebar-header h3 {
      color: #1d4ed8;
      font-size: 16px;
      font-weight: 800;
    }

    .close-sidebar {
      background: #dc2626;
      color: #ffffff;
      border: none;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 800;
    }

    /* ================= CARDS & FORM ================= */
    .card {
      background: #ffffff;
      padding: 14px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      margin-bottom: 14px;
      border: 1px solid #cbd5e1;
    }

    .card-title {
      color: #1d4ed8;
      font-size: 16px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 12px;
      padding-bottom: 6px;
      border-bottom: 1px solid #e2e8f0;
    }

    .field-group { margin-bottom: 10px; }
    label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 3px; color: #334155; }
    
    input, select {
      width: 100%;
      padding: 8px;
      font-size: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 5px;
      background-color: #fff;
      outline: none;
    }

    input:focus, select:focus {
      border-color: #2563eb;
    }

    .btn-add {
      width: 100%;
      padding: 8px;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 5px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      margin-top: 5px;
    }

    .btn-save {
      width: 100%;
      padding: 11px;
      background-color: #1d4ed8;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      margin-top: 10px;
    }

    /* ================= TABLE ================= */
    .table-container {
      width: 100%;
      overflow-x: auto;
      margin-top: 8px;
    }

    .rate-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      min-width: 850px;
    }

    .rate-table th {
      background-color: #2563eb;
      color: white;
      padding: 6px 3px;
      font-size: 10px;
      font-weight: 600;
      text-align: center;
      border: 1px solid #1d4ed8;
      word-break: break-word;
    }

    .rate-table td {
      padding: 6px 3px;
      border: 1px solid #cbd5e1;
      text-align: center;
      color: #0f172a;
      font-size: 10px;
      font-weight: 500;
      white-space: nowrap;
    }

    .rate-table tr:nth-child(even) { background-color: #f8fafc; }

    .btn-del {
      background-color: #dc2626;
      color: white;
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 10px;
    }
  </style>
</head>
<body>

<!-- Sidebar Overlay -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

<!-- Slide-out Master Data Sidebar Menu -->
<div class="sidebar" id="masterSidebar">
  <div class="sidebar-header">
    <h3>Master Data (মাস্টার ডাটা)</h3>
    <button class="close-sidebar" onclick="toggleSidebar()">✕</button>
  </div>

  <div class="field-group">
    <label>New Company</label>
    <input type="text" id="newCompanyName" placeholder="Company Name">
    <button class="btn-add" onclick="addMasterItem('companyList', 'newCompanyName', 'Company', 'company')">Add Company</button>
  </div>

  <div class="field-group">
    <label>New Series</label>
    <input type="text" id="newSeriesName" placeholder="Series Name">
    <button class="btn-add" onclick="addMasterItem('seriesList', 'newSeriesName', 'Series', 'series')">Add Series</button>
  </div>

  <div class="field-group">
    <label>New Aluminium Thickness</label>
    <input type="text" id="newThickName" placeholder="e.g. 1.2 mm">
    <button class="btn-add" onclick="addMasterItem('thickList', 'newThickName', 'Alu Thickness', 'aluThickness')">Add Thickness</button>
  </div>

  <div class="field-group">
    <label>New Aluminium Colour</label>
    <input type="text" id="newAluColourName" placeholder="e.g. Silver">
    <button class="btn-add" onclick="addMasterItem('aluColourList', 'newAluColourName', 'Alu Colour', 'aluColour')">Add Alu Colour</button>
  </div>

  <div class="field-group">
    <label>New Glass Company</label>
    <input type="text" id="newGlassCoName" placeholder="Glass Co. Name">
    <button class="btn-add" onclick="addMasterItem('glassCoList', 'newGlassCoName', 'Glass Company', 'glassCompany')">Add Glass Company</button>
  </div>

  <div class="field-group">
    <label>New Glass Thickness</label>
    <input type="text" id="newGlassThickName" placeholder="e.g. 6 mm">
    <button class="btn-add" onclick="addMasterItem('glassThickList', 'newGlassThickName', 'Glass Thickness', 'glassThickness')">Add Glass Thickness</button>
  </div>

  <div class="field-group">
    <label>New Glass Colour</label>
    <input type="text" id="newGlassColourName" placeholder="e.g. Blue">
    <button class="btn-add" onclick="addMasterItem('glassColourList', 'newGlassColourName', 'Glass Colour', 'glassColour')">Add Glass Colour</button>
  </div>
</div>

<div class="container">

  <!-- Header Section with 3-Line Menu -->
  <div class="invoice-header">
    <div class="header-top">
      <button class="menu-btn" onclick="toggleSidebar()">☰</button>
      <div class="header-title-area">
        <div class="header-main-title">RM THAI ALUMINIUM</div>
        <div class="header-sub-title">RATE SETTINGS</div>
      </div>
    </div>
    <div class="shop-details">
      <input type="text" id="shopPhone" value="Mobile: 01676-474412" readonly>
    </div>
  </div>

  <!-- Main Rate Input Card -->
  <div class="card">
    <div class="card-title">Set Material Rates</div>

    <div class="field-group">
      <label>Company</label>
      <select id="company"></select>
    </div>

    <div class="field-group">
      <label>Series</label>
      <select id="series"></select>
    </div>

    <div class="field-group">
      <label>Aluminium Thickness</label>
      <select id="aluThickness"></select>
    </div>

    <div class="field-group">
      <label>Aluminium Colour</label>
      <select id="aluColour"></select>
    </div>

    <div class="field-group">
      <label>Glass Company</label>
      <select id="glassCompany"></select>
    </div>

    <div class="field-group">
      <label>Glass Thickness</label>
      <select id="glassThickness"></select>
    </div>

    <div class="field-group">
      <label>Glass Colour</label>
      <select id="glassColour"></select>
    </div>

    <div class="field-group">
      <label>Aluminium Rate (৳/ft)</label>
      <input type="number" id="aluRate" placeholder="200">
    </div>

    <div class="field-group">
      <label>Glass Rate (৳/Sqft)</label>
      <input type="number" id="glassRate" placeholder="150">
    </div>

    <div class="field-group">
      <label>Hardware Rate (৳/Sqft)</label>
      <input type="number" id="hwRate" placeholder="40">
    </div>

    <div class="field-group">
      <label>Fittings Rate (৳/Sqft)</label>
      <input type="number" id="fitRate" placeholder="45">
    </div>

    <div class="field-group">
      <label>Labour Rate (৳/Sqft)</label>
      <input type="number" id="labourRate" placeholder="10">
    </div>

    <div class="field-group">
      <label>Profit (%)</label>
      <input type="number" id="profit" placeholder="5">
    </div>

    <button class="btn-save" onclick="saveRate()">Save Rate</button>
  </div>

  <!-- Saved Rate List Table Card -->
  <div class="card">
    <div class="card-title">Saved Rate List</div>
    
    <div class="table-container">
      <table class="rate-table">
        <thead>
          <tr>
            <th style="width: 55px;">Company</th>
            <th style="width: 75px;">Series</th>
            <th style="width: 45px;">Alu Thick</th>
            <th style="width: 55px;">Alu Colour</th>
            <th style="width: 50px;">Glass Co.</th>
            <th style="width: 45px;">Glass Thick</th>
            <th style="width: 55px;">Glass Colour</th>
            <th style="width: 45px;">Alu Rate</th>
            <th style="width: 45px;">Glass Rate</th>
            <th style="width: 40px;">HW Rate</th>
            <th style="width: 40px;">Fit Rate</th>
            <th style="width: 45px;">Labour</th>
            <th style="width: 45px;">Profit (%)</th>
            <th style="width: 50px;">Delete</th>
          </tr>
        </thead>
        <tbody id="rateTableBody">
        </tbody>
      </table>
    </div>
  </div>

</div>

<script>
  // Hardcoded Default Options
  const defaultMasterData = {
    companyList: ["Kai", "Altech", "Alpha", "Alumax", "Fresh", "Nukki", "Nasir", "Max", "Max Pro", "BTA", "Chunghua", "Alco", "EDF"],
    seriesList: ['Sliding 3"', 'Sliding 4"'],
    thickList: ["1.0 mm", "1.2 mm", "1.5 mm"],
    aluColourList: ["Silver", "Black", "Bronze", "Wooden", "Golden", "Circle Grey"],
    glassCoList: ["Nasir", "Akij", "PSP", "Belgium"],
    glassThickList: ["4 mm", "5 mm", "5.5 mm", "6 mm"],
    glassColourList: ["Clear", "Frosted", "Green Marker", "Blue Marker", "Golden Marker", "Lake Blue", "winer", "ambos"]
  };

  document.addEventListener("DOMContentLoaded", function() {
    initDropdowns();
    loadRateList();
    setupDropdownLongPress();
  });

  function toggleSidebar() {
    document.getElementById('masterSidebar').classList.toggle('active');
    document.getElementById('sidebarOverlay').classList.toggle('active');
  }

  function initDropdowns() {
    populateDropdown('companyList', 'company');
    populateDropdown('seriesList', 'series');
    populateDropdown('thickList', 'aluThickness');
    populateDropdown('aluColourList', 'aluColour');
    populateDropdown('glassCoList', 'glassCompany');
    populateDropdown('glassThickList', 'glassThickness');
    populateDropdown('glassColourList', 'glassColour');
  }

  function populateDropdown(storageKey, selectId) {
    let list = JSON.parse(localStorage.getItem(storageKey));
    
    // If empty or null, set default hardcoded list
    if (!list || list.length === 0) {
      list = defaultMasterData[storageKey] || [];
      localStorage.setItem(storageKey, JSON.stringify(list));
    }

    let select = document.getElementById(selectId);
    let currentVal = select.value;
    select.innerHTML = '';
    
    let defaultOpt = document.createElement('option');
    defaultOpt.value = "";
    defaultOpt.textContent = "-- সিলেক্ট করুন --";
    select.appendChild(defaultOpt);

    list.forEach(item => {
      let opt = document.createElement('option');
      opt.value = item;
      opt.textContent = item;
      select.appendChild(opt);
    });

    select.value = currentVal;
  }

  function setupDropdownLongPress() {
    const dropdowns = [
      { id: 'company', storageKey: 'companyList' },
      { id: 'series', storageKey: 'seriesList' },
      { id: 'aluThickness', storageKey: 'thickList' },
      { id: 'aluColour', storageKey: 'aluColourList' },
      { id: 'glassCompany', storageKey: 'glassCoList' },
      { id: 'glassThickness', storageKey: 'glassThickList' },
      { id: 'glassColour', storageKey: 'glassColourList' }
    ];

    dropdowns.forEach(item => {
      const selectEl = document.getElementById(item.id);
      let timer;

      const triggerDelete = () => {
        const selectedValue = selectEl.value;
        if (!selectedValue) {
          alert("মুছে ফেলার জন্য প্রথমে ড্রপডাউন থেকে যেকোনো একটি অপশন সিলেক্ট করুন।");
          return;
        }

        if (confirm(`আপনি কি "${selectedValue}" অপশনটি ড্রপডাউন থেকে ডিলিট করতে চান?`)) {
          let list = JSON.parse(localStorage.getItem(item.storageKey)) || [];
          list = list.filter(val => val !== selectedValue);
          localStorage.setItem(item.storageKey, JSON.stringify(list));
          populateDropdown(item.storageKey, item.id);
        }
      };

      selectEl.addEventListener('touchstart', (e) => {
        timer = setTimeout(() => {
          triggerDelete();
        }, 800);
      });

      selectEl.addEventListener('touchend', () => clearTimeout(timer));
      selectEl.addEventListener('touchmove', () => clearTimeout(timer));

      selectEl.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        triggerDelete();
      });
    });
  }

  function addMasterItem(storageKey, inputId, labelName, selectId) {
    let val = document.getElementById(inputId).value.trim();
    if (!val) {
      alert(labelName + " এর নাম লিখুন!");
      return;
    }
    let list = JSON.parse(localStorage.getItem(storageKey)) || [];
    if (!list.includes(val)) {
      list.push(val);
      localStorage.setItem(storageKey, JSON.stringify(list));
      document.getElementById(inputId).value = '';
      populateDropdown(storageKey, selectId);
      alert(labelName + " সফলভাবে যোগ হয়েছে!");
    } else {
      alert("এই নামটি ইতিমধ্যে আছে!");
    }
  }

  function saveRate() {
    let companyVal = document.getElementById('company').value;
    if (!companyVal) {
      alert("দয়া করে প্রথমে কোম্পানি সিলেক্ট করুন!");
      return;
    }

    let rateData = {
      company: companyVal,
      series: document.getElementById('series').value,
      aluThickness: document.getElementById('aluThickness').value,
      aluColour: document.getElementById('aluColour').value,
      glassCompany: document.getElementById('glassCompany').value,
      glassThickness: document.getElementById('glassThickness').value,
      glassColour: document.getElementById('glassColour').value,
      aluRate: parseFloat(document.getElementById('aluRate').value) || 0,
      glassRate: parseFloat(document.getElementById('glassRate').value) || 0,
      hwRate: parseFloat(document.getElementById('hwRate').value) || 0,
      fitRate: parseFloat(document.getElementById('fitRate').value) || 0,
      labourRate: parseFloat(document.getElementById('labourRate').value) || 0,
      profit: parseFloat(document.getElementById('profit').value) || 0
    };

    let rateList = JSON.parse(localStorage.getItem('rateList')) || [];
    rateList.push(rateData);
    
    localStorage.setItem('rateList', JSON.stringify(rateList));
    localStorage.setItem('rateSettingsData', JSON.stringify(rateList));

    alert("রেট সফলভাবে সেভ হয়েছে!");
    loadRateList();
  }

  function loadRateList() {
    let rateList = JSON.parse(localStorage.getItem('rateList')) || [];
    let tbody = document.getElementById('rateTableBody');
    tbody.innerHTML = '';

    if (rateList.length === 0) {
      tbody.innerHTML = '<tr><td colspan="14" style="padding:10px; font-size:11px;">কোনো রেট সেভ করা নেই</td></tr>';
      return;
    }

    rateList.forEach((item, index) => {
      let tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${item.company || '-'}</td>
        <td>${item.series || '-'}</td>
        <td>${item.aluThickness || '-'}</td>
        <td>${item.aluColour || '-'}</td>
        <td>${item.glassCompany || '-'}</td>
        <td>${item.glassThickness || '-'}</td>
        <td>${item.glassColour || '-'}</td>
        <td>${item.aluRate}</td>
        <td>${item.glassRate}</td>
        <td>${item.hwRate}</td>
        <td>${item.fitRate}</td>
        <td>${item.labourRate}</td>
        <td>${item.profit}%</td>
        <td><button class="btn-del" onclick="deleteRate(${index})">Delete</button></td>
      `;
      tbody.appendChild(tr);
    });
  }

  function deleteRate(index) {
    if (confirm("রেটটি মুছে ফেলতে চান?")) {
      let rateList = JSON.parse(localStorage.getItem('rateList')) || [];
      rateList.splice(index, 1);
      localStorage.setItem('rateList', JSON.stringify(rateList));
      localStorage.setItem('rateSettingsData', JSON.stringify(rateList));
      loadRateList();
    }
  }
</script>

</body>
</html>

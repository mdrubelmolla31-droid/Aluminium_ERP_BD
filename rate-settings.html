<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rate Settings - RM Thai Aluminium</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f1f5f9; margin: 0; padding: 10px; color: #0f172a; }
    .container { max-width: 600px; margin: 0 auto; }

    .card {
      background: #ffffff;
      padding: 14px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      margin-bottom: 14px;
      border: 1px solid #cbd5e1;
    }

    .card-title {
      color: #1d4ed8;
      font-size: 17px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 12px;
    }

    .master-section {
      background: #f8fafc;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #e2e8f0;
      margin-bottom: 14px;
    }

    .master-title {
      font-size: 13px;
      font-weight: 700;
      color: #334155;
      text-align: center;
      margin-bottom: 8px;
    }

    .field-group { margin-bottom: 10px; }
    label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 3px; color: #334155; }
    
    input, select {
      width: 100%;
      padding: 8px;
      font-size: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 5px;
      background-color: #fff;
    }

    .btn-add {
      width: 100%;
      padding: 8px;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 5px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      margin-top: 4px;
    }
    .btn-add:hover { background-color: #1d4ed8; }

    .btn-save {
      width: 100%;
      padding: 11px;
      background-color: #1d4ed8;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      margin-top: 10px;
    }

    /* ছবিটার স্টাইলে টেবিল যাতে এক স্ক্রিনে ফুল রো দেখায় */
    .table-container {
      width: 100%;
      overflow-x: auto;
      margin-top: 8px;
    }

    .rate-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .rate-table th {
      background-color: #2563eb;
      color: white;
      padding: 5px 1px;
      font-size: 9px;
      font-weight: 600;
      text-align: center;
      border: 1px solid #1d4ed8;
      word-break: break-word;
    }

    .rate-table td {
      padding: 6px 1px;
      border: 1px solid #cbd5e1;
      text-align: center;
      color: #0f172a;
      font-size: 10px;
      font-weight: 500;
      white-space: nowrap;
    }

    .rate-table tr:nth-child(even) { background-color: #f8fafc; }

    .btn-del {
      background-color: #ef4444;
      color: white;
      border: none;
      padding: 2px 4px;
      border-radius: 3px;
      cursor: pointer;
      font-size: 9px;
    }
  </style>
</head>
<body>

<div class="container">

  <div class="card">
    <div class="card-title">Rate Settings</div>

    <!-- Master Data Section (হুবহু ছবির মতো) -->
    <div class="master-section">
      <div class="master-title">Master Data</div>

      <div class="field-group">
        <label>New Company</label>
        <input type="text" id="newCompanyName" placeholder="Company Name">
        <button class="btn-add" onclick="addMasterItem('companyList', 'newCompanyName', 'Company')">Add Company</button>
      </div>

      <div class="field-group">
        <label>New Series</label>
        <input type="text" id="newSeriesName" placeholder="Series Name">
        <button class="btn-add" onclick="addMasterItem('seriesList', 'newSeriesName', 'Series')">Add Series</button>
      </div>

      <div class="field-group">
        <label>New Aluminium Thickness</label>
        <input type="text" id="newThickName" placeholder="e.g. 1.2 mm">
        <button class="btn-add" onclick="addMasterItem('thickList', 'newThickName', 'Alu Thickness')">Add Thickness</button>
      </div>

      <div class="field-group">
        <label>New Glass Company</label>
        <input type="text" id="newGlassCoName" placeholder="Glass Co. Name">
        <button class="btn-add" onclick="addMasterItem('glassCoList', 'newGlassCoName', 'Glass Company')">Add Glass Company</button>
      </div>
    </div>

    <!-- Main Form Selection (আপনার দেওয়া রিকোয়ারমেন্ট অনুযায়ী নতুন ৩টি ফিল্ড উপরে যুক্ত করা হয়েছে) -->
    <div class="field-group">
      <label>Company</label>
      <select id="company"><option value="KAI">KAI</option><option value="BTA">BTA</option><option value="ALFA">ALFA</option></select>
    </div>

    <div class="field-group">
      <label>Series</label>
      <select id="series"><option value="Sliding Window 3&quot;">Sliding Window 3"</option><option value="Sliding Window 4&quot;">Sliding Window 4"</option></select>
    </div>

    <!-- আপনার চাহিদা অনুযায়ী এখানে অ্যালুমিনিয়াম কালার, গ্লাস কালার ও গ্লাস থিকনেস উপরে বসানো হলো -->
    <div class="field-group">
      <label>Aluminium Colour</label>
      <select id="aluColor"><option value="Silver">Silver</option><option value="Bronze">Bronze</option><option value="Black">Black</option></select>
    </div>

    <div class="field-group">
      <label>Glass Colour</label>
      <select id="glassColour"><option value="Clear">Clear</option><option value="Blue">Blue</option><option value="Green">Green</option></select>
    </div>

    <div class="field-group">
      <label>Glass Thickness</label>
      <select id="glassThickness"><option value="5 mm">5 mm</option><option value="5.5 mm">5.5 mm</option><option value="6 mm">6 mm</option></select>
    </div>

    <div class="field-group">
      <label>Aluminium Thickness</label>
      <select id="aluThickness"><option value="1.0 mm">1.0 mm</option><option value="1.2 mm">1.2 mm</option><option value="1.5 mm">1.5 mm</option></select>
    </div>

    <div class="field-group">
      <label>Glass Company</label>
      <select id="glassCompany"><option value="Nasir">Nasir</option><option value="Bengal">Bengal</option><option value="PHP">PHP</option></select>
    </div>

    <div class="field-group">
      <label>Aluminium Rate (৳/ft)</label>
      <input type="number" id="aluRate" placeholder="180">
    </div>

    <div class="field-group">
      <label>Glass Rate (৳/Sqft)</label>
      <input type="number" id="glassRate" placeholder="145">
    </div>

    <div class="field-group">
      <label>Hardware Rate (৳/Sqft)</label>
      <input type="number" id="hwRate" placeholder="35">
    </div>

    <div class="field-group">
      <label>Fittings Rate (৳/Sqft)</label>
      <input type="number" id="fitRate" placeholder="30">
    </div>

    <div class="field-group">
      <label>Labour Rate (৳/Sqft)</label>
      <input type="number" id="labourRate" placeholder="10">
    </div>

    <div class="field-group">
      <label>Profit (%)</label>
      <input type="number" id="profit" placeholder="20">
    </div>

    <button class="btn-save" onclick="saveRate()">Save Rate</button>
  </div>

  <!-- Saved Rate List Table (ছবির মতো কমপ্যাক্ট ও এক স্ক্রিনে দৃশ্যমান) -->
  <div class="card">
    <div class="card-title">Saved Rate List</div>
    
    <div class="table-container">
      <table class="rate-table">
        <thead>
          <tr>
            <th style="width: 8%;">Company</th>
            <th style="width: 13%;">Series</th>
            <th style="width: 7%;">Alu</th>
            <th style="width: 8%;">Glass</th>
            <th style="width: 7%;">Thick</th>
            <th style="width: 8%;">Colour</th>
            <th style="width: 6%;">Alu Rate</th>
            <th style="width: 6%;">Glass</th>
            <th style="width: 5%;">HW</th>
            <th style="width: 5%;">Fit</th>
            <th style="width: 6%;">Labour</th>
            <th style="width: 6%;">Profit</th>
            <th style="width: 5%;">Action</th>
          </tr>
        </thead>
        <tbody id="rateTableBody">
        </tbody>
      </table>
    </div>
  </div>

</div>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    loadRateList();
  });

  function addMasterItem(storageKey, inputId, labelName) {
    let val = document.getElementById(inputId).value.trim();
    if (!val) {
      alert(labelName + " এর নাম লিখুন!");
      return;
    }
    let list = JSON.parse(localStorage.getItem(storageKey)) || [];
    if (!list.includes(val)) {
      list.push(val);
      localStorage.setItem(storageKey, JSON.stringify(list));
      alert(labelName + " সফলভাবে যোগ হয়েছে!");
      document.getElementById(inputId).value = '';
    } else {
      alert("এই নামটি ইতিমধ্যে আছে!");
    }
  }

  function saveRate() {
    let rateData = {
      company: document.getElementById('company').value,
      series: document.getElementById('series').value,
      aluThickness: document.getElementById('aluThickness').value,
      glassCompany: document.getElementById('glassCompany').value,
      glassThickness: document.getElementById('glassThickness').value,
      aluColour: document.getElementById('aluColour').value,
      glassColour: document.getElementById('glassColour').value,
      aluRate: parseFloat(document.getElementById('aluRate').value) || 0,
      glassRate: parseFloat(document.getElementById('glassRate').value) || 0,
      hwRate: parseFloat(document.getElementById('hwRate').value) || 0,
      fitRate: parseFloat(document.getElementById('fitRate').value) || 0,
      labourRate: parseFloat(document.getElementById('labourRate').value) || 0,
      profit: parseFloat(document.getElementById('profit').value) || 0
    };

    let rateList = JSON.parse(localStorage.getItem('rateList')) || [];
    rateList.push(rateData);
    localStorage.setItem('rateList', JSON.stringify(rateList));

    alert("রেট সফলভাবে সেভ হয়েছে!");
    loadRateList();
  }

  function loadRateList() {
    let rateList = JSON.parse(localStorage.getItem('rateList')) || [];
    let tbody = document.getElementById('rateTableBody');
    tbody.innerHTML = '';

    if (rateList.length === 0) {
      tbody.innerHTML = '<tr><td colspan="13" style="padding:10px; font-size:11px;">কোনো রেট সেভ করা নেই</td></tr>';
      return;
    }

    rateList.forEach((item, index) => {
      let tr = document.createElement('tr');
      let sName = item.series ? item.series.replace('Sliding Window', 'SW') : '-';

      tr.innerHTML = `
        <td>${item.company || '-'}</td>
        <td>${sName}</td>
        <td>${item.aluThickness || '-'}</td>
        <td>${item.glassCompany || '-'}</td>
        <td>${item.glassThickness || '-'}</td>
        <td>${item.glassColour || item.aluColour || '-'}</td>
        <td>${item.aluRate}</td>
        <td>${item.glassRate}</td>
        <td>${item.hwRate}</td>
        <td>${item.fitRate}</td>
        <td>${item.labourRate}</td>
        <td>${item.profit}%</td>
        <td><button class="btn-del" onclick="deleteRate(${index})">X</button></td>
      `;
      tbody.appendChild(tr);
    });
  }

  function deleteRate(index) {
    if (confirm("রেটটি মুছে ফেলতে চান?")) {
      let rateList = JSON.parse(localStorage.getItem('rateList')) || [];
      rateList.splice(index, 1);
      localStorage.setItem('rateList', JSON.stringify(rateList));
      loadRateList();
    }
  }
</script>

</body>
</html>

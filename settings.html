<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h2>Rate Settings</h2>
    <hr>

    <h3>Master Data</h3>

    <label>New Company</label>
    <input type="text" id="newCompany">
    <button type="button" onclick="addMasterData('company', 'newCompany')">Add Company</button>

    <label>New Series</label>
    <input type="text" id="newSeries">
    <button type="button" onclick="addMasterData('series', 'newSeries')">Add Series</button>

    <label>New Aluminium Thickness</label>
    <input type="text" id="newThickness">
    <button type="button" onclick="addMasterData('aluThickness', 'newThickness')">Add Thickness</button>
    <hr>

    <label>New Aluminium Colour</label>
    <input type="text" id="newAluColour">
    <button type="button" onclick="addMasterData('aluColour', 'newAluColour')">Add Aluminium Colour</button>

    <label>New Glass Company</label>
    <input type="text" id="newGlassCompany">
    <button type="button" onclick="addMasterData('glassCompany', 'newGlassCompany')">Add Glass Company</button>

    <label>New Glass Colour</label>
    <input type="text" id="newGlassColour">
    <button type="button" onclick="addMasterData('glassColour', 'newGlassColour')">Add Glass Colour</button>

    <hr>

    <label>Company</label>
    <select id="company">
        <option value="">Select Company</option>
        <option>KAI</option>
        <option>BTA</option>
        <option>EDF</option>
        <option>ALFA</option>
        <option>MAX</option>
    </select>

    <label>Series</label>
    <select id="series">
        <option value="">Select Series</option>
        <option>Sliding Window 3"</option>
        <option>Sliding Window 4"</option>
        <option>Fixed Window</option>
        <option>Sliding Door</option>
        <option>Casement Window</option>
    </select>

    <label>Aluminium Thickness</label>
    <select id="aluThickness">
        <option value="">Select Thickness</option>
        <option>1.0 mm</option>
        <option>1.2 mm</option>
        <option>1.4 mm</option>
        <option>1.6 mm</option>
        <option>1.8 mm</option>
        <option>2.0 mm</option>
    </select>

    <label>Aluminium Colour</label>
    <select id="aluColour">
        <option value="">Select Colour</option>
        <option>Silver</option>
        <option>Bronze</option>
        <option>Black</option>
        <option>White</option>
    </select>

    <label>Glass Company</label>
    <select id="glassCompany">
        <option value="">Select Glass Company</option>
        <option>Xinyi</option>
        <option>PHP</option>
        <option>Nasir</option>
        <option>Bengal</option>
    </select>

    <label>Glass Thickness</label>
    <select id="glassThickness">
        <option value="">Select Thickness</option>
        <option>5 mm</option>
        <option>5.5 mm</option>
        <option>6 mm</option>
        <option>8 mm</option>
        <option>10 mm</option>
        <option>12 mm</option>
    </select>

    <label>Glass Colour</label>
    <select id="glassColour">
        <option value="">Select Glass Colour</option>
        <option>Clear</option>
        <option>Black</option>
        <option>Blue</option>
        <option>Green</option>
        <option>Bronze</option>
        <option>Reflective</option>
    </select>

    <label>Aluminium Rate (৳/ft)</label>
    <input type="number" id="aluRate">

    <label>Glass Rate (৳/Sqft)</label>
    <input type="number" id="glassRate">

    <label>Hardware Rate (৳/Sqft)</label>
    <input type="number" id="hardwareRate">

    <label>Fittings Rate (৳/Sqft)</label>
    <input type="number" id="fittingsRate">

    <label>Labour Rate (৳/Sqft)</label>
    <input type="number" id="labourRate">

    <label>Profit (%)</label>
    <input type="number" id="profit">

    <button type="button" onclick="saveSettings()">Save Rate</button>

    <hr>

    <h3>Saved Rate List</h3>

    <table border="1" width="100%">
        <thead>
            <tr>
                <th>Company</th>
                <th>Series</th>
                <th>Alu Thick</th>
                <th>Alu Colour</th>
                <th>Glass Co.</th>
                <th>Glass Thick</th>
                <th>Glass Colour</th>
                <th>Alu Rate</th>
                <th>Glass Rate</th>
                <th>HW Rate</th>
                <th>Fit Rate</th>
                <th>Labour</th>
                <th>Profit (%)</th>
                <th>Delete</th>
            </tr>
        </thead>
        <tbody id="rateBody">
            <!-- Data populated via settings.js -->
        </tbody>
    </table>
</div>

<script src="settings.js?v=20250725"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ফিক্সড ক্যালকুলেটর - অ্যালুমিনিয়াম ইআরপি বিডি</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            display: flex;
            justify-content: center;
            padding: 16px;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 450px;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .back-btn {
            background: #1e293b;
            border: 1px solid #334155;
            color: #ffffff;
            padding: 8px 12px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 16px;
        }

        .header-title {
            font-size: 18px;
            font-weight: bold;
            color: #ffffff;
        }

        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .menu-card {
            background: #111827;
            border: 1px solid #1e293b;
            border-radius: 16px;
            padding: 20px;
            text-decoration: none;
            color: #f3f4f6;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s ease;
        }

        .menu-card:hover {
            border-color: #3b82f6;
            transform: translateY(-2px);
        }

        .menu-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .menu-icon {
            font-size: 24px;
            background: #1e293b;
            padding: 10px;
            border-radius: 12px;
            border: 1px solid #334155;
        }

        .menu-text-title {
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .menu-text-sub {
            font-size: 12px;
            color: #9ca3af;
        }

        .arrow-icon {
            color: #38bdf8;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <a href="index.html" class="back-btn">⬅️</a>
            <div class="header-title">📌 ফিক্সড ক্যালকুলেটর মেনু</div>
        </div>

        <div class="menu-list">
            <!-- সেকশন ১: মূল ফিক্সড -->
            <a href="main-fixed-calculator.html" target="_blank" class="menu-card">
                <div class="menu-info">
                    <div class="menu-icon">🖼️</div>
                    <div>
                        <div class="menu-text-title">মূল ফিক্সড</div>
                        <div class="menu-text-sub">সাধারণ ফিক্সড গ্লাস ও সেকশন হিসাব</div>
                    </div>
                </div>
                <div class="arrow-icon">↗️</div>
            </a>

            <!-- সেকশন ২: কাটিং ওয়াল -->
            <a href="cutting-wall-calculator.html" target="_blank" class="menu-card">
                <div class="menu-info">
                    <div class="menu-icon">🧱</div>
                    <div>
                        <div class="menu-text-title">কাটিং ওয়াল</div>
                        <div class="menu-text-sub">কাটিং ওয়াল অ্যালুমিনিয়াম ও গ্লাস হিসাব</div>
                    </div>
                </div>
                <div class="arrow-icon">↗️</div>
            </a>

            <!-- সেকশন ৩: গ্লাস ডোর এন্ড পার্টিশন -->
            <a href="glass-door-partition-calculator.html" target="_blank" class="menu-card">
                <div class="menu-info">
                    <div class="menu-icon">🚪</div>
                    <div>
                        <div class="menu-text-title">গ্লাস ডোর এন্ড পার্টিশন</div>
                        <div class="menu-text-sub">কমার্শিয়াল ডোর ও গ্লাস পার্টিশন হিসাব</div>
                    </div>
                </div>
                <div class="arrow-icon">↗️</div>
            </a>
        </div>
    </div>

</body>
</html>
